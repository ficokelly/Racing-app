      - name: Settle existing verified races and recompute form
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage68_result_reconciler.py
          if ! python calculate-strike-rates.py; then
            echo 'WARNING: Historical 14-day identity source unavailable for now. The verified results are still safely reconciled.'
          fi
      - name: Commit and publish validated repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/stage38_app.js scripts/stage32_form_rebuild.py scripts/stage68_result_reconciler.py scripts/stage68_install.py
          git add .github/workflows/racing-hot-pots-five-minute.yml .github/workflows/collect-racing-results.yml .github/workflows/stage66-three-model-d-daily.yml
          git add data/racing-results/ data/strategy-d-history.json data/strategy-d-results.json data/strike-rates.json data/form-identity-cache.json reports/stage32/form-rebuild-audit.json
          if git diff --cached --quiet; then
            echo 'Repair already installed; nothing to commit.'
            exit 0
          fi
          git commit -m 'Stage68: repair live results, trainer form, odds latency and Hot Pots views'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Stage68 repairs published on main.'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo 'Unable to publish repair due to concurrent upstream changes.' >&2
          exit 1
