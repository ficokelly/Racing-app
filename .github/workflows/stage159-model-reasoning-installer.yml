              for name in FILES:
                  path=SCRIPT/name
                  old=path.read_text(encoding='utf-8')
                  if MARK in old:
                      print('ALREADY_APPLIED',name)
                      continue
                  new=PATCHES[name](old)
                  # Only after all patches validate will any file be overwritten.
                  compile(new,str(path),'exec')
