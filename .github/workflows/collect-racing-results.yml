
name: Collect Racing Results Daily

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-results:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect UK and Irish results
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: python collect-racing-results.py || echo 'Racing API today/free returned no qualifying results; checking verified PuntersEdge fallback.'

      - name: Refresh verified PuntersEdge results fallback
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
        run: python collect-puntersedge-results.py

      - name: Reconcile final results into the dated form archive
        run: python scripts/stage68_result_reconciler.py

      - name: Calculate trainer and jockey strike rates
        run: python calculate-strike-rates.py


      - name: Save results to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/racing-results/ data/strike-rates.json data/race-results.json data/form-identity-cache.json data/strategy-d-history.json data/strategy-d-results.json reports/stage32/form-rebuild-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily racing results"
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            exit 1
          fi
