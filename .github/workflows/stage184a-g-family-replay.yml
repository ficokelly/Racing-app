name: Stage184a - G G2 G3 G4 frozen rank1 replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stage184a-g-family-replay.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage184a-g-family-research
  cancel-in-progress: false
env:
  PYTHONPATH: .:scripts
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      days: ${{ steps.days.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5987838b0e3f28b53686bac60d52cd164738718
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: days
        run: |
          python - <<'PY'
          import datetime as d,json,os
          days=[(d.date(2026,10,25)+d.timedelta(days=i)).isoformat() for i in range(30)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:print('days='+json.dumps(days,separators=(',',':')),file=f)
          PY
  score:
    needs: prepare
    name: ${{ matrix.day }} / G family
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        day: ${{ fromJSON(needs.prepare.outputs.days) }}
    env:
      DAY: ${{ matrix.day }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5987838b0e3f28b53686bac60d52cd164738718
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: reports/stage177/shared
      - uses: actions/download-artifact@v4
        with:
          name: stage177-g5-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: reports/stage177/shared
      - name: Restore exact frozen model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p restore/{107,108,109,111}
          gh run download 43292937252 --repo "$GITHUB_REPOSITORY" --name stage107-model-g-43292937252 --dir restore/107
          gh run download 43309108657 --repo "$GITHUB_REPOSITORY" --name stage108-model-g2-43309108657 --dir restore/108
          gh run download 43407036838 --repo "$GITHUB_REPOSITORY" --name stage109-g3-learning-43407036838 --dir restore/109
          gh run download 43422655754 --repo "$GITHUB_REPOSITORY" --name stage111-g4-specialists-43422655754 --dir restore/111
      - name: Install exact scoring dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 scikit-learn==1.6.1 joblib==1.4.2 freezegun==1.5.5 requests
      - name: Replay original G family paper engines on frozen pre-off inputs
        run: |
          python - <<'PY'
          import collections as C,csv,datetime as D,hashlib,json,os,pathlib as P,re,sqlite3,subprocess as S,sys,unicodedata,tempfile,shutil
          DAY=os.environ['DAY'];B=P.Path('reports/stage177/shared').resolve();O=P.Path('reports/stage184a/score').resolve();O.mkdir(parents=True,exist_ok=True)
          def read(p):return json.loads(p.read_text())
          def norm(s):return re.sub('[^a-z0-9]','',unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().lower())
          def horse(s):return norm(re.sub(r'\s*\([A-Za-z]{2,3}\)\s*$','',str(s or '')))
          def course(s):
           n=norm(re.sub(r'\s*\((?:AW|GB|IRE)\)\s*$','',str(s or ''),flags=re.I));return {'galwayire':'galway','wexfordire':'wexford','dundalkawire':'dundalk','dundalkire':'dundalk','dundalkaw':'dundalk','fairyhouseire':'fairyhouse','clonmelire':'clonmel','gowranparkire':'gowranpark','kemptonpark':'kempton','chelmsfordcity':'chelmsford','bangor':'bangorondee'}.get(n,n)
          def digest(p):
           with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          cols=['date','course','time','model','horse','race_type','discipline','basis','source_asof','cutoff','batch'];out=[];audit={'date':DAY,'status':'STARTED','batches':[]}
          def save():
           (O/'audit.json').write_text(json.dumps(audit,indent=2));
           with (O/'rank1.csv').open('w',newline='') as f:w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(out)
          try:
           batches=read(B/(DAY+'-batches.json'))
           root=P.Path.cwd(); hpr=B/'hpr.sqlite';assert hpr.is_file()
           def file(stage,name):
            xs=list((root/'restore'/str(stage)).rglob(name));assert len(xs)==1,(stage,name,len(xs));return str(xs[0])
           specs=[(107,'stage107_model_g.py',['--model',file(107,'stage107-frozen-form-model.joblib'),'--state',file(107,'stage107-prior-form-state.joblib')],'stage107-paper-all-rankings.csv','G'),(108,'stage108_model_g2.py',['--model',file(108,'stage108-frozen-form-model.joblib'),'--state',file(108,'stage108-prior-form-state.joblib')],'stage108-paper-all-rankings.csv','G2_ORIGINAL'),(109,'stage109_model_g3.py',['--model',file(109,'stage109-future-form-model.joblib'),'--state',file(109,'stage109-prior-form-state.joblib'),'--g2-frozen',file(109,'stage109-frozen-g2-original.joblib')],'stage109-paper-all-horses.csv',None),(111,'stage111_model_g4.py',['--model',file(111,'stage111-paper-specialists.joblib'),'--state',file(111,'stage111-prior-form-state.joblib')],'stage111-paper-all-horses.csv',None)]
           with tempfile.TemporaryDirectory() as td:
            T=P.Path(td);odds=T/'empty-odds.json';odds.write_text('{}')
            wrapper=T/'clock.py';wrapper.write_text("import sys,runpy,joblib\nfrom freezegun import freeze_time\nclock,script,*args=sys.argv[1:]\noriginal=joblib.load\ndef checked(*a,**k):\n obj=original(*a,**k)\n if isinstance(obj,dict):\n  for field in ('trained_through','asof_after_date'):\n   if field in obj:\n    assert str(obj[field])<'2026-01-01',('Non-frozen model or form state',field,obj[field])\n return obj\njoblib.load=checked\nsys.argv=[script,*args]\nwith freeze_time(clock,real_asyncio=True):runpy.run_path(script,run_name='__main__')\n")
            for b in batches:
             bid=b['batch'];meta={tuple(x['key']):x for x in b['races']}
             for stage,script,extra,filename,label in specs:
              work=T/(bid+'-'+str(stage));work.mkdir();rep={'batch':bid,'engine':stage,'status':'FAILED'};seen=set();exclude=C.Counter()
              try:
               args=[sys.executable,str(wrapper),b['cutoff'],str(root/'scripts'/script),'paper',*extra,'--cards',str(B/(bid+'.json')),'--date',DAY,'--cutoff',b['cutoff'],'--hpr',str(hpr),'--out',str(work)]
               if stage!=111:args+=['--odds',str(odds),'--bookmaker','williamhill']
               with (O/(bid+'-'+str(stage)+'.log')).open('w') as f:rc=S.run(args,stdout=f,stderr=S.STDOUT,timeout=1800).returncode
               assert rc==0,'Scorer failed: '+str(rc)
               output=work/filename
               if not output.exists():raise RuntimeError('No eligible full-field ranks')
               groups=C.defaultdict(list)
               for r in csv.DictReader(output.open()):
                k=(r['date'],course(r['course']),r['off_utc'][:5]);model=label or r['model'];groups[(k,model)].append(r)
               for (k,model),rs in groups.items():
                if k not in meta:exclude['unmatched_race']+=1;continue
                m=meta[k];top=[r for r in rs if r['rank'] in ('1','1.0')];declared=set(m['declared_horses'])
                if len(top)!=1 or len(rs)!=len(declared) or {horse(r['horse']) for r in rs}!=declared:exclude['incomplete_field_or_rank']+=1;continue
                r=top[0];assert (k,model) not in seen;seen.add((k,model))
                out.append(dict(date=k[0],course=k[1],time=k[2],model=model,horse=r['horse'],race_type=r.get('race_type',''),discipline=r.get('discipline',''),basis='FROZEN_G_FAMILY_PRIOR_HPR_RANK_ONLY',source_asof=m['source_asof'],cutoff=b['cutoff'],batch=bid))
               rep.update(status='SCORED' if seen else 'NO_ACCEPTED_RANK1',rank1=len(seen),excluded=dict(exclude),scheduled=len(meta))
              except Exception as e:rep['error']=repr(e)
              finally:audit['batches'].append(rep);save();shutil.rmtree(work,ignore_errors=True)
           audit['status']='COMPLETE' if batches and all(x['status']=='SCORED' for x in audit['batches']) else 'PARTIAL_OR_FAILED';save();print('STAGE184A_SCORE',json.dumps(audit),flush=True)
          except Exception as e:audit.update(status='FAILED',error=repr(e));save();raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage184a-ranks-${{ matrix.day }}
          path: reports/stage184a/score/
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: [prepare,score]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: shared
      - uses: actions/download-artifact@v4
        with:
          pattern: stage184a-ranks-*
          path: results
          merge-multiple: false
      - name: Settle rank1 with the same Stage177b prices; report coverage and common cohorts
        run: |
          python - <<'PY'
          import collections as C,csv,json,pathlib as P,re,unicodedata
          out=P.Path('summary');out.mkdir(exist_ok=True)
          def horse(s):return re.sub('[^a-z0-9]','',unicodedata.normalize('NFKD',re.sub(r'\s*\((?:IRE|GB|FR|USA|GER|AUS|NZ|ITY|JPN)\)\s*$','',str(s or ''),flags=re.I)).encode('ascii','ignore').decode().lower())
          def key(r):return (r['date'],r['course'],r['time'])
          def write(name,rs):
           p=out/name
           if not rs:p.write_text('');return
           with p.open('w',newline='') as f:w=csv.DictWriter(f,fieldnames=list(dict.fromkeys(k for r in rs for k in r)));w.writeheader();w.writerows(rs)
          s={key(x):x for x in json.loads(P.Path('shared/settlement-prices.json').read_text())};rows=[];seen=set();audits=[]
          for p in P.Path('results').rglob('audit.json'):audits.append(json.loads(p.read_text()))
          for p in P.Path('results').rglob('rank1.csv'):
           for r in csv.DictReader(p.open()):
            k=key(r);mk=(k,r['model']);assert mk not in seen;seen.add(mk)
            status='NO_RESULT';won=None;pnl=None
            if k in s:
             v=s[k];h=horse(r['horse']);starter={horse(x['horse']) for x in v['starters']};nr={horse(x) for x in v['declared_nonrunners']};wins={horse(x['horse']):x['sp_decimal'] for x in v['winner_prices']}
             if h not in starter:status='VOID_NR' if h in nr else 'UNMATCHED'
             else:
              status='SETTLED';won=int(h in wins)
              if wins and not v['price_conflicts'] and all(x is not None for x in wins.values()):pnl=float(wins[h])/len(wins)-1 if won else -1.
            rows.append(dict(r,status=status,won=won,pnl=pnl))
          def metric(rs):
           settled=[r for r in rs if r['status']=='SETTLED'];priced=[r for r in settled if r['pnl'] is not None];wins=sum(r['won'] for r in settled);profit=sum(r['pnl'] for r in priced)
           return {'selections':len(rs),'settled':len(settled),'wins':wins,'strike_rate_pct':round(100*wins/len(settled),4) if settled else None,'priced':len(priced),'pnl_units':round(profit,4),'roi_pct':round(100*profit/len(priced),4) if priced else None,'excluded_or_void':len(rs)-len(settled)}
          groups=C.defaultdict(list)
          for r in rows:
           for dimension,value in [('overall','all'),('day',r['date']),('discipline',r['discipline']),('race_type',r['race_type'])]:groups[(r['model'],dimension,value)].append(r)
          metrics=[dict(model=m,dimension=d,value=v,**metric(rs)) for (m,d,v),rs in sorted(groups.items())]
          write('rank1-settlement.csv',rows);write('model-performance.csv',metrics)
          report={'status':'RESEARCH_ONLY_NOT_ROUTING_CERTIFIED','period':['2026-10-25','2026-11-23'],'expected_days':30,'reported_days':len({a['date'] for a in audits}),'day_status':dict(C.Counter(a['status'] for a in audits)),'overall':[x for x in metrics if x['dimension']=='overall'],'limitations':['Original G/G2/G3/G4 rank-only paper scorers, original 2025 frozen states and prior-date HPR observed runs; Stage116 state patch and price-qualified selections not reproduced.','No production change. Missing fields and failed batches excluded.']}
          (out/'report.json').write_text(json.dumps(report,indent=2));(out/'day-audits.json').write_text(json.dumps(audits,indent=2));print('STAGE184A_REPORT',json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage184a-g-family-comparison
          path: summary/
          if-no-files-found: error
          retention-days: 30
