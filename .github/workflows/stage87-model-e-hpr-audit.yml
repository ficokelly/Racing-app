name: Stage87 - Model E HPR Quality Audit and Matched Model Comparison

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'As-of Irish date YYYY-MM-DD (blank = today)'
        type: string
        required: false
        default: ''
      days:
        description: 'Completed days to test (default 30)'
        type: choice
        required: true
        default: '30'
        options: ['7', '14', '30', '60', '90']

permissions:
  contents: read
  actions: read

concurrency:
  group: stage87-hpr-research-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Read full dated Git snapshots without writing any model data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Stage86 HPR, Stage87 shard safety and matched-race metrics
        run: |
          python scripts/stage86_hpr_engine.py --mode self-test
          python scripts/stage87_hpr_storage.py self-test
          python scripts/stage87_hpr_audit.py --self-test
      - name: Reuse original historical UK/IE source
        uses: actions/cache@v4
        with:
          path: |
            reports/stage86/base/original.sqlite
            ~/.cache/kagglehub
          key: stage86-base-v129-${{ hashFiles('import_historical_ukie.py') }}
          restore-keys: |
            stage84-base-ukie-v129-
      - name: Install historical source downloader
        run: python -m pip install --disable-pip-version-check kagglehub
      - name: Verify historical database without changing original source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import kagglehub,subprocess,sys,sqlite3
          from pathlib import Path
          p=Path('reports/stage86/base/original.sqlite');p.parent.mkdir(parents=True,exist_ok=True)
          if not p.exists() or p.stat().st_size<1000000:
            source=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
            subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import',
              '--input',str(source),'--min-date','1988-01-01','--max-date','2026-10-07',
              '--database',str(p),'--report','reports/stage86/base/import.json'],check=True)
          with sqlite3.connect('file:'+str(p.resolve())+'?mode=ro',uri=True) as c:
            assert c.execute('PRAGMA quick_check').fetchone()[0]=='ok'
            assert c.execute('SELECT COUNT(*) FROM historical_races').fetchone()[0]>100000
          PY
      - name: Re-run 30-day Model E HPR retrospective without modifying live models
        shell: bash
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          args=(--mode backtest --db reports/stage86/base/original.sqlite --root . \
            --output reports/stage86/test --days "${DAYS:-30}" --git-preoff)
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage86_hpr_engine.py "${args[@]}"
      - name: Audit rejected finishes, beaten distances, identity and exact model overlaps
        shell: bash
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          args=(--root . --db reports/stage86/base/original.sqlite --output reports/stage87 \
            --e-selections reports/stage86/test/hpr-race-by-race.csv --days "${DAYS:-30}")
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage87_hpr_audit.py "${args[@]}"
      - name: Upload concise human-readable audit and same-race comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage87-model-e-hpr-audit-${{ github.run_id }}
          path: |
            reports/stage87/*.json
            reports/stage87/*.csv
            reports/stage86/test/hpr-audit.json
            reports/stage86/test/hpr-metrics.csv
          retention-days: 90
          if-no-files-found: warn
