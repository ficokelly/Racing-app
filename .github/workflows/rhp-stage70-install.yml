          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(payload)),mode='r:') as tf:
              items={x.name:x for x in tf if x.isfile()}
              if set(items)!=set(allowed):raise RuntimeError('Stage70 file manifest mismatch')
              for name in allowed:
                  contents=tf.extractfile(items[name]).read()
                  if len(contents)>100000:raise RuntimeError('Unexpected large source file')
                  target=pathlib.Path(name);target.parent.mkdir(exist_ok=True,parents=True)
                  target.write_bytes(contents)
          print('Stage70 bundle verified and restored')
          STAGE70_BUNDLE

      - name: Apply non-runner ranking persistence and other requested UI changes
        shell: bash
        run: |
          set -euo pipefail
          python stage70_install.py
          python -m py_compile stage70_install.py scripts/rhp_stage70_data_coverage.py
          python scripts/rhp_stage70_data_coverage.py --self-test
          node --check scripts/stage38_app.js
          node --check scripts/rhp_stage70_ui.js
          python - <<'APP_CHECK'
          import pathlib,re,subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not blocks:raise RuntimeError('Main app JavaScript missing')
          pathlib.Path('/tmp/rhp-stage70-inline.js').write_text(blocks[-1])
          subprocess.run(['node','--check','/tmp/rhp-stage70-inline.js'],check=True)
          assert 'RHP_STAGE70_USER_REQUESTS_V1' in s
          assert 'function autoWatchQualifiers(){ /* Stage70: manual watchlist only;' in s
          assert '<a class="form-price-nav"' not in s
          print('Stage70 app syntax, watchlist, and removed nav checks passed')
          APP_CHECK
          git diff --check

      - name: Publish current race, result and person-identity coverage audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rhp_stage70_data_coverage.py --out data/rhp-stage70-coverage.json
          python - <<'WARN'
          import json,os
          p=json.load(open('data/rhp-stage70-coverage.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Racing Hot Pots Stage70 coverage audit\n')
            f.write('Status: '+p['status']+'\n\n')
            f.write('Declared races per day: '+str({k:v['declared_races'] for k,v in p['by_day'].items()})+'\n\n')
            f.write('Missing D(c) rankings: '+str(len(p['missing_rankings_for_already_scored_date']))+'\n\n')
            f.write('Missing verified historic race results: '+str(len(p['missing_verified_results_for_historic_declared_races']))+'\n\n')
            f.write('Unmatched trainer/jockey results identities: '+str(p['unmatched_result_person_identities'])+'\n\n')
            f.write('This audit cannot verify races absent from all source feeds.\n')
          if p['status']=='REVIEW_GAPS':
            print('::warning::Review published coverage report; gaps or pending feeds were found')
          WARN

      - name: Publish Stage70 app and audit (not GitHub workflow files)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stage70_install.py scripts/rhp_stage70_ui.js scripts/rhp_stage70_data_coverage.py \
            index.html scripts/stage38_app.js data/rhp-stage70-coverage.json
          if git diff --cached --quiet; then
            echo 'Stage70 already published. No changes required.'
            exit 0
          fi
          git commit -m 'Stage70 preserve D(c) rankings on withdrawals and improve Hot Pots UI'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Stage70 app and coverage audit PUBLISHED.'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          echo 'Stage70 publish failed; changes not confirmed live' >&2
          exit 1
