              if hgfirst in (0,1) and norm(r.get('headgear')):
                  out['HEADGEAR_FIRST']=['HEADGEAR_FIRST:YES' if hgfirst else 'HEADGEAR_FIRST:NO']
              # Optional trainer specialisation. Only if a source supplies categorical
              # 14-day and pre-existing baseline denominators, never from the current race.
              rn=number(r.get('trainer_specialist_recent_n'));rw=number(r.get('trainer_specialist_recent_w'))
              bn=number(r.get('trainer_specialist_baseline_n'));bw=number(r.get('trainer_specialist_baseline_w'))
              if None not in (rn,rw,bn,bw) and rn>=8 and bn>=30:
                  delta=rw/rn-bw/bn
                  out['TRAINER_SPECIALISATION']=['TRAINER_SPECIALISATION:RECENT_ABOVE12PP' if delta>=.12 else 'TRAINER_SPECIALISATION:RECENT_BELOW12PP' if delta<=-.12 else 'TRAINER_SPECIALISATION:STABLE']
              return out


          def representative(tags):
              """One nonredundant descriptive bin per family for interactions."""
              chosen={}
              for fam,vals in tags.items():
                  b=next((x for x in vals if ':BIN_' in x),None)
                  if not b:
                      # Single meaningful side closest to the middle of the threshold list.
                      b=vals[len(vals)//2]
                  chosen[fam]=b
              return chosen


          def signatures(families):
              """Automatic combinations across *different* characteristics, never copies of one."""
              singles=[(x,1) for vv in families.values() for x in vv]
              rep=representative(families)
              pair=[('&'.join(sorted([a,b])),2) for (fa,a),(fb,b) in itertools.combinations(sorted(rep.items()),2)]
              core=[(f,rep[f]) for f in TRIPLE_CORE if f in rep]
              triple=[('&'.join(sorted(z[1] for z in group)),3) for group in itertools.combinations(core[:8],3)]
              return singles+pair+triple


          class Stat:
              __slots__=('races','races_exposed','starts','known_starts','qual_starts','win','field_wins','e_expected','e_var',
                         'market_races','market_starts','market_wins','market_expected','market_var','market_return','year_first','year_last','edition_winners')
              def __init__(self):
                  self.races=0;self.races_exposed=0;self.starts=0;self.known_starts=0;self.qual_starts=0
                  self.win=0.;self.field_wins=0.;self.e_expected=0.;self.e_var=0.
                  self.market_races=0;self.market_starts=0;self.market_wins=0.;self.market_expected=0.;self.market_var=0.;self.market_return=0.
                  self.year_first=9999;self.year_last=0;self.edition_winners=0
              def take(self,k,n,w,fullwins,expected,pexp,return_units,year,prices_ok):
                  # Only called for completely observed fields for a trait. A race may
                  # have zero qualifying runners; it remains in the denominator.
                  self.races+=1;self.starts+=n;self.known_starts+=n
                  self.qual_starts+=k;self.win+=w;self.field_wins+=fullwins
                  if k:
                      self.races_exposed+=1
                      if w>0:self.edition_winners+=1
                  q=k/n if n else 0
                  self.e_expected+=q*fullwins
                  # Fractional dead-heat credit can be <1; variance is descriptive.
                  self.e_var+=q*(1-q)
                  if prices_ok:
                      self.market_races+=1;self.market_starts+=k;self.market_wins+=w
                      self.market_expected+=pexp;self.market_var+=pexp*(1-pexp)
                      self.market_return+=return_units
                  self.year_first=min(self.year_first,year);self.year_last=max(self.year_last,year)
              def result(self):
                  z=(self.market_wins-self.market_expected)/math.sqrt(self.market_var) if self.market_var>1e-12 else None
                  equalz=(self.win-self.e_expected)/math.sqrt(self.e_var) if self.e_var>1e-12 else None
                  return {'races_eligible':self.races,'races_with_exposure':self.races_exposed,
                          'winning_race_editions_with_trait':self.edition_winners,
                          'known_starters':self.known_starts,'qualifying_starters':self.qual_starts,
                          'qualifier_runner_pct':round(100*self.qual_starts/self.known_starts,2) if self.known_starts else None,
                          'winner_credit_with_trait':round(self.win,3),
                          'winner_credit_all':round(self.field_wins,3),
                          'winner_share_pct':round(100*self.win/self.field_wins,2) if self.field_wins else None,
                          'qualifier_win_rate_pct':round(100*self.win/self.qual_starts,2) if self.qual_starts else None,
                          'equal_baseline_expected_wins':round(self.e_expected,3),
                          'equal_baseline_z':round(equalz,3) if equalz is not None else None,
                          'market_complete_races':self.market_races,
                          'market_exposed_starts':self.market_starts,
                          'market_winners':round(self.market_wins,3),
                          'market_expected_wins':round(self.market_expected,3),
                          'market_excess_wins':round(self.market_wins-self.market_expected,3),
                          'market_z':round(z,3) if z is not None else None,
                          'historical_sp_roi_pct':round(100*(self.market_return/self.market_starts-1),2) if self.market_starts else None,
                          'years':f'{self.year_first}-{self.year_last}' if self.year_last else None}


          def by_fdr(pairs):
              """Benjamini-Yekutieli q values for correlated hypothesis families."""
              pvals=sorted([(math.erfc(abs(z)/math.sqrt(2)),i) for i,z in enumerate(pairs) if z is not None])
              m=len(pvals)
              if not m:return [None]*len(pairs)
              h=sum(1/i for i in range(1,m+1));q=[None]*len(pairs);running=1.
              for j in range(m-1,-1,-1):
                  p,i=pvals[j]
                  running=min(running,p*m*h/(j+1));q[i]=running
              return q


          def iter_races(path):
              opener=gzip.open if str(path).endswith('.gz') else open
              with opener(path,'rt',newline='',encoding='utf-8') as f:
                  daily=collections.defaultdict(list);lastdate=None
                  for r in csv.DictReader(f):
                      date=r['race_date'][:10]
                      if lastdate and date<lastdate:raise ValueError('Historical CSV must be chronological by date')
                      if lastdate and date!=lastdate:
                          for rr in daily.values():yield rr
                          daily.clear()
                      daily[r['race_id']].append(r);lastdate=date
                  for rr in daily.values():yield rr


          def make_race(rows):
              date=rows[0]['race_date'][:10];year=int(date[:4])
              ff=[trait_groups(r) for r in rows]
              # Protect market evaluation: race SP must be complete, and winners count known.
              pvals=[number(r.get('sp_decimal')) for r in rows]
              priced=all(p is not None and p>=1.01 for p in pvals)
              if priced:
                  den=sum(1/v for v in pvals)
                  odds=[(1/v)/den for v in pvals]
              else:odds=[None]*len(rows)
              wins=[number(r.get('winner_credit')) or 0. for r in rows]
              if sum(wins)<.99 or sum(wins)>1.01:
                  # Inconsistent dead-heat / missing winner; cannot analyse as one race.
                  return None
              return {'r':rows,'families':ff,'year':year,'date':date,'p':odds,'prices':priced,'wins':wins,'ctx':contexts(rows[0]),'n':len(rows)}


          def evaluate_race(race,store,depths=(1,2,3),allowed=None,contexts_filter=None):
              """Complete-case within each underlying family; no unknown->false conversions."""
              n=race['n'];families=race['families'];wins=race['wins'];contexts1=race['ctx']
              if contexts_filter is not None:contexts1=[x for x in contexts1 if x in contexts_filter]
              if not contexts1:return
              union=collections.defaultdict(list)
              # Trait tags present at least once. Only use tags if EVERY starter has
              # the underlying metric known, otherwise exclude the *whole race* for it.
              for i,ff in enumerate(families):
                  rr=representative(ff)
                  tags=[]
                  if 1 in depths:tags.extend([(v,frozenset([fam])) for fam,vals in ff.items() for v in vals])
                  if 2 in depths:tags.extend([('&'.join(sorted([a,b])),frozenset([fa,fb])) for (fa,a),(fb,b) in itertools.combinations(sorted(rr.items()),2)])
                  if 3 in depths:
                      core=[(f,rr[f]) for f in TRIPLE_CORE if f in rr]
                      tags.extend([('&'.join(sorted(v for f,v in cc)),frozenset(f for f,v in cc)) for cc in itertools.combinations(core[:8],3)])
                  for tag,required in tags:
                      if allowed is not None and tag not in allowed:continue
                      union[(tag,required)].append(i)
              # Families absent for at least one runner -> suppress, do not count an
              # unobserved horse as an opposing runner.
              fullfamilies=set.intersection(*(set(x) for x in families)) if families else set()
              p=race['p'];priced=race['prices'];year=race['year']
              for (tag,required),indices in union.items():
                  if not required<=fullfamilies:continue
                  k=len(indices);w=sum(wins[i] for i in indices)
                  ex=sum(p[i] for i in indices) if priced else 0
                  ret=sum(wins[i]*number(race['r'][i]['sp_decimal']) for i in indices) if priced else 0
                  for c in contexts1:
                      if '&' in tag and c.startswith(('COURSE_TYPE:','GRADE_TYPE:','TYPE_FIELD:')):continue
                      key=(c,tag)
                      if allowed is not None and key not in allowed and (tag not in allowed):continue
                      o=store.get(key)
                      if o is None:o=store[key]=Stat()
                      o.take(k,n,w,sum(wins),k/n if n else 0,ex,ret,year,priced)


          def explore(features,out,max_races=0):
              out=Path(out);out.mkdir(parents=True,exist_ok=True)
              tables={s:{} for s in ('train','valid','test')};audit=collections.Counter()
              # All hypotheses are determined by *predefined numeric threshold families*
              # and automatic cross-family enumeration, never by looking at test returns.
              for i,raw in enumerate(iter_races(features)):
                  if max_races and i>=max_races:break
                  race=make_race(raw)
                  if race is None:
                      audit['rejected_inconsistent_winner']+=1;continue
                  s=split(race['year'])
                  if s is None:continue
                  audit[s+'_races']+=1;audit[s+'_starters']+=race['n']
                  if race['prices']:audit[s+'_complete_sp_races']+=1
                  complete_fams=set.intersection(*(set(f) for f in race['families']))
                  for fam in RAW:
                      if fam in complete_fams:audit[s+'_complete_'+fam+'_races']+=1
                  # Selection filters are applied only AFTER all independent split
                  # aggregate tables are populated. Test results play NO role in model
                  # choice, validation, threshold, or multiple-testing screening.
                  evaluate_race(race,tables[s],depths=(1,2,3))
                  if (i+1)%25000==0:print('Discovery scanned',i+1,'races; train keys',len(tables['train']),flush=True)
              tr=tables['train'];va=tables['valid'];te=tables['test']
              # Conservatively screen all tested hypotheses (including unsuccessful
              # thresholds) for FDR; no prefilter on z. Require support in TRAIN only.
              keys=[];zs=[]
              for k,a in tr.items():
                  z=a.result()['market_z'];n=a.result()['qualifying_starters']
                  if a.market_races>=50 and a.qual_starts>=150 and a.races_exposed>=50 and a.market_expected>=12 and z is not None:
                      keys.append(k);zs.append(z)
              qs=by_fdr(zs);outrows=[];validated=[]
              for key,z,q in zip(keys,zs,qs):
                  a=tr[key];v=va.get(key,Stat()); t=te.get(key,Stat());ar=a.result();vr=v.result();ts=t.result()
                  valid=(q is not None and q<=.10 and vr['market_z'] is not None and vr['market_complete_races']>=20
                         and vr['market_expected_wins']>=6 and z*vr['market_z']>0 and abs(vr['market_z'])>=1.96)
                  # Test period is reported ONLY for candidates validated without it.
                  test=(ts['market_z'] is not None and ts['market_complete_races']>=20 and ts['market_expected_wins']>=6 and z*ts['market_z']>0 and abs(ts['market_z'])>=1.96) if valid else False
                  label='REPLICATED_MARKET_ASSOCIATION' if test else 'PRETEST_VALIDATED_NOT_REPLICATED' if valid else 'NOT_VALIDATED'
                  base={'context':key[0],'hypothesis':key[1],'depth':key[1].count('&')+1,'direction_training':('POSITIVE' if z>0 else 'NEGATIVE'),
                        'training_by_q':round(q,6) if q is not None else '', 'validation_confirmed':valid,
                        'test_replicated':test,'evidence_label':label}
                  for prefix,x in [('train',ar),('valid',vr),('test',ts if valid else {})]:
                      base.update({prefix+'_'+t:val for t,val in x.items()})
                  outrows.append(base)
                  if valid:validated.append(base)
              outrows.sort(key=lambda x:(not x['test_replicated'],not x['validation_confirmed'],x['training_by_q'],-x['train_qualifying_starters']))
              headers=list(outrows[0]) if outrows else ['context','hypothesis','depth','direction_training','training_by_q','validation_confirmed','test_replicated','evidence_label']
              with (out/'discovered_positive_and_negative_trends.csv').open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,headers,extrasaction='ignore');w.writeheader();w.writerows(outrows)
              audit.update({'train_tested_hypotheses':len(tr),'supported_training_hypotheses':len(keys),
                            'validated_without_test':sum(x['validation_confirmed'] for x in outrows),
                            'replicated_independent_test':sum(x['test_replicated'] for x in outrows),
                            'replicated_positive':sum(x['test_replicated'] and x['direction_training']=='POSITIVE' for x in outrows),
                            'replicated_negative':sum(x['test_replicated'] and x['direction_training']=='NEGATIVE' for x in outrows)})
              (out/'discovery_audit.json').write_text(json.dumps(audit,indent=2))
              return outrows,audit


          def parse_furlongs(s):
              v=str(s or '').lower().strip()
              if not v:return None
              n=number(v)
              if n is not None:return n
              m=re.search(r'(\d+(?:\.\d+)?)\s*m',v)
              f=re.search(r'(\d+(?:\.\d+)?)\s*f',v)
              return (float(m.group(1))*8 if m else 0)+(float(f.group(1)) if f else 0) if m or f else None


          def load_sunday(path):
              with open(path,newline='',encoding='utf-8-sig') as f:
                  cards=[]
                  for r in csv.DictReader(f):
                      race={'meeting':r.get('meeting'),'time':r.get('time'),
                            'race':r.get('race'),'discipline':r.get('discipline'),
                            'conditions':r.get('conditions') or r.get('race_condition'),
                            'distance_f':r.get('distance_f') or parse_furlongs(r.get('distance'))}
                      cards.append(race)
                  return cards


          def source_grade(title):
              t=norm(title)
              m=re.search(r'\b(?:grade|group)\s*([123])\b',t)
              if m:return ('G' if 'grade' in t else 'GROUP')+m.group(1)
              return 'LISTED' if 'listed' in t else ''


          def restriction_compatible(hist,target):
              ht=norm(hist.get('race_name'));tt=norm(target.get('race'))
              grade=source_grade(tt)
              if grade and source_grade(ht)!=grade:return False
              if ('mares' in tt or 'fillies' in tt) and not ('mares' in ht or 'fillies' in ht):return False
              if ('2yo' in tt or '2yo' in norm(target.get('conditions'))) and not (
                      '2yo' in ht or '2 year' in ht or all(number(z.get('age'))==2 for z in hist.get('_field',[]) if number(z.get('age')) is not None)):
                  # Age source in the original title is often unavailable; skip only
                  # if the historical field explicitly contradicts a 2yo-only race.
                  field=hist.get('_field')
                  if field and any(number(x.get('age')) is not None and number(x.get('age'))!=2 for x in field):return False
              return True


          def analog_tier(hist,target):
              if discipline(hist)!=discipline(target) or condition(hist)!=condition(target) or condition(hist)=='UNKNOWN':return None
              if not restriction_compatible(hist,target):return None
              dx=number(hist.get('distance_f'));dy=number(target.get('distance_f'))
              if dx is None or dy is None:return None
              diff=abs(dx-dy)
              mm=int(hist['race_date'][5:7]);month=11
              seasonal=min(abs(mm-month),12-abs(mm-month))
              if course(hist)==course(target):
                  if diff<=1 and seasonal<=1:return 1
                  if diff<=2 and seasonal<=3:return 2
                  if diff<=3:return 3
                  return None
              if diff<=1.5 and seasonal<=2:return 4
              return None


          def catalog_for_family(fam):
              if fam in THRESHOLDS:
                  x=[str(v).replace('.','p').replace('-','minus') for v in THRESHOLDS[fam]]
                  result=[f'{fam}:{op}_{t}' for t in x for op in ('LE','GT')]
                  bins=BINS.get(fam)
                  if bins:
                      result.append(f'{fam}:BIN_LT{bins[0]}')
                      for lo,hi in zip(bins,bins[1:]):result.append(f'{fam}:BIN_{lo}_{hi-1}')
                      result.append(f'{fam}:BIN_GE{bins[-1]}')
                  return result
              return {'SEX':['SEX:FEMALE','SEX:MALE'],
                      'LAST_RESULT':['LAST_RESULT:WIN','LAST_RESULT:PLACE','LAST_RESULT:FINISHED_OTHER','LAST_RESULT:DID_NOT_FINISH'],
                      'TRAINER_CHANGED':['TRAINER_CHANGED:YES','TRAINER_CHANGED:NO'],
                      'HEADGEAR_FIRST':['HEADGEAR_FIRST:YES','HEADGEAR_FIRST:NO'],
                      'TRAINER_SPECIALISATION':['TRAINER_SPECIALISATION:RECENT_ABOVE12PP','TRAINER_SPECIALISATION:RECENT_BELOW12PP',
                                                 'TRAINER_SPECIALISATION:STABLE']}.get(fam,[])


          def analogue_trait_summaries(races, end_year=2025):
              # Each characteristic uses only complete historical fields. Importantly,
              # NO-QUALIFIER races are INCLUDED in the denominator; unlike conditional
              # signature discovery, this function also evaluates zero-exposure races.
              windows={'ALL':1000,'LAST_20Y':20,'LAST_15Y':15,'LAST_10Y':10,'LAST_5Y':5}
              stats=collections.defaultdict(Stat)
              audit=collections.Counter()
              for raw in races:
                  race=make_race(raw)
                  if not race:continue
                  full=set.intersection(*(set(g) for g in race['families']))
                  if not full:
                      audit['no_complete_families']+=1;continue
                  for family in full:
                      vals=[set(f[family]) for f in race['families']]
                      for trait in catalog_for_family(family):
                          indices=[i for i,v in enumerate(vals) if trait in v]
                          k=len(indices);wins=sum(race['wins'][i] for i in indices)
                          market=sum(race['p'][i] for i in indices) if race['prices'] else 0
                          returns=sum(race['wins'][i]*number(raw[i].get('sp_decimal')) for i in indices) if race['prices'] else 0
                          for period,span in windows.items():
                              if race['year']<end_year-span+1:continue
                              a=stats[(period,trait)]
                              a.take(k,race['n'],wins,sum(race['wins']),k/race['n'],market,returns,race['year'],race['prices'])
                  audit['included_historical_races']+=1
              result=[]
              for (period,trait),obj in stats.items():
                  v=obj.result()
                  result.append({'lookback_window':period,'feature_family':trait.split(':')[0],
                                 'trend_condition':trait,**v})
              return result,audit



          def write_sunday_html(summary,detail,out):
              index=collections.defaultdict(list)
              for d in detail:
                  if d.get('lookback_window')=='ALL' and d.get('comparison_tier')!='VALIDATED_BROAD_COHORT':
                      index[(d['meeting'],d['time'])].append(d)
              style="""body{font:15px/1.5 -apple-system,BlinkMacSystemFont,Arial,sans-serif;max-width:1080px;margin:auto;padding:18px;color:#202631;background:#fafbfc}
              h1{font-size:24px}h2{font-size:19px;margin:0}small,p.note{color:#637084}details{border:1px solid #dbe1e7;border-radius:12px;background:white;margin:12px 0;padding:15px}
              summary{cursor:pointer;font-weight:700}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;border-bottom:1px solid #e7ebf0;padding:7px}
              .scroll{overflow:auto}.risk{color:#9a4b24}.good{color:#067357}.pill{border-radius:8px;background:#f0f4f8;padding:4px 8px;display:inline-block;margin:4px 0}
              """
              parts=['<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">',
                     '<title>Stage 9 — Sunday comprehensive historical trend review</title>','<style>'+style+'</style></head><body>',
                     '<h1>Sunday 1 November 2026 — historical racing trends</h1>',
                     '<p><strong>Important:</strong> All same-course records are <em>comparable races</em>, not verified earlier annual editions. '
                     'Zero winners and high winner shares are descriptive only; judge qualification rates, market expectation, sample size, missing information and withheld-period replication. '
                     'No live horse rankings are included.</p>']
              def num(x):
                  try:return f'{float(x):.2f}'
                  except (ValueError,TypeError):return '—'
              for r in summary:
                  k=(r['meeting'],r['time']);records=index[k]
                  # Pre-filter for minimal support; choosing the extremes among thousands
                  # is explicitly exploratory and does NOT qualify them as positives.
                  screened=[x for x in records if number(x.get('qualifying_starters')) and number(x.get('races_eligible')) and
                            number(x['qualifying_starters'])>=8 and number(x['races_eligible'])>=8 and
                            (number(x.get('market_expected_wins')) or 0)>=1]
                  up=sorted((x for x in screened if (number(x.get('market_z')) or 0)>0),key=lambda x:-(number(x['market_z']) or 0))[:7]
                  down=sorted((x for x in screened if (number(x.get('market_z')) or 0)<0),key=lambda x:(number(x['market_z']) or 0))[:7]
                  parts.append('<details><summary>'+html.escape(str(r['meeting'])+' '+str(r['time'])+' — '+str(r['race']))+'</summary>')
                  parts.append(f'<p class="note">{r["historical_races_used"]} historical comparators; tier {r["comparison_tier"]}; {r["historical_years"]} distinct years. '
                               'Qualification counts refer to <strong>historical comparable races</strong>, not annual editions of this event.</p>')
                  if r['historical_races_used']<8:
                      parts.append('<p class="risk">Insufficient comparable history for reliable race-specific assessment.</p>')
                  def table(rows,title):
                      parts.append('<h3>'+title+' <small>(exploratory only)</small></h3>')
                      if not rows:parts.append('<p>No sufficiently supported example in the current historical cohort.</p>');return
                      parts.append('<div class="scroll"><table><thead><tr><th>Historical characteristic</th><th>Winners with characteristic / analysed races</th><th>Eligible runner share</th><th>Expected wins (SP)</th><th>Market z</th></tr></thead><tbody>')
                      for x in rows:
                          parts.append('<tr><td>'+html.escape(x['trend_condition'])+'</td><td>'+num(x['winner_credit_with_trait'])+' / '+str(x['races_eligible'])+'</td><td>'+num(x['qualifier_runner_pct'])+'%</td><td>'+num(x['market_expected_wins'])+'</td><td>'+num(x['market_z'])+'</td></tr>')
                      parts.append('</tbody></table></div>')
                  table(up,'Higher-than-market historical outcomes')
                  table(down,'Lower-than-market historical outcomes')
                  parts.append('<p class="note">Full thresholds, both positive and negative directions, all missing-data exclusions and rolling 5/10/15/20-year results are in the CSV export. '
                               'The top examples shown above are deliberately labelled exploratory because sorting thousands of patterns can produce chance extremes.</p></details>')
              parts.append('</body></html>')
              (out/'sunday_36_race_trend_report.html').write_text('\n'.join(parts),encoding='utf-8')

          def build_sunday_comparators(features,path,out,discovered=None):
              targets=load_sunday(path)
              if not targets:raise ValueError('No Sunday races supplied')
              pools=[{1:[],2:[],3:[],4:[]} for _ in targets]
              bydisc=collections.defaultdict(list)
              counts=[0]*len(targets);rng=[random.Random(20261101+i) for i in range(len(targets))]
              for i,r in enumerate(targets):bydisc[discipline(r)].append(i)
              for rr in iter_races(features):
                  if int(rr[0]['race_date'][:4])>2025:continue
                  rmeta=dict(rr[0]);rmeta['_field']=rr
                  for ix in bydisc.get(discipline(rmeta),[]):
                      tier=analog_tier(rmeta,targets[ix])
                      if tier is None:continue
                      if tier<=3:pools[ix][tier].append(rr)
                      else:
                          counts[ix]+=1
                          if len(pools[ix][4])<750:pools[ix][4].append(rr)
                          else:
                              pos=rng[ix].randrange(counts[ix])
                              if pos<750:pools[ix][4][pos]=rr
              summary=[];detail=[];validated=collections.defaultdict(list)
              for r in (discovered or []):
                  if r.get('test_replicated'):validated[r['context']].append(r)
              for ix,target in enumerate(targets):
                  batches=pools[ix];chosen=[];tierused=0
                  for tier in (1,2,3,4):
                      chosen.extend(batches[tier]);tierused=tier
                      if len(chosen)>=15:break
                  s={'meeting':target['meeting'],'time':target['time'],'race':target['race'],
                     'discipline':discipline(target),'condition':condition(target),'distance_f':target['distance_f'],
                     'historical_reference':'COMPARABLE_RACES_NOT_VERIFIED_SAME_ANNUAL_EVENT',
                     'comparison_tier':tierused,
                     'comparison_definition':('same course and race type' if tierused<=3 else 'other-course, same type, similar trip/season'),
                     'broad_pool_races_found':counts[ix],
                     'broad_pool_sampled':counts[ix]>750 and tierused==4,
                     'historical_races_used':len(chosen),
                     'historical_years':len(set(x[0]['race_date'][:4] for x in chosen)),
                     'comparison_warning':('TOO_FEW_COMPARABLE_RACES' if len(chosen)<8 else 'OTHER_COURSES_SAMPLE_NOT_SAME_EVENT' if tierused==4 else 'SAME_COURSE_ANALOGUES_NOT_SAME_EVENT')}
                  summary.append(s)
                  if not chosen:continue
                  analysis,audit=analogue_trait_summaries(chosen)
                  for d in analysis:
                      detail.append({'meeting':target['meeting'],'time':target['time'],'race':target['race'],
                                     'comparison_tier':tierused,'status':'DESCRIPTIVE_NOT_INDEPENDENTLY_VALIDATED_FOR_THIS_RACE',**d})
                  # The broader replicated hypotheses are separately marked; do NOT
                  # imply that they were demonstrated in the small same-course sample.
                  for ctx in contexts({'course':target['meeting'],'race_type':target['discipline'],
                                       'race_condition':target['conditions'],'distance_f':target['distance_f']}):
                      for r in validated.get(ctx,[]):
                          detail.append({'meeting':target['meeting'],'time':target['time'],'race':target['race'],
                                         'comparison_tier':'VALIDATED_BROAD_COHORT','feature_family':'INTERACTION',
                                         'trend_condition':r['hypothesis'],'status':r['evidence_label'],
                                         'market_z':r.get('test_market_z'),
                                         'historical_sp_roi_pct':r.get('test_historical_sp_roi_pct')})
              summary.sort(key=lambda x:(x['meeting'],x['time']))
              detail.sort(key=lambda x:(x['meeting'],x['time'],x.get('lookback_window',''),x['feature_family'],x['trend_condition']))
              for filename,rows in [('sunday_36_race_comparability.csv',summary),('sunday_every_positive_negative_trait.csv',detail)]:
                  with (out/filename).open('w',newline='',encoding='utf-8') as f:
                      cols=(list(dict.fromkeys(k for x in rows for k in x)) if rows else
                            (['meeting','time','race','comparison_tier','historical_races_used'] if filename=='sunday_36_race_comparability.csv' else
                             ['meeting','time','race','trend_condition','status','races_eligible','winner_credit_with_trait']))
                      w=csv.DictWriter(f,cols);w.writeheader();w.writerows(rows)
              write_sunday_html(summary,detail,out)
              return {'race_count':len(summary),'detail_rows':len(detail),'comparators_ge_8':sum(x['historical_races_used']>=8 for x in summary)}


          def main():
              p=argparse.ArgumentParser()
              p.add_argument('--features',required=True);p.add_argument('--out',required=True)
              p.add_argument('--sunday-races',required=True);p.add_argument('--max-races',type=int,default=0)
              args=p.parse_args();out=Path(args.out);out.mkdir(parents=True,exist_ok=True)
              rows,audit=explore(args.features,out,max_races=args.max_races)
              sunday=build_sunday_comparators(args.features,args.sunday_races,out,rows)
              audit['sunday']=sunday
              audit['limitations']=['Every Sunday comparable cohort is NOT necessarily the same annual event.',
                'Source horse identity is provisional and has known age/last-run matching errors; do not create horse rankings.',
                'Historical database latest form may end 7 Oct 2026; do not claim up-to-date form.',
                'Small historical winner-count patterns are descriptive, not automatically significant.',
                'Market-adjusted z uses historical final SP as retrospective benchmark, never a pre-race feature.',
                'Missing SP means market evaluation is omitted for that entire race.',
                'Missing metrics exclude the affected complete race; unknown is never equivalent to false.',
                'Race grade, wind surgery, running style, pedigree performance, first-time headgear may be absent or insufficient.',
                'Historical training/validation/test splits overlap in general racing conditions but not in calendar time.',
                'Hypothesis screening uses no independent test outcomes; repeated research against same test span is exploratory.']
              (out/'audit.json').write_text(json.dumps(audit,indent=2))
              (out/'README_FIRST.md').write_text(
                 '# Stage 9: deep, symmetrical race trends\n\n'+
                 'Each numeric threshold is tested on both sides. A report can show 5/8 winners with NO previous chase runs, '
                 '6/8 winners with a race within 30 days, or 0/8 winners returning after 200+ days **only if the underlying data show it**. '
                 'Always inspect runner exposure, data completeness and expected winners.\n\n'+
                 f"Generated {audit['train_tested_hypotheses']:,} training hypotheses. "
                 f"Confirmed without independent test: {audit['validated_without_test']:,}. "
                 f"Replicated independent test: {audit['replicated_independent_test']:,}.\n\n"+
                 'The Sunday comparison report analyses SAME-COURSE *comparable races*, NOT certified annual-edition histories. '
                 'Its raw winning percentages are DESCRIPTIVE; they are not enough to confer a positive/negative edge. '
                 'No provisional horse matching results are used to rank Sunday starters.\n')
              print(json.dumps(audit,indent=2),flush=True)

          if __name__=='__main__':main()
