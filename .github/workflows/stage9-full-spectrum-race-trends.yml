          def number(x):
              try:
                  v=float(x)
                  return v if math.isfinite(v) else None
              except (ValueError,TypeError):return None


          def norm(s):return re.sub(r'[^a-z0-9]+',' ',str(s or '').lower()).strip()


          def discipline(r):
              s=norm(r.get('race_type') or r.get('discipline'))
              if 'chase' in s or 'steeple' in s:return 'CHASE'
              if 'hurdle' in s:return 'HURDLE'
              if 'bumper' in s or 'nh flat' in s:return 'BUMPER'
              if 'flat' in s or s in ('aw','all weather'):return 'FLAT'
              return 'UNKNOWN'


          def condition(r):
              src=norm(r.get('race_condition') or r.get('conditions') or '')
              title=norm(r.get('race_name') or r.get('race'))
              if src=='handicap' and ('novice' in title or 'beginners' in title):return 'NOVICE_HANDICAP'
              if src in ('unknown','conditions',''):
                  if src=='conditions' and not title:return 'CONDITIONS'
                  src=title
              # Distinguish novice handicaps and beginners from ordinary chases.
              if 'handicap' in src:
                  return 'NOVICE_HANDICAP' if ('novice' in src or 'beginners' in src) else 'HANDICAP'
              if 'maiden' in src:return 'MAIDEN'
              if 'beginners' in src:return 'BEGINNERS'
              if 'novice' in src:return 'NOVICE'
              if 'claiming' in src:return 'CLAIMING'
              if 'selling' in src:return 'SELLING'
              if 'bumper' in src or 'nh flat' in src or 'national hunt flat' in src:return 'BUMPER'
              if 'conditions' in src or 'listed' in src or 'graded' in src or 'grade' in src or 'group' in src:return 'CONDITIONS'
              return 'UNKNOWN'


          def band(d):
              if d is None:return 'UNKNOWN'
              return 'SPRINT' if d<8 else 'MILE' if d<11 else 'MIDDLE' if d<16 else 'LONG' if d<22 else 'STAYING'


          def course(r):return norm(r.get('course') or r.get('meeting'))


          def contexts(r):
              """Top-level is descriptive only; fine contexts must match same race type."""
              disc=discipline(r);cond=condition(r)
              if disc=='UNKNOWN':return []
              output=['DISC:'+disc]
              if cond!='UNKNOWN':
                  root=f'{disc}:{cond}'
                  output.append('TYPE:'+root)
                  if disc=='FLAT':
                      sf=norm(r.get('surface'))
                      if sf in ('aw','all weather','polytrack','tapeta','fibresand','synthetic'):
                          output.append('SURFACE_TYPE:AW:'+root)
                      elif sf in ('flat','turf','grass'):
                          output.append('SURFACE_TYPE:TURF:'+root)
                  d=number(r.get('distance_f'))
                  if d is not None:output.append('TYPE_DIST:'+root+':'+band(d))
                  field=number(r.get('field_size'))
                  if field is not None:
                      fband='SMALL' if field<=7 else 'MEDIUM' if field<=12 else 'LARGE'
                      output.append('TYPE_FIELD:'+root+':'+fband)
                  c=course(r)
                  if c:output.append('COURSE_TYPE:'+c+':'+root)
                  # No spurious all-racing patterns made to appear category-specific.
                  grade=norm(r.get('race_grade'))
                  if grade:output.append('GRADE_TYPE:'+root+':'+grade)
              return output


          def split(year):
              return 'train' if TRAIN[0]<=year<=TRAIN[1] else 'valid' if VALID[0]<=year<=VALID[1] else 'test' if TEST[0]<=year<=TEST[1] else None


          def bin_tag(group,value):
              ends=BINS.get(group)
              if not ends:return None
              if value<ends[0]:return f'{group}:BIN_LT{ends[0]}'
              for i in range(len(ends)-1):
                  if ends[i]<=value<ends[i+1]:return f'{group}:BIN_{ends[i]}_{ends[i+1]-1}'
              return f'{group}:BIN_GE{ends[-1]}'


          def trait_groups(r):
              """Return families -> all true tags; missing family omitted, never false."""
              d=discipline(r);out={}
