                                         'TRAINER_JOCKEY_WINRATE':'trainer_jockey_wins'}[fam]))
                      minimum=20 if fam=='TRAINER_COURSE_WINRATE' else 10
                      val=wins/val if wins is not None and val is not None and val>=minimum else None
                  if fam=='CLASS_CHANGE':
                      cur=re.search(r'\b([1-7])\b',str(r.get('race_class') or ''))
                      val=int(cur.group(1))-val if cur and val is not None else None
                  if fam in ('PREVIOUS_LONG_BREAK_WINS',) and not (number(r.get('prior_layoff_180_starts')) or 0)>=1:val=None
                  if fam=='OR_VS_PREVIOUS_WIN' and val is None:
                      a=number(r.get('official_rating'));b=number(r.get('previous_winning_or'))
                      val=a-b if a is not None and b is not None else None
                  # Only include prior experience for horses with credible history identity.
                  if fam in ('CHASE_EXPERIENCE','HURDLE_EXPERIENCE'):
