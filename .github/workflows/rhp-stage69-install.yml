          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(payload)),mode='r:') as tf:
              files={m.name:m for m in tf.getmembers() if m.isfile()}
              if set(files)!=set(allowed):
                  raise RuntimeError('Stage69 source file manifest mismatch')
              for name in allowed:
                  if not name.startswith('scripts/') and name!='stage69_install.py':
                      raise RuntimeError('Unexpected installer target')
                  data=tf.extractfile(files[name]).read()
                  if len(data)>100000:raise RuntimeError('Unexpected large Stage69 source file')
                  target=pathlib.Path(name);target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          print('Stage69 source bundle verified and restored')
          RHP_STAGE69_BUNDLE

      - name: Install only guarded D(c) app and verified-results changes
        run: |
          set -euo pipefail
          python stage69_install.py
          python -m py_compile stage69_install.py scripts/rhp_stage68_dc.py scripts/rhp_stage68_settle.py scripts/rhp_stage68_schedule.py scripts/rhp_stage68_push.py scripts/rhp_stage69_verified_results.py
          node --check scripts/stage38_app.js
          python - <<'PY'
          import pathlib,re,subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts:raise RuntimeError('No inline app JavaScript found')
          pathlib.Path('/tmp/rhp-stage69-app.js').write_text(scripts[-1])
          subprocess.run(['node','--check','/tmp/rhp-stage69-app.js'],check=True)
          PY

      - name: Apply eight independently verified PU, F, UR race outcomes
        run: |
          set -euo pipefail
          python scripts/rhp_stage69_verified_results.py --strict
          python scripts/stage68_result_reconciler.py
          python calculate-strike-rates.py
          python scripts/rhp_stage68_settle.py
          git diff --check

      - name: Publish app and verified results, leaving GitHub workflow files alone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/stage38_app.js collect-puntersedge-results.py scripts/stage68_result_reconciler.py
          git add stage69_install.py scripts/rhp_stage68_dc.py scripts/rhp_stage68_settle.py scripts/rhp_stage68_schedule.py scripts/rhp_stage68_push.py scripts/rhp_stage68_frontend.js scripts/rhp_stage69_verified_results.py
          git add data/stage69-verified-outcome-sources.json data/race-results.json data/racing-results/ data/strike-rates.json data/form-identity-cache.json reports/stage32/form-rebuild-audit.json
          for item in data/strategy-d-history.json data/strategy-d-results.json data/strategy-dc-results.json; do
            if test -f "$item"; then git add "$item"; fi
          done
          if git diff --cached --quiet; then echo 'Stage69 already published'; exit 0; fi
          git commit -m 'Stage69 verify historical nonfinishers and activate race-type-aware Hot Pots D(c) UI'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Stage69 app and data PUBLISHED. Run Hot Pots D(c) workflow to publish first next-day selections.'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          echo 'GitHub publish failed; do not assume Stage69 is installed' >&2
          exit 1
