name: Stage66 - Three Model D Daily Paper Selections
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-way:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 kagglehub
      - name: Download historical source and build baseline
        run: |
          python - <<'PY'
          import kagglehub,subprocess,sys
          from pathlib import Path
          source=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
          Path('reports/stage66/daily').mkdir(parents=True,exist_ok=True)
          Path('reports/stage66/daily/source_path.txt').write_text(str(source))
          subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import','--input',str(source),'--min-date','1988-01-01','--max-date','2026-10-07','--database','reports/stage66/daily/original.sqlite','--report','reports/stage66/daily/import.json'],check=True)
          PY
      - name: Recover verified history without changing live model
        run: |
          python -u scripts/stage65m_backfill.py --baseline reports/stage66/daily/original.sqlite --out reports/stage66/daily/backfill --keep-candidate --skip-replay
      - name: Enrich exact historical race classifications for C
        run: |
          python - <<'PY'
          import subprocess,sys,pathlib
          source=pathlib.Path('reports/stage66/daily/source_path.txt').read_text().strip()
          subprocess.run([sys.executable,'-u','scripts/stage65p_enrich_race_details.py','--db','reports/stage66/daily/backfill/backfilled_research_only.sqlite','--source',source,'--out','reports/stage66/daily/enrichment'],check=True)
          PY
      - name: Generate A B C pre-off selections
        run: |
          python -u scripts/stage66_live_paper_comparison.py --baseline reports/stage66/daily/original.sqlite --db reports/stage66/daily/backfill/backfilled_research_only.sqlite --out reports/stage66/daily/snapshots
      - name: Upload comparison and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage66-three-model-d-daily-selections
          path: |
            reports/stage66/daily/snapshots/*.csv
            reports/stage66/daily/snapshots/*.json
            reports/stage66/daily/enrichment/*.json
            reports/stage66/daily/backfill/*.json
          if-no-files-found: warn
          retention-days: 30
