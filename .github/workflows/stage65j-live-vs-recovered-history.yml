name: Stage65J - Compare Frozen Model D and Recovered History
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate audit script
        run: python -m py_compile scripts/stage65j_compare_live_history.py
      - name: Restore Stage2 and Stage65E, or rebuild Stage2 research copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stage65j_sources/live reports/stage65j_sources/recovered
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          wanted={'stage2-historical-staging-database':'reports/stage65j_sources/live',
                  'stage65e-detailed-history-database':'reports/stage65j_sources/recovered'}
          found={}
          for page in range(1,21):
              data=json.loads(subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts',
                 '-f','per_page=100','-f',f'page={page}'],text=True))
              arts=data.get('artifacts',[])
              for a in arts:
                  if a.get('name') in wanted and not a.get('expired'):
                      n=a['name']
                      if n not in found or a['created_at']>found[n]['created_at']:found[n]=a
              if len(arts)<100:break
          for name,dest in wanted.items():
              if name not in found:
                  if name!='stage2-historical-staging-database':
                      raise SystemExit('Missing/expired Stage65E artifact; rerun Stage65E first')
                  print('Stage2 artifact missing; rebuilding a RESEARCH-ONLY RECONSTRUCTION, not verified live DB',flush=True)
                  subprocess.run([sys.executable,'-m','pip','install','--disable-pip-version-check','kagglehub>=0.3,<1'],check=True)
                  import kagglehub
                  archive=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
                  db=Path(dest)/'historical_ukie_staging.sqlite'
                  subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import','--input',str(archive),
                      '--min-date','1988-01-01','--max-date','2026-10-07','--database',str(db),
                      '--report',str(Path(dest)/'stage2_rebuild_report.json')],check=True)
                  with open(os.environ['GITHUB_ENV'],'a') as f:
                      print('STAGE65J_LIVE_DB='+str(db.resolve()),file=f)
                      print('STAGE65J_BASELINE_PROVENANCE=RECONSTRUCTED_NOT_LIVE',file=f)
                  continue
              subprocess.run(['gh','run','download',str(found[name]['workflow_run']['id']),
                  '--repo',repo,'--name',name,'--dir',dest],check=True)
              matches=list(Path(dest).rglob('*.sqlite'))
              if len(matches)!=1:raise SystemExit('Expected exactly one SQLite in '+dest+', found '+str(matches))
              key='STAGE65J_LIVE_DB' if name.startswith('stage2') else 'STAGE65J_RECOVERED_DB'
              with open(os.environ['GITHUB_ENV'],'a') as f:print(key+'='+str(matches[0].resolve()),file=f)
              print(name,'source artifact run',found[name]['workflow_run']['id'],'bytes',matches[0].stat().st_size)
          PY
      - name: Run strictly read-only Model D source comparison
        run: |
          python -u scripts/stage65j_compare_live_history.py \
            --live-db "$STAGE65J_LIVE_DB" \
            --recovered-db "$STAGE65J_RECOVERED_DB" \
            --out reports/stage65j
      - name: Upload small reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage65j-live-vs-recovered-history
          path: reports/stage65j/
          retention-days: 90
          if-no-files-found: warn
