          from stage7_discovery import key_for_horse, flags, surface_kind, race_kind, process

          class Stage7Tests(unittest.TestCase):
              def test_composite_horse_id_and_surfaces(self):
                  a={'horse_name':'Second To None (IRE)','age':5,'sire':'','dam':''}
                  b={'horse_name':'Second To None (IRE)','age':6,'sire':'','dam':''}
                  k1,_=key_for_horse(a,dt.date(2020,9,1))
                  k2,_=key_for_horse(b,dt.date(2021,9,1))
                  self.assertEqual(k1,k2)
                  k3,_=key_for_horse(b,dt.date(2020,9,1))
                  self.assertNotEqual(k1,k3)
                  self.assertEqual(surface_kind(None,'Flat','Standard','Dundalk'),'AW')
                  self.assertEqual(race_kind('AW'),'flat')
                  self.assertEqual(surface_kind(None,'Flat','Good','Lingfield'),'FLAT')

              def test_strictly_prior_day_and_test_split(self):
                  with tempfile.TemporaryDirectory() as t:
                      p=Path(t);db=p/'t.db';cx=sqlite3.connect(db)
                      cx.executescript('''
                          create table historical_races(id text primary key,race_date text,course text,race_type text,surface text,distance_f real, going text,race_class text);
                          create index hist_date_idx on historical_races(race_date);
                          create table historical_runs(race_id text,runner_key text,horse_source_id text,horse_name text,horse_name_norm text,horse_country text,foaled text,finish_pos int,outcome text,trainer text,jockey text,official_rating real,weight_lbs real,sp_decimal real,draw int,age int,sex text,sire text,dam text,primary key(race_id,runner_key));
                      ''')
                      for date,rid,winner in [('2022-01-01','race1',1),('2022-01-01','race2',2),('2022-01-03','race3',2),('2023-02-01','race4',2)]:
                          cx.execute('insert into historical_races values(?,?,?,?,?,?,?,?)',(rid,date,'Cork','Chase',None,24,'Good',3))
                          for pos,horse in [(winner,'Same Horse (IRE)'),(3-winner,'Another Horse (GB)')]:
                              # 2 runners, one is first and the other second.
                              cx.execute('insert into historical_runs values(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)',(rid,horse,None,horse,'',None,None,pos,'','Trainer A','Jockey A',115,162,3,1,8 if date.startswith('2023') else 7,'G','',''))
                      cx.commit();cx.close()
                      out=p/'out';process(db,out,None,'2024-01-01',0,2022)
                      rows=list(csv.DictReader(open(out/'pre_race_runner_features.csv')))
                      self.assertEqual(len(rows),8)
                      first=[r for r in rows if r['horse_name']=='Same Horse (IRE)']
                      self.assertEqual([int(r['horse_prior_starts']) for r in first],[0,0,2,3])
                      self.assertEqual([int(float(r['horse_prior_wins'])) for r in first],[0,0,1,1])
                      self.assertEqual([r['year_split'] for r in first],['TEST']*4)
                      a=json.load(open(out/'audit.json'))
                      self.assertEqual(a['counts']['races_usable'],4)
                      self.assertEqual(a['counts']['horse_identity_COMPOSITE_NAME_COUNTRY_BIRTHYEAR_REVIEW'],8)

          if __name__=='__main__':unittest.main()
          STAGE7_DISCOVERY_TESTS
      - name: Test leak protection and historic linking
        run: python -m unittest -v test_stage7
      - name: Download existing Stage 2 SQLite and optional Stage 4 mapping
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'STAGE7_EXISTING_ARTIFACTS'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          records=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts','--method','GET','-f','per_page=100'],text=True))['artifacts']
          for expected,root,key,target,suffix in [
            ('stage2-historical-staging-database','stage2_database','STAGE2_DB',None,('.sqlite','.db')),
            ('stage4-reference-named-events-and-winners','stage4_identity','STAGE4_MAP','all_races_with_reference_event_ids.csv',('.csv',)),
          ]:
            chosen=sorted((a for a in records if a['name']==expected and not a.get('expired')),key=lambda z:z['created_at'],reverse=True)
            if not chosen:
              if key=='STAGE4_MAP':
                print('Optional identity annotation not available:',expected,'(trends continue)',flush=True)
                continue
              raise SystemExit('Missing historical database artifact: '+expected)
            a=chosen[0]
            print('Downloading',a['name'],'artifact',a['id'],'size',a['size_in_bytes'],'bytes',flush=True)
            Path(root).mkdir(exist_ok=True)
            subprocess.run(['gh','run','download',str(a['workflow_run']['id']),'--repo',repo,'--name',expected,'--dir',root],check=True)
            allfiles=[p for p in Path(root).rglob('*') if p.is_file() and (p.name==target if target else p.suffix in suffix)]
            if not allfiles:
              if key=='STAGE4_MAP':continue
              raise SystemExit('Downloaded but missing expected Stage 2 SQLite DB')
            path=max(allfiles,key=lambda z:z.stat().st_size).resolve()
            print(key,path,'bytes',path.stat().st_size,flush=True)
            with open(os.environ['GITHUB_ENV'],'a') as f:print(key+'='+str(path),file=f)
          STAGE7_EXISTING_ARTIFACTS
      - name: Stream historical races, reconstruct pre-race form, test signals
        shell: bash
        run: |
          set -euo pipefail
          args=( --db "$STAGE2_DB" --out stage7_results --cutoff 2026-11-01 --export-min-year 2022 )
          if [[ -n "${STAGE4_MAP:-}" ]]; then args+=( --mapping "$STAGE4_MAP" ); fi
          if [[ -s data/racecards.json ]]; then args+=( --current-cards data/racecards.json ); fi
          python stage7_discovery.py "${args[@]}"
      - name: Publish audit and research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-chronological-positive-negative-signals
          path: stage7_results/
          retention-days: 30
          if-no-files-found: warn
