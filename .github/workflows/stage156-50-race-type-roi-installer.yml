          content=current.read_bytes()
          known_sha='378309f3535f0880c123c3813a938aa730b5dbbe38bed8f6899a995f1751222c'
          updated=gzip.decompress(base64.b64decode(package['scripts/stage153_roi_combined.py']))
          if hashlib.sha256(content).hexdigest()!=known_sha and content!=updated:
              raise RuntimeError('Stage153 scorer changed since audit. Refusing to overwrite newer selection/commentary work; merge before installing.')
          for name,encoded in package.items():
              dest=pathlib.Path(name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              data=gzip.decompress(base64.b64decode(encoded))
              dest.write_bytes(data)
              print('STAGE156_READY',name,len(data))
          info=json.loads(pathlib.Path('data/roi-racetype-route-map.json').read_text())
          assert len(info['routes'])==50
          assert info['routes']['AW_NOVICE']['model']=='STAGE143_TYPE_INTERACTIONS'
          assert info['routes']['HURDLE_JUVENILE']['model']=='D_FORM_WEIGHT_GRADE__ROI'
          assert info['routes']['AW_LISTED_PATTERN']['historical_races']==7
          print('STAGE156_TYPE_AUDIT_OK',len(info['routes']),'historically tested categories')
          STAGE156_FILES
          python -m py_compile scripts/stage153_roi_combined.py
          python scripts/stage153_roi_combined.py self-test
      - name: Commit improved type routes and preserve all other model files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stage153_roi_combined.py data/roi-racetype-route-map.json
          if git diff --cached --quiet;then echo 'STAGE156_ALREADY_INSTALLED';exit 0;fi
          git commit -m 'Stage156: route previously unassessed types via audited ROI specialists'
          for i in 1 2 3 4 5;do
            if git pull --rebase origin main && git push origin HEAD:main;then
              echo 'STAGE156_SOURCE_PUBLISHED';exit 0
            fi
            git rebase --abort || true
            sleep "$((i*4))"
          done
          exit 1
      - name: Trigger fresh combined selections from all existing specialist workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(TZ=Europe/Dublin date +%F)"
          HOUR="$(TZ=Europe/Dublin date +%H)"
          if [ "$HOUR" -ge 18 ];then TARGET="$(TZ=Europe/Dublin date -d tomorrow +%F)";fi
          echo "Reassessing $TARGET: all five specialists will be triggered by Stage153 controller"
          if gh workflow run stage153-roi-combined.yml --repo ficokelly/Racing-app --ref main -f "selection_date=$TARGET";then
            echo 'STAGE156_REASSESSMENT_DISPATCHED'
          else
            echo 'Stage156 installed successfully, but automatic dispatch was rejected. Run Stage153 manually.'
          fi
