name: Stage90 - Kaggle Comments and Distances Recovery Audit
on:
  workflow_dispatch:
    inputs:
      since:
        description: 'First racing date to inspect'
        required: true
        type: string
        default: '2026-10-24'
      as_of:
        description: 'Last racing date, blank means current Ireland date'
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: stage90-kaggle-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Stage90 self-test
        run: python scripts/stage90_kaggle_gap_audit.py --self-test
      - name: Install public Kaggle downloader
        run: python -m pip install --disable-pip-version-check 'kagglehub>=0.3,<1'
      - name: Audit latest public Kaggle source versus current results
        env:
          FIRST: ${{ inputs.since }}
          LAST: ${{ inputs.as_of }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--root . --out reports/stage90 --since "${FIRST:-2026-10-24}")
          if [ -n "${LAST:-}" ]; then args+=(--as-of "$LAST"); fi
          python -u scripts/stage90_kaggle_gap_audit.py "${args[@]}"
      - name: Publish small report and source-coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage90-kaggle-audit-${{ github.run_id }}
          path: |
            reports/stage90/stage90-report.json
            reports/stage90/stage90-coverage-by-month.csv
            reports/stage90/stage90-recovery-candidates.csv
          if-no-files-found: warn
          retention-days: 90
