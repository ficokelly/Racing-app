name: Stage88 - Model E Verified Non-Finishers v1 Research

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'As-of date YYYY-MM-DD, Ireland (blank means today)'
        required: false
        type: string
        default: ''
      days:
        description: 'Completed days for paired research backtest'
        required: true
        type: choice
        default: '30'
        options: ['7', '14', '30', '60', '90']

permissions:
  contents: read
  actions: read

concurrency:
  group: stage88-model-e-verified-outcomes-research
  cancel-in-progress: false

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout dated cards and research source read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test frozen E v0 and Stage88 explicit-result adapter
        run: |
          python scripts/stage86_hpr_engine.py --mode self-test
          python scripts/stage88_hpr_verified_outcomes.py --mode self-test
          python scripts/stage88_hpr_paired_comparison.py --self-test
      - name: Restore historical Stage86 base
        uses: actions/cache@v4
        with:
          path: |
            reports/stage86/base/original.sqlite
            ~/.cache/kagglehub
          key: stage86-base-v129-${{ hashFiles('import_historical_ukie.py') }}
          restore-keys: |
            stage84-base-ukie-v129-
      - name: Install historical source downloader
        run: python -m pip install --disable-pip-version-check kagglehub
      - name: Verify original historical archive without modifying it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import kagglehub,subprocess,sys,sqlite3
          from pathlib import Path
          p=Path('reports/stage86/base/original.sqlite');p.parent.mkdir(parents=True,exist_ok=True)
          if not p.exists() or p.stat().st_size<1000000:
            source=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
            subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import',
              '--input',str(source),'--min-date','1988-01-01','--max-date','2026-10-07',
              '--database',str(p),'--report','reports/stage86/base/import.json'],check=True)
          with sqlite3.connect('file:'+str(p.resolve())+'?mode=ro',uri=True) as c:
            assert c.execute('PRAGMA quick_check').fetchone()[0]=='ok'
            assert c.execute('SELECT COUNT(*) FROM historical_races').fetchone()[0]>100000
          PY
      - name: Backtest original E v0 unchanged
        shell: bash
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          args=(--mode backtest --db reports/stage86/base/original.sqlite \
            --root . --output reports/stage88/v0 --days "${DAYS:-30}" --git-preoff)
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage86_hpr_engine.py "${args[@]}"
      - name: Research candidate E v1 with ONLY explicit DNF result recovery
        shell: bash
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          args=(--mode backtest --db reports/stage86/base/original.sqlite \
            --root . --output reports/stage88/v1 --days "${DAYS:-30}" --git-preoff)
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage88_hpr_verified_outcomes.py "${args[@]}"
      - name: Produce paired exact-race comparison and evidence audits
        run: |
          python scripts/stage88_hpr_paired_comparison.py \
            --baseline reports/stage88/v0/hpr-race-by-race.csv \
            --candidate reports/stage88/v1/hpr-race-by-race.csv \
            --output reports/stage88/paired
      - name: Upload compact read-only findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage88-model-e-v0-v1-${{ github.run_id }}
          path: |
            reports/stage88/v0/hpr-audit.json
            reports/stage88/v0/hpr-metrics.csv
            reports/stage88/v1/hpr-audit.json
            reports/stage88/v1/hpr-metrics.csv
            reports/stage88/paired/*.json
            reports/stage88/paired/*.csv
          retention-days: 90
          if-no-files-found: warn
