name: 'Stage155 — Evidence-led individual horse and race commentary'

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Stage153 — ROI Specialists single Hot Pots model'
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: stage155-enrich-only
  cancel-in-progress: false

jobs:
  install:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout full history of main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover verified Stage155 commentary module and correct indentation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess, textwrap
          path='.github/workflows/stage155-evidence-commentary-install.yml'
          commits=subprocess.check_output(['git','log','--all','--format=%H','--',path],text=True).splitlines()
          originals=[]
          for sha in commits:
              p=subprocess.run(['git','show',f'{sha}:{path}'],capture_output=True,text=True)
              if p.returncode==0 and 'STAGE155_SCRIPT_BYTES' in p.stdout and 'Check prose differentiates runner form' in p.stdout:
                  originals.append(p.stdout)
          if not originals:
              raise RuntimeError('Original Stage155 source not found in Git history. Refusing to invent a commentary module.')
          original=originals[-1]
          def embedded_python(start,end):
              if original.count(start)!=1 or original.count(end)!=1:
                  raise RuntimeError('Original installer block changed; safe extraction stopped')
              part=original.split(start,1)[1].split(end,1)[0]
              lines=part.splitlines()
              first=next(i for i,s in enumerate(lines) if s.strip()=="python - <<'PY'")
              last=next(i for i in range(first+1,len(lines)) if lines[i].strip()=='PY')
              return textwrap.dedent('\n'.join(lines[first+1:last]))+'\n'
          source=embedded_python(
              '      - name: Install grounded commentary source and preserve optional API evidence fields',
              '      - name: Check prose differentiates runner form and never fabricates course history')
          # The earlier installer assumed two leading spaces inside the current
          # Stage153 build() function. Stage156 correctly uses ONE leading space.
          # Change only the original insertion point and its inserted lines.
          replacements=[
            ("needle='  args.output.write_text(json.dumps(payload,indent=2,ensure_ascii=False)'",
             "needle=' args.output.write_text(json.dumps(payload,indent=2,ensure_ascii=False)'"),
            ("addition=('  '+mark+'\\n'", "addition=(' '+mark+'\\n'"),
            ("'  _enrich_individual(payload, cards, args.sources)\\n'",
             "' _enrich_individual(payload, cards, args.sources)\\n'"),
            ("'  # Stage155 only changes prose; source-model runners, ranks, scores and picks are preserved.\\n'",
             "' # Stage155 only changes prose; source-model runners, ranks, scores and picks are preserved.\\n'")]
          for before,after in replacements:
              if source.count(before)!=1:
                  raise RuntimeError('Stage155 patch anchor is not unique: '+before[:90])
              source=source.replace(before,after,1)
          test=embedded_python(
              '      - name: Check prose differentiates runner form and never fabricates course history',
              '      - name: Commit prose-only changes without modifying the specialist selection rules')
          pathlib.Path('/tmp/stage155-original-install-corrected.py').write_text(source)
          pathlib.Path('/tmp/stage155-original-test.py').write_text(test)
          print('STAGE155_RECOVERED_VERIFIED_ORIGINAL_AND_FIXED_FOUR_ANCHORS')
          PY
      - name: Install commentary without changing any workflow files or scoring choices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python /tmp/stage155-original-install-corrected.py
            python -m py_compile scripts/stage155_evidence_commentary.py scripts/stage153_roi_combined.py collect-racecards.py
            python scripts/stage153_roi_combined.py self-test
            PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" python /tmp/stage155-original-test.py
            git add scripts/stage155_evidence_commentary.py scripts/stage153_roi_combined.py collect-racecards.py
            if git diff --cached --quiet; then
              echo 'STAGE155_ALREADY_INSTALLED'
              break
            fi
            git commit -m 'Stage155: install evidence-led prose, leave frozen model rankings untouched'
            if git push origin HEAD:main; then
              echo 'STAGE155_GROUNDED_PROSE_INSTALLED'
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo 'Failed to publish commentary changes after 5 attempts' >&2
              exit 1
            fi
            sleep "$((attempt*5))"
          done
      - name: Enrich current publication while preserving every horse ranking and selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stage155/source
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if [ ! -s data/strategy-roi-combined.json ]; then
              echo 'No published combined feed; the installed hook will enrich the next Stage153 run.'
              exit 0
            fi
            cp data/strategy-roi-combined.json "$RUNNER_TEMP/stage155-before.json"
            python scripts/stage155_evidence_commentary.py \
              --feed data/strategy-roi-combined.json \
              --cards data/racecards.json \
              --sources reports/stage155/source
            python - <<'PY'
          import json,os,pathlib
          before=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'stage155-before.json').read_text())
          after=json.loads(pathlib.Path('data/strategy-roi-combined.json').read_text())
          def frozen(feed):
              return [(r.get('date'),r.get('course'),r.get('time'),r.get('source_model'),
                       r.get('selection'),r.get('selection_status'),
                       [(h.get('horse'),h.get('rank'),h.get('research_score'),h.get('source_model'))
                        for h in r.get('runners',[])]) for r in feed.get('races',[])]
          assert frozen(before)==frozen(after),'Stage155 must not alter rank, score, source model or pick'
          print('STAGE155_SELECTION_RANKS_SCORES_UNCHANGED',len(frozen(after)))
          PY
            git add data/strategy-roi-combined.json
            if git diff --cached --quiet; then
              echo 'STAGE155_FEED_ALREADY_ENRICHED'
              exit 0
            fi
            git commit -m 'Stage155: publish grounded individual and race commentary'
            if git push origin HEAD:main; then
              echo 'STAGE155_COMMENTARY_PUBLISHED'
              exit 0
            fi
            sleep "$((attempt*5))"
          done
          echo 'Failed to publish current feed after retries' >&2
          exit 1
