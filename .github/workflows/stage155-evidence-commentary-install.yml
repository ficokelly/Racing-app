name: 'Stage155 — Evidence-led individual horse and race commentary'

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Stage153 — ROI Specialists single Hot Pots model'
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: stage155-enrich-only
  cancel-in-progress: false

jobs:
  install:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
