      - name: Check prose differentiates runner form and never fabricates course history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,pathlib,copy
          from scripts.stage155_evidence_commentary import enrich
          cards={'runners':[
            {'date':'2026-11-19','course':'Test Course','race_time':'2026-11-19T15:00:00Z','horse':'A','form':'21611','ofr':112,'course_distance_wins':2},
            {'date':'2026-11-19','course':'Test Course','race_time':'2026-11-19T15:00:00Z','horse':'B','form':'67780','ofr':118},
            {'date':'2026-11-19','course':'Test Course','race_time':'2026-11-19T15:00:00Z','horse':'C','form':'40235','ofr':108}]}
          f={'day':'2026-11-19','races':[{'date':'2026-11-19','course':'Test Course','time':'15:00',
            'race_type':'aw handicap','selection':{'horse':'A'},'runners':[
            {'horse':'A','rank':1,'research_score':.22},
            {'horse':'B','rank':2,'research_score':.18},
            {'horse':'C','rank':3,'research_score':.1}]}]}
          old=copy.deepcopy(f)
          enrich(f,cards,pathlib.Path('reports/none'))
          a,b=[x['commentary'] for x in f['races'][0]['runners'][:2]]
          assert '2 verified wins over this course and distance' in a
          assert 'no top-three finish' in b
          assert 'course and distance' not in b
          assert f['races'][0]['selection']==old['races'][0]['selection']
          assert [(x['horse'],x['rank'],x['research_score']) for x in f['races'][0]['runners']]==[(x['horse'],x['rank'],x['research_score']) for x in old['races'][0]['runners']]
          assert a!=b and 'heads B' in f['races'][0]['commentary']
          print('STAGE155_FORM_COMPARISON_AND_NO_SELECTION_CHANGE_TEST_OK')
          PY
      - name: Commit prose-only changes without modifying the specialist selection rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp scripts/stage155_evidence_commentary.py "$RUNNER_TEMP/stage155-module.py"
          cp scripts/stage153_roi_combined.py "$RUNNER_TEMP/stage155-scorer.py"
          cp collect-racecards.py "$RUNNER_TEMP/stage155-collector.py"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/stage155-module.py" scripts/stage155_evidence_commentary.py
            cp "$RUNNER_TEMP/stage155-scorer.py" scripts/stage153_roi_combined.py
            cp "$RUNNER_TEMP/stage155-collector.py" collect-racecards.py
            git add scripts/stage155_evidence_commentary.py scripts/stage153_roi_combined.py collect-racecards.py
            if git diff --cached --quiet;then echo 'STAGE155_PROSE_ALREADY_INSTALLED';break;fi
            git commit -m 'Stage155: specific runner evidence and non-generic model race commentary'
            if git push origin HEAD:main;then echo 'STAGE155_PROSE_INSTALLED';break;fi
            test "$attempt" -lt 5 || exit 1
            sleep "$((attempt*5))"
          done
      - name: Restore independent pre-off horse history features if available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stage155/source
          python - <<'PY'
          import subprocess,json,csv,pathlib
          try:
            feed=json.loads(pathlib.Path('data/strategy-roi-combined.json').read_text())
            target=feed.get('day')
            r=subprocess.run(['gh','run','list','--workflow','stage141-today-or-weight-paper.yml','--limit','15',
              '--json','databaseId,conclusion,createdAt'],capture_output=True,text=True,check=True)
            runs=[x for x in json.loads(r.stdout) if x.get('conclusion')=='success']
            for run in runs:
              rid=run['databaseId'];folder=pathlib.Path('reports/stage155/source')
              p=subprocess.run(['gh','run','download',str(rid),'--name',f'stage141-today-hpr-or-weight-{rid}',
                '--dir',str(folder)],capture_output=True,text=True)
              if p.returncode!=0:continue
              f=folder/'stage141-today-all-runners.csv'
              if f.exists():
                with f.open(encoding='utf-8-sig') as stream:
                  if any(row['date']==target for row in csv.DictReader(stream)):
                    print('STAGE155_CONTEXT_FROM_PREOFF_STAGE141_RUN',rid,target);break
                f.unlink()
          except (OSError,ValueError,KeyError,subprocess.SubprocessError) as e:
            print('STAGE155_OPTIONAL_CONTEXT_UNAVAILABLE',str(e)[:250])
          PY
      - name: Apply grounded prose to the currently published selections without changing rankings
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4;do
            git fetch origin main
            git reset --hard origin/main
            if ! test -s data/strategy-roi-combined.json;then
              echo 'First Stage153 publication is not available yet; future scheduled runs will be enriched.'; exit 0
            fi
            python scripts/stage155_evidence_commentary.py \
              --feed data/strategy-roi-combined.json --cards data/racecards.json --sources reports/stage155/source
            git add data/strategy-roi-combined.json
            if git diff --cached --quiet;then echo 'STAGE155_PROSE_FEED_ALREADY_PUBLISHED';exit 0;fi
            git commit -m 'Stage155: publish grounded horse-by-horse race verdicts'
            if git push origin HEAD:main;then echo 'STAGE155_PROSE_FEED_PUBLISHED';exit 0;fi
            sleep "$((attempt*5))"
          done
          exit 1
