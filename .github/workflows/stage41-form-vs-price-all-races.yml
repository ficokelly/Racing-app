      - name: Verify independent research safety and syntax
        run: |
          set -euo pipefail
          test -s scripts/stage40_price_value.py
          python -m py_compile scripts/stage41_form_price.py scripts/stage41_app_patch.py scripts/stage40_price_value.py
          python scripts/stage40_price_value.py self-test
          python scripts/stage41_form_price.py self-test
          python scripts/stage41_app_patch.py --self-test
          python - <<'PY_JS'
          from pathlib import Path
          page=Path('form-price.html').read_text(encoding='utf-8')
          assert '<script>' in page and '</script>' in page
          Path('/tmp/stage41_ui_syntax.js').write_text(page.split('<script>',1)[1].split('</script>',1)[0])
          PY_JS
          node --check /tmp/stage41_ui_syntax.js

      - name: Compare independent form ranks against complete named-bookmaker markets
        env:
          TARGET_DAY: ${{ inputs.day || '' }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET_DAY" ]; then
            python scripts/stage41_form_price.py run --repo . --day "$TARGET_DAY"
          else
            python scripts/stage41_form_price.py run --repo .
          fi
          python scripts/stage41_app_patch.py --repo .
          python - <<'PY_RESULTS'
          import json
          from pathlib import Path
          o=json.loads(Path('data/form-price-opportunities.json').read_text())
          h=json.loads(Path('data/form-price-paper-history.json').read_text())
          assert o['models_changed'] is False and o['z_frozen_unchanged'] is True
          assert o['no_real_bets'] is True and o['no_betting_recommendations'] is True
          assert all(r.get('overlay') is None or r['overlay']['rank_advantage']>=2 for r in o['races'])
          assert all(x.get('no_bet_placed') is True for x in h.get('selections',[]))
          print('Race coverage:',o['summary'])
          print('No frozen model weights, My Bets or real P&L modified.')
          PY_RESULTS

      - name: Publish only Stage41 research and paper observations
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/stage41_form_price.py \
            scripts/stage41_app_patch.py \
            form-price.html index.html \
            data/form-price-opportunities.json \
            data/form-price-paper-history.json
          if git diff --cached --quiet; then echo 'Stage41 already current';exit 0;fi
          git diff --quiet || { echo 'Unrelated unstaged changes detected; refusing unsafe rebase';exit 1; }
          git commit -m 'Stage41: all-race form-versus-market ranks and separate forward paper diagnostics'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Stage41 published: https://ficokelly.github.io/Racing-app/form-price.html'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt*3))
          done
          echo 'Research generated; git publication failed. Artifact preserved.' >&2
          exit 1

      - name: Preserve the research outputs if publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage41-form-vs-price-all-races
          path: |
            data/form-price-opportunities.json
            data/form-price-paper-history.json
            form-price.html
          retention-days: 14
          if-no-files-found: warn
