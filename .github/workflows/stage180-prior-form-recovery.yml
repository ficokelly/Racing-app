      - name: Publish only validated ledger and corroborated result changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stage171-history/ data/racing-results/ scripts/stage180_archive_overlay.py scripts/stage167_validated_history.py
          if test -d data/stage180-history-overlay; then git add data/stage180-history-overlay/; fi
          if git diff --cached --quiet; then echo 'STAGE180_NO_VERIFIED_NEW_RECORDS'; exit 0; fi
          git commit -m 'Stage180: recover verified prior form and integrate older archive overlay'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git diff --name-only HEAD^ origin/main > "$RUNNER_TEMP/stage179-remote-changes.txt"
            python - <<'CHECK'
          import pathlib,os
          changes=pathlib.Path(os.environ['RUNNER_TEMP'],'stage179-remote-changes.txt').read_text().splitlines()
          critical=[p for p in changes if p.startswith(('data/stage171-history/','data/racing-results/','data/stage180-history-overlay/')) or p in ('scripts/stage171_recent_history.py','scripts/stage167_validated_history.py','scripts/stage180_archive_overlay.py','import_historical_ukie.py','scripts/stage65c_puntersedge_recovery.py','scripts/stage68_result_reconciler.py')]
          assert not critical,('Relevant historical input changed; rerun before publishing',critical)
          CHECK
            git rebase origin/main
            if git push origin HEAD:main; then echo 'STAGE180_PUBLISHED'; exit 0; fi
            sleep "$((attempt*3))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage180-recovery-audit
          path: reports/stage180/
          if-no-files-found: warn
          retention-days: 30
