
name: Collect Racing Racecards

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,5 * * *'  # Overnight fresh today/tomorrow cards; daytime uses 5-minute workflow

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect trainer and jockey racecards
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: python collect-racecards.py

      - name: Save racecards data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/racecards.json data/racecards-archive.json
          if git diff --cached --quiet; then
            echo 'No changes to racecards.'
            exit 0
          fi
          git commit -m "Update today/tomorrow racecards and archive"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Racecards published.'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          echo 'Racecards publication conflicted with another data update.' >&2
          exit 1
