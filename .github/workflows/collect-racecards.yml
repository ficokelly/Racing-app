
name: Collect Racing Racecards

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
    - cron: '15 12 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect trainer and jockey racecards
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: python collect-racecards.py

      - name: Save racecards data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/racecards.json
          if ! git diff --cached --quiet; then
            git commit -m "Update racing racecards"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
