name: 'Stage154 — Hot Pots update notifications and history'

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Stage153 — ROI Specialists single Hot Pots model'
    types: [completed]
  schedule:
    # Backup check: source-run event handles normal immediate publication.
    - cron: '15,45 6-23 * * *'

permissions:
  contents: write

concurrency:
  group: stage154-roi-update-notifications
  cancel-in-progress: false

jobs:
  install:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout live app
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-only notification delivery and in-app history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'INSTALL_STAGE154'
          from pathlib import Path
          import gzip,base64,shutil,importlib.util,json,datetime as dt
          payloads = {
              'stage154_roi_notifications.py': '',
              'stage154_notification_ui.js': '',
              'stage154_notification_ui.css': '',
          }
          root=Path('.')
          def unpack(name,dest):
              out=root/dest
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(gzip.decompress(base64.b64decode(payloads[name])))
              print('STAGE154_SOURCE',dest, out.stat().st_size)
          unpack('stage154_roi_notifications.py','scripts/stage154_roi_notifications.py')
          unpack('stage154_notification_ui.js','scripts/stage154_notification_ui.js')
          css=gzip.decompress(base64.b64decode(payloads['stage154_notification_ui.css'])).decode('utf-8')
          html=Path('index.html')
          content=html.read_text(encoding='utf-8')
          marker='<!-- RHP_STAGE154_UPDATE_NOTIFICATIONS -->'
          if marker not in content:
              assert content.count('</head>')==1 and content.count('</body>')==1
              content=content.replace('</head>','<style>\n'+css+'\n</style>\n</head>',1)
              content=content.replace('</body>',marker+'\n<script src="./scripts/stage154_notification_ui.js?v=154" defer></script>\n</body>',1)
              html.write_text(content,encoding='utf-8')
              print('STAGE154_APP_NOTIFICATION_BUTTON_INSTALLED')
          else: print('STAGE154_UI_ALREADY_PRESENT')
          # Legacy delivery paths are made inert; original code is saved for audit only.
          legacy={
            'send-power-fav-alerts.py':'send-power-fav-alerts.py',
            'send-power-fav-alerts-diagnostic.py':'send-power-fav-alerts-diagnostic.py',
            'scripts/rhp_stage68_push.py':'rhp_stage68_push.py',
          }
          guard='# STAGE154_LEGACY_PUSH_DISABLED'
          for name,archivename in legacy.items():
              source=Path(name)
              if not source.exists():continue
              original=source.read_text(encoding='utf-8')
              if guard in original:continue
              backup=Path('scripts/legacy_push_archives')/archivename
              backup.parent.mkdir(parents=True,exist_ok=True)
              if not backup.exists():backup.write_text(original,encoding='utf-8')
              source.write_text('#!/usr/bin/env python3\n'+guard+'\n'
                  'print("Legacy notification sender disabled: Stage154 sends only ROI model review alerts.")\n',encoding='utf-8')
              print('STAGE154_LEGACY_PUSH_OFF',name)
          notifications=Path('data/roi-notifications.json')
          state=Path('data/roi-notification-state.json')
          notifications.parent.mkdir(exist_ok=True)
          if not notifications.exists():notifications.write_text(json.dumps({'version':1,'events':[]},indent=2)+'\n')
          if not state.exists():state.write_text(json.dumps({'days':{}},indent=2)+'\n')
          # Verify notification diff is race-keyed and covers changes at either rank.
          spec=importlib.util.spec_from_file_location('stage154',Path('scripts/stage154_roi_notifications.py'))
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          before={'x':{'course':'Kempton','time':'19:00','rank1':'A','rank2':'B'}}
          after={'x':{'course':'Kempton','time':'19:00','rank1':'A','rank2':'C'}}
          assert len(mod.change_rows(before,after))==1
          assert len(mod.change_rows(after,after))==0
          print('STAGE154_PYTHON_DIFF_TEST_OK')
          INSTALL_STAGE154
          python -m py_compile scripts/stage154_roi_notifications.py
          node --check scripts/stage154_notification_ui.js
      - name: Publish app code and disable old push senders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/stage154_roi_notifications.py scripts/stage154_notification_ui.js scripts/legacy_push_archives \
            send-power-fav-alerts.py send-power-fav-alerts-diagnostic.py scripts/rhp_stage68_push.py \
            data/roi-notifications.json data/roi-notification-state.json
          if git diff --cached --quiet;then echo 'STAGE154_SOURCE_ALREADY_INSTALLED';exit 0;fi
          git commit -m 'Stage154: show ROI notification history, clear locally, disable legacy pushes'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main;then
              echo 'STAGE154_INSTALLED';exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt*5))"
          done
          echo 'Stage154 source push failed; no partial push assumed' >&2
          exit 1
      - name: Process any already-published fresh model update
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python scripts/stage154_roi_notifications.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/roi-notification-state.json data/roi-notifications.json
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'Stage154: archive first available combined ROI review'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            git rebase --abort || true
            sleep "$((attempt*3))"
          done
          exit 1

  notify:
    if: ${{ github.event_name != 'workflow_dispatch' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout latest published Stage153 selections
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare top two picks, send OneSignal push, record affected races
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/stage154_roi_notifications.py ];then
            echo 'Stage154 installer must be run manually once first' >&2;exit 1
          fi
          python scripts/stage154_roi_notifications.py
      - name: Publish notification history and deduplication status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/roi-notifications.json data/roi-notification-state.json
          if git diff --cached --quiet;then echo 'NO_NEW_REVIEW_OR_DELIVERY';exit 0;fi
          git commit -m 'Stage154: publish selection review notifications and changes'
          for attempt in 1 2 3 4 5;do
            if git pull --rebase origin main && git push origin HEAD:main;then
              echo 'NOTIFICATION_HISTORY_PUBLISHED';exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt*4))"
          done
          exit 1
