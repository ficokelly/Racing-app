          class Agg:
              __slots__=('starts','wins','market_wins','races','expected','variance','return_units','market_starts','year_first','year_last')
              def __init__(self):
                  self.starts=0;self.wins=0.;self.market_wins=0.;self.races=0;self.expected=0.;self.variance=0.
                  self.return_units=0.;self.market_starts=0;self.year_first=9999;self.year_last=0
              def add(self,rows,dateyear):
                  self.races+=1;self.starts+=len(rows);self.wins+=sum(r['win'] for r in rows)
                  self.year_first=min(self.year_first,dateyear);self.year_last=max(self.year_last,dateyear)
                  if all(r['p'] is not None and r['sp'] is not None for r in rows):
                      # Caller ensures entire race has prices, not only qualifiers.
                      p=sum(r['p'] for r in rows)
                      self.expected+=p;self.variance+=p*(1-p)
                      self.market_wins+=sum(r['win'] for r in rows)
                      self.return_units+=sum(r['win']*r['sp'] for r in rows)
                      self.market_starts+=len(rows)
              def stats(self):
                  z=(self.market_wins-self.expected)/math.sqrt(self.variance) if self.variance>0 else None
                  return {'starts':self.starts,'races':self.races,'wins':round(self.wins,3),
                          'market_expected_wins':round(self.expected,3),
                          'excess_wins':round(self.market_wins-self.expected,3),
                          'market_z':round(z,4) if z is not None else None,
                          'historical_sp_roi_pct':round(100*(self.return_units/self.market_starts-1),2) if self.market_starts else None,
                          'market_covered_starts':self.market_starts,'first_year':self.year_first if self.year_first<9999 else None,'last_year':self.year_last or None}


          def split(year,train_end=2017,valid_end=2021,test_end=2025):
              if year<1995 or year>test_end:return None
              return 'train' if year<=train_end else 'valid' if year<=valid_end else 'test'


          def augmented_events(input_path,train_end=2017,valid_end=2021,test_end=2025):
              trainer=RollingTrainer();day=None;batch=[]
              opener=gzip.open if str(input_path).endswith('.gz') else open
              with opener(input_path,'rt',newline='',encoding='utf-8') as f:
                  for row in csv.DictReader(f):
                      date=dt.date.fromisoformat(row['race_date'][:10])
                      if day is not None and date<day:raise ValueError('Input historical features not in chronological date order')
                      if day is not None and date!=day:
                          for r in batch:trainer.settle(r,day)
                          batch=[]
                      day=date
                      data=trainer.features(row,date)
                      groups=tag_families(row,data)
                      win=number(row.get('winner_credit')) or 0
                      p=number(row.get('market_expected_share'))
                      sp=number(row.get('sp_decimal'))
                      entry={'race':row['race_id'],'date':date.isoformat(),'win':win,'p':p,'sp':sp,
                             'tags':signatures(groups),'row':row,'trainer_recent_n':data['recent_n'],
                             'trainer_recent_w':data['recent_w'],'trainer_base_n':data['baseline_n'],
                             'trainer_base_w':data['baseline_w'],'trainer_category':data['cat']}
                      batch.append(row)
                      yield entry
                  # End of last day: do not settle for subsequent racing.


          def iter_races(events):
              # Input sorted by (date, race_id) in original exporter. For any potential
              # interleaving race IDs, group by day to be safe.
              lastday=None;daily=collections.defaultdict(list)
              for e in events:
                  if lastday is not None and e['date']!=lastday:
                      for rid,rows in daily.items():yield rows
                      daily.clear()
                  lastday=e['date'];daily[e['race']].append(e)
              for rows in daily.values():yield rows


          def race_patterns(rows,selection=None):
              """Yield market-complete race aggregates per pattern, allowing no look-ahead."""
              exemplar=rows[0]['row'];year=int(rows[0]['date'][:4]);covered=all(x['p'] is not None and x['sp'] is not None for x in rows)
              selected=collections.defaultdict(list)
              for e in rows:
                  for sig,depth in e['tags']:
                      for ctx in contexts(exemplar,compound=(depth>1)):
                          key=(ctx,sig)
                          if selection is None or key in selection:selected[key].append(e)
              for k,qualifiers in selected.items():
                  # Evaluation requires the full race to have SP; if not, blank the
                  # market expectation/ROI for every qualifier in that race.
                  if not covered:qualifiers=[dict(x,p=None,sp=None) for x in qualifiers]
                  yield k,qualifiers,year


          def discover_train(input_path,args):
              aggs=collections.defaultdict(Agg);count=collections.Counter()
              for i,rows in enumerate(iter_races(augmented_events(input_path))):
                  year=int(rows[0]['date'][:4]);cohort=split(year,args.train_end,args.valid_end,args.test_end)
                  if cohort!='train':continue
                  count['train_races']+=1;count['train_starts']+=len(rows)
                  for key,qualifiers,yr in race_patterns(rows):aggs[key].add(qualifiers,yr)
                  if count['train_races']%30000==0:print('Train scan:',count['train_races'],'races; candidate keys:',len(aggs),flush=True)
              return aggs,count


          def pvalue(z):return math.erfc(abs(z)/math.sqrt(2)) if z is not None else 1.


          def selection_train(aggs):
              eligible=[]
              for key,a in aggs.items():
                  if a.starts<MIN_TRAIN_STARTS or a.wins<MIN_TRAIN_WINS or a.races<MIN_TRAIN_RACES or a.market_starts < MIN_TRAIN_STARTS*.8:continue
                  z=a.stats()['market_z']
                  if z is None:continue
                  eligible.append((key,a,z,pvalue(z)))
              eligible.sort(key=lambda x:x[3]);m=len(eligible)
              # Benjamini-Yekutieli FDR controls dependence between overlapping patterns.
              correction=sum(1/i for i in range(1,m+1)) if m else 1
              accepted=set()
              for rank,(key,a,z,p) in enumerate(eligible,1):
                  if p<=rank*.05/(m*correction):accepted.add(key)
              # BY step-up uses *largest* passing rank and includes everything earlier.
              if accepted:
                  cutoff=max(i for i,entry in enumerate(eligible,1) if entry[0] in accepted)
                  accepted={e[0] for e in eligible[:cutoff]}
              exploratory={entry[0] for entry in eligible[:KEEP_EXPLORATORY]}
              return eligible,accepted,exploratory


          def validate(input_path,selected,args):
              aggs={'valid':collections.defaultdict(Agg),'test':collections.defaultdict(Agg)}
              count=collections.Counter()
              for rows in iter_races(augmented_events(input_path)):
                  year=int(rows[0]['date'][:4]);sp=split(year,args.train_end,args.valid_end,args.test_end)
                  if sp not in aggs:continue
                  count[sp+'_races']+=1
                  for key,qualifiers,yr in race_patterns(rows,selected):aggs[sp][key].add(qualifiers,yr)
                  if count[sp+'_races']%30000==0:print('Validate:',sp,count[sp+'_races'],'races',flush=True)
              return aggs,count


          def write_results(out,eligible,accepted,evals):
              headings=['cohort','pattern','feature_count','train_starts','train_races','train_wins','train_expected','train_z','train_sp_roi',
                        'valid_starts','valid_races','valid_wins','valid_expected','valid_z','valid_sp_roi',
                        'test_starts','test_races','test_wins','test_expected','test_z','test_sp_roi',
                        'train_by_fdr','validated_before_test','independent_test_direction','independent_test_significant','evidence_label']
              records=[]
              for key,a,z,p in eligible:
                  v=evals['valid'].get(key,Agg());t=evals['test'].get(key,Agg())
                  vs=v.stats();ts=t.stats();tr=a.stats()
                  consistent=vs['market_z'] is not None and z*vs['market_z']>0 and vs['market_covered_starts']>=60 and abs(vs['market_z'])>=1.96
                  confirmed=bool(key in accepted and consistent)
                  testdir=ts['market_z'] is not None and z*ts['market_z']>0 and ts['market_covered_starts']>=60
                  testsig=bool(confirmed and testdir and abs(ts['market_z'])>=1.96)
                  label='TEST_REPLICATED_ASSOCIATION_NO_PROFIT_CLAIM' if testsig else 'PRETEST_VALIDATED_NOT_REPLICATED' if confirmed else 'TRAIN_FDR_ONLY' if key in accepted else 'EXPLORATORY'
                  r={'cohort':key[0],'pattern':key[1],'feature_count':len(key[1].split(' + ')),
                     'train_starts':a.starts,'train_races':a.races,'train_wins':tr['wins'],'train_expected':tr['market_expected_wins'],'train_z':tr['market_z'],'train_sp_roi':tr['historical_sp_roi_pct'],
                     'valid_starts':v.starts,'valid_races':v.races,'valid_wins':vs['wins'],'valid_expected':vs['market_expected_wins'],'valid_z':vs['market_z'],'valid_sp_roi':vs['historical_sp_roi_pct'],
                     'test_starts':t.starts,'test_races':t.races,'test_wins':ts['wins'],'test_expected':ts['market_expected_wins'],'test_z':ts['market_z'],'test_sp_roi':ts['historical_sp_roi_pct'],
                     'train_by_fdr':key in accepted,'validated_before_test':confirmed,'independent_test_direction':testdir,'independent_test_significant':testsig,'evidence_label':label}
                  records.append(r)
              with (out/'conditional_trend_validation.csv').open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=headings);w.writeheader();w.writerows(records)
              return records


          def sunday_report(out,records,path):
              if not path or not Path(path).exists():return {'status':'NO_SUNDAY_RACE_AUDIT'}
              with open(path,encoding='utf-8-sig',newline='') as f:races=list(csv.DictReader(f))
              outrows=[]
              for r in races:
                  kind=norm(r.get('discipline'))
                  d='CHASE' if 'chase' in kind else 'HURDLE' if 'hurdle' in kind else 'FLAT' if 'flat' in kind or 'aw' in kind else 'BUMPER' if 'bumper' in kind else 'UNKNOWN'
                  cond=norm(r.get('conditions'))
                  condition='HANDICAP' if 'handicap' in cond else 'MAIDEN' if 'maiden' in cond else 'NOVICE' if 'novice' in cond else 'CONDITIONS'
                  cf=f'{d}:{condition}'
                  course=norm(r.get('meeting'))
                  dd=number(r.get('distance_f'))
                  db='SPRINT' if dd is not None and dd<8 else 'MILE' if dd is not None and dd<11 else 'MIDDLE' if dd is not None and dd<16 else 'LONG' if dd is not None and dd<22 else 'STAYING' if dd is not None else 'UNKNOWN'
                  relevant=[]
                  for row in records:
                      ctx=row['cohort']
                      # A narrow context belongs to this race ONLY if all qualifiers
                      # match. Never report another distance or another course's stats.
                      if ctx not in ('ALL',cf) and not ctx.startswith(cf+':'):continue
                      if ':DIST_' in ctx and not ctx.endswith('DIST_'+db):continue
                      if ':COURSE_' in ctx and not ctx.endswith('COURSE_'+course):continue
                      # Source Sunday race audit did not include a verified class;
                      # skip class-specific results instead of guessing.
                      if ':CLASS_' in ctx:continue
                      # Don't rank from train-only evidence.
                      if row['validated_before_test']:relevant.append(row)
                  relevant.sort(key=lambda x:(not x['validated_before_test'],-abs(x['valid_z'] or 0),-abs(x['train_z'] or 0)))
                  positives=[x for x in relevant if x['train_z']>0]
                  negatives=[x for x in relevant if x['train_z']<0]
                  def fmt(items):
                      return ' | '.join(f"{x['pattern']} [cohort={x['cohort']}; train {x['train_starts']} starts, z={x['train_z']}; validation z={x['valid_z']}; independent z={x['test_z']}; test SP ROI={x['test_sp_roi']}%; {x['evidence_label']}]" for x in items[:6])
                  outrows.append({'meeting':r.get('meeting'),'time':r.get('time'),'race':r.get('race'),'category':cf,
                                  'independent_positive_trends':fmt([x for x in positives if x['independent_test_significant']]),
                                  'independent_negative_trends':fmt([x for x in negatives if x['independent_test_significant']]),
                                  'unconfirmed_positive_candidates':fmt([x for x in positives if not x['independent_test_significant']]),
                                  'unconfirmed_negative_candidates':fmt([x for x in negatives if not x['independent_test_significant']]),
                                  'data_caveat':'RACE CATEGORY INFERRED; RECHECK SOURCE TITLE/CONDITIONS; NO VERIFIED 2026 LIVE HORSE LINKS'})
              with (out/'sunday_36_races_deep_trends.csv').open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=list(outrows[0]) if outrows else []);w.writeheader();w.writerows(outrows)
              return {'status':'RACE_CONTEXT_REPORT_ONLY_NO_RUNNER_RANKINGS','races':len(outrows)}


          def main():
              pa=argparse.ArgumentParser()
              pa.add_argument('--features',required=True);pa.add_argument('--out',required=True)
              pa.add_argument('--sunday-races');pa.add_argument('--train-end',type=int,default=2017)
              pa.add_argument('--valid-end',type=int,default=2021)
              pa.add_argument('--test-end',type=int,default=2025)
              args=pa.parse_args()
              if not (1995<=args.train_end<args.valid_end<args.test_end<=2025):pa.error('split years must increase and test no later than 2025')
              out=Path(args.out);out.mkdir(parents=True,exist_ok=True)
              print('Stage 8 discovery start',flush=True)
              aggs,train_counts=discover_train(args.features,args)
              eligible,accepted,exploratory=selection_train(aggs)
              print('Training inventory:',len(aggs),'eligible:',len(eligible),'train FDR:',len(accepted),'testing:',len(accepted|exploratory),flush=True)
              evals,heldout_counts=validate(args.features,accepted|exploratory,args)
              records=write_results(out,eligible,accepted,evals)
              sunday=sunday_report(out,records,args.sunday_races)
              audit={'train':train_counts,'heldout':heldout_counts,'candidate_patterns':len(aggs),'training_supported':len(eligible),
                     'passed_train_by_fdr':len(accepted),'passed_validation_before_test':sum(r['validated_before_test'] for r in records),
                     'independent_test_replicated':sum(r['independent_test_significant'] for r in records),
                     'test_period_used_for_selection':False,'sunday':sunday,
                     'design_limitations':['Source horse IDs are not verified; horse history and stable-switch features are provisional.',
                                           'Trainer segmentation uses calendar-day-lagged previous results; source may have trainer aliases.',
                                           'Race condition derived from race title; unknown conditions cannot support specialisation.',
                                           'No headgear/wind surgery/pace/sire/pre-race odds history in existing database; unavailable signals are NOT scored.',
                                           'SP is a post-race evaluation-only field; historic SP ROI does not establish price availability.',
                                           'Selection of final model on test results would invalidate test. Test must remain untouched for selection.',
                                           'Training BY-FDR and subsequent tests reduce false positives but do not guarantee independent profitability.',
                                           'Horse-specific Sunday ratings blocked pending verified horse IDs, ages, missing Oct form and current conditions.',
                                           'Named recurring race historical identity remains provisional where not externally verified.']}
              (out/'audit.json').write_text(json.dumps(audit,indent=2,default=dict))
              lines=['# Stage 8: conditional race-trend research','',
                 'This is an *actual discovery pipeline*, not a hand-selected list of generic positives and negatives.','',
                 f'- Training patterns tested: {len(aggs):,}',f'- Adequately supported for multiple testing: {len(eligible):,}',
                 f'- Passed train BY-FDR: {len(accepted):,}',
                 f'- Passed validation before looking at independent test: {audit["passed_validation_before_test"]:,}',
                 f'- Independently replicated in 2022–2025 (unless running an explicitly labeled smoke pilot): {audit["independent_test_replicated"]:,}',
                 '', 'Methods: trainer 14-day category wins versus their own 3-year category baseline; past-market surprise; horse past comparable layoffs; stable changes; class/trip change; relative ratings; several context-specific two/three-factor combinations. No unsupported signal is called a positive/negative.','',
                 '**All race-level signals must be judged in their actual cohort with sample sizes and validation. No horse ranking until identity and live form are verified.**',
                 '', 'Not covered by available source: surgery, headgear, pace, sire, and timestamped opening odds.']
              (out/'README.md').write_text('\n'.join(lines)+'\n')
              print(json.dumps(audit,indent=2,default=dict),flush=True)

          if __name__=='__main__':main()

