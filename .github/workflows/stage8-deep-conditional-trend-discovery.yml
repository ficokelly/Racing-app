              except (TypeError, ValueError): return None


          def norm(x):
              return re.sub(r'[^a-z0-9]+',' ',str(x or '').lower()).strip()


          def race_condition(row):
              c=str(row.get('race_condition') or '').upper()
              if c in ('HANDICAP','NOVICE','MAIDEN','CONDITIONS'):return c
              title=norm(row.get('race_name'))
              for word in ('handicap','maiden','novice'):
                  if word in title:return word.upper()
              # Without a race title, cannot distinguish a novice from a handicap.
              return 'UNKNOWN'


          def discipline(row):
              kind=norm(row.get('race_type'))
              if 'chase' in kind:return 'CHASE'
              if 'hurdle' in kind:return 'HURDLE'
              if 'flat' in kind:return 'FLAT'
              if 'bumper' in kind:return 'BUMPER'
              return 'UNKNOWN'


          def dist_band(row):
              d=number(row.get('distance_f'))
              if d is None:return 'UNKNOWN'
              return 'SPRINT' if d<8 else 'MILE' if d<11 else 'MIDDLE' if d<16 else 'LONG' if d<22 else 'STAYING'


          def class_band(row):
              m=re.search(r'\b[1-7]\b',str(row.get('race_class') or ''))
              return m.group() if m else 'UNKNOWN'


          def category(row):
              disc=discipline(row);cond=race_condition(row)
              age=number(row.get('age'))
              if disc=='FLAT' and age is not None:
                  a='2YO' if age==2 else '3YO' if age==3 else '4PLUS'
              elif disc in ('CHASE','HURDLE'):
                  a='JUMPS'
              else:a='UNKNOWN'
              return f'{disc}:{cond}:{a}'


          def contexts(row,compound):
              disc=discipline(row);cond=race_condition(row)
              result=['ALL']
              if disc=='UNKNOWN':return result
              if cond!='UNKNOWN':result.append(f'{disc}:{cond}')
              if not compound and cond!='UNKNOWN':
                  d=dist_band(row); cl=class_band(row)
                  if d!='UNKNOWN':result.append(f'{disc}:{cond}:DIST_{d}')
                  if cl!='UNKNOWN':result.append(f'{disc}:{cond}:CLASS_{cl}')
                  course=norm(row.get('course'))
                  if course:result.append(f'{disc}:{cond}:COURSE_{course}')
              return result


          class RollingTrainer:
              """Trainer category history, date-batched to forbid same-day leakage."""
              def __init__(self):
                  self.recent=collections.defaultdict(collections.deque)
                  self.long=collections.defaultdict(collections.deque)
              @staticmethod
              def view(q,day,span):
                  limit=day-dt.timedelta(days=span)
                  while q and q[0][0]<limit:q.popleft()
                  return len(q),sum(x[1] for x in q),sum(x[2] for x in q if x[2] is not None),sum(x[2] is not None for x in q)
              def features(self,row,day):
                  t=norm(row.get('trainer'));cat=category(row)
                  if not t or 'UNKNOWN' in cat.split(':'):return {'cat':cat,'recent_n':0,'recent_w':0,'baseline_n':0,'baseline_w':0,'recent_expected':None}
                  n,w,exp,priced=self.view(self.recent[(t,cat)],day,14)
                  bn,bw,bexp,bpriced=self.view(self.long[(t,cat)],day,DAYS_3Y)
                  # Compare 14-day specialist form against the PRECEDING historical
                  # baseline: don't count the recent winners on both sides of a contrast.
                  bn-=n; bw-=w
                  if priced==n and bpriced>=priced:
                      bexp-=exp; bpriced-=priced
                  else:bpriced=-1
                  return {'cat':cat,'recent_n':n,'recent_w':w,'baseline_n':bn,'baseline_w':bw,
                          'recent_expected':exp if priced==n else None,
                          'baseline_expected':bexp if bpriced==bn and bn>=0 else None}
              def settle(self,row,day):
                  t=norm(row.get('trainer'))
                  if not t:return
                  cat=category(row)
                  if 'UNKNOWN' in cat.split(':'):return
                  win=number(row.get('winner_credit')) or 0.
                  expected=number(row.get('market_expected_share'))
                  item=(day,win,expected)
                  self.recent[(t,cat)].append(item)
                  self.long[(t,cat)].append(item)


