          import datetime as dt,unittest,tempfile,csv,os
          from stage8_conditional_discovery import RollingTrainer,category,contexts,tag_families,signatures,Agg,split,race_condition,augmented_events

          class ResearchSafetyTests(unittest.TestCase):
           def test_unknown_condition_is_not_assumed_handicap(self):
            row={'race_type':'hurdle','race_name':'','age':'5'}
            self.assertEqual(race_condition(row),'UNKNOWN')
            self.assertEqual(category(row),'HURDLE:UNKNOWN:JUMPS')
            self.assertNotIn('HURDLE:HANDICAP',contexts(row,False))
           def test_same_date_trainer_results_not_visible(self):
            hist=RollingTrainer();date=dt.date(2025,1,1)
            r={'trainer':'Sample Trainer','race_type':'flat','race_condition':'MAIDEN','age':'2',
               'winner_credit':'1','market_expected_share':'.2'}
            self.assertEqual(hist.features(r,date)['recent_n'],0)
            # Production runner buffers the whole day; this test checks if settled
            # on the previous date, the next date sees exactly one historical record.
            hist.settle(r,date)
            self.assertEqual(hist.features(r,date+dt.timedelta(days=1))['recent_n'],1)
            self.assertEqual(hist.features(r,date+dt.timedelta(days=1))['recent_w'],1)
           def test_actual_streamer_buffers_entire_racing_day(self):
            fd,path=tempfile.mkstemp(suffix='.csv');os.close(fd)
            try:
             fields=['race_date','race_id','trainer','race_type','race_condition','age','horse_prior_starts','winner_credit','market_expected_share','sp_decimal']
             with open(path,'w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader()
              for date,rid in [('2025-01-01','race1'),('2025-01-01','race2'),('2025-01-02','race3')]:
               w.writerow({'race_date':date,'race_id':rid,'trainer':'X','race_type':'flat','race_condition':'MAIDEN','age':'2','horse_prior_starts':'0','winner_credit':'1','market_expected_share':'.3','sp_decimal':'3.0'})
             out=list(augmented_events(path))
             self.assertEqual([x['trainer_recent_n'] for x in out],[0,0,2])
            finally:os.remove(path)
           def test_category_specialisation(self):
            date=dt.date(2025,1,1);h=RollingTrainer()
            maiden={'trainer':'Trainer A','race_type':'flat','race_condition':'MAIDEN','age':'2',
                    'winner_credit':'1','market_expected_share':'.25'}
            handicap=dict(maiden,race_condition='HANDICAP',winner_credit='0')
            for i in range(8):h.settle(maiden,date-dt.timedelta(days=i+1))
            for i in range(9):h.settle(handicap,date-dt.timedelta(days=i+1))
            self.assertEqual(h.features(maiden,date)['recent_w'],8)
            self.assertEqual(h.features(handicap,date)['recent_w'],0)
            self.assertEqual(h.features(maiden,date)['recent_n'],8)
           def test_last_run_finished_fourth_is_not_misread_as_unknown_or_dnf(self):
            record={'horse_prior_starts':'10','horse_recent_form':'1-P--','last_finish_pos':'5'}
            f=tag_families(record,{'recent_n':0,'recent_w':0,'baseline_n':0,'baseline_w':0})
            self.assertEqual(f['FORM'],['LAST_FINISHED_4PLUS'])
            record['last_finish_pos']='PU'
            f=tag_families(record,{'recent_n':0,'recent_w':0,'baseline_n':0,'baseline_w':0})
            self.assertEqual(f['FORM'],['LAST_NONFINISH_RECORDED'])
            record['last_finish_pos']=''
            f=tag_families(record,{'recent_n':0,'recent_w':0,'baseline_n':0,'baseline_w':0})
            self.assertNotIn('FORM',f)
           def test_prior_layoff_unknown_not_negative(self):
            r={'horse_prior_starts':'11','days_since_run':'183','race_type':'hurdle'}
            group=tag_families(r,{'recent_n':0,'recent_w':0,'baseline_n':0,'baseline_w':0})
            self.assertEqual(group['LAYOFF'],['DAYS_181+'])
            self.assertNotIn('FRESH_HORSE',group)
           def test_own_layoff_records(self):
            r={'horse_prior_starts':'11','days_since_run':'183','race_type':'hurdle',
               'prior_layoff_90_starts':'3','prior_layoff_90_wins':'1'}
            group=tag_families(r,{'recent_n':0,'recent_w':0,'baseline_n':0,'baseline_w':0})
            self.assertIn('LONG_BREAK_PREVIOUS_WIN',group['FRESH_HORSE'])
           def test_price_missing_does_not_inflate_market_z(self):
            a=Agg();a.add([{'win':1,'p':None,'sp':None}],2022)
            self.assertIsNone(a.stats()['market_z'])
            self.assertEqual(a.stats()['wins'],1)
           def test_wins_and_expectation_market_only(self):
            a=Agg();a.add([{'win':1,'p':.3,'sp':4.0}],2022)
            a.add([{'win':1,'p':None,'sp':None}],2022)
            self.assertAlmostEqual(a.market_wins,1)
            self.assertAlmostEqual(a.stats()['excess_wins'],.7)
           def test_do_not_call_train_test_validation(self):
            self.assertEqual(split(2017),'train')
            self.assertEqual(split(2018),'valid')
            self.assertEqual(split(2022),'test')
            self.assertIsNone(split(2026))
           def test_interactions_include_trainer_speciality_and_horse_form(self):
            g={'FORM':['LAST_WIN'],'TRAINER_SPECIALIST':['TRAINER_SUBTYPE_UP12PP'],'LAYOFF':['DAYS_91-180']}
            ss=[x for x,d in signatures(g)]
            self.assertIn('LAST_WIN + TRAINER_SUBTYPE_UP12PP',ss)
            self.assertTrue(any(x.count(' + ')==2 for x in ss))
