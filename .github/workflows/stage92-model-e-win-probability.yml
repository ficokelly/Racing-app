name: Stage92 - Model E v2 Win Probability Research (Flat AW Jumps)

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Irish as-of date YYYY-MM-DD; blank = today'
        type: string
        required: false
        default: ''
      days:
        description: 'Completed race days for retrospective probability tests'
        type: choice
        required: true
        default: '30'
        options: ['30', '60', '90']

permissions:
  contents: read
  actions: read

concurrency:
  group: stage92-e-v2-probability-research
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout dated pre-off cards with no write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test original HPR and new probability-only engine
        run: |
          python scripts/stage86_hpr_engine.py --mode self-test
          python scripts/stage92_model_e_winprob.py --self-test
      - name: Restore original historical research archive cache
        uses: actions/cache@v4
        with:
          path: |
            reports/stage86/base/original.sqlite
            ~/.cache/kagglehub
          key: stage86-base-v129-${{ hashFiles('import_historical_ukie.py') }}
          restore-keys: |
            stage84-base-ukie-v129-
      - name: Install historical archive downloader
        run: python -m pip install --disable-pip-version-check kagglehub
      - name: Verify original historical UK IE source read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import kagglehub,subprocess,sys,sqlite3
          from pathlib import Path
          p=Path('reports/stage86/base/original.sqlite');p.parent.mkdir(parents=True,exist_ok=True)
          if not p.exists() or p.stat().st_size<1000000:
              src=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
              subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import',
                 '--input',str(src),'--min-date','1988-01-01','--max-date','2026-10-07',
                 '--database',str(p),'--report','reports/stage86/base/import.json'],check=True)
          with sqlite3.connect('file:'+str(p.resolve())+'?mode=ro',uri=True) as c:
              assert c.execute('PRAGMA quick_check').fetchone()[0]=='ok'
              assert c.execute('SELECT COUNT(*) FROM historical_races').fetchone()[0]>100000
          print('PASS: verified historical source')
          PY
      - name: Rebuild unchanged HPR v0 in temporary research files
        shell: bash
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          args=(--mode backtest --db reports/stage86/base/original.sqlite \
             --root . --output reports/stage92/hpr-base --days "${DAYS:-30}" --git-preoff)
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage86_hpr_engine.py "${args[@]}"
      - name: Test all 7 combinations by Flat AW Jumps and race subtypes
        shell: bash
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          args=(--root . --db reports/stage86/base/original.sqlite \
             --ratings reports/stage92/hpr-base/hpr-backtest-research.sqlite \
             --output reports/stage92/output --days "${DAYS:-30}")
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage92_model_e_winprob.py "${args[@]}"
      - name: Verify no omissions or withheld probabilities for missing HPR
        shell: bash
        run: |
          python - <<'PY'
          import csv,json,collections
          from pathlib import Path
          p=Path('reports/stage92/output')
          s=json.loads((p/'stage92-summary.json').read_text())
          rows=list(csv.DictReader((p/'stage92-race-probabilities.csv').open(encoding='utf-8-sig',newline='')))
          assert len(rows)==s['runners']
          assert s['without_hpr']>0,'No missing-HPR cohort verified; check input audit'
          grouped=collections.defaultdict(list)
          for r in rows:grouped[(r['date'],r['course'],r['time'])].append(r)
          for k,race in grouped.items():
              assert abs(sum(float(r['win_probability_pct']) for r in race)-100)<.005,k
              assert sum(int(r['winner_verified']) for r in race)==1,k
              assert len({int(r['rank']) for r in race})==len(race),k
          assert len(grouped)==s['total_verified_races']
          print('PASS: every pre-off runner included; probabilities sum to 100%; all winners uniquely verified')
          PY
      - name: Upload compact probability-only research outputs (no large SQLite)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage92-model-e-v2-winprob-${{ github.run_id }}
          path: |
            reports/stage92/output/stage92-summary.json
            reports/stage92/output/stage92-segment-performance.csv
            reports/stage92/output/stage92-all-variant-results.csv
            reports/stage92/output/stage92-race-probabilities.csv
            reports/stage92/hpr-base/hpr-audit.json
          retention-days: 90
          if-no-files-found: warn
