name: Stage56 - Restore Original Race Metadata
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install kagglehub
          python -m py_compile scripts/stage56_restore_original_race_metadata.py
      - name: Restore historical database
        env:
          GH_TOKEN: ${{ github.token }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          target=Path('stage56_source');target.mkdir(exist_ok=True)
          latest=None
          for page in range(1,21):
              out=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts','-f','per_page=100','-f',f'page={page}'],text=True)
              arts=json.loads(out).get('artifacts',[])
              for item in arts:
                  if item.get('name')=='stage2-historical-staging-database' and not item.get('expired'):
                      if latest is None or item.get('created_at','')>latest.get('created_at',''):latest=item
              if len(arts)<100:break
          matches=[]
          if latest:
              try:
                  subprocess.run(['gh','run','download',str(latest['workflow_run']['id']),'--repo',repo,'--name',latest['name'],'--dir',str(target)],check=True)
                  matches=list(target.rglob('*.sqlite'))
              except subprocess.CalledProcessError:pass
          if matches:
              db=max(matches,key=lambda p:p.stat().st_size).resolve()
          else:
              import kagglehub
              archive=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025')
              db=(target/'historical_ukie_staging.sqlite').resolve()
              subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import','--input',str(archive),'--min-date','1988-01-01','--max-date','2026-10-07','--database',str(db),'--report',str(target/'import-report.json')],check=True)
          if not db.exists() or db.stat().st_size<10000000:raise SystemExit('Historical database missing or too small')
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE56_DB='+str(db),file=f)
          print('Database',db,'bytes',db.stat().st_size)
          PY
      - name: Retrieve and inventory original Stage 4 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/stage56/stage4
          python - <<'PYART'
          import subprocess,json
          from pathlib import Path
          ids=[('stage4-original-race-names',41246870484),('stage4-all-race-identity-research',41249958071),('stage4-historical-trends-reports',41244970228)]
          records=[]
          for name,run in ids:
           target=Path('reports/stage56/stage4')/name;target.mkdir(parents=True,exist_ok=True)
           cmd=['gh','run','download',str(run),'--repo','ficokelly/Racing-app','--name',name,'--dir',str(target)]
           p=subprocess.run(cmd,capture_output=True,text=True)
           files=[{'path':str(f),'bytes':f.stat().st_size} for f in target.rglob('*') if f.is_file()]
           records.append({'artifact':name,'run':run,'download_ok':p.returncode==0,'stderr':p.stderr[-1500:],'files':files[:150]})
           print(name,'downloaded',p.returncode==0,'files',len(files))
          Path('reports/stage56/stage4_artifact_inventory.json').write_text(json.dumps(records,indent=2))
          PYART
      - name: Restore original metadata by exact Stage 2 race ID
        run: |
          python - <<'PY'
          import kagglehub,os
          src=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025')
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE56_SOURCE='+src,file=f)
          PY
          python -u scripts/stage56_restore_original_race_metadata.py --db "$STAGE56_DB" --source "$STAGE56_SOURCE" --out reports/stage56
          cat reports/stage56/stage56_report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage56-restored-race-metadata
          path: reports/stage56/
          retention-days: 90
