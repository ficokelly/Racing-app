name: Manual odds refresh (legacy entry point)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Trigger the single protected odds collector
        run: gh workflow run stage167-external-odds.yml --repo "$GITHUB_REPOSITORY" --ref main -f force=true
