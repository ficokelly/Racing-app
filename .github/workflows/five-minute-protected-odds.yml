name: Protected 5-Minute Racing Odds

on:
  workflow_dispatch:
  schedule:
    # GitHub runs on UTC; the script uses real Europe/Dublin race times.
    - cron: '*/5 10-20 * * *'

permissions:
  contents: write
  actions: read

# Serialise only these extra runs; preserve the existing collector's queue.
concurrency:
  group: racing-hot-pots-extra-five-minute
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check race times and credits (no odds API call)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json, os, re, subprocess
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def skip(reason):
              print('SKIPPED:', reason)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('collect=false\n')
              raise SystemExit(0)

          now = dt.datetime.now(dt.timezone.utc)
          local = now.astimezone(ZoneInfo('Europe/Dublin'))
          print('Current Irish time:', local.isoformat(timespec='seconds'))

          # Original workflow is scheduled at minute 0 every hour, and at
          # minutes 15/30/45 during 11-18 UTC. Don't duplicate those calls.
          if now.minute == 0 or (11 <= now.hour <= 18 and now.minute in (15, 30, 45)):
              skip('Already covered by the existing odds schedule.')

          path = Path('data/racecards.json')
          if not path.is_file():
              skip('Missing racecards.json.')
          try:
              raw = json.loads(path.read_text())
              runners = raw.get('runners', [])
          except (ValueError, AttributeError):
              skip('Invalid racecards.json.')

          matching = set()
          for runner in runners:
              if not isinstance(runner, dict):
                  continue
              try:
                  post = dt.datetime.fromisoformat(runner['race_time'].replace('Z', '+00:00'))
                  if post.tzinfo is None:
                      continue
                  minutes = (post.astimezone(dt.timezone.utc) - now).total_seconds() / 60
                  if 0 < minutes <= 15:
                      matching.add((runner.get('course', '?'), runner['race_time']))
              except (KeyError, ValueError, TypeError):
                  continue
          if not matching:
              skip('No verified races starting within 15 minutes.')
          print('Upcoming races within 15 minutes:', len(matching))
          for course, when in sorted(matching)[:8]:
              print('  ', course, when)

          # Fail closed if we cannot verify remaining credits from a recently
          # successful run of the EXISTING odds collector. This does not call
          # PuntersEdge and therefore consumes zero odds-provider credits.
          try:
              proc = subprocess.run(
                  ['gh', 'run', 'list', '--repo', os.environ['GH_REPO'],
                   '--workflow', 'collect-odds.yml', '--status', 'success',
                   '--limit', '12', '--json', 'databaseId,createdAt'],
                  capture_output=True, text=True, check=True, timeout=25)
              histories = json.loads(proc.stdout)
          except (subprocess.SubprocessError, ValueError, KeyError) as exc:
              skip('Unable to inspect existing collector runs: ' + type(exc).__name__)

          last_balance = None
          for entry in histories:
              try:
                  stamp = dt.datetime.fromisoformat(entry['createdAt'].replace('Z', '+00:00'))
                  age = (now - stamp).total_seconds() / 60
                  if age < 0 or age > 75:
                      continue
                  logs = subprocess.run(
                      ['gh', 'run', 'view', str(entry['databaseId']),
                       '--repo', os.environ['GH_REPO'], '--log'],
                      capture_output=True, text=True, check=True, timeout=45)
                  amounts = re.findall(r'Credits remaining:\s*(\d+)', logs.stdout)
                  if amounts:
                      last_balance = int(amounts[-1])
                      print('Last verified credits:', last_balance, 'from', round(age, 1), 'minutes ago')
                      break
              except (KeyError, TypeError, ValueError, subprocess.SubprocessError):
                  continue
          if last_balance is None:
              skip('No recent verified PuntersEdge credits reading; preserving credits.')
          if last_balance <= 1000:
              skip('Credit reserve reached (1,000); normal odds collector retains priority.')

          # No extra requests can proceed unless all the above checks pass.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('collect=true\n')
          print('APPROVED: one extra full-feed odds collection (not a per-race API request).')
          PY

      - name: Collect bookmaker odds
        if: steps.guard.outputs.collect == 'true'
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
        run: python collect-odds.py

      - name: Save updated odds history
        if: steps.guard.outputs.collect == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest-odds.json data/odds-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh pre-race odds (protected 5-minute check)'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
