name: 'Stage161 — Abandoned races and smooth app refresh'

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: stage161-app-repair
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify app and race-status repair
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stage161_patch.py" <<'PY'
          from pathlib import Path
          import ast,json,datetime as dt,re

          def replace(s,old,new):
              if s.count(old)!=1: raise RuntimeError(f'Expected one anchor, got {s.count(old)}: {old[:100]}')
              return s.replace(old,new,1)

          p=Path('scripts/stage153_roi_combined.py'); s=p.read_text()
          if 'STAGE161_ABANDONED_RACES' not in s:
              s=replace(s,'def nonrunner(r):', '''# STAGE161_ABANDONED_RACES: require explicit consistent race-level status.
          def abandoned_race(entries):
           return bool(entries) and all(normalize(r.get('race_status')) in {'abandoned','cancelled','canceled','void'} for r in entries)

          def nonrunner(r):''')
              s=replace(s,' races=[];counts=collections.Counter()',' races=[];abandoned=[];counts=collections.Counter()')
              s=replace(s,"  old=prior.get((stamp.split()[0]+' '+clock,course_key))",'''  if abandoned_race(entries):
             abandoned.append({**prior.get((target+' '+clock,course_key),{}),'date':target,'course':course,'time':clock,'race_time':iso(off),'race_status':'abandoned',
              'racecard_asof':cards.get('collected_at')})
             counts['abandoned']+=1
             continue
            old=prior.get((stamp.split()[0]+' '+clock,course_key))''')
              s=replace(s,"'coverage':dict(counts),'source_rows':dict(read_stats)","'coverage':dict(counts),'abandoned_races':abandoned,'source_rows':dict(read_stats)")
              s=replace(s," payload={'version':1,'model':'ROI Specialists'"," if args.output.exists():\n  try:\n   previous_audit=json.loads(args.output.read_text()).get('abandoned_races',[])\n   audit={(r.get('date'),normalize(r.get('course')),r.get('time')):r for r in previous_audit}\n   for r in abandoned:audit.setdefault((r.get('date'),normalize(r.get('course')),r.get('time')),r)\n   abandoned=list(audit.values())\n  except (ValueError,OSError):pass\n payload={'version':1,'model':'ROI Specialists'")
              s=replace(s," if not counts['ranked'] and not counts['preserved_post_off']:"," if not counts['ranked'] and not counts['preserved_post_off'] and counts['abandoned']!=len(grouped):")
              s=replace(s,' assert len(STAGE156_ROUTES)==50', ''' assert abandoned_race([{'race_status':'abandoned'},{'race_status':'cancelled'}])
           assert not abandoned_race([{'race_status':'abandoned'},{'race_status':'declared'}])
           assert not abandoned_race([{}])
