          async function rhpFetchTimed(url,method='GET'){
           const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
           try{const r=await fetch(url,{method,cache:'no-cache',signal:controller.signal});if(!r.ok)throw Error('Unavailable '+url);if(method==='HEAD')return r.headers.get('etag')||r.headers.get('last-modified')||null;return await r.json();}finally{clearTimeout(timer)}
          }
          async function rhpFetchChanged(file,force){
           const sources=file==='latest-odds.json'?[RHP_FAST_ODDS_BASE+file,'./data/'+file]:['./data/'+file];
           for(const url of sources){try{
            let signature=null;try{signature=await rhpFetchTimed(url,'HEAD')}catch(e){}
            if(!force&&signature&&rhpLiveSignatures.get(url)===signature)return null;
            const data=await rhpFetchTimed(url);if(!data||typeof data!=='object')continue;
            const valid=file==='latest-odds.json'?Array.isArray(data.prices):file==='racecards.json'?Array.isArray(data.runners):file==='strategy-roi-combined.json'?Array.isArray(data.races):file==='strategy-roi-combined-results.json'?Array.isArray(data.selections):Array.isArray(data.races)||Array.isArray(data.results);
            if(!valid)continue;
            return {file,url,signature,data};
           }catch(e){}}
           return null;
          }
          function rhpLiveViewSnapshot(){
           return {tab:activeTab,scroll:window.scrollY,horse:[...document.querySelectorAll('.rhp158-horse-details:not([hidden]) [data-rhp158-open-horse]')].map(el=>el.dataset.rhp158OpenHorse),
            details:[...document.querySelectorAll('section:not(.hidden) details[open]')].map(el=>({id:el.id,summary:el.querySelector('summary')?.textContent?.trim()})),
            controls:Object.fromEntries(['rc-meeting','rc-time','rc-type','rc-odds','hot-meeting','hot-race-time','hot-race-type','rhp158-hp-meeting','rhp158-hp-time'].map(id=>[id,$(id)?.value]))};
          }
          function rhpLiveRedraw(){
           const state=rhpLiveViewSnapshot();
           if(activeTab==='power')renderStrategySelections();
           else if(activeTab==='racecards'){rcSetupFilters();setFromSaved($('rc-meeting'),state.controls['rc-meeting']);rcSetupFilters();setFromSaved($('rc-time'),state.controls['rc-time']);renderRacecards();}
           else if(activeTab==='markets'){refreshSelects();renderPersonFilters('markets');renderMarkets();}
           else if(activeTab==='hot')renderHot();
           else if(activeTab==='powerresults')renderPowerResults();
           else if(activeTab==='watchlist')renderWatch();
           for(const el of document.querySelectorAll('.rhp158-horse-details [data-rhp158-open-horse]'))if(state.horse.includes(el.dataset.rhp158OpenHorse)){const d=el.closest('.rhp158-horse-details');d.hidden=false;d.parentElement.querySelector('[data-rhp158-toggle]')?.setAttribute('aria-expanded','true')}
           for(const el of document.querySelectorAll('section:not(.hidden) details'))if(state.details.some(x=>x.id?x.id===el.id:x.summary&&x.summary===el.querySelector('summary')?.textContent?.trim()))el.open=true;
           if(activeTab===state.tab&&Math.abs(window.scrollY-state.scroll)>2)window.scrollTo(0,state.scroll);
          }
          async function checkPublishedData(force=false){
           if(autoRefreshBusy||rhpInitialFeedBusy||document.visibilityState==='hidden'||!navigator.onLine)return;
           if(!force&&Date.now()-autoRefreshLastCheck<75000)return;
           // Do not rebuild an open race/bet popup or a control the user is editing.
           if(!force&&(['race-overlay','bet-overlay'].some(id=>$(id)&&!$(id).classList.contains('hidden'))||document.activeElement?.matches('input,select,textarea')))return;
           autoRefreshBusy=true;const btn=$('rhp-refresh-odds');if(force&&btn){btn.disabled=true;btn.textContent='↻ Refreshing…'}
           try{
            const received=(await Promise.all(rhpLiveFiles.map(f=>rhpFetchChanged(f,force)))).filter(Boolean);
            let changed=false,marketChanged=false;
            for(const {file,url,signature,data} of received){
             if(file==='latest-odds.json'){
              if(!rhpLiveOdds||Date.parse(data.collected_at)>Date.parse(rhpLiveOdds.collected_at)){rhpLiveOdds=data;marketChanged=true;changed=true;
               if(!rhpLiveHistory.some(h=>h.collected_at===data.collected_at))rhpLiveHistory.push(data);}
             }else if(file==='racecards.json'){
              if(!rhpLiveCards||Date.parse(data.collected_at)>Date.parse(rhpLiveCards.collected_at)){rhpLiveCards=data;rhpMergeLiveCards(data,rhpCardHistory);marketChanged=true;changed=true;}
             }else if(file==='strategy-roi-combined.json'){
              if(!stage38D||Date.parse(data.generated_at)>Date.parse(stage38D.generated_at)||data.generated_at===stage38D.generated_at&&data.race_status_corrected_at!==stage38D.race_status_corrected_at){stage38D=data;changed=true;}
             }else if(file==='strategy-roi-combined-results.json'){
              if(!stage38DResults||data.updated_at!==stage38DResults.updated_at){stage38DResults=data;changed=true;}
             }else if(file==='race-results.json'){loadFinishedRaces(data);changed=true;}
             if(signature)rhpLiveSignatures.set(url,signature);
            }
            if(marketChanged&&rhpLiveOdds){rows=build(rhpLiveOdds,rhpLiveHistory);rhp158HistoricHotRows=rhp158BuildHistoricHotRows(rhpLiveHistory);rhpSyncBookControl();rhpApplyBookPreference(rhpGlobalBook,{redraw:false});supplementRacecardsFromMarket();}
            if(rhpLiveOdds){const age=(Date.now()-Date.parse(rhpLiveOdds.collected_at))/60000;$('status').textContent=age>=20?'⚠ ODDS STALE · '+Math.floor(age)+'m':'● ODDS SYNCED';$('asof').textContent=`Last collected: ${when(rhpLiveOdds.collected_at)} (Irish time) · ${rhpLiveOdds.races_returned} races · ${rhpLiveOdds.prices_collected} bookmaker quotes`;}
            if(changed)rhpLiveRedraw();
           }catch(e){console.warn('Live refresh retained previous view',e)}finally{autoRefreshBusy=false;autoRefreshLastCheck=Date.now();if(force&&btn){btn.disabled=false;btn.textContent='↻ Refresh odds'}}
          }
          '''+s[b:]
              a=s.index("$('rhp-refresh-odds').addEventListener('click',()=>{")
              b=s.index('// Open Racecards on every fresh app launch.',a)
              s=s[:a]+"$('rhp-refresh-odds').addEventListener('click',()=>checkPublishedData(true));\n"+s[b:]
              s=replace(s,"showTab('racecards');\nrestoreAutoRefreshView();","try{const last=sessionStorage.getItem('rhp-selected-section');if(['markets','racecards','watchlist','power','hot','powerresults','bets','pnl'].includes(last))activeTab=last}catch(e){}\nrestoreAutoRefreshView();\nshowTab(activeTab||'racecards',true);")
              s=replace(s,"if(document.visibilityState==='visible'&&Date.now()-autoRefreshLastCheck>15000)checkPublishedData();","if(document.visibilityState==='visible'&&Date.now()-autoRefreshLastCheck>=AUTO_REFRESH_INTERVAL_MS)checkPublishedData();")
              s=s.replace('A changed data file triggers a page reload; unchanged files never reload the page.','Changed live data is refreshed in place; never reload the page.')
              s=s.replace('Manual refresh uses the existing state-preserving reload path, not a new API call.','Manual refresh updates the published feeds in place, not the bookmaker API.')
