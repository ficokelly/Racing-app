          function loadRacecardIndex(raw){''')
              s=replace(s,'racecardRunners=normalized;\n for(const r of normalized){','racecardRunners=normalized.filter(r=>!rhpIsAbandoned(r.course,r.date||dateKey(r.race_time),clock(r.race_time)));\n for(const r of racecardRunners){')
              s=replace(s,'if(!x?.horse||!x?.course||!x?.starts||!x?.day)continue;','if(!x?.horse||!x?.course||!x?.starts||!x?.day||rhpIsAbandoned(x.course,x.day,x.time))continue;')
              s=replace(s,"const current=Array.isArray(latest.prices)?latest.prices:[];","const current=(Array.isArray(latest.prices)?latest.prices:[]).filter(p=>p&&!rhpIsAbandoned(p.course,dateKey(p.race_time),clock(p.race_time)));")
              s=replace(s,'const scored=feed.races.filter(x=>x.date===day);','const scored=feed.races.filter(x=>x.date===day&&!rhpIsAbandoned(x.course,x.date,x.time||clock(x.race_time)));')
              s=replace(s,'const all=(stage38DResults?.selections||[]);','const all=(stage38DResults?.selections||[]).filter(r=>!rhpIsAbandoned(r.course,r.date,r.time||clock(r.race_time)));')
              # Keep initial loading behavior, but cache its large datasets for the background updater.
              s=replace(s,'async function loadFeed(){loadForm();loadFinishedRaceFeed();try{','let rhpInitialFeedBusy=false,rhpLiveOdds=null,rhpLiveHistory=[],rhpCardHistory=[],rhpLiveCards=null;\nasync function loadFeed(){rhpInitialFeedBusy=true;loadForm();loadFinishedRaceFeed();try{')
