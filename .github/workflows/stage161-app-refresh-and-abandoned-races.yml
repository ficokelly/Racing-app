              p.write_text(s)

          # Immediately correct today's published combined feed without re-running frozen scorers.
          # Keep abandoned records in a separate audit field and do not touch historical days.
          p=Path('data/strategy-roi-combined.json');cards=json.loads(Path('data/racecards.json').read_text());feed=json.loads(p.read_text())
          from collections import defaultdict
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo('Europe/Dublin'));allowed={now.date().isoformat(),(now.date()+dt.timedelta(days=1)).isoformat()}
          def k(r):
              course=re.sub(r'\s*\((?:AW|all[ -]?weather)\)\s*$','',str(r.get('course','')),flags=re.I)
              time=str(r.get('race_time') or '')
              if time:
                  try: time=dt.datetime.fromisoformat(time.replace('Z','+00:00')).astimezone(dt.timezone.utc).strftime('%H:%M')
                  except ValueError: time=str(r.get('time',''))
              else: time=str(r.get('time',''))
              return (r.get('date'),re.sub(r'[^a-z0-9]','',course.lower()),time)
          groups=defaultdict(list)
          for r in cards.get('runners',[]):
