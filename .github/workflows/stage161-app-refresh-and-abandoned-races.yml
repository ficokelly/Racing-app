            const a=grouped.get(k)||[];a.push(String(r.race_status||'').toLowerCase().replace(/[^a-z]/g,''));grouped.set(k,a);}
           for(const [k,a] of grouped){if(a.every(v=>['abandoned','cancelled','canceled','void'].includes(v)))rhpAbandonedKeys.add(k);else if(a.some(v=>['declared','open','scheduled','active'].includes(v)))rhpAbandonedKeys.delete(k);}
          }
          function rhpMergeLiveCards(live,history){
