          done
      - name: Request fresh combined-model assessment
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(TZ=Europe/Dublin date +%F)"
          gh workflow run stage153-roi-combined.yml --ref main -f "selection_date=$DATE"
          echo "STAGE161_TRIGGERED_STAGE153 $DATE"
