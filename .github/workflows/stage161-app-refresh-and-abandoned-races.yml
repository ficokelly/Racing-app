              s=replace(s,'            previous = (before or {}).get("races") or {}','            previous = {k:v for k,v in ((before or {}).get("races") or {}).items() if k not in abandoned_alert_keys()}')
              s=replace(s,'    for event in reversed(events):','    closed = abandoned_alert_keys()\n    for event in reversed(events):')
              s=replace(s,'        result = send_push(event, secret, subscriber)', '''        affected = [x for x in event.get('changes', []) if x.get('race_key') in closed]
                  if affected:
