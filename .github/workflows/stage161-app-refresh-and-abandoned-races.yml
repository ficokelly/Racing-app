          assert 'STAGE161_IN_PLACE_REFRESH' in html
          assert 'window.location.reload()' not in html
          with tempfile.TemporaryDirectory() as d:
              n=0
              for attrs,body in re.findall(r'<script\b([^>]*)>(.*?)</script\s*>',html,re.I|re.S):
                  if not body.strip() or re.search(r'\btype=["\'](?:application/(?:ld\+)?json|importmap)["\']',attrs,re.I):continue
                  p=Path(d)/f'script-{n}.js';p.write_text(body)
                  subprocess.run(['node','--check',str(p)],check=True);n+=1
              print('STAGE161_INLINE_SCRIPTS_SYNTAX_OK',n)
          PY
            git add index.html scripts/stage153_roi_combined.py scripts/stage154_roi_notifications.py data/strategy-roi-combined.json
            if git diff --cached --quiet; then echo STAGE161_ALREADY_INSTALLED; break; fi
            git commit -m 'Stage161: hide abandoned races and refresh app data without page reloads'
            if git push origin HEAD:main; then echo STAGE161_PUBLISHED; break; fi
            test "$attempt" -lt 5 || exit 1
