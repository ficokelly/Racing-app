          closed={key for key,entries in groups.items() if entries and all(str(r.get('race_status','')).lower() in {'abandoned','cancelled','canceled','void'} for r in entries)}
          removed=[r for r in feed.get('races',[]) if k(r) in closed]
          if removed:
              before=feed.get('races',[]);feed['races']=[r for r in before if k(r) not in closed]
              audit=feed.setdefault('abandoned_races',[]);existing={k(r) for r in audit}
              for r in removed:
                  if k(r) not in existing:audit.append({**r,'race_status':'abandoned','racecard_asof':cards.get('collected_at')})
              day=feed.get('day');today=[r for r in feed['races'] if r.get('date')==day];abandoned=sum(1 for key in closed if key[0]==day)
              feed['coverage']={'ranked':sum(bool(r.get('runners')) for r in today),'unscored_or_changed':sum(not r.get('runners') for r in today),'abandoned':abandoned}
              # Keep original model generation time and pick timestamps; mark only presentation correction.
              feed['race_status_corrected_at']=now.isoformat();p.write_text(json.dumps(feed,indent=2,ensure_ascii=False)+'\n')
              print('STAGE161_REMOVED_ABANDONED',len(removed))
          else:print('STAGE161_NO_ABANDONED_ROWS_TO_REMOVE')

          # Prevent stale queued selection alerts for explicitly abandoned races; retain history.
