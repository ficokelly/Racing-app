              s=replace(s,'const AUTO_REFRESH_INTERVAL_MS=45000;','const AUTO_REFRESH_INTERVAL_MS=90000;')
              # Replace the old global HEAD + reload handler. Legacy declarations can remain for compatibility.
              a=s.index('let autoRefreshSignatures=null,autoRefreshBusy=false,autoRefreshLastCheck=0;')
              b=s.index('function restoreAutoRefreshView(){',a)
              s=s[:a]+'''let autoRefreshBusy=false,autoRefreshLastCheck=0;
          const rhpLiveSignatures=new Map();
