          if 'STAGE161_ABANDONED_ALERTS' not in s:
              s=replace(s,'def first_two(race):','''# STAGE161_ABANDONED_ALERTS
           def_placeholder
          '''.replace(' def_placeholder','''def abandoned_alert_keys():
              groups = {}
              for r in read_json(DATA / 'racecards.json', {}).get('runners', []):
