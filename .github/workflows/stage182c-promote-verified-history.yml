          set -euo pipefail
          test -s reports/stage182b/promotion-validation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stage182c_verified_source.py scripts/stage167_validated_history.py data/stage182c-approved-history.json
          git diff --cached --check
          git commit -m 'Stage182c: integrate 115 verified v132 historical races'
