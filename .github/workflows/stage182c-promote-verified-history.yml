          git fetch origin main
          if ! git diff --quiet "$BASE" origin/main -- scripts/stage167_validated_history.py scripts/stage180_archive_overlay.py scripts/stage171_recent_history.py scripts/stage182c_verified_source.py data/stage182c-approved-history.json data/stage171-history data/stage180-history-overlay; then
