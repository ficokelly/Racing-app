           for label,script,extra,outfile in [('141','stage141_today_or_weight_paper.py',[],'stage141-today-all-runners.csv'),('147','stage147_daily_143_146.py',['today','--config',str(ROOT/'scripts/stage143_race_type_specialist_config.json')],'stage146-today-all-runners.csv'),('151','stage151_d142_core_form_or_weight_today.py',['today'],'stage151-d142-core-form-weight-all-runners.csv'),('152','stage152_best_roi_specialists_today.py',['today'],'stage152-strongest-roi-specialists-all-runners.csv')]:
            out=P/label;out.mkdir(exist_ok=True)
            args=extra+['--db',str(db),'--reference',str(ref),'--cards',str(cards),'--date',day,'--out',str(out)]
            rc=execute([sys.executable,str(wrapper),asof.isoformat(),str(ROOT/'scripts'/script),*args],P/(label+'-replay.log'))
            f=out/outfile;counts=collections.Counter(r.get('model') for r in csv.DictReader(f.open()) if str(r.get('rank'))=='1') if rc==0 and f.is_file() else {}
