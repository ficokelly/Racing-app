name: Stage71 - Repair Archived Results (No Workflow Permission Required)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rhp-stage71-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current racing repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install guarded recovery and scheduled Stage70 hook without changing workflow files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > scripts/rhp_stage71_result_recovery.py <<'STAGE71_RECOVERY_PY'
          #!/usr/bin/env python3
          """Stage71 safe final-status classification of previously archived Racing API results.
          
          The result must have provider provenance, a race ID, a unique recorded winner,
          distinct named runners and known finishing positions or statuses. Where a separate
          PuntersEdge result is saved, finishing positions must not conflict. Never invents
          race identities, odds, placings, winners or any model predictions.
          """
          from __future__ import annotations
          import argparse, collections, datetime as dt, json, pathlib, re, unicodedata
          from zoneinfo import ZoneInfo
          
          ROOT=pathlib.Path(__file__).resolve().parent.parent
          UTC=dt.timezone.utc
          COUNTRY=re.compile(r'\s*\((?:GB|IRE|IRL|FR|USA|GER|AUS|NZ|SAF|ITA|ITY|CAN)\)\s*$',re.I)
          COURSE=re.compile(r'\s*\((?:AW|ALL WEATHER|IRE|IRL|GB)\)',re.I)
          TERMINAL={'PU','F','RO','UR','BD','R','NR','DQ','DSQ','RR','VOID','WD','DNS','REF','P','RET','CO','S','SU'}
          
          
          def compact(s):
              x=unicodedata.normalize('NFKD',str(s or ''))
              return re.sub('[^a-z0-9]','', ''.join(c for c in x if not unicodedata.combining(c)).casefold())
          
          
          def horse(s): return compact(COUNTRY.sub('',str(s or '')))
          
          
          def course(s):
              n=compact(COURSE.sub('',str(s or '')))
              return {'chelmsfordcity':'chelmsford'}.get(n,n)
          
          
          def minute(value):
              try:
                  x=dt.datetime.fromisoformat(str(value).replace('Z','+00:00'))
                  return (x if x.tzinfo else x.replace(tzinfo=UTC)).astimezone(UTC).strftime('%H:%M')
              except (ValueError,TypeError):
                  m=re.search(r'\b(\d\d:\d\d)\b',str(value or ''))
                  return m.group(1) if m else ''
          
          
          def identity(r):
              return (str(r.get('date') or '')[:10],course(r.get('course')),
                      minute(r.get('off_dt') or r.get('race_time') or r.get('off')))
          
          
          def pos(v):
              if isinstance(v,bool): return None
              s=str(v or '').strip()
              return int(s) if s.isdecimal() and int(s)>0 else None
          
          
          def winner(r):
              v=[horse(x.get('horse')) for x in r.get('runners',[])
                 if isinstance(x,dict) and pos(x.get('position'))==1]
              return v[0] if len(v)==1 else None
          
          
          def validate(r,day,source,today):
              if r.get('status') not in (None,''):return 'already_has_status'
              if day>today or str(r.get('date') or '')[:10]!=day:return 'invalid_day'
              if 'racing api' not in str(source or '').lower():return 'unconfirmed_archive_provenance'
              if not str(r.get('race_id') or '').startswith('rac_'):return 'missing_source_race_id'
              if str(r.get('region') or '').upper() not in ('GB','IE','IRE'):return 'unsupported_region'
              k=identity(r)
              if not k[1] or not k[2]:return 'invalid_race_identity'
              rows=r.get('runners')
              if not isinstance(rows,list) or len(rows)<2:return 'insufficient_runners'
              names=[horse(x.get('horse')) if isinstance(x,dict) else '' for x in rows]
              if not all(names) or len(set(names))!=len(names):return 'duplicate_or_missing_runner'
              if not winner(r):return 'ambiguous_winner'
              for x in rows:
                  raw=str(x.get('position') or '').strip().upper()
                  if pos(raw) is None and raw not in TERMINAL:
                      # An explicit known terminal status is also valid if position is null.
                      status=compact(x.get('status'))
                      if status not in {'nr','nonrunner','dns','scratched','withdrawn','pulledup','pu','f','fell',
                                        'unseatedrider','ur','broughtdown','bd','refused','r','ranout','ro',
                                        'disqualified','dq','unplaced','finishedunplaced'}:
                          return 'unknown_finishing_status'
                  if not x.get('trainer') or not x.get('jockey'):return 'missing_person_identity'
              return None
          
          
          def compare(a,b):
              if winner(a)!=winner(b):return 'winner_conflict'
              matches={horse(x.get('horse')):x for x in b.get('runners',[]) if isinstance(x,dict)}
              common=0
              for x in a['runners']:
                  y=matches.get(horse(x.get('horse')))
                  if y is None:continue
                  common+=1
                  p,q=pos(x.get('position')),pos(y.get('position'))
                  if p is not None and q is not None and p!=q:return 'finishing_position_conflict'
              if common<2:return 'insufficient_runner_overlap'
              return None
          
          
          def recover(root=ROOT,apply=True,report_path=None,as_of=None):
              today=as_of or dt.datetime.now(ZoneInfo('Europe/Dublin')).date().isoformat()
              root=pathlib.Path(root)
              feed=root/'data/race-results.json'
              external=json.loads(feed.read_text(encoding='utf-8')) if feed.exists() else {}
              finals=collections.defaultdict(list)
              for r in external.get('races',[]):
                  if isinstance(r,dict) and r.get('status')=='final':finals[identity(r)].append(r)
              documents={}
              slots=collections.defaultdict(list)
              for path in sorted((root/'data/racing-results').glob('????-??-??.json')):
                  if path.stem>=today or path.stem<(dt.date.fromisoformat(today)-dt.timedelta(days=30)).isoformat():continue
                  payload=json.loads(path.read_text(encoding='utf-8'))
                  if not isinstance(payload.get('results'),list):continue
                  documents[path]=payload
                  for r in payload['results']:
                      if isinstance(r,dict):slots[identity(r)].append(r)
              report={'mode':'apply' if apply else 'dry-run','generated_at':dt.datetime.now(UTC).isoformat(),
                      'missing_final_flag':0,'newly_validated':0,'provider_cross_checked':0,
                      'archive_only_validated':0,'already_final':0,'held_for_review':[],
                      'by_day':{},'method':'Source-validated Racing API classification with PuntersEdge cross-check where available',
                      'model_safety':'No model weights, rankings, selections, SPs or finishing positions modified'}
              changed=set()
              for path,payload in documents.items():
                  counts=collections.Counter()
                  for r in payload['results']:
                      if not isinstance(r,dict):continue
                      if r.get('status')=='final':report['already_final']+=1;continue
                      if r.get('status') not in (None,''):continue
                      report['missing_final_flag']+=1
                      counts['missing_final_flag']+=1
                      issue=validate(r,path.stem,payload.get('source'),today)
                      key=identity(r)
                      if not issue:
                          others=slots[key]
                          if any(winner(x) and winner(x)!=winner(r) for x in others if x is not r):
                              issue='contradictory_archive_duplicate'
                      if not issue:
                          providers=finals.get(key,[])
                          if len(providers)>1:
                              matched=[x for x in providers if winner(x)==winner(r)]
                              if len(matched)!=len(providers):issue='conflicting_provider_records'
                              else:issue=next((problem for x in matched if (problem:=compare(r,x))),None)
                          elif providers:issue=compare(r,providers[0])
                      if issue:
                          counts['held']+=1
                          report['held_for_review'].append({'day':path.stem,'course':r.get('course'),
                              'time':key[2],'race_id':r.get('race_id'),'reason':issue})
                          continue
                      source='provider_cross_checked' if finals.get(key) else 'archive_only_validated'
                      counts[source]+=1
                      report[source]+=1
                      report['newly_validated']+=1
                      if apply:
                          r['status']='final'
                          r['result_classification_source']='stage71_'+source
                          r['completion_validation']='Existing recorded race result validated; rankings, runners, positions and odds unchanged'
                          changed.add(path)
                  if counts:report['by_day'][path.stem]=dict(counts)
              if apply:
                  for path in changed:
                      path.write_text(json.dumps(documents[path],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              report['modified_daily_archives']=len(changed)
              report['unresolved_classification_count']=len(report['held_for_review'])
              if report_path:
                  path=root/report_path
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
              return report
          
          
          def self_test():
              a={'race_id':'rac_test','date':'2026-11-02','region':'GB',
                 'course':'Dundalk (AW) (IRE)','off_dt':'2026-11-02T13:30:00Z',
                 'runners':[{'horse':'A (FR)','position':'1','trainer':'Trainer','jockey':'Jockey'},
                            {'horse':'B (IRE)','position':'PU','trainer':'Trainer','jockey':'Jockey'}]}
              assert identity(a)==('2026-11-02','dundalk','13:30')
              assert validate(a,'2026-11-02','Racing API results','2026-11-09') is None
              b={**a,'status':'final','runners':[{'horse':'A','position':1},{'horse':'B','position':None,'status':'pu'}]}
              assert compare(a,b) is None
              bad={**b,'runners':[{'horse':'A','position':2},{'horse':'B','position':1}]}
              assert compare(a,bad)=='winner_conflict'
              print('Stage71 guarded recovery self-test passed')
          
          
          def main():
              parser=argparse.ArgumentParser()
              parser.add_argument('--self-test',action='store_true')
              parser.add_argument('--dry-run',action='store_true')
              parser.add_argument('--report',default='data/rhp-stage71-recovery.json')
              opts=parser.parse_args()
              if opts.self_test:self_test();return
              report=recover(apply=not opts.dry_run,report_path=opts.report if not opts.dry_run else None)
              print(json.dumps({k:report[k] for k in ('missing_final_flag','newly_validated',
                  'provider_cross_checked','archive_only_validated','unresolved_classification_count')},indent=2))
          
          if __name__=='__main__':main()
          STAGE71_RECOVERY_PY
          cat > scripts/rhp_stage71_patch_coverage.py <<'STAGE71_PATCH_PY'
          #!/usr/bin/env python3
          """Patch only Stage70 Python logic (no .github/workflows write permission required).
          Refuses unexpected source revisions rather than editing uncertain code.
          """
          from pathlib import Path
          
          P=Path('scripts/rhp_stage70_data_coverage.py')
          s=P.read_text(encoding='utf-8')
          
          def replace_once(old,new,label):
              global s
              if new in s:
                  print('Already applied:',label)
                  return
              if s.count(old)!=1:
                  raise RuntimeError('Unexpected Stage70 revision; refusing patch: '+label)
              s=s.replace(old,new,1)
          
          old_norm="""def norm(s):
              s=re.sub(r'\\s*\\((?:aw|all.weather)\\)\\s*$','',str(s or ''),flags=re.I)
              return re.sub('[^a-z0-9]','',s.casefold())"""
          new_norm="""def norm(s):
              # Remove all recognised course/horse suffixes, including multiple suffixes.
              s=re.sub(r'\\s*\\((?:aw|all.weather|ire|irl|gb|fr|usa|can|ger|aus|nz)\\)', '', str(s or ''), flags=re.I)
              cleaned=re.sub('[^a-z0-9]','',s.casefold())
              return {'chelmsfordcity':'chelmsford'}.get(cleaned,cleaned)"""
          replace_once(old_norm,new_norm,'normalized race names')
          
          old_archive="""    archive=collections.defaultdict(dict)
              root=ROOT/'data/racing-results'
              for day in (today-dt.timedelta(days=n) for n in range(0,15)):
                  document=data('data/racing-results/'+day.isoformat()+'.json',{})
                  for x in document.get('results',[]):
                      if x.get('status')=='final':
                          archive[day.isoformat()][race_key(day.isoformat(),x.get('course'),x.get('off_dt') or x.get('race_time'))]=x"""
          new_archive="""    # Include archived finals and separately verified final provider results.
              archive=collections.defaultdict(list)
              for day in (today-dt.timedelta(days=n) for n in range(0,15)):
                  document=data('data/racing-results/'+day.isoformat()+'.json',{})
                  for x in document.get('results',[]):
                      if isinstance(x,dict) and x.get('status')=='final' and x.get('course'):
                          archive[day.isoformat()].append(x)
              for x in data('data/race-results.json',{}).get('races',[]):
                  if isinstance(x,dict) and x.get('status')=='final' and x.get('course'):
                      day=str(x.get('date') or '')[:10]
                      archive[day].append(x)
          
              def result_for(key,horses):
                  day,course_name,off_time=key
                  target=int(off_time[:2])*60+int(off_time[3:])
                  hits=[]
                  for r in archive.get(day,[]):
                      if norm(r.get('course'))!=course_name:continue
                      actual=clock(r.get('off_dt') or r.get('race_time') or r.get('off'))
                      if not actual:continue
                      delta=abs(int(actual[:2])*60+int(actual[3:])-target)
                      if delta>12:continue
                      rows=r.get('runners') or []
                      winners=[norm(z.get('horse')) for z in rows if isinstance(z,dict) and str(z.get('position')) in ('1','1.0')]
                      if len(winners)!=1:continue
                      names={norm(z.get('horse')) for z in rows if isinstance(z,dict) and z.get('horse')}
                      count=len(names.intersection(horses))
                      if count<(1 if delta==0 else 2):continue
                      hits.append((delta,-count,winners[0],r))
                  if not hits:return None
                  hits.sort(key=lambda x:(x[0],x[1]))
                  best=hits[0]
                  # Do not silently count conflicting winner reports as verified coverage.
                  if any(item[2]!=best[2] for item in hits if item[0]==best[0]):return None
                  return best[3]"""
          replace_once(old_archive,new_archive,'result source matching')
          replace_once("if key in archive.get(day,{}):record['results_found']+=1",
                       "if result_for(key,horses):record['results_found']+=1",'race result lookup')
          
          old_main="""    if a.self_test:self_test();return
              value=audit()"""
          new_main="""    if a.self_test:self_test();return
              # Stage71 reruns safely whenever the existing Stage70 schedule fires.
              # This avoids changing restricted GitHub workflow files.
              from rhp_stage71_result_recovery import recover
              recovery=recover(ROOT,apply=True)
              if recovery['newly_validated']:
                  import subprocess,sys
                  subprocess.run([sys.executable,'calculate-strike-rates.py'],cwd=ROOT,check=True)
              value=audit()
              value['stage71_recovery_summary']={k:recovery[k] for k in (
                  'missing_final_flag','newly_validated','provider_cross_checked',
                  'archive_only_validated','unresolved_classification_count')}"""
          replace_once(old_main,new_main,'scheduled recovery hook')
          P.write_text(s,encoding='utf-8')
          print('Stage71 installed without modifying any workflow file')
          STAGE71_PATCH_PY
          python scripts/rhp_stage71_patch_coverage.py
          python -m py_compile scripts/rhp_stage71_result_recovery.py scripts/rhp_stage71_patch_coverage.py scripts/rhp_stage70_data_coverage.py
          python scripts/rhp_stage71_result_recovery.py --self-test
          python scripts/rhp_stage70_data_coverage.py --self-test
      - name: Validate, recover and rebuild form without changing model selections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rhp_stage71_result_recovery.py --dry-run
          python scripts/rhp_stage71_result_recovery.py
          python calculate-strike-rates.py
          python scripts/rhp_stage70_data_coverage.py --out data/rhp-stage70-coverage.json
          python - <<'SUMMARY'
          import json,os
          recovery=json.load(open('data/rhp-stage71-recovery.json'))
          coverage=json.load(open('data/rhp-stage70-coverage.json'))
          if recovery['newly_validated'] < 1:
              print('No new archived results required classification.')
          lines=['## Stage71 archive repair','',
            '- Previously unflagged races safely classified: **'+str(recovery['newly_validated'])+'**',
            '- Independently cross-checked against final provider: **'+str(recovery['provider_cross_checked'])+'**',
            '- Archive-only validated (not independently confirmed): **'+str(recovery['archive_only_validated'])+'**',
            '- Records held for review: **'+str(recovery['unresolved_classification_count'])+'**',
            '- Historical card races still reporting missing results: **'+str(len(coverage['missing_verified_results_for_historic_declared_races']))+'**','',
            'No model rankings, prediction weights, prices or bets were changed.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          SUMMARY
      - name: Commit only result recovery, form statistics and Python scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- scripts/rhp_stage71_result_recovery.py scripts/rhp_stage71_patch_coverage.py \
            scripts/rhp_stage70_data_coverage.py data/racing-results data/rhp-stage71-recovery.json \
            data/rhp-stage70-coverage.json data/strike-rates.json data/form-identity-cache.json \
            reports/stage32/form-rebuild-audit.json
          if git diff --cached --name-only | grep -E '^\.github/workflows/|strategy-|racecards|odds|selections'; then
            echo 'Safety stop: unexpected workflow or model data file staged.' >&2
            exit 1
          fi
          if git diff --cached --quiet; then echo 'Everything already up-to-date'; exit 0; fi
          git commit -m 'Stage71 guarded archive result classification and scheduled audit integration'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Stage71 recovery published successfully'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt*3))
          done
          echo 'Stage71 publication failed; details retained in workflow artifact' >&2
          exit 1
      - name: Upload before and after recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage71-guarded-recovery-report
          path: |
            data/rhp-stage71-recovery.json
            data/rhp-stage70-coverage.json
            reports/stage32/form-rebuild-audit.json
          retention-days: 30
          if-no-files-found: warn
