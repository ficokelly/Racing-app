name: Stage184b - Frozen G4 class-weight and type-strength challenger replays
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stage184b-g4-challengers-replay.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage184b-g4-research
  cancel-in-progress: false
env:
  PYTHONPATH: .:scripts
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      days: ${{ steps.days.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5987838b0e3f28b53686bac60d52cd164738718
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: days
        run: |
          python - <<'PY'
          import datetime as d,json,os
          days=[(d.date(2026,10,25)+d.timedelta(days=i)).isoformat() for i in range(30)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:print('days='+json.dumps(days,separators=(',',':')),file=f)
          PY
  score:
    needs: prepare
    name: ${{ matrix.day }} / G4 ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        day: ${{ fromJSON(needs.prepare.outputs.days) }}
        engine: [CLASS_WEIGHT, TYPE_STRENGTH]
    env:
      DAY: ${{ matrix.day }}
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5987838b0e3f28b53686bac60d52cd164738718
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: reports/stage177/shared
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-db
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: reports/stage177/shared
      - name: Restore the original 2025 frozen challenger bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p restore/g4
          if [ "$ENGINE" = CLASS_WEIGHT ]; then
            gh run download 43709519173 --repo "$GITHUB_REPOSITORY" --name stage131-class-weight-hpr-43709519173 --dir restore/g4
          else
            gh run download 43751798379 --repo "$GITHUB_REPOSITORY" --name stage136-race-types-g4-hpr-43751798379 --dir restore/g4
          fi
      - name: Install exact scoring dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 scikit-learn==1.6.1 joblib==1.4.2 freezegun==1.5.5 requests
      - name: Install original G4 challenger adapter
        run: |
          cat > scripts/stage184b_local_replay.py <<'PY'
          import argparse,pathlib as P,json,csv,collections,sqlite3,datetime as dt,inspect,os
          import numpy as np,pandas as pd,joblib
          import stage108_model_g2 as G
          import stage111_model_g4 as G4
          import stage131_class_weight_hpr as S131
          import stage136_g4_race_type_challenger as S136
          import stage141_today_or_weight_paper as L
          p=argparse.ArgumentParser();p.add_argument('command');p.add_argument('--date');p.add_argument('--db',type=P.Path);p.add_argument('--reference',type=P.Path);p.add_argument('--cards',type=P.Path);p.add_argument('--out',type=P.Path);a=p.parse_args();date=a.date;engine=os.environ['ENGINE']
          a.out.mkdir(parents=True,exist_ok=True)
          cards,_=L.today_cards(a.cards,date);scratch,ref,latest=L._scratch_archive_original(a.db,a.reference,cards,date,a.out);assert latest<date
          # Extend the ORIGINAL metadata reader's upper bound only. It reads declared OR and weight, no outcomes.
          source=inspect.getsource(S136.metadata);assert source.count("'2025-12-31'")==1
          ns=dict(vars(S136));exec(compile(source.replace("'2025-12-31'",repr(date)),'stage184b-metadata-date-only','exec'),ns)
          meta=ns['metadata'](scratch)
          if engine=='CLASS_WEIGHT':
           _,State=S131.build_context_state();State.field_meta=meta;feature_names=list(G.FEATURES)+list(S131.ADDED_FEATURES);version=S131.VERSION;filename='stage131-g4-class-weight-model.joblib';label='G4_CLASS_WEIGHT_'
          else:
           assert engine=='TYPE_STRENGTH';_,State=S136.build_context_state(meta);feature_names=list(G.FEATURES)+list(S131.ADDED_FEATURES)+list(S136.ADDED_FEATURES);version=S136.VERSION;filename='stage136-g4-type-strength-challenger.joblib';label='G4_STAGE136_'
          files=list(P.Path('restore/g4').rglob(filename));assert len(files)==1,(filename,files)
          bundle=joblib.load(files[0]);assert bundle['version']==version and bundle['features']==feature_names and bundle['trained_through']=='2025-12-31'
          refs,_=G.load_reference(ref,first='2022-01-01',last=date)
          # The Stage108 history collector releases outcomes only after an entire date. Target rows are
          # synthetic pre-off placeholders; no target outcome is used in a later prediction.
          orig_state,orig_start,orig_feat=G.FormState,G.TRAIN_START,G.FEATURES
          try:
           G.FormState=State;G.TRAIN_START=date
           frame,_,history_audit,_=G.collect_historical(scratch,first='2022-01-01',last=date,reference=refs)
          finally:G.FormState=orig_state;G.TRAIN_START=orig_start
          assert len(frame) and (frame.date==date).all()
          for col,target in [('weight_lbs','today_weight_relative'),('official_rating','today_or_relative')]:
           frame[target]=pd.to_numeric(frame[col],errors='coerce')-frame.groupby('race_id')[col].transform(lambda x:pd.to_numeric(x,errors='coerce').mean())
          # Preserve original minimum field / single identity and G-family 55% prior-form eligibility.
          bycard={r['id']:r for r in cards};keep=[]
          for rid,z in frame.groupby('race_id'):
           card=bycard[str(rid)]
           if len(z)<4 or len(z)!=len(card['field']) or z.identity.nunique()!=len(z):continue
           if sum(bool(k) and float(n)>0 for k,n in zip(z.identity,z.prior_runs))/len(z)<.55:continue
           keep.append(rid)
          frame=G4.classify(frame[frame.race_id.isin(keep)].copy());assert len(frame)
          try:
           G.FEATURES=feature_names
           pure,blend,_,_=G4.bank_raw_prob(bundle['bank'],frame)
          finally:G.FEATURES=orig_feat
          rows=[]
          for mode,values in [('SPECIALIST',pure),('BLENDED',blend)]:
           assert len(values)==len(frame) and np.isfinite(values).all()
           z=frame.assign(raw_probability=values);z=G.ranks(G.softmax_races(z,1.))
           for _,r in z.iterrows():
            card=bycard[str(r.race_id)]
            if card['off']<=L.utcnow()+dt.timedelta(minutes=10):continue
            rows.append(dict(date=date,time_utc=card['off'].strftime('%H:%M'),meeting=r.course,race_type=r.race_type,discipline=r.discipline,model=label+mode,rank=int(r['rank']),horse=r.horse))
          assert rows
          L.csvwrite(a.out/'stage184b-all-runners.csv',rows)
          (a.out/'stage184b-audit.json').write_text(json.dumps(dict(rank_only=True,historical_source_through=latest,trained_through=bundle['trained_through'],engine=engine,models=sorted({r['model'] for r in rows}),history_audit=history_audit),default=str))
          PY
          python -m py_compile scripts/stage184b_local_replay.py
      - name: Replay original frozen G4 challenger bundles on frozen pre-off inputs
        run: |
          python - <<'PY'
          import collections as C,csv,datetime as D,hashlib,json,os,pathlib as P,re,sqlite3,subprocess as S,sys,unicodedata,tempfile,shutil
          DAY=os.environ['DAY'];B=P.Path('reports/stage177/shared').resolve();O=P.Path('reports/stage184b/score').resolve();O.mkdir(parents=True,exist_ok=True)
          def read(p):return json.loads(p.read_text())
          def norm(s):return re.sub('[^a-z0-9]','',unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().lower())
          def horse(s):return norm(re.sub(r'\s*\([A-Za-z]{2,3}\)\s*$','',str(s or '')))
          def course(s):
           n=norm(re.sub(r'\s*\((?:AW|GB|IRE)\)\s*$','',str(s or ''),flags=re.I));return {'galwayire':'galway','wexfordire':'wexford','dundalkawire':'dundalk','dundalkire':'dundalk','dundalkaw':'dundalk','fairyhouseire':'fairyhouse','clonmelire':'clonmel','gowranparkire':'gowranpark','kemptonpark':'kempton','chelmsfordcity':'chelmsford','bangor':'bangorondee'}.get(n,n)
          def digest(p):
           with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          cols=['date','course','time','model','horse','race_type','discipline','basis','source_asof','cutoff','batch'];out=[];audit={'date':DAY,'engine':os.environ['ENGINE'],'status':'STARTED','batches':[]}
          def save():
           (O/'audit.json').write_text(json.dumps(audit,indent=2));
           with (O/'rank1.csv').open('w',newline='') as f:w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(out)
          try:
           manifest=read(B/'history-manifest.json');db=B/'candidate.sqlite';assert digest(db)==manifest['database_sha256'] and digest(B/'candidate-reference.csv')==manifest['reference_sha256']
           batches=read(B/(DAY+'-batches.json'))
           with sqlite3.connect(db) as c:
            c.execute('delete from historical_runs where race_id in (select id from historical_races where race_date>=?)',(DAY,));c.execute('delete from historical_races where race_date>=?',(DAY,));c.commit();assert c.execute('select max(race_date) from historical_races').fetchone()[0]<DAY
           with tempfile.TemporaryDirectory() as td:
            T=P.Path(td);ref=T/'prior-reference.csv'
            with (B/'candidate-reference.csv').open(encoding='utf-8-sig',newline='') as f,ref.open('w',newline='') as g:
             r=csv.DictReader(f);w=csv.DictWriter(g,fieldnames=r.fieldnames);w.writeheader();w.writerows(x for x in r if x['date']<DAY)
            wrapper=T/'clock.py';wrapper.write_text('import sys,runpy\nfrom freezegun import freeze_time\nclock,script,*args=sys.argv[1:]\nsys.argv=[script,*args]\nwith freeze_time(clock,real_asyncio=True):\n runpy.run_path(script,run_name="__main__")\n')
            for b in batches:
             bid=b['batch'];work=T/bid;work.mkdir();rep={'batch':bid,'status':'FAILED'};meta={tuple(x['key']):x for x in b['races']};seen=set();exclude=C.Counter()
             try:
              args=[sys.executable,str(wrapper),b['cutoff'],str(P.Path('scripts/stage184b_local_replay.py').resolve()),'today','--db',str(db),'--reference',str(ref),'--cards',str(B/(bid+'.json')),'--date',DAY,'--out',str(work)]
              with (O/(bid+'.log')).open('w') as f:rc=S.run(args,stdout=f,stderr=S.STDOUT,timeout=6000).returncode
              assert rc==0,'Scorer failed: '+str(rc)
              sa=read(work/'stage184b-audit.json');assert sa['rank_only'] and sa['historical_source_through']<DAY and sa['trained_through']=='2025-12-31'
              raw=list(csv.DictReader((work/'stage184b-all-runners.csv').open()));groups=C.defaultdict(list)
              for r in raw:groups[((r['date'],course(r['meeting']),r['time_utc']),r['model'])].append(r)
              for (k,model),rs in groups.items():
               if k not in meta:exclude['unmatched_race']+=1;continue
               m=meta[k];top=[r for r in rs if r['rank']=='1'];declared=set(m['declared_horses'])
               if len(top)!=1 or len(rs)!=len(declared) or {horse(r['horse']) for r in rs}!=declared:exclude['incomplete_field_or_rank']+=1;continue
               r=top[0];assert (k,model) not in seen;seen.add((k,model))
               out.append(dict(date=k[0],course=k[1],time=k[2],model=r['model'],horse=r['horse'],race_type=r['race_type'],discipline=r['discipline'],basis='STAGE131_136_FROZEN_G4_BANK_PREOFF_ADAPTER',source_asof=m['source_asof'],cutoff=b['cutoff'],batch=bid))
              rep.update(status='SCORED' if seen else 'NO_ACCEPTED_RANK1',rank1=len(seen),excluded=dict(exclude),scheduled=len(meta))
             except Exception as e:rep['error']=repr(e)
             finally:audit['batches'].append(rep);save();shutil.rmtree(work,ignore_errors=True)
           audit['status']='COMPLETE' if batches and all(x['status']=='SCORED' for x in audit['batches']) else 'PARTIAL_OR_FAILED';save();print('STAGE184B_SCORE',json.dumps(audit),flush=True)
           if audit['status']!='COMPLETE':raise RuntimeError('Incomplete G4 daily replay; retained diagnostic artifact')
          except Exception as e:audit.update(status='FAILED',error=repr(e));save();raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage184b-ranks-${{ matrix.day }}-${{ matrix.engine }}
          path: reports/stage184b/score/
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: [prepare,score]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: shared
      - uses: actions/download-artifact@v4
        with:
          pattern: stage184b-ranks-*
          path: results
          merge-multiple: false
      - name: Settle rank1 with the same Stage177b prices; report coverage and common cohorts
        run: |
          python - <<'PY'
          import collections as C,csv,json,pathlib as P,re,unicodedata
          out=P.Path('summary');out.mkdir(exist_ok=True)
          def horse(s):return re.sub('[^a-z0-9]','',unicodedata.normalize('NFKD',re.sub(r'\s*\((?:IRE|GB|FR|USA|GER|AUS|NZ|ITY|JPN)\)\s*$','',str(s or ''),flags=re.I)).encode('ascii','ignore').decode().lower())
          def key(r):return (r['date'],r['course'],r['time'])
          def write(name,rs):
           p=out/name
           if not rs:p.write_text('');return
           with p.open('w',newline='') as f:w=csv.DictWriter(f,fieldnames=list(dict.fromkeys(k for r in rs for k in r)));w.writeheader();w.writerows(rs)
          s={key(x):x for x in json.loads(P.Path('shared/settlement-prices.json').read_text())};rows=[];seen=set();audits=[]
          for p in P.Path('results').rglob('audit.json'):audits.append(json.loads(p.read_text()))
          for p in P.Path('results').rglob('rank1.csv'):
           for r in csv.DictReader(p.open()):
            k=key(r);mk=(k,r['model']);assert mk not in seen;seen.add(mk)
            status='NO_RESULT';won=None;pnl=None
            if k in s:
             v=s[k];h=horse(r['horse']);starter={horse(x['horse']) for x in v['starters']};nr={horse(x) for x in v['declared_nonrunners']};wins={horse(x['horse']):x['sp_decimal'] for x in v['winner_prices']}
             if h not in starter:status='VOID_NR' if h in nr else 'UNMATCHED'
             else:
              status='SETTLED';won=int(h in wins)
              if wins and not v['price_conflicts'] and all(x is not None for x in wins.values()):pnl=float(wins[h])/len(wins)-1 if won else -1.
            rows.append(dict(r,status=status,won=won,pnl=pnl))
          def metric(rs):
           settled=[r for r in rs if r['status']=='SETTLED'];priced=[r for r in settled if r['pnl'] is not None];wins=sum(r['won'] for r in settled);profit=sum(r['pnl'] for r in priced)
           return {'selections':len(rs),'settled':len(settled),'wins':wins,'strike_rate_pct':round(100*wins/len(settled),4) if settled else None,'priced':len(priced),'pnl_units':round(profit,4),'roi_pct':round(100*profit/len(priced),4) if priced else None,'excluded_or_void':len(rs)-len(settled)}
          groups=C.defaultdict(list)
          for r in rows:
           for dimension,value in [('overall','all'),('day',r['date']),('discipline',r['discipline']),('race_type',r['race_type'])]:groups[(r['model'],dimension,value)].append(r)
          metrics=[dict(model=m,dimension=d,value=v,**metric(rs)) for (m,d,v),rs in sorted(groups.items())]
          write('rank1-settlement.csv',rows);write('model-performance.csv',metrics)
          report={'status':'RESEARCH_ONLY_NOT_ROUTING_CERTIFIED','period':['2026-10-25','2026-11-23'],'expected_days':30,'reported_days':len({a['date'] for a in audits}),'day_status':dict(C.Counter(a['status'] for a in audits)),'overall':[x for x in metrics if x['dimension']=='overall'],'limitations':['Original Stage131 and Stage136 frozen G4 model banks, reconstructed prior-date full-field feature state. No claim of original paper parity; no odds used.','No production change. Missing fields and failed batches excluded.']}
          (out/'report.json').write_text(json.dumps(report,indent=2));(out/'day-audits.json').write_text(json.dumps(audits,indent=2));print('STAGE184B_REPORT',json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage184b-g4-challengers-comparison
          path: summary/
          if-no-files-found: error
          retention-days: 30
