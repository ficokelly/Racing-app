         # No retrospective runner removal is permitted here.
         for path in ('data/racecards.json','data/racecards-archive.json'):
          for line in S.check_output(['git','log','--format=%H %ct','--since=2026-10-23T00:00:00Z','--until=2026-11-24T00:00:00Z','--',path],text=True).splitlines():
