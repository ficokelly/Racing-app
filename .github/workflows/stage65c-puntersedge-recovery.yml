name: Stage65C - PuntersEdge UK IE Results and Prices Recovery
on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Earliest GB/IE local racing date'
        default: '2026-10-08'
        required: true
      until:
        description: 'Last local racing date (empty = yesterday)'
        default: ''
        required: false
      include_prices:
        description: 'Retrieve all closing archive rows too (may use paid API credits)'
        default: 'true'
        type: choice
        options: [ 'true', 'false' ]
      max_requests:
        description: 'API request cap per run'
        default: '150'
        required: true
  schedule:
    - cron: '25 1 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: stage65c-ukie-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      FROM_DATE: ${{ github.event.inputs.since || '2026-10-08' }}
      UNTIL_DATE: ${{ github.event.inputs.until || '' }}
      INCLUDE_PRICES: ${{ github.event.inputs.include_prices || 'true' }}
      MAX_REQUESTS: ${{ github.event.inputs.max_requests || '150' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate script
        run: python -m py_compile scripts/stage65c_puntersedge_recovery.py
      - name: Restore latest durable archive artifact, if one exists
        run: |
          set -euo pipefail
          mkdir -p reports/stage65c
          python - <<'PY'
          import json,os,subprocess,sys,sqlite3,pathlib
          repo=os.environ['GITHUB_REPOSITORY']
          # Filter by name at the API: a busy repository may have more than 500
          # unrelated artifacts, so unfiltered pagination could silently miss ours.
          x=json.loads(subprocess.check_output(['gh','api','-X','GET',
              f'repos/{repo}/actions/artifacts','-f','name=stage65c-ukie-form-archive',
              '-f','per_page=100'],text=True))
          runs=[y for y in x.get('artifacts',[]) if not y.get('expired')]
          if not runs:
              # Never silently restart an established archive after retention expiry.
              h=json.loads(subprocess.check_output(['gh','api','-X','GET',
                  f'repos/{repo}/actions/workflows/stage65c-puntersedge-recovery.yml/runs',
                  '-f','per_page=10'],text=True))
              previous=[r for r in h.get('workflow_runs',[])
                  if str(r.get('id'))!=os.environ.get('GITHUB_RUN_ID')]
              if any(r.get('conclusion')=='success' for r in previous):
                  raise SystemExit('A completed Stage65C run exists but archive artifact is unavailable. '
                      'STOP: restore prior backup rather than losing history.')
              print('First Stage65C run: creating a new research archive')
              sys.exit(0)
          a=max(runs,key=lambda x:x['created_at'])
          rid=a['workflow_run']['id']
          print('Restoring existing Stage65C archive from run',rid)
          subprocess.run(['gh','run','download',str(rid),'--repo',repo,
              '--name','stage65c-ukie-form-archive','--dir','reports/stage65c'],check=True)
          f=pathlib.Path('reports/stage65c/form_archive.sqlite')
          if not f.exists() or f.stat().st_size<4096:
              raise SystemExit('Previous archive not restored; refuse to start from empty database')
          con=sqlite3.connect('file:'+str(f.resolve())+'?mode=ro',uri=True)
          valid=con.execute('PRAGMA quick_check').fetchone()[0]=='ok'
          tables={r[0] for r in con.execute('SELECT name FROM sqlite_master WHERE type="table"')}
          con.close()
          if not valid or not {'races','runners','closing_prices','api_day_audit'}.issubset(tables):
              raise SystemExit('Restored archive invalid; refusing to overwrite it')
          print('Prior database restored; archival continuity preserved')
          PY
      - name: Backfill GB/IE results and full price archive
        run: |
          set -euo pipefail
          args=(--since "$FROM_DATE" --include-prices "$INCLUDE_PRICES" --max-requests "$MAX_REQUESTS")
          if [ -n "$UNTIL_DATE" ]; then args+=(--until "$UNTIL_DATE"); fi
          python -u scripts/stage65c_puntersedge_recovery.py "${args[@]}"
      - name: Upload updated archive and coverage even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage65c-ukie-form-archive
          path: reports/stage65c/
          retention-days: 90
          if-no-files-found: warn
