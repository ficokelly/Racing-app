name: "Stage140 - 2026 backtest Stage137 + HPR v3.1 inside Ability"
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage140-d137-hpr-ability-2026
  cancel-in-progress: false
jobs:
  historical-2026:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      DB: reports/stage140/source/stage2/historical_ukie_staging.sqlite
      REF: reports/stage140/source/stage4/all_races_with_reference_event_ids.csv
      ARCHIVE137: reports/stage140/source/stage137/stage137-quarterly-predictions.csv.gz
      OUT: reports/stage140/research
    steps:
      - name: Checkout unchanged Stage137 Stage139 HPR and 2026-only research code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical and machine learning packages
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 \
            scikit-learn==1.6.1 joblib==1.4.2
      - name: Validate exact Ability HPR treatment and immutable source code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/stage140_d137_hpr_ability_2026.py \
            scripts/stage139_hpr_137_138_walkforward.py \
            scripts/stage138_integrated_eight_pillars.py \
            scripts/stage137_frozen_d_race_type_walkforward.py \
            scripts/stage30_gap_aware_abcd.py \
            scripts/stage86_hpr_engine.py \
            scripts/stage134c_full_field_hpr_replay.py \
            scripts/stage133_class_taxonomy_hpr_replay.py
          python scripts/stage140_d137_hpr_ability_2026.py self-test
          python scripts/stage139_hpr_137_138_walkforward.py self-test
          python scripts/stage137_frozen_d_race_type_walkforward.py self-test
          test -s reports/stage30/stage30-summary.json
      - name: Restore immutable source archive and Stage137 original picks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/stage140/source/{stage2,stage4,stage137} "$OUT"
          gh run download 43089770857 --repo "$GITHUB_REPOSITORY" \
            --name stage2-historical-staging-database \
            --dir reports/stage140/source/stage2
          gh run download 43089770857 --repo "$GITHUB_REPOSITORY" \
            --name stage4-reference-named-events-and-winners \
            --dir reports/stage140/source/stage4
          gh run download 43756586012 --repo "$GITHUB_REPOSITORY" \
            --name stage137-frozen-d-specialist-nlp-43756586012 \
            --dir reports/stage140/source/stage137
          test -s "$DB" && test -s "$REF" && test -s "$ARCHIVE137"
          python - <<'PY'
          import os,sqlite3,csv,gzip
          cx=sqlite3.connect('file:'+os.path.abspath(os.environ['DB'])+'?mode=ro',uri=True)
          try:
            assert cx.execute('PRAGMA quick_check').fetchone()[0]=='ok'
            earliest,latest=cx.execute('SELECT MIN(race_date),MAX(race_date) FROM historical_races').fetchone()
            count=cx.execute("SELECT COUNT(*) FROM historical_races WHERE race_date BETWEEN '2026-01-01' AND '2026-11-14'").fetchone()[0]
            assert earliest<='1990-01-01' and latest>='2026-09-30' and count>=1000,(earliest,latest,count)
            print('Source dates',earliest,latest,'2026 archive races',count)
          finally:cx.close()
          with gzip.open(os.environ['ARCHIVE137'],'rt',newline='') as f:
            n=sum(1 for x in csv.DictReader(f) if x['period']=='2025Q4' and x['model']=='D_RACETYPE_NLP')
          assert n>=3000,n
          print('Stage137 immutable 2025Q4 regression reference',n,'races')
          PY
      - name: Reconstruct full-history HPR and replay all verified 2026 quarters
        run: |
          set -euo pipefail
          python -u scripts/stage140_d137_hpr_ability_2026.py walkforward \
            --db "$DB" --reference "$REF" --stage137 "$ARCHIVE137" --out "$OUT"
          python - <<'PY'
          import os,json,pathlib
          out=pathlib.Path(os.environ['OUT'])
          z=json.loads((out/'stage140-2026-summary.json').read_text())
          assert z['status']=='RESEARCH_ONLY_2026_HISTORICAL_REPLAY'
          assert z['baseline_guard']['2025_q4_baseline_exact_match']
          assert z['frozen_D_unchanged'] and z['Stage137_unchanged'] and not z['live_app_modified']
          assert z['hpr_history_earliest']<='1990-01-01'
          assert len(z['model_names'])==2 and len(z['folds'])>=3
          assert all(x['races']>1000 for x in z['overall'].values())
          for file in ('stage140-2026-rank1-rank2.csv.gz', 'stage140-2026-full-runners.csv.gz',
                       'stage140-2026-period-racetype.csv', 'stage140-2026-summary.json'):
            assert (out/file).stat().st_size>1000,file
          print('Stage140 2026 completed; all exact-match and chronology assertions passed')
          PY
      - name: Publish evidence, 2026 by-quarter results and missing SP warning
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os,pathlib,json,csv
          p=pathlib.Path(os.environ['OUT']);f=p/'stage140-2026-summary.json'
          print('# Stage140 — 2026 D137 + HPR in Ability')
          print('**Historical research only. No live app, HPR store or production model changed.**')
          if not f.exists():
            print('Incomplete run — no 2026 performance claimed. Read failed step.');raise SystemExit(0)
          z=json.loads(f.read_text());a=z['source_date_audit'];b=z['baseline_guard']
          print('Archive available through:',a['archive_last_date'])
          print('2026 selections evaluated through:',a['evaluation_last_date'])
          print('2025Q4 exact baseline regression:',b['2025_q4_baseline_exact_match'])
          print('\n| Model | Races | Winners | SR % | Price coverage % | Historical SP ROI % |')
          print('|---|---:|---:|---:|---:|---:|')
          for m,v in z['overall'].items():
            print('|',m,'|',v['races'],'|',v['rank1_winners'],'|',v['strike_pct'],'|',v['price_coverage_pct'],'|',v['sp_roi_pct'],'|')
          print('\n**WARNING:** SP ROI is computed only for races with valid archived starting prices. Do not read missing prices as losses or claim a full-cohort ROI if coverage is low.')
          file=p/'stage140-2026-period-racetype.csv'
          if file.exists():
            rows=list(csv.DictReader(file.open()))
            for typ in ('QUARTER','BROAD','DISCIPLINE','RACE_TYPE','MONTH'):
              print('\n##',typ)
              print('| Model | Group | Races | Winners | Strike % | SP coverage % | SP ROI % |')
              print('|---|---|---:|---:|---:|---:|---:|')
              for r in rows:
                if r['breakdown']==typ and (typ!='RACE_TYPE' or int(r['races'])>=40):
                  print('|',r['model'],'|',r['group'],'|',r['races'],'|',r['rank1_winners'],'|',r['strike_pct'],'|',r['price_coverage_pct'],'|',r['sp_roi_pct'],'|')
          print('\nResearch conceived after reviewing prior results; historical 2026 replay is not a pristine pre-registered prospective test.')
          PY
      - name: Upload full 2026 rank one rank two individual runners and HPR audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage140-2026-d137-hpr-ability-${{ github.run_id }}
          path: |
            reports/stage140/research/*.json
            reports/stage140/research/*.csv
            reports/stage140/research/*.csv.gz
          retention-days: 90
          compression-level: 6
          if-no-files-found: warn
