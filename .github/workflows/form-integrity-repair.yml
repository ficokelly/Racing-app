name: Form integrity repair and morning reconciliation
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
permissions:
  contents: write
concurrency:
  group: form-integrity-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install idempotent form integrity fixes and test
        run: |
          cat > scripts/form_coverage_guard.py <<'FORM_GUARD_PY'
          """Conservative rolling results coverage: saved cards are a floor, not an external census."""
          import datetime as dt
          import json
          from pathlib import Path
          import re


          def read(path):
              p = Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}


          def apply_guard(output, report, root=Path('.')):
              try:
                  from scripts.stage32_form_rebuild import horse_key, course_key, off_key
                  from scripts.rhp_stage70_data_coverage import is_nr
              except ModuleNotFoundError:
                  from stage32_form_rebuild import horse_key, course_key, off_key
                  from rhp_stage70_data_coverage import is_nr
              root = Path(root)
              end = dt.date.fromisoformat(output['as_of'])
              start = end - dt.timedelta(days=13)
              prior = read(root/'reports/stage32/form-rebuild-audit.json')
              ledger = prior.get('coverage_guard', {}).get('expected_races', {})
              ledger = {k:v for k,v in ledger.items() if start.isoformat() <= k.split('|')[0] <= end.isoformat()}
              # Keep known cards even when the source archive rolls forward. Only explicit
              # non-runner flags remove a declaration; absence alone is not evidence.
              for p in ('data/racecards-archive.json','data/racecards.json'):
                  for r in read(root/p).get('runners', []):
                      day = str(r.get('date') or r.get('race_time') or '')[:10]
                      co = course_key(r.get('course')); off = off_key(r.get('race_time') or r.get('off_dt'))
                      name = horse_key(r.get('horse'))
                      if not (start.isoformat() <= day <= end.isoformat() and co and off and name): continue
                      key = '|'.join((day,co,off))
                      people = ledger.setdefault(key, {})
                      people[name] = 'NR' if is_nr(r) else 'declared'
              exceptions = set()
              for e in read(root/'data/rhp-stage72-race-exceptions.json').get('races', []):
                  if e.get('source') and e.get('disposition') in ('ABANDONED','UNRUN_DUPLICATE_CARD','VOID','CANCELLED'):
                      exceptions.add('|'.join((str(e.get('day')),course_key(e.get('course')),off_key(e.get('time')))))
              byday = {}
              for i in range(14):
                  day = (start + dt.timedelta(days=i)).isoformat()
                  candidates = []
                  for race in read(root/'data/racing-results'/f'{day}.json').get('results', []):
                      if race.get('status') != 'final': continue
                      if str(race.get('date') or day)[:10] != day: continue
                      if str(race.get('region') or '').upper() not in ('','GB','IRE','IE'): continue
                      co = course_key(race.get('course')); off = off_key(race.get('off_dt') or race.get('race_time') or race.get('off'))
                      names = {horse_key(x.get('horse')) for x in race.get('runners', []) if x.get('horse')}
                      if co and off and names: candidates.append((co,off,names))
                  expected = {k:v for k,v in ledger.items() if k.startswith(day+'|') and k not in exceptions}
                  missing = []; unresolved = []; claimed = set()
                  for k, people in expected.items():
                      _,co,off = k.split('|')
                      active = {n for n,s in people.items() if s != 'NR'}
                      if not active: continue
                      exact = [j for j,(c,o,n) in enumerate(candidates) if c==co and o==off and n & active]
                      # Don't silently map two cards to the same result. Exact slots only;
                      # shifted off-times are reviewable rather than guessed.
                      if len(exact)!=1 or exact[0] in claimed:
                          missing.append(k); continue
                      j=exact[0]; claimed.add(j)
                      gap=sorted(active-candidates[j][2])
                      if gap: unresolved.append({'race':k,'declared_horses_without_result_or_withdrawal':gap})
                  byday[day]={'expected_saved_races':len(expected),'final_archive_races':len(candidates),
                              'missing_or_ambiguous_races':missing,'unresolved_declarations':unresolved,
                              'fixture_coverage_unknown':not bool(expected),
                              'unmatched_final_archive_races':len(candidates)-len(claimed)}
              for n,p in output['periods'].items():
                  lower=(end-dt.timedelta(days=int(n)-1)).isoformat()
                  selected=[v for d,v in byday.items() if d>=lower]
                  missing=sum(len(v['missing_or_ambiguous_races']) for v in selected)
                  unresolved=sum(len(x['declared_horses_without_result_or_withdrawal']) for v in selected for x in v['unresolved_declarations'])
                  unknown=sum(v['fixture_coverage_unknown'] for v in selected)
                  gaps=sum((p.get('identity_gaps') or {}).values())
                  p['coverage_complete']=False if missing or unresolved or unknown or gaps or len(p.get('dates_available',[]))<int(n) else None
                  p['coverage_note']='Partial or externally unverified UK/IE results; never a certified complete strike rate.'
                  p['coverage_guard']={'missing_or_ambiguous_races':missing,'unresolved_declarations':unresolved,'unknown_fixture_days':unknown,'identity_gaps':gaps}
              report['coverage_guard']={'expected_races':ledger,'by_day':byday,'scope':'Saved cards and dated final archive only; no independent complete fixture census. Unknown withdrawals are not counted as starters.'}
              report['status']='AUDITED_PARTIAL_COVERAGE' if output['periods']['14']['coverage_complete'] is False else 'NO_KNOWN_GAPS_EXTERNAL_COVERAGE_UNVERIFIED'
              print('FORM_COVERAGE_GUARD',json.dumps(output['periods']['14']['coverage_guard']))
          FORM_GUARD_PY
          cat > .form_repair_install.py <<'FORM_INSTALL_PY'
          from pathlib import Path
          import py_compile

          # All replacements are exact, checked and idempotent. Stop on a changed base.
          def patch(path,old,new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if new in s: return
              if s.count(old)!=1: raise RuntimeError(f'Unexpected source version in {path}; no deployment')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          patch('scripts/stage68_result_reconciler.py', '''                for runner in race['runners']:
                              prior = oldr.get(norm(runner.get('horse')))
                              if not prior:
                                  continue
          ''', '''                # FORM_REPAIR_V1: reconcile partial races only with agreeing finals.
                          incomingr = {norm(x.get('horse')): x for x in race['runners']}
                          def placing(x):
                              return str(x.get('position') or '').strip().removesuffix('.0')
                          old_winners = {n for n,x in oldr.items() if placing(x) in ('1','1=','1ST')}
                          new_winners = {n for n,x in incomingr.items() if placing(x) in ('1','1=','1ST')}
                          shared = oldr.keys() & incomingr.keys()
                          compatible = len(shared)>=2 and bool(old_winners) and old_winners==new_winners
                          compatible = compatible and len(oldr)==len(old.get('runners',[]))
                          compatible = compatible and all(not (placing(oldr[n]).isdigit() and placing(incomingr[n]).isdigit() and placing(oldr[n])!=placing(incomingr[n])) for n in shared)
                          if not compatible:
                              print('FORM_REPAIR_CONFLICT_OR_LOW_OVERLAP',loc)
                              continue
                          for runner in race['runners']:
                              name = norm(runner.get('horse'))
                              prior = oldr.get(name)
                              if not prior:
                                  old.setdefault('runners', []).append(dict(runner))
                                  oldr[name]=old['runners'][-1]
                                  update=True
                                  print('FORM_REPAIR_RECOVERED_RUNNER',loc,runner.get('horse'))
                                  continue
          ''')
          patch('collect-racing-results.py', '''    skip += len(races)

              if not races or skip >= data.get("total", 0):
                  break
          ''', '''    # FORM_REPAIR_V1: a missing total must not truncate pagination.
              skip += len(races)
              total = data.get("total")
              if not races or (isinstance(total, int) and total > 0 and skip >= total):
                  break
              if skip >= 10000:
                  raise RuntimeError("Results pagination did not terminate; refusing partial response")
          ''')
          patch('scripts/stage32_form_rebuild.py', '''    CACHE_FILE.parent.mkdir(parents=True,exist_ok=True)
          ''', '''    # FORM_REPAIR_V1: check missing races, declarations and identities on every rebuild.
              try:
                  from scripts.form_coverage_guard import apply_guard
              except ModuleNotFoundError:
                  from form_coverage_guard import apply_guard
              apply_guard(output, report)
              CACHE_FILE.parent.mkdir(parents=True,exist_ok=True)
          ''')
          patch('index.html', 'partialCoverage:availableDays<calendarDays||period.coverage_complete===false', 'partialCoverage:availableDays<calendarDays||period.coverage_complete!==true')
          patch('index.html', "const value=stat?`${stat.wins}/${stat.runs} · ${stat.pct.toFixed(1)}%`:'Form unavailable';", "const value=stat?`${stat.wins}/${stat.runs} · ${stat.pct.toFixed(1)}%${stat.partialCoverage?' · partial/unverified':''}`:'Form unavailable';")
          for p in ['collect-racing-results.py','scripts/stage68_result_reconciler.py','scripts/stage32_form_rebuild.py','scripts/form_coverage_guard.py']:
              py_compile.compile(p,doraise=True)

          # Regression test actual patched reconciler on isolated data, never production.
          import tempfile
          from scripts.stage68_result_reconciler import insert_races, read
          with tempfile.TemporaryDirectory() as temp:
              root=Path(temp)
              race={'date':'2026-11-09','course':'Aintree','off_dt':'2026-11-09T15:25:00Z','status':'final','runners':[{'horse':'A','position':1},{'horse':'B','position':2}]}
              full={**race,'runners':race['runners']+[{'horse':'C','position':3}]}
              assert insert_races(root,[race])==1
              assert insert_races(root,[full])==1
              assert len(read(root/'data/racing-results/2026-11-09.json',{})['results'][0]['runners'])==3
              assert insert_races(root,[full])==0
              conflict={**race,'runners':[{'horse':'B','position':1},{'horse':'A','position':2},{'horse':'D','position':3}]}
              assert insert_races(root,[conflict])==0
          print('FORM_REPAIR: source anchors, compilation and isolated reconciliation test passed')
          FORM_INSTALL_PY
          python .form_repair_install.py
          rm .form_repair_install.py
      - name: Refresh rolling late-results fallback and reconcile dated archive
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
        run: |
          # Morning repair deliberately relies on the rolling fallback for yesterday.
          # Today's free endpoint is not a historical endpoint. Keep archived data.
          python collect-puntersedge-results.py
          python - <<'PY_RECOVER'
          from pathlib import Path
          from scripts.stage68_result_reconciler import insert_races, read, verified
          from scripts.rhp_stage71_result_recovery import recover
          root = Path('.')
          feed = read(root/'data/race-results.json', {})
          print('Recovered result dates:', insert_races(root, [r for r in feed.get('races', []) if verified(r)]))
          print('Recovered final statuses:', recover(root, apply=True)['newly_validated'])
          PY_RECOVER
      - name: Rebuild strike rates through yesterday (no same-day partial form)
        run: |
          DAY=$(python -c 'from datetime import datetime,timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("Europe/Dublin")).date()-timedelta(days=1)).isoformat())')
          python calculate-strike-rates.py --as-of "$DAY" --no-wrapper
      - name: Publish guarded source fixes, recovered results and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collect-racing-results.py scripts/stage68_result_reconciler.py scripts/stage32_form_rebuild.py scripts/form_coverage_guard.py index.html data/racing-results/ data/race-results.json data/strike-rates.json data/form-identity-cache.json reports/stage32/form-rebuild-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Form integrity: reconcile verified missing runners and publish rolling coverage audit'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
      - name: Report unresolved coverage (never mark partial data complete)
        run: |
          python - <<'PY_AUDIT'
          import json
          from pathlib import Path
          x=json.loads(Path('data/strike-rates.json').read_text())['periods']['14']
          print(json.dumps(x['coverage_guard'],indent=2))
          if x['coverage_complete'] is not True:
              print('::warning::Strike rates are partial or externally unverified; inspect reports/stage32/form-rebuild-audit.json')
          PY_AUDIT
