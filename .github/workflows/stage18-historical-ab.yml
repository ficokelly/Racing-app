      - name: Download existing historical database and named-race mapping
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'STAGE18_DOWNLOAD'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          required={'stage2-historical-staging-database':('stage18_sources/stage2','STAGE18_DB','*.sqlite'),
                    'stage4-reference-named-events-and-winners':('stage18_sources/stage4','STAGE18_MAP','all_races_with_reference_event_ids.csv')}
          found={}
          for page in range(1,15):
           raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts','-f','per_page=100','-f',f'page={page}'],text=True)
           batch=json.loads(raw).get('artifacts',[])
           for a in batch:
            if a.get('expired') or a.get('name') not in required:continue
            if a['name'] not in found or a['created_at']>found[a['name']]['created_at']:found[a['name']]=a
           if len(found)==len(required) or len(batch)<100:break
          for name,(folder,env,pattern) in required.items():
           a=found.get(name)
           if not a:raise SystemExit('Required historic input missing: '+name+'. Run its Stage2/Stage4 workflow first.')
           Path(folder).mkdir(parents=True,exist_ok=True)
           print('Downloading',name,'from',a['workflow_run']['id'],flush=True)
           subprocess.run(['gh','run','download',str(a['workflow_run']['id']),'--repo',repo,'--name',name,'--dir',folder],check=True)
           matches=list(Path(folder).rglob(pattern))
           if not matches:raise SystemExit('Missing '+pattern+' inside '+name)
           p=max(matches,key=lambda x:x.stat().st_size).resolve()
           with open(os.environ['GITHUB_ENV'],'a') as f:print(f'{env}={p}',file=f)
           print(env,'size',p.stat().st_size,flush=True)
          STAGE18_DOWNLOAD
      - name: Repair historical result gap and match canonical pedigrees before Model B training
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage24_history_integrity.py self-test
          python scripts/stage24_history_integrity.py prepare --db "$STAGE18_DB" --repo . --strict
          python - <<'SAVE_OLD_B'
          from pathlib import Path
          import shutil
          x=Path('data/strategy-model-b-historical.json')
          if x.exists():shutil.copyfile(x,'data/strategy-model-b-pre-stage24.json')
          SAVE_OLD_B
      - name: Train independent Model B and calculate A versus B 2025 SP ROI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage18_audit data
          python -u scripts/stage18_historical_ab.py \
            --db "$STAGE18_DB" --mapping "$STAGE18_MAP" \
            --model-a data/strategy-historical-model.json \
            --out stage18_audit/strategy-ab-historical-roi-full.json \
            --model-b-out data/strategy-model-b-historical.json --mod 20
          python - <<'STAGE18_VERIFY'
          import json
          from pathlib import Path
          p=Path('stage18_audit/strategy-ab-historical-roi-full.json');x=json.loads(p.read_text())
          assert x['retrospective_evaluable_matched_races'] >= 150
          assert x['diagnostic']['A_B_same_race_count']==x['retrospective_evaluable_matched_races']
          a=x['model_a_top_ranked_each_matched_race'];b=x['model_b_top_ranked_each_matched_race']
          assert a['races']==b['races']
          for key in ('model_a_top_ranked_each_matched_race','model_b_top_ranked_each_matched_race',
                      'model_a_conditional_selection_policy','model_b_conditional_selection_policy'):
           q=x[key]
           assert q['priced_bets']<=q['races']
           assert q['sp_roi_pct'] is None or -100 <= q['sp_roi_pct'] < 10000
          # The app needs only the honest summary, not 1000 individual predictions.
          public={k:v for k,v in x.items() if k!='predictions'}
          Path('data/strategy-ab-historical-roi.json').write_text(json.dumps(public,indent=2,sort_keys=True)+'\n')
          print('A/B paired 2025 test:',x['retrospective_evaluable_matched_races'])
          for key in ('model_a_top_ranked_each_matched_race','model_b_top_ranked_each_matched_race',
                      'model_a_conditional_selection_policy','model_b_conditional_selection_policy'):
           q=x[key];print(key,'bets',q['priced_bets'],'wins',q['wins'],'ROI%',q['sp_roi_pct'])
          STAGE18_VERIFY
      - name: Publish independently tested historical A/B summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strategy-model-b-historical.json data/strategy-ab-historical-roi.json
          if test -f data/strategy-model-b-pre-stage24.json; then git add data/strategy-model-b-pre-stage24.json; fi
          git add data/history-integrity-audit.json
          if git diff --cached --quiet; then echo 'Historical report already current';exit 0;fi
          git commit -m 'Publish held-out 2025 Model A/B SP ROI and historical Model B'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo 'Historical A/B results published';exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo 'Cannot publish historical report due to concurrent GitHub writes' >&2
          exit 1
      - name: Upload auditable historical A/B predictions and ROI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage18-historical-ab-roi-audit
          path: |
            stage18_audit/strategy-ab-historical-roi-full.json
            data/strategy-ab-historical-roi.json
            data/strategy-model-b-historical.json
          retention-days: 30
          if-no-files-found: warn
