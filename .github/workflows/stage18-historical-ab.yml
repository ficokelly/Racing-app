name: Stage 18 - Historical A/B Training and SP ROI

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stage18-historical-ab
  cancel-in-progress: false

jobs:
  train-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out Racing Hot Pots
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical model dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
