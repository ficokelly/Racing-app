name: Stage 16 - Historical Model Bootstrap and External Research

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 0'

permissions:
  contents: write
  actions: read

concurrency:
  group: stage16-training-bootstrap
  cancel-in-progress: false

jobs:
  validate-historical-model:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install statistics tools
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn==1.6.1
      - name: Load research-only historical trainer and external methodology scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/stage16_history_model.py
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/stage16_external_research.py
          python -m py_compile scripts/stage16_history_model.py scripts/stage16_external_research.py
      - name: Retrieve full existing Stage 2 history artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'STAGE16_FETCH'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          found=None
          for page in range(1,12):
           raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts','-f','per_page=100','-f',f'page={page}'],text=True)
           arr=json.loads(raw).get('artifacts',[])
           for item in arr:
            if item.get('name')=='stage2-historical-staging-database' and not item.get('expired'):
             if found is None or item['created_at']>found['created_at']:found=item
           if found or len(arr)<100:break
          if not found:raise SystemExit('Stage2 historical artifact missing. Re-run historical import before bootstrap.')
          Path('stage16_history_source').mkdir(exist_ok=True)
          subprocess.run(['gh','run','download',str(found['workflow_run']['id']),'--repo',repo,'--name',found['name'],'--dir','stage16_history_source'],check=True)
          matches=list(Path('stage16_history_source').rglob('*.sqlite'))
          if not matches:raise SystemExit('Artifact does not contain historical SQLite file')
          db=max(matches,key=lambda p:p.stat().st_size).resolve()
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE16_DB='+str(db),file=f)
          print('Historical SQLite size bytes:',db.stat().st_size)
          STAGE16_FETCH
      - name: Train point-in-time model and test later untouched years
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          mkdir -p data
          python scripts/stage16_history_model.py --db "$STAGE16_DB" \
            --mod 20 --out data/strategy-historical-model-candidate.json
          python - <<'STAGE16_PROMOTE'
          import json,shutil
          from pathlib import Path
          candidate=json.loads(Path('data/strategy-historical-model-candidate.json').read_text())
          if candidate['state']=='VALIDATED':
           shutil.copyfile('data/strategy-historical-model-candidate.json','data/strategy-historical-model.json')
           print('Model validated: independent test',candidate['independent_test'])
          else:
           print('Candidate model NOT PROMOTED; preserve existing deployed model.')
          STAGE16_PROMOTE
      - name: Review external methodology separately from predictions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage16_external_research.py --model data/strategy-historical-model-candidate.json \
            --out data/strategy-external-research.json
      - name: Publish trained model, external study audit and hypothesis tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strategy-historical-model-candidate.json data/strategy-external-research.json
          if [ -f data/strategy-historical-model.json ]; then git add data/strategy-historical-model.json; fi
          if git diff --cached --quiet; then echo 'No changes to publish.'; exit 0; fi
          git commit -m 'Validate chronological race probabilities and external methodology hypotheses'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort || true
            sleep $((4*attempt))
          done
          exit 1
      - name: Upload bootstrap validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage16-historical-model-validation
          path: |
            data/strategy-historical-model-candidate.json
            data/strategy-external-research.json
          retention-days: 21
          if-no-files-found: warn
