      - name: Price-check every active race and lock forward paper observations
        env:
          TARGET_DAY: ${{ inputs.day }}
        run: |
          set -euo pipefail
          test -s data/racecards.json
          test -s data/latest-odds.json
          test -s data/strategy-d-probabilities.json
          if [ -n "$TARGET_DAY" ]; then
            python scripts/stage40_price_value.py run --day "$TARGET_DAY"
          else
            python scripts/stage40_price_value.py run
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('data')
          o=json.loads((d/'value-opportunities.json').read_text(encoding='utf-8'))
          p=json.loads((d/'value-paper-history.json').read_text(encoding='utf-8'))
          h=json.loads((d/'value-forecast-history.json').read_text(encoding='utf-8'))
          assert o['state']=='RESEARCH_ONLY_CALIBRATION_UNVALIDATED'
          assert o['my_bets_and_pnl_modified'] is False and o['stage34_z_weights_modified'] is False
          assert o['real_bets_placed']==0
          assert all(x.get('paper_only') and x.get('no_bet_placed') for x in p.get('selections',[]))
          assert all(x.get('record_type')=='FORECAST_NOT_A_BET' for x in h.get('observations',[]))
          assert len(o['races'])==len({(r['date'],r['course'],r['time']) for r in o['races']})
          print('Stage40 verified:',len(o['races']),'races,',
                sum(len(r.get('paper_candidates',[])) for r in o['races']),'paper watch possibilities,',
                len(p.get('selections',[])),'immutable paper entries')
          PY

      - name: Add Price Research navigation to existing app (idempotent)
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          nav='<a class="model-z-nav" href="./price-aware.html" aria-label="Price-aware paper value research">💶 Value · Paper</a>'
          if nav not in s:
              needle='<a class="model-z-nav" href="./model-z.html" aria-label="Model Z paper portfolio">🧪 Model Z · Paper</a>'
              if s.count(needle)!=1:raise SystemExit('App navigation changed; refusing unsafe Stage40 insertion')
              s=s.replace(needle,needle+nav,1)
          for view,anchor in (('selections','<div class="rhp-strategy-items" id="strategy-selection-list"'),
                              ('results','<div id="strategy-results-list" class="rhp-strategy-items"')):
              token='data-stage40-paper="'+view+'"'
              if token in s:continue
              if s.count(anchor)!=1:raise SystemExit('App '+view+' anchor changed; refusing unsafe insertion')
              note='<p '+token+' class="hint" style="margin:8px 0 14px"><a href="./price-aware.html">💶 View price-aware paper research</a> · Independent model rankings stay separate from value screens and real bets.</p>'
              s=s.replace(anchor,note+anchor,1)
          p.write_text(s,encoding='utf-8')
          assert s.count('href="./price-aware.html"')==3
          print('App menu, Strategy Selections and Strategy Results linked to Stage40')
          PY
          python - <<'PY'
          import re,pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          assert scripts
          pathlib.Path('/tmp/stage40-current-app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/stage40-current-app.js

      - name: Publish only value research outputs, without touching A B C D Z models
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stage40_price_value.py price-aware.html index.html \
            data/value-opportunities.json data/value-paper-history.json data/value-forecast-history.json
          if git diff --cached --quiet; then
            echo 'No research updates since previous run.'
            exit 0
          fi
          # Fail safely instead of pulling with uncommitted non-research changes.
          if ! git diff --quiet; then
            echo 'Other tracked files changed locally; refusing to rewrite them.' >&2
            git status --short
            exit 1
          fi
          git commit -m 'Stage40: price-aware preoff paper value research and immutable observations'
          for n in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Published https://ficokelly.github.io/Racing-app/price-aware.html'
              exit 0
            fi
            git rebase --abort || true
            sleep $((3*n))
          done
          echo 'Publication failed, see Stage40 action artifact for research results.' >&2
          exit 1

      - name: Preserve value observations if push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage40-price-aware-paper-research
          path: |
            data/value-opportunities.json
            data/value-paper-history.json
            data/value-forecast-history.json
            price-aware.html
          retention-days: 21
          if-no-files-found: warn
