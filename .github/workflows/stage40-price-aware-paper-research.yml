name: Stage 40 - Price Aware Value Research and Paper Tracking

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Optional Ireland local date YYYY-MM-DD (blank = today)"
        required: false
        type: string
  schedule:
    # Capture a pre-race price snapshot after routine 5-minute odds collections.
    - cron: "12,27,42,57 9-21 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: stage40-price-aware-paper-research
  cancel-in-progress: false

jobs:
  update-paper-value:
    runs-on: ubuntu-latest
    timeout-minutes: 15
