name: Stage196F — Validate combined selections
on:
  workflow_dispatch:
    inputs:
      selection_date:
        description: Dublin date (today or tomorrow), YYYY-MM-DD
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: stage196f-combined-candidate
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONPATH: .:scripts
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoring dependencies
        run: pip install numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 scikit-learn==1.6.1 joblib==1.4.2 freezegun==1.5.5 requests 'kagglehub>=0.3,<1'
      - name: Validate date and refresh declarations
        env:
          REQUESTED_DATE: ${{ inputs.selection_date }}
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          set -euo pipefail
          today="$(TZ=Europe/Dublin date +%F)"
          tomorrow="$(TZ=Europe/Dublin date -d tomorrow +%F)"
          target="${REQUESTED_DATE:-$today}"
          [[ "$target" == "$today" || "$target" == "$tomorrow" ]]
          echo "TARGET_DAY=$target" >> "$GITHUB_ENV"
          if [[ -n "$RACING_API_USERNAME" && -n "$RACING_API_PASSWORD" ]]; then
            python collect-racecards.py
          fi
      - name: Install verified Stage204C HPR integration (27 November only)
        if: ${{ env.TARGET_DAY == '2026-11-27' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('scripts/stage196f_combined_candidate.py')
          raw = p.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert actual == '5ca6bd07df13330d307a4ecfaddb039ac258f543', ('Scoring source changed; revalidate integration', actual)
          source = raw.decode('utf-8')
          anchor = '# Freeze model source and root imports to original replay commit, while retaining current validated data and Git history.'
          assert source.count(anchor) == 1 and "stage204c_hpr_overlay" not in source, 'Unexpected source structure'
          insertion = """# Stage204C: use the validated HPR candidate for this selection date only.
          # The live ledger and the frozen model formulas remain unchanged.
          if not REPLAY and DAY=='2026-11-27':
           from stage86_hpr_engine import save_ratings, VERSION
           from stage87_hpr_storage import FIELDS
           hpr_run=45912501511
           hpr_head='c043d3f50b30d794fa40250a2ad08e773941dbc0'
           runmeta=json.loads(S.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+str(hpr_run)],text=True,timeout=60))
           assert runmeta['conclusion']=='success' and runmeta['head_sha']==hpr_head and runmeta['head_branch']=='main' and runmeta['path']=='.github/workflows/stage204c-hpr-shared-history.yml','Unverified HPR run'
           assert not git('diff','--name-only',hpr_head,'HEAD','--','data/hpr/shards').strip(),'HPR base changed since validation; regenerate candidate'
           dest=W/'stage204c-validated'
           download(hpr_run,'stage204c-hpr-shared-history-'+str(hpr_run),dest)
           summary_path=exactly(dest,'summary.json'); delta_path=exactly(dest,'candidate-hpr-revisions.json')
           assert digest(summary_path)=='919eed059a7dae17f9628e533f07b4df20a4d54698f8996290ff16305a358688','Unexpected HPR summary checksum'
           assert digest(delta_path)=='b6a165f520b12ad40d092dcec6dade209a7d8e1712718fc054d0d6faa9aa7825','Unexpected HPR delta checksum'
           hs=json.loads(summary_path.read_text()); revisions=json.loads(delta_path.read_text())
           assert hs['target']==DAY and hs['status']=='CANDIDATE_VALIDATED_NOT_DEPLOYED' and hs['legacy_hpr_formula_unchanged']==VERSION
           assert hs['original_revisions_preserved'] and hs['second_save_idempotent'] and hs['embedded_database']['copy_integrity']=='PASS'
           assert len(revisions)==1490 and len({(x['horse_key'],x['race_key'],x['model_version']) for x in revisions})==len(revisions)
           assert all(x['date']<DAY and x['model_version']==VERSION and 0<=x['hpr']<=100 and x['source']=='shared_verified_history_stage204c' and x['source_race_id'] for x in revisions)
           with sqlite3.connect(db) as hc_history:
            for rid,day in sorted({(x['source_race_id'],x['date']) for x in revisions}):
             assert hc_history.execute('SELECT 1 FROM historical_races WHERE id=? AND race_date=?',(rid,day)).fetchone(),('HPR source race missing',rid)
           hpr_before=W/'hpr-pre-stage204c.sqlite'
           shutil.copy2(hpr,hpr_before)
           with sqlite3.connect(hpr) as hc:
            assert hc.execute('SELECT COUNT(*) FROM hpr_ratings').fetchone()[0]==hs['original_hpr_rows']
            assert dict(hc.execute('SELECT model_version,COUNT(*) FROM hpr_ratings GROUP BY model_version'))==hs['original_versions']
            counts=save_ratings(hc,revisions)
            assert counts==hs['rating_changes'],('HPR delta replay differs',counts)
            assert hc.execute('SELECT COUNT(*) FROM hpr_ratings').fetchone()[0]==hs['candidate_hpr_rows']
            hc.execute('ATTACH DATABASE ? AS old',(str(hpr_before.resolve()),))
            assert not hc.execute(f'SELECT {FIELDS} FROM old.hpr_ratings EXCEPT SELECT {FIELDS} FROM main.hpr_ratings LIMIT 1').fetchone(),'Original HPR revisions changed'
            hc.execute('DETACH DATABASE old')
            assert save_ratings(hc,revisions)=={'unchanged':len(revisions)},'HPR overlay not idempotent'
            assert hc.execute('PRAGMA quick_check').fetchone()[0]=='ok'
            assert not hc.execute('SELECT 1 FROM hpr_ratings WHERE race_date>=? LIMIT 1',(DAY,)).fetchone(),'Future HPR leakage'
           hpr_before.unlink()
           audit['stage204c_hpr_overlay']={'run_id':hpr_run,'artifact_id':15161232567,'source_commit':hpr_head,'delta_sha256':digest(delta_path),'changes':counts,'candidate_rows':hs['candidate_hpr_rows'],'production_ledger_changed':False}
           dump(O/'audit.json',audit)
           print('STAGE204C_HPR_OVERLAY',json.dumps(audit['stage204c_hpr_overlay']),flush=True)
          """
          compile(insertion, 'stage204c_hpr_overlay', 'exec')
          merged = source.replace(anchor, insertion + anchor, 1)
          # Rebuild history from the exact data snapshot used to create the HPR artifact.
          # A later archive refresh can contain the same race under a different identifier.
          # Restore the live checkout immediately after building the historical DB, keeping fresh cards.
          old_build = "History.build=capture\ntry:"
          assert merged.count(old_build)==1
          pinned_build = """# Stage196F: pin historical inputs to Stage204C source commit, not a later archive.
          _history_pin='c043d3f50b30d794fa40250a2ad08e773941dbc0'
          _live_cards=ROOT/'data/racecards.json'
          _live_card_bytes=_live_cards.read_bytes()
          # This is a read-only Actions workspace. Refuse changes to history-builder code.
          assert not git('diff','--name-only',_history_pin,'HEAD','--','scripts').strip(),'Historical builder source changed; revalidate snapshot'
          S.run(['git','restore','--source',_history_pin,'--worktree','--','data'],check=True,timeout=600)
          audit['history_data_snapshot_commit']=_history_pin
          print('STAGE196F_HISTORY_SNAPSHOT',_history_pin,flush=True)
          History.build=capture
          try:"""
          merged=merged.replace(old_build,pinned_build,1)
          end_build="finally:History.build=original_build"
          assert merged.count(end_build)==1
          restore_build="""finally:
           History.build=original_build
           S.run(['git','restore','--source','HEAD','--worktree','--','data'],check=True,timeout=600)
           _live_cards.write_bytes(_live_card_bytes)
           assert _live_cards.read_bytes()==_live_card_bytes,'Fresh declarations not restored'
          """
          merged=merged.replace(end_build,restore_build,1)
          # Construct one whole-race eligibility manifest from the fresh declarations before form audit.
          preflight = "pre=json.loads((ROOT/'data/racecards.json').read_text());active=[r for r in pre['runners'] if r.get('date')==DAY and active_runner(r)]"
          assert merged.count(preflight)==1
          scope = """pre=json.loads((ROOT/'data/racecards.json').read_text());active=[r for r in pre['runners'] if r.get('date')==DAY and active_runner(r)]
          if not REPLAY and DAY=='2026-11-27':
           _cutoff=NOW()+dt.timedelta(minutes=10)
           _settlement={'position','finish_pos','result','outcome','sp','sp_decimal','starting_price','beaten','race_result','result_status','overall_beaten','distance_beaten_total'}
           _closed={'finished','resulted','final','completed','abandoned','cancelled','canceled','void'}
           _groups=C.defaultdict(list)
           for r in active:
            assert r.get('race_time') and r.get('course') and r.get('race_id') and r.get('horse'),'Incomplete declaration identity'
            _groups[cardkey(r)].append(r)
           _validated_fields={};_excluded=[]
           for k,v in sorted(_groups.items()):
            assert len({r['race_id'] for r in v})==1 and len({stamp(r['race_time']) for r in v})==1,('Conflicting race identity',k)
            reason=None
            if stamp(v[0]['race_time'])<=_cutoff:reason='OFF_OR_IMMINENT_AT_PREFLIGHT'
            elif any(norm(r.get('race_status')) in _closed for r in v):reason='CLOSED_RACE'
            elif any(r.get(f) not in (None,'',[],{}) for r in v for f in _settlement):reason='SETTLEMENT_PRESENT_IN_FIELD'
            elif len(v)<2:reason='FEWER_THAN_TWO_ACTIVE_RUNNERS'
            else:
             assert len({horse(r['horse']) for r in v})==len(v),('Duplicate declared horse',k)
             _validated_fields[k]=v
            if reason:_excluded.append(dict(race=list(k),race_id=v[0]['race_id'],runners=len(v),reason=reason))
           active=[r for v in _validated_fields.values() for r in v]
           _preflight_card_sha=digest(ROOT/'data/racecards.json')
           _validated_ids={k:sorted((r['race_id'],r['horse_id']) for r in v) for k,v in _validated_fields.items()}
           dump(O/'preflight-excluded-races.json',_excluded)
           dump(O/'preflight-field-manifest.json',dict(cutoff=_cutoff.isoformat(),cards_sha256=_preflight_card_sha,fields=[dict(race=list(k),runner_ids=v) for k,v in _validated_ids.items()]))
           assert _validated_fields,'No eligible upcoming fields at preflight'
          """
          merged=merged.replace(preflight,scope,1)
          # The later scoring stage must consume exactly that validated manifest, not independently select a different universe.
          old_fields="""for r in cards.get('runners',[]):
           if str(r.get('date'))!=DAY or not r.get('race_time') or not r.get('horse') or not active_runner(r):continue
           if norm(r.get('race_status')) in {'finished','resulted','final','completed','abandoned','cancelled','canceled','void'}:continue
           if any(r.get(k) not in (None,'',[],{}) for k in outcome):continue
           if stamp(r['race_time'])<=NOW()+dt.timedelta(minutes=2):continue
           fields[cardkey(r)].append({k:v for k,v in r.items() if k not in outcome|prices})
          fields={k:v for k,v in fields.items() if len(v)>=2 and len({horse(r['horse']) for r in v})==len(v)};assert fields,'No verified remaining fields'"""
          assert merged.count(old_fields)==1
          new_fields="""if not REPLAY and DAY=='2026-11-27':
           assert digest(ROOT/'data/racecards.json')==_preflight_card_sha,'Declarations changed between preflight and scoring'
           assert sum(map(len,_validated_fields.values()))==preaudit['active'] and len(_validated_fields)==preaudit['races'],'Preflight manifest totals inconsistent'
           _score_cutoff=NOW()+dt.timedelta(minutes=2)
           _expired_before_scoring={k for k,v in _validated_fields.items() if stamp(v[0]['race_time'])<=_score_cutoff}
           fields={k:[{a:b for a,b in r.items() if a not in outcome|prices} for r in v] for k,v in _validated_fields.items() if k not in _expired_before_scoring}
           _expected_scoring_ids={k:v for k,v in _validated_ids.items() if k not in _expired_before_scoring}
           assert {k:sorted((r['race_id'],r['horse_id']) for r in v) for k,v in fields.items()}==_expected_scoring_ids,'Preflight/score identity mismatch'
           assert fields,'No verified remaining fields'
           audit['field_reconciliation']=dict(preflight_fields=len(_validated_fields),preflight_runners=preaudit['active'],scoring_fields=len(fields),scoring_runners=sum(map(len,fields.values())),expired_before_scoring=[list(k) for k in sorted(_expired_before_scoring)],same_declaration_snapshot=True)
           dump(O/'audit.json',audit)
           print('STAGE196F_FIELD_RECONCILIATION',json.dumps(audit['field_reconciliation']),flush=True)
          else:
           for r in cards.get('runners',[]):
            if str(r.get('date'))!=DAY or not r.get('race_time') or not r.get('horse') or not active_runner(r):continue
            if norm(r.get('race_status')) in {'finished','resulted','final','completed','abandoned','cancelled','canceled','void'}:continue
            if any(r.get(k) not in (None,'',[],{}) for k in outcome):continue
            if stamp(r['race_time'])<=NOW()+dt.timedelta(minutes=2):continue
            fields[cardkey(r)].append({k:v for k,v in r.items() if k not in outcome|prices})
           fields={k:v for k,v in fields.items() if len(v)>=2 and len({horse(r['horse']) for r in v})==len(v)};assert fields,'No verified remaining fields'"""
          merged=merged.replace(old_fields,new_fields,1)
          old_check="assert sum(map(len,fields.values()))==preaudit['active'] and len(fields)==preaudit['races'],'Preflight/score field mismatch'"
          assert merged.count(old_check)==1
          new_check="""if not REPLAY and DAY=='2026-11-27':
           assert {k:sorted((r['race_id'],r['horse_id']) for r in v) for k,v in fields.items()}==_expected_scoring_ids,'Preflight/score field mismatch after identity processing'
           assert (set(fields)|_expired_before_scoring)==set(_validated_fields) and not (set(fields)&_expired_before_scoring),'Unexplained field loss or addition'
          else:
           assert sum(map(len,fields.values()))==preaudit['active'] and len(fields)==preaudit['races'],'Preflight/score field mismatch'"""
          merged=merged.replace(old_check,new_check,1)
          # Keep the existing field/rank validation and fail on genuine scoring gaps.
          # Races that expire without scoring are reported separately, never presented as selections.
          final_anchor="results=checkpoint()\nby_race={(course(r['course']),r['time']):r for r in results}"
          assert merged.count(final_anchor)==1
          final_scope="""results=checkpoint()
          if not REPLAY and DAY=='2026-11-27':
           _publication_cutoff=NOW()+dt.timedelta(minutes=2)
           expired=[r for r in results if stamp(fields[(DAY,course(r['course']),r['time'])][0]['race_time'])<=_publication_cutoff]
           dump(O/'expired-before-artifact-races.json',expired)
           expired_keys={(DAY,course(r['course']),r['time']) for r in expired}
           if expired_keys:
            fields={k:v for k,v in fields.items() if k not in expired_keys}
            assert fields,'No remaining scored or eligible fields'
            audit['expired_before_artifact_fields']=len(expired_keys)
            audit['remaining_fields']=len(fields)
            results=checkpoint()
          by_race={(course(r['course']),r['time']):r for r in results}"""
          merged=merged.replace(final_anchor,final_scope,1)
          compile(merged, str(p), 'exec')
          p.write_bytes(merged.encode('utf-8'))
          print('Stage204C HPR overlay installed in temporary scoring workspace; production files unchanged.')
          PY
      - name: Validate complete pre-race selections
        run: |
          python -m py_compile scripts/stage196f_combined_candidate.py
          python -u scripts/stage196f_combined_candidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage196f-combined-candidate-${{ github.run_id }}
          path: stage196-output/
          retention-days: 30
          if-no-files-found: warn
