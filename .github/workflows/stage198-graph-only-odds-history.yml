name: Stage198 - Graph-only odds history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove raw odds lists while preserving interactive charts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          for row in ('x', 'row'):
              old = '${miniGraph(' + row + '.points)}<div class="historyline">${' + row + '.points.map(p=>`${safe(when(p.at))} — ${fmt(p.od)}`).join(\'<br>\')||\'No saved prices\'}</div>'
              new = '${miniGraph(' + row + '.points)}'
              count = s.count(old)
              if count == 1:
                  s = s.replace(old, new, 1)
              elif count == 0 and new + '</details>' in s:
                  print(f'{row}: already graph-only')
              else:
                  raise SystemExit(f'Unexpected template count for {row}: {count}')
              assert new + '</details>' in s
          s = s.replace('<summary>Price history graph &amp; details</summary>', '<summary>Price history graph</summary>')
          s = s.replace('<summary>Full odds history</summary>', '<summary>Price history graph</summary>')
          if s != original:
              p.write_text(s, encoding='utf-8')
          print('Markets and Hot Trainers: interactive charts retained; raw price lists removed.')
          PY
      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage198: show interactive odds graphs without raw price lists'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
