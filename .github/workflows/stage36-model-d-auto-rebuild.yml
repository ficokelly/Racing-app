name: Stage 36 Repair - Model D All vs Best Chance (Auto-Rebuild Archive)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stage36-model-d-auto-rebuild
  cancel-in-progress: false

jobs:
  model-d-all-races-and-best-chance:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout independent Model D files
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audited dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1

      - name: Verify full-race and best-chance research self-tests
        run: |
          set -euo pipefail
          test -s scripts/stage30_gap_aware_abcd.py
          test -s scripts/stage35_model_d_going_5years.py
          test -s scripts/stage36_model_d_best_chance.py
          test -s scripts/stage34_model_d_course_research.py
          test -s reports/stage30/stage30-summary.json
          test -s reports/stage35/stage35-frozen-profiles.json
          python -m py_compile scripts/stage30_gap_aware_abcd.py scripts/stage35_model_d_going_5years.py scripts/stage36_model_d_best_chance.py
          python scripts/stage30_gap_aware_abcd.py --self-test
          python scripts/stage34_model_d_course_research.py --self-test
          python scripts/stage35_model_d_going_5years.py --self-test
          python scripts/stage36_model_d_best_chance.py --self-test
          python scripts/stage24_history_integrity.py self-test

      - name: Download or rebuild full historical racing database (no Betfair)
        env:
          GH_TOKEN: ${{ github.token }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];winner=None
          for page in range(1,21):
              raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts',
                                           '-f','per_page=100','-f',f'page={page}'],text=True)
              rows=json.loads(raw).get('artifacts',[])
              for r in rows:
                  if r.get('name')=='stage2-historical-staging-database' and not r.get('expired'):
                      if not winner or r.get('created_at','')>winner.get('created_at',''):winner=r
              if len(rows)<100:break
          # Stage 2 keeps its staging SQLite artifact for only three days.
          # When that expires, rebuild from its original Kaggle dataset, not from
          # an abbreviated set of recent app results. No Betfair API is needed.
          Path('stage36_db').mkdir(exist_ok=True)
          matches=[]
          if winner:
              rid=str(winner['workflow_run']['id'])
              try:
                  subprocess.run(['gh','run','download',rid,'--repo',repo,
                                  '--name',winner['name'],'--dir','stage36_db'],check=True)
                  matches=list(Path('stage36_db').rglob('*.sqlite'))
                  print('Downloaded staging archive from run:',rid,flush=True)
              except subprocess.CalledProcessError:
                  print('Historical database artifact download failed; rebuilding',flush=True)
          if matches:
              db=max(matches,key=lambda p:p.stat().st_size).resolve()
          else:
              import sys
              print('Historical database artifact expired. Rebuilding the full UK/IE archive.',flush=True)
              subprocess.run([sys.executable,'-m','pip','install',
                              '--disable-pip-version-check','kagglehub'],check=True)
              import kagglehub
              source=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025')
              db=Path('stage36_db/historical_ukie_staging.sqlite').resolve()
              subprocess.run([sys.executable,'import_historical_ukie.py',
                              '--mode','import','--input',str(source),
                              '--min-date','1988-01-01','--max-date','2026-10-07',
                              '--database',str(db),
                              '--report','stage36_db/historical_stage2_report.json'],check=True)
              subprocess.run([sys.executable,'audit_history_coverage.py',
                              '--database',str(db),'--expect-first-year','1988',
                              '--output','stage36_db/historical_annual_coverage.csv',
                              '--summary','stage36_db/historical_coverage_summary.json'],check=True)
              print('Rebuilt historical archive from original source',flush=True)
          if not db.is_file() or db.stat().st_size<10_000_000:
              raise SystemExit('No valid historical SQLite database available for Stage36')
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE36_DB='+str(db),file=f)
          print('Historical database size:',db.stat().st_size,flush=True)
          PY

      - name: Restore verified historical integrity dependencies from existing workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,json,os,pathlib,re,urllib.request,py_compile
          repo=os.environ['GITHUB_REPOSITORY']
          def workflow(name):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/contents/.github/workflows/'+name,
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=45) as response:d=json.load(response)
              return base64.b64decode(d['content']).decode('utf-8')
          src=workflow('stage18-historical-ab.yml')
          pairs=re.findall(r"pathlib\.Path\('([^']+\.py)'\)\.write_bytes\(gzip\.decompress\(base64\.b64decode\('''(.*?)'''\)\)\)",src,re.S)
          done=set()
          for file,b64 in pairs:
              p=pathlib.Path(file);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(gzip.decompress(base64.b64decode(b64)));done.add(file)
          needed={'scripts/stage16_history_model.py','scripts/stage18_historical_ab.py'}
          if not needed.issubset(done):raise SystemExit('Required integrity dependency missing: '+str(needed-done))
          src13=workflow('stage13-strategy-learning.yml')
          encoded=re.findall(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 --decode \| gzip --decompress > ([\w./-]+\.py)",src13)
          wanted={'stage12_form_analysis.py','scripts/stage16_score.py','scripts/stage16_integrate.py'}
          for b64,file in encoded:
              if file in wanted:
                  p=pathlib.Path(file);p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(gzip.decompress(base64.b64decode(b64)));done.add(file)
          for file in done:py_compile.compile(file,doraise=True)
          print('Integrity dependencies restored:',len(done))
          PY

      - name: Apply official historical archive integrity checks
        run: |
          set -euo pipefail
          python scripts/stage24_history_integrity.py prepare --db "$STAGE36_DB" --repo . --strict --assert-form
          python - <<'PY'
          import datetime,json
          from pathlib import Path
          a=json.loads(Path('data/history-integrity-audit.json').read_text())
          through=a.get('coverage_verified_through')
          if not through:raise SystemExit('Missing date of verified source coverage')
          print('Verified historical results through:',through)
          PY

      - name: Analyse all eligible races versus Model D best-chance races
        run: |
          set -euo pipefail
          python -u scripts/stage36_model_d_best_chance.py \
            --db "$STAGE36_DB" \
            --stage30-report reports/stage30/stage30-summary.json \
            --stage35-profiles reports/stage35/stage35-frozen-profiles.json \
            --output stage36_report
          python - <<'PYVALIDATE'
          import csv,json
          from pathlib import Path
          out=Path('stage36_report')
          s=json.loads((out/'stage36-summary.json').read_text())
          assert s['status']=='RESEARCH_ONLY_NOT_LIVE' and s['betfair_required'] is False
          assert s['interaction_fitting_years']==[2018,2019,2020]
          assert s['best_chance_rule_fitting_years']==[2021,2022,2023]
          assert s['comparative_validation_year']==2024 and s['audit_year']==2025
          assert all(s['races_by_year'][str(y)]>=500 for y in range(2018,2026))
          r=s['2025']
          n=s['races_by_year']['2025']
          assert r['stage36_all']['races']==r['stage35_all']['races']==r['original_D_all']['races']==n
          assert r['stage36_best_chance']['races']<=n
          assert all(k in s['2021_2025_yearly_full_vs_best_chance'] for k in map(str,range(2021,2026)))
          assert all(k in s['by_discipline_2025'] for k in ('flat','aw','jumps'))
          assert all(k in s['profile_selection'] for k in ('flat','aw','jumps'))
          assert s['course_x_distance_x_going_associations']>100
          for name in ('stage36-2025-all-races.csv','stage36-2025-best-chance.csv',
                       'stage36-2025-comparison.csv',
                       'stage36-2021-2025-yearly-comparison.csv',
                       'stage36-course-distance-going-2025.csv',
                       'stage36-pre2021-track-trip-ground-signals.csv',
                       'stage36-frozen-best-chance-rules.json'):
              assert (out/name).exists() and (out/name).stat().st_size>40,name
          with (out/'stage36-2025-all-races.csv').open() as f:
              assert sum(1 for _ in csv.DictReader(f))==n
          with (out/'stage36-2025-best-chance.csv').open() as f:
              assert sum(1 for _ in csv.DictReader(f))==r['stage36_best_chance']['races']
          print('2025 historical races',n)
          print('Original D:',r['original_D_all'],r['original_D_selected'])
          print('Stage35:   ',r['stage35_all'],r['stage35_selected'])
          print('Stage36:   ',r['stage36_all'],r['stage36_best_chance'])
          print('Scope: all races vs qualified best-chance subset. A/B/C/live D unchanged.')
          PYVALIDATE

      - name: Publish Stage 36 research only, no live model changes
        run: |
          set -euo pipefail
          mkdir -p reports/stage36
          cp stage36_report/stage36-* reports/stage36/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stage36/
          if git diff --cached --quiet; then
            echo 'Stage 36 reports already published'
            exit 0
          fi
          git commit -m 'Stage 36: full-race vs best-chance Model D research'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Stage 36 all-race/shortlist research published';exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt*3))"
          done
          echo 'Research completed, but commit push was unsuccessful; retrieve Actions artifact' >&2
          exit 1

      - name: Preserve separate reports and track weight profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage36-model-d-best-chance
          path: stage36_report/
          retention-days: 30
          if-no-files-found: warn
