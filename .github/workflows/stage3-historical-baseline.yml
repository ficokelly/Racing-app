name: Stage 3 - Historical baseline research
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve latest Stage 2 database artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,zipfile,io
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN']
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              return urllib.request.urlopen(req,timeout=120)
          arts=json.load(get(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100'))['artifacts']
          matches=[a for a in arts if not a['expired'] and ('staging' in a['name'].lower() or 'database' in a['name'].lower()) and ('historical' in a['name'].lower() or 'stage2' in a['name'].lower())]
          if not matches:raise SystemExit('No unexpired Stage 2 database artifact. Rerun Stage 2 first.')
          art=max(matches,key=lambda x:x['created_at']);print('Downloading:',art['name'],art['size_in_bytes'])
          with get(art['archive_download_url']) as response: payload=response.read()
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              sqlite_files=[i for i in z.infolist() if i.filename.endswith(('.sqlite','.db'))]
              if not sqlite_files:raise SystemExit('No SQLite file in artifact; inspect Stage 2 artifact format.')
              item=max(sqlite_files,key=lambda i:i.file_size)
              with z.open(item) as src,open('historical_stage3.sqlite','wb') as dst:
                  import shutil;shutil.copyfileobj(src,dst)
          PY
      - name: Run exploratory baseline
        run: python stage3_baseline.py --db historical_stage3.sqlite --out stage3_output
      - name: Upload small reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-baseline-reports
          path: stage3_output/
          retention-days: 14
