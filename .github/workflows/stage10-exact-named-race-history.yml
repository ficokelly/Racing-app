                      self.cx.execute('INSERT INTO historical_races VALUES(?,?,?,?,?,?,?,?)',(rid,f'{year}-11-01','Huntingdon','Chase','Jumps',16.5,'3','Good'))
                      for horse,finish,age,sp in [('Winner',1,7,3),('Loser',2,None,4),('Other',3,9,5)]:
                          self.cx.execute('INSERT INTO historical_runs VALUES(?,?,?,?,?,?,?,?,?,?,?,?)',(rid,horse,finish,'Trainer','Jockey',age,115,sp,145,1,'g','FINISHED'))
                  self.cx.commit();self.write_map()
              def tearDown(self):self.cx.close();self.t.cleanup()
              def write_map(self):
                  with open(self.mp,'w',newline='') as f:
                      w=csv.DictWriter(f,fieldnames=['stage2_race_id','race_name','course','race_type','date','event_id','match_status','edition_year']);w.writeheader();w.writerows(self.maprows)
              def test_generic_novice_not_matched(self):
                  a,_=matched_mapping(self.mp,read_cards(self.cards))
                  self.assertNotIn(('carlisle','13:13'),a)
              def test_valid_named_race_has_three_editions(self):
                  a,_=matched_mapping(self.mp,read_cards(self.cards))
                  self.assertEqual(len(a[('huntingdon','14:42')]),3)
              def test_separate_named_races_no_cross_contamination(self):
                  self.maprows.append({**self.maprows[0],'stage2_race_id':'bad','race_name':'Macer Gifford Supporters Novices Hurdle','race_type':'Hurdle','edition_year':'2000','date':'2000-11-01'})
                  self.write_map();a,_=matched_mapping(self.mp,read_cards(self.cards))
                  self.assertEqual(len(a[('huntingdon','14:42')]),3)
              def test_future_dates_not_used(self):
                  self.maprows.append({**self.maprows[0],'stage2_race_id':'future','edition_year':'2026','date':'2026-11-01'})
                  self.write_map();a,_=matched_mapping(self.mp,read_cards(self.cards))
                  self.assertEqual(len(a[('huntingdon','14:42')]),3)
              def test_ambiguous_year_excluded(self):
                  self.maprows.append({**self.maprows[0],'stage2_race_id':'ambig','race_name':'Macer Gifford Memorial Handicap Chase'})
                  self.write_map();a,rej=matched_mapping(self.mp,read_cards(self.cards))
                  self.assertEqual(len(a[('huntingdon','14:42')]),2)
                  self.assertEqual(len(rej[('huntingdon','14:42')]),1)
              def test_missing_age_is_unknown(self):
                  field=[{'age':None,'official_rating':90,'weight_lbs':140,'draw':None},{'age':7,'official_rating':95,'weight_lbs':141,'draw':None},{'age':8,'official_rating':100,'weight_lbs':142,'draw':None}]
                  self.assertFalse(any(v.startswith('AGE_') for v in flags(field[0],0,field,'chase')))
              def test_end_to_end(self):
                  args=type('Args',(),dict(db=str(self.db),mapping=str(self.mp),cards=str(self.cards),out=str(self.p/'out')))()
                  process(args)
                  import json
                  audit=json.loads((self.p/'out/audit.json').read_text())
                  self.assertEqual(audit['all_current_races'],2)
                  self.assertEqual(audit['matching_races'],1)
                  self.assertEqual(audit['excluded_races'],1)
                  self.assertEqual(audit['historical_editions'],3)
                  with open(self.p/'out/actual_historical_runners.csv',encoding='utf-8-sig') as f:rows=list(csv.DictReader(f))
                  self.assertEqual(len(rows),9)
                  self.assertEqual(sum(float(x['winner_credit']) for x in rows),3)
                  self.assertFalse(any('AGE_0' in x['historical_traits'] for x in rows))

          if __name__=='__main__':unittest.main()
