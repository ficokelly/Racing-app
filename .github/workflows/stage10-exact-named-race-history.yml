                  self.cx.executescript('CREATE TABLE historical_races(id TEXT PRIMARY KEY,race_date TEXT,course TEXT,race_type TEXT,surface TEXT,distance_f REAL,race_class TEXT,going TEXT); CREATE TABLE historical_runs(race_id TEXT,horse_name TEXT,finish_pos INTEGER,trainer TEXT,jockey TEXT,age INTEGER,official_rating REAL,sp_decimal REAL,weight_lbs REAL,draw INTEGER,sex TEXT,outcome TEXT);')
