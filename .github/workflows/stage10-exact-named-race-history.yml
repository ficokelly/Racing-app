      - name: Download the already-existing Stage 2 historical DB and Stage 4 named-event registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'GET_STAGE10_ARTIFACTS'
          import json, os, subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          names={
            'stage2-historical-staging-database':('stage2_database','STAGE10_DB',None,('.sqlite','.db')),
            'stage4-reference-named-events-and-winners':('stage4_identity','STAGE10_MAP','all_races_with_reference_event_ids.csv',('.csv',))}
          records=[]
          found={}
          for page in range(1,8):
            p=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts',
                            '-f','per_page=100','-f',f'page={page}'],text=True)
            batch=json.loads(p).get('artifacts',[])
            records.extend(batch)
            for a in batch:
              if a['name'] in names and not a.get('expired'):
                k=a['name'];prior=found.get(k)
                if prior is None or a['created_at']>prior['created_at']:found[k]=a
            if len(found)==len(names) or len(batch)<100:break
          for name,(root,envname,target,suffixes) in names.items():
            artifact=found.get(name)
            if artifact is None:raise SystemExit('MISSING/EXPIRED: '+name+'; cannot fabricate previous editions')
            Path(root).mkdir(exist_ok=True)
            print('Downloading',name,'run',artifact['workflow_run']['id'],flush=True)
            subprocess.run(['gh','run','download',str(artifact['workflow_run']['id']),
                    '--repo',repo,'--name',name,'--dir',root],check=True)
            files=[p for p in Path(root).rglob('*') if p.is_file() and
                   (p.name==target if target is not None else p.suffix in suffixes)]
            if not files:raise SystemExit('Required data file missing inside '+name)
            path=max(files,key=lambda p:p.stat().st_size).resolve()
            print('DATA:',envname,path,'bytes',path.stat().st_size,flush=True)
            with open(os.environ['GITHUB_ENV'],'a') as f:print(envname+'='+str(path),file=f)
          GET_STAGE10_ARTIFACTS
