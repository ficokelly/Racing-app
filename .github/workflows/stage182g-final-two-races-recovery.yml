      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-db
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - uses: actions/download-artifact@v4
        with:
          name: stage181-unmatched-recovery-audit
          run-id: 45515273975
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/audit
      - uses: actions/download-artifact@v4
        with:
          name: stage182b-metadata-repair-audit
          run-id: 45518317420
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved182b
      - uses: actions/download-artifact@v4
        with:
          name: stage182d-individual-recovery-evidence
          run-id: 45519353923
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/provider182d
      - uses: actions/download-artifact@v4
        with:
          name: stage182e-targeted-recovery-audit
          run-id: 45520125973
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved182e
      - uses: actions/download-artifact@v4
        with:
          name: stage182f-final-nine-recovery-audit
          run-id: 45521233197
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved182f
      - name: Install pinned-source downloader
        run: python -m pip install --disable-pip-version-check 'kagglehub>=0.3,<1'
      - name: Recover candidate historical fields privately and verify baseline gap
        run: |
          python - <<'PY'
          import collections as C, csv, datetime as D, hashlib, json, os, pathlib as P, re, sqlite3, shutil, subprocess as S
          import kagglehub
