           'adba':['https://m.attheraces.com/racecard/Uttoxeter/16-October-2026/1622','https://www.racingpost.com/results/84/uttoxeter/2026-10-16/928432/'],
           'ritaan':['https://m.attheraces.com/racecard/Fontwell/21-October-2026/1650','https://www.racingtv.com/results/2026-10-21/fontwell-park/1650'],
           'wolverhampton17':['https://www.racingpost.com/results/513/wolverhampton-aw/2026-11-16/931748/','https://www.racingtv.com/results/2026-11-16/wolverhampton/1700'],
           'wolverhampton19':['https://www.racingpost.com/results/513/wolverhampton-aw/2026-11-16/931749/','https://www.racingtv.com/results/2026-11-16/wolverhampton/1900'],
           'virtualrock':['https://www.racingpost.com/results/26/huntingdon/2026-11-21/931612/','https://racingbrief.com/results/2026-11-21/huntingdon/1-58','https://overround.com/results?date=2026-11-21&meeting=huntingdon']}
