name: Stage182g - Final two Wolverhampton races candidate recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stage182g-final-two-races-recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage182g-final-two-races-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:scripts'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
