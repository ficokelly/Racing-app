name: Stage52 - Historical Race Trends + Eight Pillars
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: stage52-d2-research
  cancel-in-progress: false
jobs:
  enhance-d2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and verify scripts
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 kagglehub
          python -m py_compile scripts/stage52_race_trends_d2.py scripts/stage50_model_d2_optimise.py scripts/stage38_model_dz_live.py scripts/stage30_gap_aware_abcd.py
      - name: Restore historical database
        env:
          GH_TOKEN: ${{ github.token }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          target=Path('stage52_source');target.mkdir(exist_ok=True)
          latest=None
          for page in range(1,21):
              out=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts','-f','per_page=100','-f',f'page={page}'],text=True)
              arts=json.loads(out).get('artifacts',[])
              for item in arts:
                  if item.get('name')=='stage2-historical-staging-database' and not item.get('expired'):
                      if latest is None or item.get('created_at','')>latest.get('created_at',''):latest=item
              if len(arts)<100:break
          matches=[]
          if latest:
              try:
                  subprocess.run(['gh','run','download',str(latest['workflow_run']['id']),'--repo',repo,'--name',latest['name'],'--dir',str(target)],check=True)
                  matches=list(target.rglob('*.sqlite'))
              except subprocess.CalledProcessError:pass
          if matches:
              db=max(matches,key=lambda p:p.stat().st_size).resolve()
          else:
              import kagglehub
              archive=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025')
              db=(target/'historical_ukie_staging.sqlite').resolve()
              subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import','--input',str(archive),'--min-date','1988-01-01','--max-date','2026-10-07','--database',str(db),'--report',str(target/'import-report.json')],check=True)
          if not db.exists() or db.stat().st_size<10000000:raise SystemExit('Historical database missing or too small')
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE52_DB='+str(db),file=f)
          print('Database',db,'bytes',db.stat().st_size)
          PY
      - name: Retrieve completed Stage50 results (required)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stage52_input
          python - <<'PYGET'
          import json,subprocess
          repo='${{ github.repository }}'
          run_id=None
          for page in range(1,11):
              payload=json.loads(subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/workflows/stage50-model-d2-optimise.yml/runs','-f','status=completed','-f','per_page=100','-f',f'page={page}'],text=True))
              for r in payload.get('workflow_runs',[]):
                  if r.get('conclusion')=='success':run_id=str(r['id']);break
              if run_id:break
          if not run_id:raise SystemExit('Stage50 must finish successfully first')
          subprocess.run(['gh','run','download',run_id,'--repo',repo,'--name','stage50-model-d2-optimisation','--dir','stage52_input'],check=True)
          PYGET
          test -s stage52_input/stage50_d2_summary.json
      - name: Run Stage52 historical race trends
        run: |
          python -u scripts/stage52_race_trends_d2.py --db "$STAGE52_DB" --stage50 stage52_input/stage50_d2_summary.json --output reports/stage52
      - name: Show results summary
        if: success()
        run: |
          cat reports/stage52/stage52_trends_vs_d2.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload research results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage52-race-trends-d2
          path: reports/stage52/
          retention-days: 90
          if-no-files-found: warn
