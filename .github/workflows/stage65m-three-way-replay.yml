name: Stage65M - Three Way Model D 5-6 November
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoring dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 kagglehub
          python -m py_compile scripts/stage65m_backfill.py scripts/stage65m_three_way_replay.py
      - name: Reconstruct original history to 7 October
        run: |
          python - <<'PY'
          import kagglehub,subprocess,sys
          from pathlib import Path
          source=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
          Path('reports/stage65m').mkdir(parents=True,exist_ok=True)
          subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import','--input',str(source),'--min-date','1988-01-01','--max-date','2026-10-07','--database','reports/stage65m/original.sqlite','--report','reports/stage65m/import.json'],check=True)
          PY
      - name: Build verified Hot Pots history through November 4
        run: |
          python -u scripts/stage65m_backfill.py --baseline reports/stage65m/original.sqlite --out reports/stage65m/backfill --keep-candidate --skip-replay
      - name: Replay Nov 5 and Nov 6 against recorded actuals
        run: |
          python -u scripts/stage65m_three_way_replay.py --baseline reports/stage65m/original.sqlite --updated reports/stage65m/backfill/backfilled_research_only.sqlite --out reports/stage65m/three_way
      - name: Upload small comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage65m-three-way-model-d-comparison
          path: |
            reports/stage65m/backfill/*.csv
            reports/stage65m/backfill/*.json
            reports/stage65m/three_way/*.csv
            reports/stage65m/three_way/*.json
          retention-days: 90
          if-no-files-found: warn
