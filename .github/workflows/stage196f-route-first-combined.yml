name: Stage196F - Route-first exact-recipe combined engine (paper)
on:
  workflow_dispatch:
    inputs:
      selection_date:
        description: Dublin date, blank for today
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['.github/workflows/stage196f-route-first-combined.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage196f-route-first
  cancel-in-progress: false
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONPATH: .:scripts
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned scoring dependencies
        run: pip install numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 scikit-learn==1.6.1 joblib==1.4.2 freezegun==1.5.5 requests 'kagglehub>=0.3,<1'
      - name: Validate current date and refresh declarations
        env:
          ASKED_DATE: ${{ inputs.selection_date }}
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          set -euo pipefail
          TODAY="$(TZ=Europe/Dublin date +%F)"
          TARGET="${ASKED_DATE:-$TODAY}"
          test "$TARGET" = "$TODAY"
          echo "TARGET_DAY=$TARGET" >> "$GITHUB_ENV"
          if [ -n "$RACING_API_USERNAME" ] && [ -n "$RACING_API_PASSWORD" ]; then python collect-racecards.py; fi
