          python stage11_form_analysis.py \
            --db "$STAGE11_DB" \
            --stage10 stage11_sources/stage10 \
            --cards data/racecards.json \
            --odds data/latest-odds.json \
            --repo . \
            --day 2026-11-01 \
            --out stage11_results
          python - <<'STAGE11_VALIDATE'
          import csv,json
          from pathlib import Path
          p=Path('stage11_results')
          d=json.loads((p/'audit.json').read_text())
          assert d['day']=='2026-11-01' and d['matched_races']>0
          with open(p/'runner_research_rankings.csv',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          assert rows and len([r for r in rows if r['horse']])==d['current_runner_count']
          for f in ['read_on_iphone.html','exact_event_historical_sp_bands.csv',
                    'historical_favourite_rank_statistics.csv','race_eligibility_audit.csv']:
              assert (p/f).is_file(),f
          print('Stage 11 complete: matched races',d['matched_races'],'runners',d['current_runner_count'])
          STAGE11_VALIDATE
