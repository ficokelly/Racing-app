      - name: Retrieve Stage 10 exact-named race history and Stage 2 results DB
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'STAGE11_DOWNLOAD_ARTIFACTS'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          wanted=['stage10-exact-named-race-history','stage2-historical-staging-database']
          found={}
          for page in range(1,11):
              response=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts',
                                 '-f','per_page=100','-f',f'page={page}'],text=True)
              batch=json.loads(response).get('artifacts',[])
              for artifact in batch:
                  if artifact.get('name') not in wanted or artifact.get('expired'):continue
                  name=artifact['name'];prev=found.get(name)
                  if prev is None or artifact['created_at']>prev['created_at']:found[name]=artifact
              if len(found)==len(wanted) or len(batch)<100:break
          for name in wanted:
              if name not in found:
                  raise SystemExit('Missing/expired GitHub Actions artifact: '+name+'; rerun its producer first')
              path=Path('stage11_sources/stage10' if name.startswith('stage10') else 'stage11_sources/stage2')
              path.mkdir(parents=True,exist_ok=True)
              artifact=found[name]
              print('Download',name,'run',artifact['workflow_run']['id'],flush=True)
              subprocess.run(['gh','run','download',str(artifact['workflow_run']['id']),
                     '--repo',repo,'--name',name,'--dir',str(path)],check=True)
          exact=Path('stage11_sources/stage10')
          required=['audit.json','race_match_audit.csv','previous_edition_trends.csv','actual_historical_runners.csv']
          for f in required:
              if not (exact/f).exists():raise SystemExit('Missing exact-race Stage 10 file: '+f)
          databases=list(Path('stage11_sources/stage2').rglob('*.sqlite'))
          if not databases:raise SystemExit('Historical Stage 2 SQLite missing, cannot build horse form')
          db=max(databases,key=lambda x:x.stat().st_size).resolve()
          with open(os.environ['GITHUB_ENV'],'a') as f:
              print('STAGE11_DB='+str(db),file=f)
          STAGE11_DOWNLOAD_ARTIFACTS
