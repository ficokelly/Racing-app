name: Stage 11 - Exact race trends and own-data horse form (Nov 1)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rank-only-exact-named-events:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out Racing Hot Pots repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create standalone Stage 11 analyzer and tests
        shell: bash
        run: |
          set -euo pipefail
          cat > stage11_form_analysis.py <<'STAGE11_PYTHON_SCRIPT'
          #!/usr/bin/env python3
          """Stage 11: same-named-event trends THEN pre-race horse form from owned data.

          Only Stage 10 matched named events qualify; no fallback to similar races.
          No outcome or same-day post-event information enters feature calculations.
          Outputs are research rankings, not estimated probabilities or established betting edges.
          """
          import argparse, collections, csv, datetime as dt, html, json, math, os, re, sqlite3, statistics, unicodedata
          from pathlib import Path
          from zoneinfo import ZoneInfo

          BANDS=[('odds-on',0,2),('evens–under 2/1',2,3),('2/1–under 4/1',3,5),('4/1–under 8/1',5,9),('8/1–under 14/1',9,15),('14/1–under 25/1',15,26),('25/1+',26,float('inf'))]
          CUTOFF_DATA=dt.date(2026,11,1)

          def norm(s):
              return re.sub(r'[^a-z0-9]+','',unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().lower().replace('’',"'"))
          def name_norm(s):
              return re.sub(r'[^a-z0-9]+','',re.sub(r'\s*\((?:ire|gb|usa|fr|ger|aus|nz|jpn|brz)\)\s*$','',unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode(),flags=re.I).lower())
          def person(s):
              return norm(re.sub(r'\(\d+\)$','',str(s or '').strip()))
          def num(v):
              try:
                  a=float(v);return a if math.isfinite(a) else None
              except (TypeError,ValueError):return None
          def day(s):
              try:return dt.date.fromisoformat(str(s)[:10])
              except (ValueError,TypeError):return None
          def local_clock(s):
              try:
                  d=dt.datetime.fromisoformat(str(s).replace('Z','+00:00'))
                  if d.tzinfo is None:d=d.replace(tzinfo=dt.timezone.utc)
                  return d.astimezone(ZoneInfo('Europe/Dublin')).strftime('%H:%M')
              except (ValueError,TypeError):return ''
          def position(v):
              if isinstance(v,int):return v if v>=1 else None
              s=str(v or '').strip()
              if s.isdigit():return int(s)
              m=re.match(r'^(\d+)(?:st|nd|rd|th)?$',s,re.I)
              return int(m.group(1)) if m else None

          def loadcsv(p):
              with open(p,encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def jsonread(p):return json.loads(Path(p).read_text(encoding='utf8'))
          def clean_lineage(v):return name_norm(v)

          def matched_horse(h,source,strict_name=True):
              """Require age continuity, and known pedigree agreement; exclude contradictions."""
              if name_norm(h.get('horse_name',h.get('horse')))!=name_norm(source['horse']):return False
              if h.get('date'):
                  d=day(h['date']);source_day=day(source['date']); age=num(h.get('age'));now=num(source.get('age'))
                  if d and source_day and age is not None and now is not None and abs((age+source_day.year-d.year)-now)>1:return False
              for k in ('sire','dam'):
                  a=clean_lineage(h.get(k));b=clean_lineage(source.get(k))
                  if a and b and a!=b:return False
              return True

          def current_runners(card_json,target,matched,run_date):
              d=jsonread(card_json)
              if 'runners' not in d:raise RuntimeError('Racecards must contain runners')
              selected=collections.defaultdict(list)
              for r in d['runners']:
                  if r.get('date')!=target:continue
                  loc=local_clock(r.get('race_time'))
                  key=(norm(r.get('course')),loc)
                  if key in matched:selected[key].append(dict(r,date=target,meeting=r.get('course'),time=loc))
              for key in matched:
                  if not selected[key]:continue
                  # Deduplicate by stable API ID, not just name.
                  names=[name_norm(x.get('horse')) for x in selected[key]]
                  if len(names)!=len(set(names)):raise RuntimeError('Ambiguous duplicate horse names in current '+str(key))
              return selected

          def load_recent(repo,target):
              d=Path(repo)/'data/racing-results'
              out=[]
              for p in sorted(d.glob('*.json')):
                  fday=day(p.name)
                  if fday is None or fday>=target:continue # NEVER include target date's finished results
                  if fday<dt.date(2026,10,8):continue
                  obj=jsonread(p)
                  for race in obj.get('results',[]):
                      when=day(race.get('date')) or fday
                      if when>=target:continue
                      for r in race.get('runners',[]):
                          horse=r.get('horse');po=position(r.get('position'))
                          if not horse:continue
                          out.append({'date':when.isoformat(),'course':race.get('course'),'race_id':race.get('race_id'),
                              'horse':horse,'horse_id':r.get('horse_id'),'age':r.get('age'),'sire':r.get('sire'),'dam':r.get('dam'),
                              'trainer':r.get('trainer'),'jockey':r.get('jockey'),'finish':po,
                              'distance_f':num(race.get('dist_f')),'type':race.get('type'), 'going':race.get('going'),
                              'or':num(r.get('or')),'rpr':None,'topspeed':None,'source':'racing_api'})
              return out

          def read_db_history(db,cardhorses,target):
              """Single bounded historical pass: retain only target horses, plus aggregate eligible trainers and jockeys.
              SQLite records end 2026-10-07; no hand-wavy historical IDs.
              """
              entries=[];stats=[];keys={name_norm(x['horse']) for x in cardhorses}
              trainers={person(x.get('trainer')) for x in cardhorses if x.get('trainer')}
              jockeys={person(x.get('jockey')) for x in cardhorses if x.get('jockey')}
              con=sqlite3.connect('file:'+str(Path(db).resolve())+'?mode=ro',uri=True)
              maxdate=con.execute('SELECT max(race_date) FROM historical_races').fetchone()[0]
              meta={row[0]:row[1:] for row in con.execute('SELECT id,race_date,course,race_type,distance_f,going FROM historical_races WHERE race_date < ?',(target.isoformat(),))}
              # Sequential scan avoids 194k random index probes / expensive SQLite join.
              sql='SELECT race_id,horse_name,horse_name_norm,age,sire,dam,trainer,jockey,finish_pos,rpr,topspeed,official_rating FROM historical_runs'
              from functools import lru_cache
              @lru_cache(maxsize=16000)
              def pnorm(v):return person(v)
              for rid,horse,hn,age,sire,dam,trainer,jockey,finish,rpr,speed,ori in con.execute(sql):
                  m=meta.get(rid)
                  if not m:continue
                  ish=name_norm(hn or horse) in keys
                  ist=pnorm(trainer) in trainers
                  isj=pnorm(jockey) in jockeys
                  if not ish and not ist and not isj:continue
                  date,course,typ,dist,going=m
                  record={'date':date,'course':course,'type':typ,'distance_f':dist,'going':going,
                          'horse':horse,'horse_name':horse,'age':age,'sire':sire,'dam':dam,'trainer':trainer,'jockey':jockey,
                          'finish':finish,'rpr':rpr,'topspeed':speed,'or':ori,'race_id':rid,'source':'stage2'}
                  if ish:entries.append(record)
                  if ist or isj:stats.append(record)
              con.close()
              return entries,stats,maxdate

          def history_match(h,r,strict_id=False):
              # When both racing API identifiers exist, require equality.
              if h.get('horse_id') and r.get('horse_id') and h['horse_id']!=r['horse_id']:return False
              return matched_horse(h,r)

          def aggregated_form(rows,runner,target):
              valid=[]; rejected=0
              for h in rows:
                  if name_norm(h.get('horse'))!=name_norm(runner.get('horse')):continue
                  if not history_match(h,runner):rejected+=1;continue
                  valid.append(h)
              valid.sort(key=lambda x:(x['date'],str(x.get('race_id'))),reverse=True)
              # If a record is demonstrably associated with another stable API identity, avoid blending.
              known_ids={h.get('horse_id') for h in valid if h.get('horse_id')}
              if runner.get('horse_id') and known_ids and runner['horse_id'] not in known_ids:return {'status':'CONFLICTING_API_ID','runs':0,'rejected':rejected}
              # Historical entries with multiple incompatible pedigrees must be excluded.
              pedigrees={(clean_lineage(h.get('sire')),clean_lineage(h.get('dam'))) for h in valid if h.get('sire') and h.get('dam')}
              if len(pedigrees)>1:return {'status':'AMBIGUOUS_PEDIGREE','runs':0,'rejected':rejected}
              # Distinct race IDs by source, no same-day duplicate across archived systems.
              seen=set();dedup=[]
              for h in valid:
                  k=(h['date'],norm(h.get('course')),name_norm(h.get('horse')))
                  if k in seen:continue
                  seen.add(k);dedup.append(h)
              valid=dedup
              if not valid:return {'status':'NO_MATCHED_RECORDS','runs':0,'rejected':rejected}
              won=lambda h: h.get('finish')==1
              place=lambda h: h.get('finish') is not None and h['finish']<=3
              track=norm(runner.get('course'))
              rf=num(runner.get('distance_f'))
              kind='flat' if norm(runner.get('type'))=='flat' else 'chase' if 'chase' in norm(runner.get('type')) else 'hurdle' if 'hurdle' in norm(runner.get('type')) else ''
              atcourse=[h for h in valid if norm(h.get('course'))==track]
              atdistance=[h for h in valid if rf is not None and num(h.get('distance_f')) is not None and abs(num(h['distance_f'])-rf)<=1]
              atk=[h for h in valid if kind and kind in norm(h.get('type'))]
              p5=valid[:5];p3=valid[:3]
              ratings=[num(h.get('rpr')) for h in p5];ratings=[v for v in ratings if v is not None]
              days=(target-day(valid[0]['date'])).days
              return {'status':'MATCHED','runs':len(valid),'wins':sum(map(won,valid)),'last3':sum(map(place,p3)),
                  'last5':sum(map(place,p5)),'last5wins':sum(map(won,p5)),
                  'course_runs':len(atcourse),'course_wins':sum(map(won,atcourse)),
                  'distance_runs':len(atdistance),'distance_wins':sum(map(won,atdistance)),
                  'type_runs':len(atk),'type_wins':sum(map(won,atk)),
                  'last_run_days':days,'last_rpr_avg':round(statistics.mean(ratings),1) if ratings else None,
                  'latest_record':valid[0]['date'],'rejected':rejected,'history_sources':','.join(sorted({h['source'] for h in valid}))}

          def person_stats(rows,runner,target,role,days,course=False):
              key=person(runner.get(role));loc=norm(runner.get('course'))
              if not key:return {'starts':0,'wins':0}
              since=target-dt.timedelta(days=days)
              sel=[r for r in rows if person(r.get(role))==key and since<=day(r['date'])<target and (not course or norm(r.get('course'))==loc)]
              # Deduplicate across sets; date+course+horse may mix double headers but acceptable for trainer field.
              unique={(x['date'],norm(x.get('course')),name_norm(x.get('horse'))):x for x in sel}
              n=len(unique);w=sum(x.get('finish')==1 for x in unique.values())
              return {'starts':n,'wins':w,'pct':round(100*w/n,1) if n else None}

          def band_for(price):
              return next((name for name,a,b in BANDS if price is not None and a<=price<b),None)

          def market_data(stage10_runners,matched):
              stats=collections.defaultdict(lambda:collections.defaultdict(list))
              for r in stage10_runners:
                  key=(norm(r['meeting']),r['time'])
                  if key not in matched or str(r.get('included_in_trends')).lower()!='true':continue
                  sp=num(r.get('sp_decimal'))
                  if sp is None or sp<=1:continue
                  b=band_for(sp)
                  if b:stats[key][b].append((num(r.get('winner_credit')) or 0,sp,r['date']))
              output={}
              for key,groups in stats.items():
                  output[key]={}
                  for b,vals in groups.items():
                      wins=sum(x[0] for x in vals);n=len(vals)
                      output[key][b]={'starts':n,'wins':round(wins,2), 'strike_pct':round(wins/n*100,1),
                          'roi_pct':round((sum(w*odds for w,odds,_ in vals)-n)/n*100,1),
                          'editions':len({date[:4] for _,_,date in vals})}
              return output

          def historical_market_positions(stage10_runners,matched):
              """Rank every historical starter within its edition by final SP (descriptive ONLY)."""
              byrace=collections.defaultdict(list)
              for r in stage10_runners:
                  key=(norm(r['meeting']),r['time'])
                  if key not in matched or str(r.get('included_in_trends')).lower()!='true':continue
                  price=num(r.get('sp_decimal'))
                  if price and price>1:
                      byrace[(key,r['race_id'])].append((price,num(r.get('winner_credit')) or 0,r['date'][:4]))
              groups=collections.defaultdict(lambda:collections.defaultdict(list))
              for (key,race_id),data in byrace.items():
                  prices=sorted({p for p,w,y in data})
                  for p,w,y in data:
                      rank=prices.index(p)+1
                      label='Favourite' if rank==1 else 'Second favourite' if rank==2 else 'Third–fourth' if rank<=4 else 'Fifth or bigger'
                      groups[key][label].append((w,p,y))
              out={}
              for key,g in groups.items():
                  out[key]={}
                  for label,vals in g.items():
                      n=len(vals);wins=sum(x[0] for x in vals)
                      out[key][label]={'starts':n,'wins':round(wins,2),'roi_pct':round((sum(w*p for w,p,_ in vals)-n)/n*100,1),
                                       'editions':len({y for _,_,y in vals})}
              return out

          def observed_prices(p,target):
              if not Path(p).exists():return {}
              data=jsonread(p);rows=data.get('prices',[])
              by=collections.defaultdict(list)
              for x in rows:
                  if x.get('bookmaker')!='williamhill':continue
                  if str(x.get('race_time',''))[:10]!=target:continue
                  k=(norm(x.get('course')),local_clock(x.get('race_time')),name_norm(x.get('horse')))
                  price=num(x.get('decimal_odds'))
                  if price and price>1:by[k].append(x)
              out={}
              for k,v in by.items():
                  v.sort(key=lambda x:str(x.get('collected_at') or x.get('bookmaker_updated_at')))
                  x=v[-1]
                  observed=str(x.get('collected_at') or data.get('collected_at') or '')
                  # No betting price when snapshot came after scheduled off
                  snap=dt.datetime.fromisoformat(observed.replace('Z','+00:00')) if observed else None
                  off=dt.datetime.fromisoformat(str(x['race_time']).replace('Z','+00:00'))
                  out[k]={'decimal':num(x.get('decimal_odds')) if snap and snap<off and not x.get('stale') else None,
                      'opening_decimal':num(x.get('opening_odds')) if snap and snap<off and not x.get('stale') else None,
                      'observed_at':observed,'preoff':bool(snap and snap<off and not x.get('stale')),
                      'raw_decimal':num(x.get('decimal_odds'))}
              return out

          def current_trait(r,allr):
              traits=set()
              age=num(r.get('age'))
              if age is not None:
                  traits.add('AGE_'+str(int(age)))
                  if age<8:traits.add('AGE_UNDER_8')
              sex=norm(r.get('sex'))
              if sex in ('gelding','g'):traits.add('GELDING')
              if sex in ('mare','m','filly','f'):traits.add('FEMALE')
              if sex in ('colt','c','horse','h','stallion'):traits.add('MALE_ENTIRE')
              for field,trait_prefix in [('ofr','OFFICIAL_RATING'),('lbs','WEIGHT')]:
                  v=num(r.get(field));all_values=[num(x.get(field)) for x in allr];all_values=[x for x in all_values if x is not None]
                  if v is not None and len(all_values)>=3:
                      lower=sum(x<v for x in all_values);tie=sum(x==v for x in all_values)
                      p=(lower+tie*.5)/len(all_values)
                      label='BOTTOM_THIRD' if p<=1/3 else 'TOP_THIRD' if p>=2/3 else 'MIDDLE_THIRD'
                      traits.add(trait_prefix+'_'+label)
              return traits

          def historical_signal(traits,trend_rows,key,editions):
              # Statistical evidence is exploratory and post-selection; never assert validated edge.
              evaluated=[]
              for row in trend_rows:
                  if (norm(row['meeting']),row['time'])!=key:continue
                  t=row['trait']
                  if t not in traits:continue
                  n=num(row.get('qualifying_runners')) or 0
                  e=num(row.get('editions_with_qualifiers')) or 0
                  wins=num(row.get('winning_runner_credit')) or 0
                  expected=num(row.get('market_expected_wins'))
                  if n<10 or e<5 or expected is None or expected<=0:continue
                  excess=wins-expected
                  # Stabilize with pseudocounts and prevent extreme zeros; cap per-factor contribution.
                  z=excess/math.sqrt(expected+1)
                  strength=max(-1,min(1,z/2.8))*min(1,e/12)*min(1,n/30)
                  evaluated.append((t,round(strength,3),round(wins,2),int(n),int(e)))
              return sorted(evaluated,key=lambda x:-abs(x[1]))

          def ranking(r,feature,trainer30,trainercourse,jockey90,signals,price,historical_market):
              # Transparent research FIT score (not win probability), sparse-history penalty.
              f=feature
              hist=sum(max(-0.25,min(0.25,x[1])) for x in signals[:4])
              hist=max(-0.75,min(0.75,hist))
              fscore=0
              if f.get('status')=='MATCHED':
                  n=f['runs'];fscore+=min(f['last5'],3)*0.11+min(f['last5wins'],2)*0.17
                  if f['type_runs']>=3:fscore+=min(f['type_wins'],3)*0.09
                  if f['course_runs']>=2:fscore+=min(f['course_wins'],2)*0.1
                  if f['distance_runs']>=2:fscore+=min(f['distance_wins'],2)*0.1
                  if f.get('last_run_days') is not None and f['last_run_days']>210:fscore-=0.08
              else:fscore-=0.1
              # Trainer/jockey indicators are sample-shrunk relative to neutral baselines, not post-race.
              t=0
              if trainer30.get('starts',0)>=10:t+=max(-.12,min(.16,(trainer30['wins']/(trainer30['starts']+30)-0.1)*0.7))
              if trainercourse.get('starts',0)>=25:t+=max(-.09,min(.12,(trainercourse['wins']/(trainercourse['starts']+30)-0.1)*0.5))
              if jockey90.get('starts',0)>=20:t+=max(-.08,min(.1,(jockey90['wins']/(jockey90['starts']+30)-0.1)*0.5))
              score=round(50+hist*16+fscore*18+t*16,1)
              # Market data and historical SP bands are deliberately NOT used to optimize scores,
              # avoiding the post-race SP pattern as a predictive shortcut without validation.
              return max(0,min(100,score)),round(hist,3),round(fscore,3),round(t,3)

          def writecsv(p,rows,columns=None):
              p.parent.mkdir(parents=True,exist_ok=True)
              columns=columns or (list(rows[0]) if rows else [])
              with open(p,'w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,columns,extrasaction='ignore');w.writeheader();w.writerows(rows)

          def run(args):
              target=day(args.day)
              if not target:raise ValueError('Invalid target day')
              stage10=Path(args.stage10)
              audit=jsonread(stage10/'audit.json')
              if audit.get('target_day')!=args.day or audit.get('status')!='COMPLETE':raise RuntimeError('Stage 10 results not for requested target day')
              allmatched=loadcsv(stage10/'race_match_audit.csv')
              matched={(norm(r['meeting']),r['time']):r for r in allmatched if r['status']=='MATCHED' and int(r['comparable_editions'])>=2}
              if not matched:raise RuntimeError('No exact-match races were found; no fallback allowed')
              cards=current_runners(args.cards,args.day,matched,target)
              if not any(cards.values()):raise RuntimeError('No exact-race runners in current racecards for requested date; REFUSE stale-day ranking')
              current=[r for group in cards.values() for r in group]
              recent=load_recent(args.repo,target)
              import time
              tic=time.monotonic()
              print('Starting history extraction with',len(current),'today runners',flush=True)
              historic,personrows,dbmax=read_db_history(args.db,current,target)
              print('History extracted',len(historic),len(personrows),'in',round(time.monotonic()-tic,1),'seconds',flush=True)
              # Historical records end Oct 7; recent archived results Oct 8 onward.
              seen={(x['date'],norm(x.get('course')),name_norm(x.get('horse'))) for x in historic}
              for x in recent:
                  if (x['date'],norm(x.get('course')),name_norm(x.get('horse'))) not in seen:
                      historic.append(x);personrows.append(x)
              print('Recent results merged',len(historic),len(personrows),'in',round(time.monotonic()-tic,1),'seconds',flush=True)
              odds=observed_prices(args.odds,args.day)
              trendrows=loadcsv(stage10/'previous_edition_trends.csv')
              stage10rows=loadcsv(stage10/'actual_historical_runners.csv')
              bands=market_data(stage10rows,matched)
              favorite_stats=historical_market_positions(stage10rows,matched)
              # Index person records by normalized name once. Without this, each runner scans years of trainer+ jockey rows.
              pindex={'trainer':collections.defaultdict(list),'jockey':collections.defaultdict(list)}
              for h in personrows:
                  for role in ('trainer','jockey'):
                      k=person(h.get(role))
                      if k:pindex[role][k].append(h)
              print('Person indexes built',round(time.monotonic()-tic,1),'seconds',flush=True)
              outr=[];prices=[];formrows=[]
              for key,match in sorted(matched.items()):
                  racers=cards.get(key,[])
                  if not racers:
                      outr.append({'meeting':match['meeting'],'time':match['time'],'horse':'','status':'MISSING_CURRENT_RACECARD','fit_score':'','why':'Missing current runners; no selection'})
                      continue
                  for r in racers:
                      traits=current_trait(r,racers)
                      signal=historical_signal(traits,trendrows,key,int(match['comparable_editions']))
                      f=aggregated_form(historic,r,target)
                      t30=person_stats(pindex['trainer'].get(person(r.get('trainer')),[]),r,target,'trainer',30)
                      tc=person_stats(pindex['trainer'].get(person(r.get('trainer')),[]),r,target,'trainer',3650,course=True)
                      j90=person_stats(pindex['jockey'].get(person(r.get('jockey')),[]),r,target,'jockey',90)
                      pr=odds.get((key[0],key[1],name_norm(r['horse'])),{})
                      dec=pr.get('decimal');b=band_for(dec)
                      historical_band=bands.get(key,{}).get(b) if b else None
                      score,hscore,fscore,tscore=ranking(r,f,t30,tc,j90,signal,pr,historical_band)
                      market_prices=sorted(set(v['decimal'] for horse in racers if (v:=odds.get((key[0],key[1],name_norm(horse['horse'])),{})).get('decimal') is not None))
                      market_rank=market_prices.index(dec)+1 if dec in market_prices else None
                      market_label=('Favourite' if market_rank==1 else 'Second favourite' if market_rank==2 else 'Third–fourth' if market_rank and market_rank<=4 else 'Fifth or bigger' if market_rank else None)
                      historical_market_rank=favorite_stats.get(key,{}).get(market_label) if market_label else None
                      opening=pr.get('opening_decimal')
                      movement_pct=round((opening-dec)/opening*100,1) if opening and dec else None
                      # Exact event history screen runs BEFORE individual form determines ranking.
                      # Only a provisional positive excess-vs-market sample can qualify; never claim proof.
                      positive=[x for x in signal if x[1]>=0.10 and x[2]>=2]
                      qualifies=bool(positive) and int(match['comparable_editions'])>=5
                      label='PROVISIONAL_POSITIVE_EVENT_TREND' if qualifies else 'NO_SUPPORTED_POSITIVE_EVENT_TREND'
