          import sys,unittest,tempfile,csv,json,sqlite3,datetime as dt
          from pathlib import Path
          sys.path.insert(0,str(Path(__file__).parent))
          import stage11_form_analysis as m

          class TestStage11(unittest.TestCase):
           def test_name_normalization(self):
            self.assertEqual(m.name_norm('The Austrian (IRE)'),m.name_norm('The Austrian'))
           def test_age_future_isolation(self):
            now={'horse':'Example','date':'2026-11-01','age':6,'sire':'Sun'}
            self.assertFalse(m.matched_horse({'horse':'Example','date':'2020-01-01','age':8,'sire':'Sun'},now))
            self.assertTrue(m.matched_horse({'horse':'Example','date':'2024-01-01','age':4,'sire':'Sun'},now))
           def test_pedigree_contradiction(self):
            r={'horse':'Same Name','date':'2026-11-01','age':6,'sire':'Actual Sire','dam':'Dam'}
            self.assertFalse(m.matched_horse({'horse':'Same Name','date':'2024-01-01','age':4,'sire':'Different Sire'},r))
           def test_odds_post_off_fail_closed(self):
            with tempfile.TemporaryDirectory() as d:
             p=Path(d)/'prices.json'
             data={'prices':[{'bookmaker':'williamhill','race_time':'2026-11-01T12:38:00Z','course':'Carlisle','horse':'Test Horse','decimal_odds':5,'collected_at':'2026-11-01T13:53:32Z','stale':False}]}
             p.write_text(json.dumps(data))
             x=m.observed_prices(p,'2026-11-01')[('carlisle','12:38','testhorse')]
             self.assertFalse(x['preoff']);self.assertIsNone(x['decimal'])
           def test_price_preoff_available(self):
            with tempfile.TemporaryDirectory() as d:
             p=Path(d)/'prices.json'
             data={'prices':[{'bookmaker':'williamhill','race_time':'2026-11-01T16:20:00Z','course':'Curragh','horse':'Test Horse','decimal_odds':5,'collected_at':'2026-11-01T13:53:32Z','stale':False}]}
             p.write_text(json.dumps(data))
             x=m.observed_prices(p,'2026-11-01')[('curragh','16:20','testhorse')]
             self.assertTrue(x['preoff']);self.assertEqual(x['decimal'],5)
           def test_exclude_target_date_results(self):
            with tempfile.TemporaryDirectory() as d:
             p=Path(d)/'data/racing-results';p.mkdir(parents=True)
             for date in ['2026-10-31','2026-11-01']:
              (p/(date+'.json')).write_text(json.dumps({'results':[{'date':date,'course':'Cork','runners':[{'horse':'Horse','position':'1'}]}]}))
             rows=m.load_recent(d,dt.date(2026,11,1))
             self.assertEqual([r['date'] for r in rows],['2026-10-31'])
           def test_trait_only_matching_race(self):
            t=[{'meeting':'Cork','time':'15:25','trait':'AGE_7','qualifying_runners':'50','editions_with_qualifiers':'12','winning_runner_credit':'10','market_expected_wins':'5'},
               {'meeting':'Carlisle','time':'15:33','trait':'AGE_7','qualifying_runners':'50','editions_with_qualifiers':'12','winning_runner_credit':'0','market_expected_wins':'5'}]
            x=m.historical_signal({'AGE_7'},t,('cork','15:25'),14)
            self.assertEqual(len(x),1);self.assertGreater(x[0][1],0)
           def test_untested_trait_excluded(self):
            t=[{'meeting':'Cork','time':'15:25','trait':'AGE_7','qualifying_runners':'3','editions_with_qualifiers':'2','winning_runner_credit':'2','market_expected_wins':'1'}]
            self.assertEqual(m.historical_signal({'AGE_7'},t,('cork','15:25'),14),[])
           def test_horse_id_conflict(self):
            h=[{'horse':'Another Horse','date':'2026-10-31','horse_id':'hrs_other','age':5,'sire':'Sire','dam':'Dam','finish':1}]
            r={'horse':'Another Horse','date':'2026-11-01','horse_id':'hrs_current','age':5,'sire':'Sire','dam':'Dam'}
            self.assertEqual(m.aggregated_form(h,r,dt.date(2026,11,1))['status'],'NO_MATCHED_RECORDS')
           def test_form_includes_previous_not_future(self):
            h=[{'horse':'Runner','date':'2026-10-31','horse_id':'a','age':5,'finish':1,'source':'test','race_id':'a'},
                {'horse':'Runner','date':'2026-10-20','horse_id':'a','age':5,'finish':3,'source':'test','race_id':'b'}]
            r={'horse':'Runner','date':'2026-11-01','horse_id':'a','age':5,'course':'Cork','type':'Chase','distance_f':20}
            x=m.aggregated_form(h,r,dt.date(2026,11,1));self.assertEqual(x['wins'],1);self.assertEqual(x['last3'],2)
           def test_all_bands_nonoverlap(self):
