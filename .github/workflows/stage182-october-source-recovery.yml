name: Stage182 - October historical source gap recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stage182-october-source-recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage182-source-gap-research
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:scripts'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-db
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - uses: actions/download-artifact@v4
        with:
          name: stage181-unmatched-recovery-audit
          run-id: 45515273975
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/audit
      - name: Install pinned-source downloader
        run: python -m pip install --disable-pip-version-check 'kagglehub>=0.3,<1'
      - name: Recover candidate historical fields privately and verify baseline gap
        run: |
          python - <<'PY'
          import collections as C, csv, datetime as D, hashlib, json, os, pathlib as P, re, sqlite3, shutil
          import kagglehub
          import import_historical_ukie as I
          import stage4_match_all_recurring_races as R
          from scripts import stage171_recent_history as M
          T=P.Path(os.environ['RUNNER_TEMP']); B=T/'frozen'; OUT=P.Path('reports/stage182'); OUT.mkdir(parents=True,exist_ok=True)
          FIRST='2026-10-10'; LAST='2026-11-20'; TARGET='2026-11-25'
          def load(p):return json.loads(p.read_text())
          def dump(n,x):(OUT/n).write_text(json.dumps(x,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          def sha(p):
           with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          def course(x):
           n=M.course(x);return {'dundalkaw':'dundalk','dundalkire':'dundalk','dundalkawire':'dundalk','kemptonpark':'kempton','chelmsfordcity':'chelmsford','bangor':'bangorondee','galwayire':'galway','wexfordire':'wexford','curraghire':'curragh'}.get(n,n)
          def horse(x):return M.norm(re.sub(r'\s*\([A-Za-z]{2,3}\)\s*$','',str(x or '')))
          def outcome(h):
           p=h.get('position');s=M.norm(h.get('status'));t=M.norm(p)
           if s in M.NR or t in M.NR:return ('NR',None)
           if s in M.TERMINAL or t in M.TERMINAL:return (M.TERMINAL.get(s) or M.TERMINAL.get(t),None)
           if not isinstance(p,bool) and re.fullmatch(r'[0-9]+(?:\.0+)?',str(p)) and float(p)>0:return ('FINISHED',int(float(p)))
           return ('UNKNOWN',None)
          def src_out(o,p):
           n=M.norm(o)
           if n in M.NR:return ('NR',None)
           if n in M.TERMINAL:return (M.TERMINAL[n],None)
           return ('FINISHED',p) if n=='finished' and isinstance(p,int) and p>0 else ('UNKNOWN',None)
          manifest=load(B/'history-manifest.json'); db=B/'candidate.sqlite'; ref=B/'candidate-reference.csv'
          assert sha(db)==manifest['database_sha256'] and sha(ref)==manifest['reference_sha256'],'Frozen input checksum mismatch'
          missing=load(T/'audit'/'unresolved-prior-runs.json'); report181=load(T/'audit'/'report.json')
          assert len(missing)==report181['unresolved_archive_matches']==165 and report181['target']==TARGET
          priority={horse(x) for x in ('Acclamique','Persian Coast',"Samantha's Lady",'Celestial Order')}
          # Reconstruct the current Stage181 candidate in a private copy; no frozen file or production write.
          candidate=T/'stage182-candidate.sqlite'; candidate_ref=T/'stage182-reference.csv'; shutil.copy2(db,candidate);shutil.copy2(ref,candidate_ref)
          with sqlite3.connect(candidate) as c:
           c.execute('delete from historical_runs where race_id in (select id from historical_races where race_date>?)',(M.BASE,));c.execute('delete from historical_races where race_date>?',(M.BASE,));c.commit()
          with candidate_ref.open(encoding='utf-8-sig',newline='') as f:
           rr=csv.DictReader(f);fields=rr.fieldnames;keep=[r for r in rr if r['date']<=M.BASE]
          with candidate_ref.open('w',encoding='utf-8',newline='') as f:
           w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(keep)
          from scripts.stage180_archive_overlay import apply
          apply(candidate,candidate_ref,TARGET); M.append_bridge(candidate,candidate_ref,TARGET,P.Path('data'))
          # Original source version, not a new unvalidated version or a scraped dataset.
          src=P.Path(kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/132'))
          delta=T/'stage182-delta.sqlite'
          imp=I.process(src,delta,FIRST,LAST,'import');assert imp['integrity']=='ok' and imp['inserted']>0
          # Independently inspect raw source race IDs, metadata and duplicate runner signatures.
          raw_meta={}; signatures={}; bad=set(); raw_counts=C.Counter()
          for filename,opener in I.source_iter(src):
           with opener() as f:
            reader=csv.DictReader(f); m=I.mapping(reader.fieldnames or [])
            if not all(m.get(k) for k in ('race_date','course','horse','finish','race_id')):continue
            for row in reader:
             d=I.dateparse(I.value(row,m,'race_date')) if FIRST<=str(row.get(m['race_date'],'')).strip()[:10]<=LAST else None
             if not d or not FIRST<=d<=LAST:continue
             co=I.value(row,m,'course');raw=I.value(row,m,'race_id');h=I.value(row,m,'horse')
             if not co or not raw or not h:continue
             rid=I.SOURCE+':'+d+':'+I.normhead(co)+':'+re.sub('[^a-zA-Z0-9_-]','',raw)[:90]
             facts=(d,co,I.value(row,m,'race_type'),str(row.get('race_name') or '').strip(),R.region(co),raw)
             if rid in raw_meta and raw_meta[rid]!=facts:bad.add(rid)
             raw_meta[rid]=facts; hid=I.value(row,m,'horse_id'); key=(rid,'id:'+hid if hid else 'name:'+I.normname(h))
             sig=tuple(I.value(row,m,k) for k in ('horse','country','foaled','finish','trainer','jockey','rating','weight','sp','draw','age','sex','sire','dam','rpr','ts','comment','beaten','surface','distance','going','race_class'))
             if key in signatures and signatures[key]!=sig:bad.add(rid)
             signatures[key]=sig;raw_counts[d]+=1
          # Compare complete archived race fields and outcomes with original source fields.
          # Exact runner-set agreement is mandatory. No synthetic results or corrections to existing rows.
          archive=C.defaultdict(list)
          for day in sorted({x['prior_date'] for x in missing}):
           p=P.Path('data/racing-results')/(day+'.json')
           if not p.exists():continue
           for r in load(p).get('results',[]):
            if r.get('status')!='final':continue
            rr=r.get('runners') or []; active=[h for h in rr if outcome(h)[0]!='NR']; names=[horse(h.get('horse')) for h in active]
            if not names or not all(names) or len(set(names))!=len(names):continue
            archive[(day,course(r.get('course')))].append((r,{horse(h.get('horse')):(outcome(h),h) for h in active}))
          source_fields=C.defaultdict(dict); source_by_slot=C.defaultdict(list); source_info={}; coverage=C.defaultdict(C.Counter)
          with sqlite3.connect(delta) as c:
           for rid,d,co,typ,surface,dist in c.execute('select id,race_date,course,race_type,surface,distance_f from historical_races'):
            source_info[rid]=(d,co,typ,surface,dist); source_by_slot[(d,course(co))].append(rid); coverage[d]['source_races']+=1
           for rid,h,hid,sire,dam,o,p in c.execute('select race_id,horse_name,horse_source_id,sire,dam,outcome,finish_pos from historical_runs'):
            st=src_out(o,p)
            if st[0]=='NR':continue
            n=horse(h)
            if not n or n in source_fields[rid]:bad.add(rid)
            source_fields[rid][n]=(st,hid,sire,dam);coverage[source_info[rid][0]]['source_runners']+=1
          base_fields=C.defaultdict(set);base_slot=C.defaultdict(set);base_id=C.defaultdict(set);base_ids=set(); base_matches=C.defaultdict(list)
          with sqlite3.connect(candidate) as c:
           before=c.execute('select count(*) from historical_races').fetchone()[0];before_runs=c.execute('select count(*) from historical_runs').fetchone()[0]
           for rid,d,co in c.execute('select id,race_date,course from historical_races where race_date between ? and ?',(FIRST,'2026-11-24')):
            base_ids.add(rid);coverage[d]['baseline_races']+=1
           for rid,d,co,h,hid,sire,dam,o,p in c.execute('select r.id,r.race_date,r.course,h.horse_name,h.horse_source_id,h.sire,h.dam,h.outcome,h.finish_pos from historical_races r join historical_runs h on h.race_id=r.id where r.race_date between ? and ?',(FIRST,'2026-11-24')):
            n=horse(h);base_fields[rid].add(n);base_slot[(d,n)].add(rid)
            if hid:base_id[(d,str(hid))].add(rid)
            base_matches[(d,course(co),n)].append((rid,src_out(o,p),hid,sire,dam));coverage[d]['baseline_runners']+=1
          # For each missing runner, locate its exact archived race, then a unique original-source full field.
          # Require target pedigree concordance or matching source ID where the archive identifies the horse.
          records=[];approved={};candidate_races=C.defaultdict(list)
          for x in missing:
           day=x['prior_date'];co=course(x['prior_course']);n=horse(x['horse']);expected=(x['outcome'],x['position']);z={'horse':x['horse'],'date':day,'course':x['prior_course'],'prior_time':x['prior_time'],'position':x['position'],'priority':n in priority,'stage181_race_id':x.get('race_id')}
           matches=[(r,f) for r,f in archive[(day,co)] if n in f and M.off(r)==x['prior_time'] and (not x.get('race_id') or r.get('race_id')==x['race_id']) and f[n][0]==expected]
           if len(matches)!=1:z['status']='ARCHIVE_RACE_NOT_UNIQUE';records.append(z);continue
           r,af=matches[0];pool=source_by_slot[(day,co)];z['source_course_day_races']=len(pool)
           if day>LAST:z['status']='OUTSIDE_PINNED_SOURCE_CUTOFF';records.append(z);continue
           exact=[rid for rid in pool if set(source_fields[rid])==set(af)]
           agreed=[rid for rid in exact if all(source_fields[rid][h][0]==af[h][0] and af[h][0][0]!='UNKNOWN' for h in af)]
           z['exact_fields']=len(exact);z['outcome_agreed_fields']=len(agreed)
           if len(agreed)!=1:
            z['status']='NO_SOURCE_COURSE_DAY' if not pool else 'NO_EXACT_FIELD' if not exact else 'SOURCE_OUTCOME_CONFLICT_OR_AMBIGUOUS';records.append(z);continue
           rid=agreed[0];z['source_race_id']=rid;facts=raw_meta.get(rid);s=source_fields[rid];d,sc,typ,surface,dist=source_info[rid]
           if rid in bad or not facts or not facts[3] or facts[4] not in ('GB','IRELAND') or not typ or not surface or not dist or len(s)<2 or sum(v[0]==('FINISHED',1) for v in s.values())!=1:
            z['status']='SOURCE_METADATA_OR_DUPLICATE_CONFLICT';records.append(z);continue
           # Cross-provider IDs can differ. Pedigree concordance is independent of name alone.
           _,sid,ss,sd=s[n]; ident=any((sid and a.get('horse_id') and str(sid)==str(a['horse_id'])) or (ss and sd and a.get('sire') and a.get('dam') and horse(ss)==horse(a['sire']) and horse(sd)==horse(a['dam'])) for a in x['tomorrow'])
           if not ident:z['status']='TARGET_IDENTITY_UNVERIFIED';records.append(z);continue
           conflicts=set().union(*(base_slot[(day,h)] for h in s),*(base_id[(day,str(v[1]))] for v in s.values() if v[1]))
           if conflicts or rid in base_ids:
            z['status']='BASELINE_OVERLAP_QUARANTINED';z['baseline_race_ids']=sorted(conflicts);records.append(z);continue
           z['status']='VALIDATED_CANDIDATE';approved[rid]=facts;candidate_races[rid].append(len(records));records.append(z)
          # Distinct source IDs must not share any runner name or ID on the same date.
          seen=C.defaultdict(set)
          for rid in approved:
           day=source_info[rid][0]
           for n,(_,hid,_,_) in source_fields[rid].items():
            seen[(day,'name:'+n)].add(rid)
            if hid:seen[(day,'id:'+str(hid))].add(rid)
          collisions=set().union(*(v for v in seen.values() if len(v)>1))
          for rid in collisions:
           approved.pop(rid,None)
           for i in candidate_races[rid]:records[i]['status']='CANDIDATE_CROSS_ID_COLLISION'
          # Append complete, verified fields to the disposable SQLite and reference only.
          with sqlite3.connect(candidate) as c:
           c.execute('attach database ? as incoming',(str(delta),));c.execute('create temp table approved(id text primary key)');c.executemany('insert into approved values(?)',[(r,) for r in approved]);c.execute('insert into historical_races select i.* from incoming.historical_races i join approved a on a.id=i.id');c.execute('insert into historical_runs select i.* from incoming.historical_runs i join approved a on a.id=i.race_id');c.commit()
           after=c.execute('select count(*) from historical_races').fetchone()[0];after_runs=c.execute('select count(*) from historical_runs').fetchone()[0]
           assert after==before+len(approved) and after_runs==before_runs+sum(len(source_fields[rid]) for rid in approved)+sum(1 for rid in approved for row in c.execute('select outcome,finish_pos from incoming.historical_runs where race_id=?',(rid,)) if src_out(*row)[0]=='NR')
           assert c.execute('pragma quick_check').fetchone()[0]=='ok' and not c.execute('select count(*) from historical_races where race_date>=?',(TARGET,)).fetchone()[0]
           for z in records:
            if z['status']!='VALIDATED_CANDIDATE':continue
            rid=z['source_race_id'];hits=[v for v in c.execute('select horse_name,outcome,finish_pos from historical_runs where race_id=?',(rid,)) if horse(v[0])==horse(z['horse'])];assert len(hits)==1 and hits[0][2]==z['position'];z['status']='RECOVERED_IN_PRIVATE_CANDIDATE'
          with candidate_ref.open('a',encoding='utf-8',newline='') as f:
           w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore')
           for rid,(d,co,typ,title,region,raw) in approved.items():w.writerow(dict(stage2_race_id=rid,date=d,course=co,race_type=typ,race_name=title,region_scope=region,source_race_id=raw))
          # Only derived audit evidence is uploaded, not raw Kaggle files, DB or reference CSV.
          counts=C.Counter(z['status'] for z in records); rec=counts['RECOVERED_IN_PRIVATE_CANDIDATE']; assert len(records)==165
          summary={'status':'PRIVATE_CANDIDATE_ONLY_NOT_DEPLOYED','target':TARGET,'source_version':132,'source_window':[FIRST,LAST],'production_import_window_start':'2026-10-23','baseline_unmatched':len(missing),'candidate_recovered_records':rec,'remaining_unmatched_in_candidate':len(missing)-rec,'candidate_new_races':after-before,'candidate_new_runner_rows':after_runs-before_runs,'baseline_race_count':before,'candidate_race_count':after,'baseline_differs_from_stage181':before!=report181['historical_races'],'source_import_races':imp['races'],'source_import_runs':imp['runs'],'status_counts':dict(counts),'priority':[z for z in records if z['priority']],'limitations':['Frozen Stage177b input unchanged; Stage181 baseline reconstructed privately.','Exact full-field and outcomes agreement plus target ID or pedigree required; overlaps quarantined.','Candidate does not change any live model, G5 or legacy history.','No external alternative source data added by this run; source gaps require separately verified licensed provider recovery.','Candidate count is scoped to original 165 audit records, not proof of complete career history.']}
          dump('report.json',summary);dump('record-audit.json',records);dump('daily-source-coverage.json',{d:dict(v) for d,v in sorted(coverage.items())});dump('approved-source-race-ids.json',sorted(approved));print('STAGE182_REPORT',json.dumps(summary),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage182-october-source-recovery-audit
          path: reports/stage182/
          if-no-files-found: warn
          retention-days: 30
