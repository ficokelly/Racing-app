name: Stage 39 FIX - Wednesday Six Course ROI Research v2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stage39-2026-11-04-six-course-roi-fix
  cancel-in-progress: false

