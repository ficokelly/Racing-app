          cat > sunday_historical_engine.py <<'SUNDAY_PYTHON_ENGINE'
          #!/usr/bin/env python3
          """Sunday 2026-11-01 historical winner-versus-runner research, UK/IE only.

          Uses pre-race source runner records from an existing Stage 2 SQLite database. This is
          NOT a live selection engine. It does not infer recurring annual race IDs from
          similar distances or sponsored names. Every comparable-race tier is labelled.
          Python 3.11, standard library only.
          """
          import argparse, collections, csv, datetime as dt, json, math, re, sqlite3, statistics, unicodedata
          from pathlib import Path

          FIELDS = ['date','course','post_time','race_title','distance_f','race_type','race_class','going','surface','declared_runners','race_condition','source_url','data_status']
          GENERIC_NO_RUN = {'NR','NONRUNNER','NON-RUNNER','NON RUNNER','WITHDRAWN','SCRATCHED','VOID'}
          NAMED_ANCHORS = {
           ('Curragh','14:37'):r'\bloughbrown\b',
           ('Curragh','16:20'):r'\bfinale\s+stakes\b',
           ('Cork','15:25'):r'\bcork\s+grand\s+national\b',
           ('Carlisle','12:38'):r'\bgordon\s+richards\b',
           ('Carlisle','13:48'):r'\bhoughton\b',
           ('Carlisle','14:23'):r'\bcastletown\b',
           ('Carlisle','14:58'):r'\bcolin\s+parker\b',
           ('Carlisle','15:33'):r'\bcumberland\b',
           ('Huntingdon','14:42'):r'\bmacer\s+gifford\b',
          }

          def norm(s):
           s=unicodedata.normalize('NFKD',str(s or '').lower()).encode('ascii','ignore').decode()
           return ' '.join(re.findall(r'[a-z0-9]+',s))
          def course(s):return re.sub(r'\s+(ire|gb|aw)$','',norm(s))
          def kind(s):
           n=norm(s)
           if n in ('chase','steeplechase','steeple chase'):return 'chase'
           if n in ('hurdle','hurdles'):return 'hurdle'
           if n in ('nh flat','national hunt flat','bumper'):return 'nh flat'
           if n in ('flat','flat turf'):return 'flat'
           return n

          def num(s):
           try:
            v=float(s);return v if math.isfinite(v) else None
           except (ValueError,TypeError):return None

          def class_num(x):
           if x is None:return None
           m=re.search(r'\b([1-7])\b',str(x))
           return int(m.group(1)) if m else None

          def distance_num(v):
           x=num(v)
           if x is not None:return x
           s=str(v or '').lower().replace(' ','').replace('½','.5').replace('¼','.25').replace('¾','.75')
           m=re.search(r'(\d+(?:\.\d+)?)m',s);f=re.search(r'(\d+(?:\.\d+)?)f',s)
           y=re.search(r'(\d+(?:\.\d+)?)y',s)
           if not(m or f or y):return None
           return (8*float(m.group(1)) if m else 0)+(float(f.group(1)) if f else 0)+(float(y.group(1))/220 if y else 0)

          def going_score(value):
           s=norm(value)
           if not s:return None
           if 'standard' in s:return -1
           if 'heavy' in s:return 4
           if 'soft' in s and 'yield' in s:return 2.7
           if 'good' in s and 'soft' in s:return 2
           if 'soft' in s:return 3
           if 'good' in s and 'yield' in s:return 1.5
           if 'yield' in s:return 2
           if 'firm' in s and 'good' in s:return 0.5
           if 'firm' in s:return 0
           if 'good' in s:return 1
           return None

          def band(n):
           if n is None:return 'unknown'
           if n<=5:return '2-5'
           if n<=9:return '6-9'
           if n<=13:return '10-13'
           return '14+'

          def cond_flags(text):
           s=norm(text)
           return {
            'handicap':bool(re.search(r'\bhandicap\b',s)),
            'novice':bool(re.search(r'\bnovice\w*\b',s)),
            'maiden':bool(re.search(r'\bmaiden\b',s)),
            'mares':bool(re.search(r'\bmares?\b|\bfillies?\b',s)),
            'juvenile':bool(re.search(r'\bjuvenile\b',s)),
            'beginners':bool(re.search(r'\bbeginners?\b',s)),
            'claiming':bool(re.search(r'\bclaim\w*\b',s)),
            'listed':bool(re.search(r'\blisted\b',s)),
            'group':bool(re.search(r'\bgroup\s*[123]\b',s)),
            'grade':bool(re.search(r'\bgrade\s*[123]\b',s)),
           }

          def conditions_match(card,old_title,strict=True):
           a=cond_flags(str(card['race_condition'])+' '+card['race_title']);b=cond_flags(old_title)
           # These properties define fundamentally different races. Never treat a handicap
           # as a non-handicap, or a juvenile/mares race as unrestricted, at strict tiers.
           core=('handicap','novice','maiden','mares','juvenile','beginners','claiming')
           if strict:
            if any(a[k]!=b[k] for k in core):return False
            if a['listed'] and not b['listed']:return False
            if a['group'] and not b['group']:return False
            if a['grade'] and not b['grade']:return False
           else:
            if a['handicap']!=b['handicap']:return False
            if a['mares']!=b['mares']:return False
            if a['juvenile']!=b['juvenile']:return False
            if a['maiden'] and not b['maiden']:return False
           return True

          def season_gap(d, target):
           # Days within seasonal window accounting for Dec/Jan and leap days.
           return min(abs((d.replace(year=2000)-target.replace(year=2000)).days),
                      abs((d.replace(year=2000)-target.replace(year=2000)).days-366),
                      abs((d.replace(year=2000)-target.replace(year=2000)).days+366))

          def region(c):
           return 'IRE' if course(c) in {'cork','curragh'} else 'GB'

          def writecsv(path, cols, rows):
           with open(path,'w',newline='',encoding='utf-8-sig') as f:
            w=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore');w.writeheader();w.writerows(rows)

          class Repository:
           def __init__(self, db):
            self.cx=sqlite3.connect('file:'+Path(db).resolve().as_posix()+'?mode=ro',uri=True)
            self.cx.row_factory=sqlite3.Row
            expected={'id','race_date','course','race_type','surface','distance_f','going','race_class'}
            available={r['name'] for r in self.cx.execute('pragma table_info(historical_races)')}
            if expected-available:raise ValueError(f'Missing historical_races columns: {expected-available}')
            needed={'race_id','horse_name','finish_pos','outcome','age','official_rating','draw','sp_decimal','trainer','jockey'}
            found={r['name'] for r in self.cx.execute('pragma table_info(historical_runs)')}
            if needed-found:raise ValueError(f'Missing historical_runs columns: {needed-found}')
            self.cache={}
           def get_runs(self,rid):
            if rid not in self.cache:
             q='select horse_name,finish_pos,outcome,age,official_rating,draw,sp_decimal,trainer,jockey from historical_runs where race_id=?'
             rows=[dict(x) for x in self.cx.execute(q,(rid,))]
             starters=[x for x in rows if norm(x.get('outcome')).upper().replace(' ','') not in GENERIC_NO_RUN]
             # Explicit NR strings checked separately; missing SP is not proof of non-runner.
             starters=[x for x in starters if str(x.get('outcome') or '').strip().upper() not in GENERIC_NO_RUN]
             winners=[x for x in starters if x['finish_pos']==1]
             ok=2<=len(starters)<=40 and 1<=len(winners)<=3
             self.cache[rid]={'runners':starters,'valid':ok,'field':len(starters),'winners':len(winners),'dead_heat':len(winners)>1}
            return self.cache[rid]

          def summary(n):return round(n,2) if n is not None else ''

          def main():
           ap=argparse.ArgumentParser();ap.add_argument('--db',required=True);ap.add_argument('--cards',required=True);ap.add_argument('--mapping',required=True);ap.add_argument('--out',default='sunday_strict_trends'); args=ap.parse_args()
           out=Path(args.out);out.mkdir(parents=True,exist_ok=True)
           cards=list(csv.DictReader(open(args.cards,encoding='utf-8-sig')))
           assert len(cards)==36 and len({(r['course'],r['post_time']) for r in cards})==36,'Expected exactly 36 distinct Sunday races'
           target=dt.date(2026,11,1)
           cards=[{**c,'distance_n':distance_num(c['distance_f']),'size_n':int(c['declared_runners']), 'class_n':class_num(c['race_class']), 'ground_n':going_score(c['going'])} for c in cards]
           db=Repository(args.db)
           # Read race metadata and exact original titles from the previously audited
           # race identity map; preserve source keys to the unmodified Stage 2 SQLite DB.
           meta={}; index={}; duplicate_meta=0
           with open(args.mapping,encoding='utf-8-sig',newline='') as f:
            for row in csv.DictReader(f):
             rid=row['stage2_race_id']
             if rid in meta:duplicate_meta+=1;continue
             meta[rid]={'race_title':row.get('race_name',''),'event_id':row.get('event_id',''), 'match_status':row.get('match_status','')}
           if duplicate_meta:raise ValueError(f'Mapping contains {duplicate_meta} duplicate individual race keys')
           wanted={course(c['course']) for c in cards}
           races_by_course=collections.defaultdict(list);races_by_region_type=collections.defaultdict(list)
           missing_map=0;all_prior=0
           for x in db.cx.execute('select id,race_date,course,race_type,surface,distance_f,going,race_class from historical_races where race_date<?',(target.isoformat(),)):
            try:d=dt.date.fromisoformat(str(x['race_date'])[:10])
            except ValueError:continue
            c=course(x['course']);t=kind(x['race_type'])
            if t not in {'flat','nh flat','hurdle','chase'}:continue
            source=meta.get(x['id'])
            if source is None:missing_map+=1;continue
            o={'rid':x['id'],'date':d,'course':c,'kind':t,'dist':num(x['distance_f']),'going':going_score(x['going']),'class':class_num(x['race_class']),'race_name':source['race_title'],'event_id':source['event_id'],'status':source['match_status'], 'raw_course':x['course'], 'raw_going':x['going'], 'raw_class':x['race_class']}
            if c in wanted:races_by_course[c].append(o)
            if (c in wanted or t in {'flat','nh flat','hurdle','chase'}) and region(x['course']) in ('GB','IRE'):
             # For fallback, country membership must be verified separately below.
             pass
            all_prior+=1
           # Country-wide fallback derived from the known British and Irish course names
           # of Sunday tracks only would be misleading: no cross-track pool is generated.
           tiers=[
            ('A_STRICT_SAME_COURSE',0.75,60,True,True,True,True,True),
            ('B_GOING_RELAXED',1.0,90,True,False,True,True,True),
            ('C_CLASS_RELAXED',1.25,120,False,False,True,True,True),
            ('D_FIELD_RELAXED',1.5,180,False,False,False,True,True),
            ('E_SAME_COURSE_LONG_HISTORY',1.5,366,False,False,False,False,False),
           ]
           record_rows=[];trend_rows=[];runner_rows=[];named_rows=[];pool_rows=[];missing=[]
           for c in cards:
            targetkey=(c['course'],c['post_time']);potential=races_by_course[course(c['course'])]
            valid_pool=[];chosen=None;counts={};eligible_by_tier={};
            # Grouping controlled by historical *race date* only; today's card never appears in training.
            for label,tolerance,window,need_class,need_ground,need_field,strict_cond,window_active in tiers:
             eligible=[]
             for r in potential:
              if r['kind']!=kind(c['race_type']) or r['dist'] is None or c['distance_n'] is None:continue
              if abs(r['dist']-c['distance_n'])>tolerance:continue
              if window_active and season_gap(r['date'],target)>window:continue
              if not conditions_match(c,r['race_name'],strict_cond):continue
              if need_class and c['class_n'] is not None:
               if r['class']!=c['class_n']:continue
              if need_ground and c['ground_n'] is not None:
               if r['going'] is None or abs(c['ground_n']-r['going'])>0.8:continue
              stats=db.get_runs(r['rid'])
              if not stats['valid']:continue
              if need_field and band(stats['field'])!=band(c['size_n']):continue
              eligible.append(r)
             counts[label]=len(eligible);eligible_by_tier[label]=eligible
             if not chosen and len(eligible)>=40:chosen=label;valid_pool=eligible
            if chosen is None:
             chosen=next((name for name,*_ in reversed(tiers) if counts[name]>=1),'NO_COMPARABLE_HISTORY')
             valid_pool=eligible_by_tier.get(chosen,[])
            size=sum(db.get_runs(r['rid'])['field'] for r in valid_pool)
            unique_years=len({r['date'].year for r in valid_pool})
            dh=sum(db.get_runs(r['rid'])['dead_heat'] for r in valid_pool)
            named_anchor=NAMED_ANCHORS.get(targetkey)
            named_history=[]
            if named_anchor:
             for r in potential:
              if r['kind']!=kind(c['race_type']):continue
              if re.search(named_anchor,norm(r['race_name'])):
               res=db.get_runs(r['rid'])
               if not res['valid']:continue
               named_history.append(r)
               wins=[v for v in res['runners'] if v['finish_pos']==1]
               named_rows.append({'course':c['course'],'post_time':c['post_time'],'target_race':c['race_title'],'edition_year':r['date'].year,'historical_date':r['date'].isoformat(),'historical_race_name':r['race_name'],'historical_race_id':r['rid'],'provisional_event_id':r['event_id'],'identity_status':'TITLE_ANCHOR_CANDIDATE_NOT_EXTERNALLY_VERIFIED', 'winner_names':' / '.join(x['horse_name'] for x in wins),'winning_sp_decimal':' / '.join(str(x['sp_decimal'] or '') for x in wins),'field_size':res['field'],'dead_heat':res['dead_heat']})
            rec={'meeting':c['course'],'post_time':c['post_time'],'race_title':c['race_title'],'race_type':c['race_type'],'race_class':c['race_class'],'going':c['going'],'distance_f':c['distance_n'],'declared_runners_snapshot':c['size_n'],'race_condition':c['race_condition'],'named_title_candidates':len(named_history),'named_candidate_years':len({r['date'].year for r in named_history}),'selected_tier':chosen,'historical_races_in_selected_tier':len(valid_pool),'historical_runner_starts_in_selected_tier':size,'historical_years_in_selected_tier':unique_years,'historic_dead_heat_races_in_selected_tier':dh,**counts,'evidence_strength':('DESCRIPTIVE_SAMPLE_AT_LEAST_40_RACES' if len(valid_pool)>=40 else 'SMALL_SAMPLE_DO_NOT_INFER_TRENDS' if valid_pool else 'NO_SUITABLE_HISTORICAL_RUNNERS'),'going_status':('UNKNOWN_NO_GOING_FILTER' if c['ground_n'] is None else 'SOURCE_SNAPSHOT'),'class_status':('UNSPECIFIED_CLASS_NO_CLASS_FILTER' if c['class_n'] is None else 'SOURCE_SNAPSHOT'),'source_url':c['source_url']}
            record_rows.append(rec)
            if not valid_pool:missing.append(rec);continue
            attr=collections.defaultdict(lambda:[0,0.]); total=sum(db.get_runs(r['rid'])['field'] for r in valid_pool)
            for r in valid_pool:
             dat=db.get_runs(r['rid']);w=dat['winners'];score=1/w
             pool_rows.append({'sunday_course':c['course'],'sunday_time':c['post_time'],'tier':chosen,'historic_race_id':r['rid'],'historic_date':r['date'].isoformat(),'historic_name':r['race_name'],'historic_class':r['raw_class'],'historic_going':r['raw_going'],'historic_field_size':dat['field'],'historic_winner_count':w,'historic_event_id':r['event_id'],'event_link_status':r['status']})
             for x in dat['runners']:
              iswin=x['finish_pos']==1
              # Only use fields known prior to this historical race: age, pre-race OR and draw.
              age=num(x['age']);orating=num(x['official_rating']);draw=num(x['draw'])
              dimensions=[('age',str(int(age)) if age and 2<=age<=20 else 'unknown'),
                          ('age_group',('2-3' if age<=3 else '4-5' if age<=5 else '6-7' if age<=7 else '8-9' if age<=9 else '10+') if age and age>=2 else 'unknown'),
                          ('official_rating_10',str(int(orating//10)*10)+'-'+str(int(orating//10)*10+9) if orating is not None and 0<orating<200 else 'unknown')]
              if kind(c['race_type'])=='flat':
               dimensions.append(('draw_relative',('low_third' if draw<=dat['field']/3 else 'middle_third' if draw<=dat['field']*2/3 else 'high_third') if draw is not None and 1<=draw<=dat['field'] else 'unknown'))
              for dim,v in dimensions:
               attr[(dim,v)][0]+=1
               if iswin:attr[(dim,v)][1]+=score
              runner_rows.append({'sunday_course':c['course'],'sunday_time':c['post_time'],'historic_date':r['date'].isoformat(),'historic_race_id':r['rid'],'historic_horse':x['horse_name'],'historic_finish_pos':x['finish_pos'],'historic_winner_credit':round(score if iswin else 0,3),'age':x['age'],'official_rating':x['official_rating'],'draw':x['draw'],'sp_decimal':x['sp_decimal'],'trainer':x['trainer'],'jockey':x['jockey'],'pool_tier':chosen})
            # Winner-credit denominator is number of historic races including dead heats.
            winbase=len(valid_pool)
            for (dim,val),(n,wins) in sorted(attr.items()):
             if val=='unknown' or n<3:continue
             share=n/total;wshare=wins/winbase
             enrich=(wshare/share if share else None)
             trend_rows.append({'course':c['course'],'post_time':c['post_time'],'race_title':c['race_title'],'tier':chosen,'historical_races':winbase,'historical_runners':total,'dimension':dim,'value':val,'runners_with_trait':n,'winner_credit_with_trait':round(wins,3),'runner_share_pct':round(100*share,2),'winner_share_pct':round(100*wshare,2),'enrichment_vs_runner_share':round(enrich,3) if enrich is not None else '', 'evidence_warning':('AT_LEAST_40_RACES_EXPLORATORY_NOT_VALIDATED' if winbase>=40 and wins>=5 else 'LOW_SAMPLE_OR_FEW_WINNERS')})
