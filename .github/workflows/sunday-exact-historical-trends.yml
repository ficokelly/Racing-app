           if pool_rows:writecsv(out/'selected_historical_races.csv',list(pool_rows[0]),pool_rows)
           if runner_rows:writecsv(out/'actual_historical_runner_records.csv',list(runner_rows[0]),runner_rows)
           coverage={'status':'COMPLETE','date':'2026-11-01','races_in_snapshot':len(cards),'historical_database':'Stage 2 historical_races + historical_runs (read-only)','source_named_race_mapping':'Stage 4 reference mapping, not an official identity authority','race_metadata_before_today':all_prior,'records_missing_source_title_mapping':missing_map,'races_with_40plus_historic_comparisons':sum(x['historical_races_in_selected_tier']>=40 for x in record_rows),'races_with_1plus_historic_comparisons':sum(x['historical_races_in_selected_tier']>=1 for x in record_rows),'races_without_historic_comparisons':[x['meeting']+' '+x['post_time'] for x in missing],'named_title_candidate_editions':len(named_rows),'selected_historical_runner_records':len(runner_rows),'limitations':['Historical winners compared with all actual historical starters; dead-heat winners have fractional winner-credit summing to one per race.','Tiers A-D require current course, discipline, eligible race conditions, distance and varying going/class/field size constraints. Tier E is explicitly broad.','When historical class is missing, tiers requiring class omit the race; relaxed tiers may include it.','Historic race titles are imperfect evidence of restrictions and grade. Some source metadata may be misclassified.','Named annual matching uses original title anchors, not independent proof of event continuity.','Current runner names and current form are NOT in the published 36-race snapshot; no runner ranking or win-probability claims made.','Source published going and runner counts can change, especially through non-runners.','Historical trait associations are descriptive and do NOT imply betting value, out-of-sample predictive accuracy or causal effects.','Ratings are used as pre-race official ratings; RPR and Topspeed are excluded due possible post-race data leakage.','Exact going/class restrictions in historical records can leave sparse samples; the tier selected is always recorded.','Not all available records are necessarily UK/Ireland-only; per-race comparisons are at the same known course only.']}
           (out/'research_audit.json').write_text(json.dumps(coverage,indent=2))
           (out/'README_FIRST.txt').write_text('Sunday 1 November 2026 — actual historical winner-vs-runner research.\nRead sunday_race_historical_comparisons.csv first.\nDo not conflate named_title_candidates with verified annual race IDs.\nA = strict; B = going relaxed; C = class relaxed; D = field relaxed; E = broad same-course context.\nLow samples cannot establish robust trends. No live recommendations in this stage.\n')
           print(json.dumps(coverage,indent=2))

          if __name__=='__main__':main()
          SUNDAY_PYTHON_ENGINE
      - name: Retrieve existing Stage 2 database and Stage 4 named race mapping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'DOWNLOAD_EXISTING_ARTIFACTS'
          import json, os, subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          result=subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts','--method','GET','-f','per_page=100'],text=True)
          artifacts=json.loads(result)['artifacts']
          for wanted,folder,key,needle,extensions in [
           ('stage2-historical-staging-database','historic_db','SOURCE_DB',None,('.sqlite','.db')),
           ('stage4-reference-named-events-and-winners','race_identity_map','IDENTITY_MAP','all_races_with_reference_event_ids.csv',('.csv',)),
          ]:
           matches=[a for a in artifacts if not a['expired'] and a['name']==wanted]
           if not matches:raise SystemExit(f'Missing or expired {wanted}. Rerun the source workflow first.')
           a=max(matches,key=lambda x:x['created_at'])
           print('Downloading',a['name'],'from run',a['workflow_run']['id'],flush=True)
           subprocess.run(['gh','run','download',str(a['workflow_run']['id']),'--repo',repo,'--name',a['name'],'--dir',folder],check=True)
           paths=[p for p in Path(folder).rglob('*') if p.is_file() and (p.name==needle if needle else p.suffix in extensions)]
           if not paths:raise SystemExit(f'No matching file found in {wanted}: {folder}')
           path=max(paths,key=lambda p:p.stat().st_size).resolve()
           with open(os.environ['GITHUB_ENV'],'a') as f:print(key+'='+str(path),file=f)
           print(key,str(path),path.stat().st_size,flush=True)
          DOWNLOAD_EXISTING_ARTIFACTS
      - name: Compare previous winners with every historical starter
        run: |
          python sunday_historical_engine.py \
            --db "$SOURCE_DB" \
            --mapping "$IDENTITY_MAP" \
            --cards sunday_current_cards.csv \
            --out sunday_historical_research
      - name: Upload Sunday historical research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunday-2026-exact-historical-trends
          path: sunday_historical_research/
          if-no-files-found: warn
          retention-days: 30
