name: Publish Racing Hot Pots Race Results
on:
  schedule:
    - cron: '7,22,37,52 10-22 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      externally_triggered:
        type: boolean
        default: false
    secrets:
      PUNTERSEDGE_API_KEY:
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: publish-racing-hot-pots-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the result collection window
        id: window
        env:
          EXTERNAL_RESULTS: ${{ inputs.externally_triggered }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from os import environ
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('Europe/Dublin'))
          external = environ.get('EXTERNAL_RESULTS') == 'true'
          collect = not external or (10 <= now.hour < 23 and now.minute % 15 < 6)
          with open(environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'collect={str(collect).lower()}\n')
          PY
      - name: Publish new or amended final results
        if: steps.window.outputs.collect == 'true'
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python collect-puntersedge-results.py
            git add -- data/race-results.json
            if git diff --cached --quiet; then
              echo 'No new or amended results to publish.'
              exit 0
            fi
            git commit -m 'Publish verified race results'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          echo '::error::Result publication could not push after three attempts.'
          exit 1
