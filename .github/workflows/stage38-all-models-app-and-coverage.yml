# Stage 125: Retire the legacy, no-date Stage38 D/Z publisher.
# It previously overwrote a newer 2026-11-14 READY forecast with a stale
# 2026-11-13 NO_UPCOMING_FIELDS forecast on 2026-11-13 at 23:50 UTC.
# The current authoritative scheduler is stage38-model-d-repair.yml.
# This compatibility entry retains the old Actions name and dispatch modes.
# There is deliberately no cron schedule: the guarded workflow owns the schedule.
# No model source, racecards, results, or selected horses are modified here.
name: Stage 38 - Every Race A B C D Z Assessment and Commentary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual legacy action; guarded scorer is used for scoring'
        required: true
        type: choice
        options:
          - install-and-score
          - install-ui-only
          - score-only
        default: install-and-score

permissions:
  contents: read
  actions: write

jobs:
  guarded-score:
    if: ${{ inputs.mode != 'install-ui-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the currently maintained pre-off D/Z + all-model coverage workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run stage38-model-d-repair.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Forwarded to stage38-model-d-repair.yml, which checks for future races and refuses empty/stale forecasts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The forwarded job is separate; check its conclusion in GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"
  legacy-ui-notice:
    if: ${{ inputs.mode == 'install-ui-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Legacy UI already deployed; do not replace source scripts
        run: |
          echo 'Stage38 legacy UI was previously installed. No file changes made.' >> "$GITHUB_STEP_SUMMARY"
          echo 'For refreshed rankings use the guarded Stage38 Model D Daily Scoring workflow.' >> "$GITHUB_STEP_SUMMARY"
