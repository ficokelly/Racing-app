name: Stage 38 - Every Race A B C D Z Assessment and Commentary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'App-only fast update, live scoring, or both'
        required: true
        type: choice
        options:
          - install-and-score
          - install-ui-only
          - score-only
        default: install-and-score
  schedule:
    - cron: '25 7,11,15,18 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: stage38-unified-all-models
  cancel-in-progress: false

jobs:
  install-ui:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'score-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact checked Stage38 code without overwriting subsequent edits
        run: |
          set -euo pipefail
          python - <<'PY_ASSETS'
          import base64,gzip,hashlib
          from pathlib import Path
          package = {
            'scripts/stage38_model_dz_live.py': ('', '13c7a99559b2af5213a68b0c3282c026e408987841b749e38807c0fb7d57f0e5'),
            'scripts/stage38_fullfield_bridge.py': ('', '8ae185cdad0f3fd9ec0e54c9803d470e42d261a9cd2e8d9fb73c9b4a6e9f52b9'),
            'scripts/stage38_app.js': ('', 'f71925d712e33be1dbf267e4714f122a6057578f6e1b3adafd74325d140921a2'),
            'scripts/stage38_ui_patch.py': ('', '34cdd017cfcfed3ca4abcb718a05bbef49c60b1b9ac162394d7580d95faec94d'),
            'scripts/stage38_z_dashboard.js': ('', '966bd63a5b1481ff875446a2be4b27e2f830da9482c743a43b1d648e90984367'),
          }
          for path,(encoded,sha) in package.items():
              p=Path(path)
              raw=gzip.decompress(base64.b64decode(encoded))
              if hashlib.sha256(raw).hexdigest()!=sha:raise SystemExit('Stage38 file mismatch: '+path)
              if p.exists():
                  if hashlib.sha256(p.read_bytes()).hexdigest()!=sha:
                      raise SystemExit('Existing Stage38 source was manually changed; refusing to silently overwrite '+path)
                  print('Verified existing Stage38 file:',path)
                  continue
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(raw)
              print('Restored Stage38:',path,len(raw),'bytes')
          PY_ASSETS
      - name: Apply all five model tabs, readable commentary and racecard layout
        run: |
          set -euo pipefail
          python -m py_compile scripts/stage38_model_dz_live.py scripts/stage38_fullfield_bridge.py scripts/stage38_ui_patch.py
          node --check scripts/stage38_app.js
          node --check scripts/stage38_z_dashboard.js
          python scripts/stage38_fullfield_bridge.py --self-test
          python scripts/stage38_ui_patch.py --self-test
          python scripts/stage38_ui_patch.py
          # Model C gets extra evening independent reassessment runs.
          python - <<'PY_CADENCE'
          from pathlib import Path
          p=Path('.github/workflows/stage21-model-c-live.yml')
          if p.is_file():
              s=p.read_text()
              old='- cron: "12 7,10,13,16 * * *"'
              new='- cron: "12 7,10,13,16,18,19,20 * * *"'
              if old in s:
                  p.write_text(s.replace(old,new,1))
                  print('Added two evening Model C scoring slots')
              elif new in s:print('Model C evening slots already present')
              else:print('C schedule changed upstream; keeping existing C workflow unchanged')
          PY_CADENCE
          python - <<'PY_A_CADENCE'
          from pathlib import Path
          p=Path('.github/workflows/stage13-strategy-learning.yml')
          if p.exists():
              s=p.read_text()
              old="- cron: '30 9,11,14,17 * * *'"
              new="- cron: '30 9,11,14,17,19 * * *'"
              if old in s:
                  p.write_text(s.replace(old,new,1))
                  print('Added late independent Model A/B historical refresh')
              elif new not in s:print('A/B schedule differs upstream; keeping as-is')
          PY_A_CADENCE
          python - <<'PY_APP_CHECK'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert all(s.count(f'data-rc-model="{m}"')==1 for m in 'ABCDZ')
          assert all(s.count(f'data-ab-model="{m}" data-ab-view="selections"')==1 for m in 'ABCDZ')
          assert all(s.count(f'data-ab-model="{m}" data-ab-view="results"')==1 for m in 'ABCDZ')
          assert s.count('Stage38: integrated, labelled A/B/C/D/Z independent race assessment views.')==1
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,flags=re.I)
          Path('/tmp/stage38-inline.js').write_text('\n'.join(blocks))
          PY_APP_CHECK
          node --check /tmp/stage38-inline.js
          test -s model-z.html
      - name: Commit additive app integration with conflict-safe refresh
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/stage38-source-backup
          cp scripts/stage38* /tmp/stage38-source-backup/
          for attempt in 1 2 3; do
            # Pull remote BEFORE making a new patch; no manual changes are ever overwritten.
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/stage38-source-backup/stage38* scripts/
              python scripts/stage38_ui_patch.py
            fi
            git add scripts/stage38_model_dz_live.py scripts/stage38_fullfield_bridge.py scripts/stage38_app.js scripts/stage38_ui_patch.py scripts/stage38_z_dashboard.js index.html model-z.html .github/workflows/stage21-model-c-live.yml .github/workflows/stage13-strategy-learning.yml
            if git diff --cached --quiet; then echo 'Stage38 UI already installed';exit 0;fi
            git commit -m 'Stage38: every-race model view, readable commentary, frozen D and Z research'
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Stage38 app and source installed';exit 0
            fi
            git rebase --abort || true
          done
          echo 'Stage38 UI commit conflict could not be resolved safely' >&2
          exit 1

  score-independent-dz:
    needs: [install-ui]
    if: ${{ always() && (needs.install-ui.result == 'success' || needs.install-ui.result == 'skipped') && (github.event_name == 'schedule' || github.event.inputs.mode != 'install-ui-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent historical scorer dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 kagglehub
      - name: Validate the frozen score engine and all-race coverage bridge
        run: |
          set -euo pipefail
          for path in scripts/stage30_gap_aware_abcd.py scripts/stage38_model_dz_live.py scripts/stage38_fullfield_bridge.py reports/stage30/stage30-summary.json reports/stage34/stage34-frozen-track-profiles.json data/model-z-strategies.json; do
             test -s "$path"
          done
          python scripts/stage30_gap_aware_abcd.py --self-test
          python scripts/stage38_model_dz_live.py self-test
          python scripts/stage38_fullfield_bridge.py --self-test
      - name: Download or rebuild full historical racing database (no Betfair)
        env:
          GH_TOKEN: ${{ github.token }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];winner=None
          for page in range(1,21):
              raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts',
                                           '-f','per_page=100','-f',f'page={page}'],text=True)
              rows=json.loads(raw).get('artifacts',[])
              for r in rows:
                  if r.get('name')=='stage2-historical-staging-database' and not r.get('expired'):
                      if not winner or r.get('created_at','')>winner.get('created_at',''):winner=r
              if len(rows)<100:break
          # Stage 2 keeps its staging SQLite artifact for only three days.
          # When that expires, rebuild from its original Kaggle dataset, not from
          # an abbreviated set of recent app results. No Betfair API is needed.
          Path('stage38_db').mkdir(exist_ok=True)
          matches=[]
          if winner:
              rid=str(winner['workflow_run']['id'])
              try:
                  subprocess.run(['gh','run','download',rid,'--repo',repo,
                                  '--name',winner['name'],'--dir','stage38_db'],check=True)
                  matches=list(Path('stage38_db').rglob('*.sqlite'))
                  print('Downloaded staging archive from run:',rid,flush=True)
              except subprocess.CalledProcessError:
                  print('Historical database artifact download failed; rebuilding',flush=True)
          if matches:
              db=max(matches,key=lambda p:p.stat().st_size).resolve()
          else:
              import sys
              print('Historical database artifact expired. Rebuilding the full UK/IE archive.',flush=True)
              subprocess.run([sys.executable,'-m','pip','install',
                              '--disable-pip-version-check','kagglehub'],check=True)
              import kagglehub
              source=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025')
              db=Path('stage38_db/historical_ukie_staging.sqlite').resolve()
              subprocess.run([sys.executable,'import_historical_ukie.py',
                              '--mode','import','--input',str(source),
                              '--min-date','1988-01-01','--max-date','2026-10-07',
                              '--database',str(db),
                              '--report','stage38_db/historical_stage2_report.json'],check=True)
              subprocess.run([sys.executable,'audit_history_coverage.py',
                              '--database',str(db),'--expect-first-year','1988',
                              '--output','stage38_db/historical_annual_coverage.csv',
                              '--summary','stage38_db/historical_coverage_summary.json'],check=True)
              print('Rebuilt historical archive from original source',flush=True)
          if not db.is_file() or db.stat().st_size<10_000_000:
              raise SystemExit('No valid historical SQLite database available for Stage38')
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE38_DB='+str(db),file=f)
          print('Historical database size:',db.stat().st_size,flush=True)
          PY

      - name: Score independent frozen Model D and Model Z paper candidates
        run: |
          set -euo pipefail
          python -u scripts/stage38_model_dz_live.py live --repo . --db "$STAGE38_DB"
          python scripts/stage38_fullfield_bridge.py --repo .
          python - <<'PY_VALIDATE'
          import json
          from pathlib import Path
          data=Path('data')
          d=json.loads((data/'strategy-d-probabilities.json').read_text())
          z=json.loads((data/'strategy-z-probabilities.json').read_text())
          b=json.loads((data/'strategy-b-all-races.json').read_text())
          c=json.loads((data/'model-assessment-coverage.json').read_text())
          registry=json.loads((data/'model-z-strategies.json').read_text())
          assert d['model']=='D' and d['version']==1 and d['selection_policy']=='RESEARCH_ONLY_NOT_PROVEN_PROFITABLE'
          assert z['model']=='Z' and z['automatic_paper_only'] is True and not z['live_models_changed']
          assert not registry['active_strategy_ids']
          assert b['model']=='B' and c['version']==1 and len(b['races'])==len(c['races'])
          assert all(set(row['models'])==set('ABCDZ') for row in c['races'])
          assert all(r['selection_status'] in ('PAPER_ONLY','NO_SELECTION') for r in z['races'])
          print('Independent D:',d['state'],len(d['races']),'Z specialist races:',len(z['races']))
          print('All-race assessment coverage:',c['summary'])
          PY_VALIDATE
      - name: Publish independent D/Z research and B fallback only, not A B C or real bets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strategy-b-all-races.json data/model-assessment-coverage.json data/strategy-d-probabilities.json data/strategy-d-results.json data/strategy-d-history.json data/strategy-z-probabilities.json data/strategy-z-paper-history.json data/strategy-z-results.json
          if git diff --cached --quiet; then echo 'No data updates';exit 0;fi
          git commit -m 'Stage38: independent every-race coverage and frozen D/Z paper forecasts'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo 'Independent assessments published';exit 0;fi
            git rebase --abort || true
            sleep "$((attempt*3))"
          done
          echo 'D/Z computed but GitHub publication failed' >&2
          exit 1
      - name: Preserve research feed files on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage38-research-dz-and-race-coverage
          path: |
            data/strategy-d-probabilities.json
            data/strategy-z-probabilities.json
            data/strategy-z-paper-history.json
            data/strategy-b-all-races.json
            data/model-assessment-coverage.json
          retention-days: 14
          if-no-files-found: warn
