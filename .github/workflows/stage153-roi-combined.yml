name: 'Stage153 — ROI Specialists single Hot Pots model'

on:
  workflow_dispatch:
    inputs:
      validated_run_id:
        description: 'Optional successful Stage196F validation run ID to publish. Leave blank for Stage153.'
        required: false
        type: string
        default: ''
      selection_date:
        description: 'Dublin date, today or tomorrow (blank = tomorrow for evening runs; today otherwise)'
        required: false
        type: string
        default: ''
  schedule:
    # Start far enough ahead for slower underlying historical specialist runs.
    # Target first view 20:00 the evening before, then 08/10/12/14/16 Dublin.
    - cron: '7 18 * * *'
      timezone: 'Europe/Dublin'
    - cron: '7 7,9,11,13,15 * * *'
      timezone: 'Europe/Dublin'

permissions:
  contents: write
  actions: write

concurrency:
  group: stage153-roi-combined-publication
  cancel-in-progress: false

jobs:
  combine:
    if: ${{ !inputs.validated_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TZ: Europe/Dublin
    steps:
      - name: Checkout full current app, preserving underlying research files
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm date and fail-closed assembler
        env:
          REQUESTED: ${{ inputs.selection_date }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage153_roi_combined.py self-test
          python -m py_compile scripts/stage153_roi_combined.py
          python - <<'PY'
          import datetime as dt,os
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo('Europe/Dublin'))
          requested=os.environ.get('REQUESTED','')
          target=requested or (now.date()+dt.timedelta(days=int(now.hour>=18))).isoformat()
          allowed={now.date().isoformat(),(now.date()+dt.timedelta(days=1)).isoformat()}
          if target not in allowed:raise RuntimeError('Only today/tomorrow live selections permitted')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TARGET_DAY='+target+'\n')
          print('STAGE153_TARGET',target,'STARTED',now.isoformat())
          PY
      - name: Refresh live racecards (including explicit withdrawals) once before specialist dispatch
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RACING_API_USERNAME:-}" && test -n "${RACING_API_PASSWORD:-}"
          python scripts/stage26_feed_capture.py racecards
          python - <<'PY'
          import datetime as dt,json,os
          from pathlib import Path
          j=json.loads(Path('data/racecards.json').read_text())
          n=len({r.get('race_id') for r in j.get('runners',[]) if r.get('date')==os.environ['TARGET_DAY']})
          if n<1:raise RuntimeError('No refreshed racecards for target, cannot invent selections')
          print('STAGE153_DECLARED_RACES',n)
          PY
          cp data/racecards.json "$RUNNER_TEMP/stage153-refreshed-racecards.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/stage153-refreshed-racecards.json" data/racecards.json
            git add data/racecards.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'Stage153: refresh UK IE declarations before specialist run'
            if git push origin HEAD:main; then break; fi
            sleep "$((attempt*5))"
            test "$attempt" -lt 5 || exit 1
          done
      - name: Check whether Stage196F owns this date
        id: active-feed
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          feed = json.loads(Path('data/strategy-roi-combined.json').read_text())
          retained = os.environ['TARGET_DAY'] in feed.get('stage196f_publications', {})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'retain_stage196f={str(retained).lower()}\n')
          PY
      - name: Dispatch all required independent specialist scorers and capture new run IDs
        if: ${{ steps.active-feed.outputs.retain_stage196f == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stage153/source
          python - <<'PY'
          import datetime as dt,json,os,pathlib,subprocess,time
          workflows=[
            ('stage141-today-or-weight-paper.yml','stage141-today-hpr-or-weight-'),
            ('stage151-d142-core-form-or-weight-today.yml','stage151-d142-core-form-weight-today-'),
            ('stage152-best-roi-specialists-today.yml','stage152-best-roi-specialists-'),
            ('stage147-daily-143-146.yml','stage147-daily-143-146-'),
            ('stage128-g5-paper.yml','stage128-g5-paper-')]
          began=dt.datetime.now(dt.timezone.utc)-dt.timedelta(seconds=20)
          for name,_ in workflows:
            for attempt in range(1,4):
              result=subprocess.run(['gh','workflow','run',name,'--ref','main','-f',
                'selection_date='+os.environ['TARGET_DAY']],capture_output=True,text=True)
              if result.returncode==0:
                print('DISPATCHED',name,'attempt',attempt,flush=True)
                break
              print('DISPATCH_RETRY',name,attempt,result.stderr[:250],flush=True)
              if attempt==3:raise RuntimeError('Failed to dispatch required specialist '+name)
              time.sleep(attempt*10)
          pathlib.Path('reports/stage153/source/dispatch.json').write_text(json.dumps({
            'began':began.isoformat(),'workflows':workflows},indent=2))
          PY
      - name: Wait for today-specific source runs, never use stale or earlier-day artifacts
        if: ${{ steps.active-feed.outputs.retain_stage196f == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt,json,pathlib,subprocess,time
          home=pathlib.Path('reports/stage153/source')
          data=json.loads((home/'dispatch.json').read_text())
          began=dt.datetime.fromisoformat(data['began'])
          workflows=dict(data['workflows']);ids={};complete={};retry_count={}
          deadline=time.monotonic()+105*60
          while time.monotonic()<deadline:
            for wf in workflows:
              if wf in complete:continue
              try:
                r=subprocess.run(['gh','run','list','--workflow',wf,'--event','workflow_dispatch',
                 '--limit','8','--json','databaseId,createdAt,status,conclusion'],capture_output=True,text=True,check=True,timeout=40)
                fresh=[x for x in json.loads(r.stdout) if
                 dt.datetime.fromisoformat(x['createdAt'].replace('Z','+00:00'))>=began]
                if not fresh:continue
                x=max(fresh,key=lambda x:x['databaseId']);ids[wf]=x['databaseId']
                if x['status']=='completed':
                  conclusion=x.get('conclusion')
                  if conclusion!='success' and retry_count.get(wf,0)<1:
                    try:
                      subprocess.run(['gh','run','rerun',str(x['databaseId']),'--failed','--repo',
                         'ficokelly/Racing-app'],check=True,timeout=45,capture_output=True,text=True)
                      retry_count[wf]=retry_count.get(wf,0)+1
                      print('RETRY_SOURCE_FAILURE',wf,x['databaseId'],conclusion,flush=True)
                      continue
                    except subprocess.SubprocessError as error:
                      print('SOURCE_RETRY_UNAVAILABLE',wf,str(error)[:200],flush=True)
                  complete[wf]=conclusion
                  print('SOURCE_COMPLETE',wf,x['databaseId'],conclusion,flush=True)
              except (subprocess.SubprocessError,ValueError,KeyError) as e:
                print('SOURCE_POLL_WARNING',wf,str(e),flush=True)
            if len(complete)==len(workflows):break
            time.sleep(40)
          for wf,prefix in workflows.items():
            if complete.get(wf)!='success':
              print('UNAVAILABLE_SPECIALIST',wf,complete.get(wf,'timeout'),flush=True);continue
            destination=home/wf.removesuffix('.yml');destination.mkdir(exist_ok=True)
            for attempt in range(1,4):
              res=subprocess.run(['gh','run','download',str(ids[wf]),'--repo',
               'ficokelly/Racing-app','--name',prefix+str(ids[wf]),'--dir',str(destination)],
               capture_output=True,text=True)
              if res.returncode==0:
                print('ARTIFACT_DOWNLOADED',wf,ids[wf],flush=True)
                break
              print('ARTIFACT_DOWNLOAD_RETRY',wf,attempt,res.stderr[:250],flush=True)
              if attempt<3:time.sleep(attempt*10)
            else: print('ARTIFACT_UNAVAILABLE',wf,'after three attempts',flush=True)
          (home/'status.json').write_text(json.dumps({'ids':ids,'conclusions':complete,'automatic_retries':retry_count},indent=2))
          PY
      - name: Build one race-type ROI model and settle already finished preserved picks
        shell: bash
        run: |
          set -euo pipefail
          cp data/strategy-roi-combined.json "$RUNNER_TEMP/stage153-prior.json"
          if [[ "${{ steps.active-feed.outputs.retain_stage196f }}" == "false" ]]; then
            python scripts/stage153_roi_combined.py build \
              --date "$TARGET_DAY" --cards data/racecards.json \
              --sources reports/stage153/source \
              --output data/strategy-roi-combined.json
            python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/strategy-roi-combined.json')
          previous = json.loads((Path(os.environ['RUNNER_TEMP']) / 'stage153-prior.json').read_text())
          if 'stage196f_publications' in previous:
              payload = json.loads(path.read_text())
              payload['stage196f_publications'] = previous['stage196f_publications']
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          PY
          fi
          python scripts/stage153_roi_combined.py settle \
            --output data/strategy-roi-combined.json \
            --results data/race-results.json \
            --settled data/strategy-roi-combined-results.json
          if [[ -f reports/stage153/source/status.json ]]; then
            cat reports/stage153/source/status.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish source-model-attributed combined ranking without changing frozen models
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/strategy-roi-combined.json "$RUNNER_TEMP/stage153-combined.json"
          cp data/strategy-roi-combined-results.json "$RUNNER_TEMP/stage153-results.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/stage153-combined.json" data/strategy-roi-combined.json
            cp "$RUNNER_TEMP/stage153-results.json" data/strategy-roi-combined-results.json
            git add data/strategy-roi-combined.json data/strategy-roi-combined-results.json
            if git diff --cached --quiet; then echo 'Already published';exit 0;fi
            git commit -m "Stage153: publish race-type ROI specialists for $TARGET_DAY"
            if git push origin HEAD:main;then echo 'PUBLISHED';exit 0;fi
            sleep "$((attempt*4))"
          done
          exit 1
      - name: Preserve complete provenance, missing arms and selection coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage153-combined-${{ github.run_id }}
          path: |
            reports/stage153/source/dispatch.json
            reports/stage153/source/status.json
            data/strategy-roi-combined.json
            data/strategy-roi-combined-results.json
          retention-days: 90
          if-no-files-found: warn

  publish-stage196f:
    if: ${{ inputs.validated_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
      REQUESTED_DATE: ${{ inputs.selection_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and download the completed Stage196F run
        run: |
          set -euo pipefail
          [[ "$VALIDATED_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN_ID" > "$RUNNER_TEMP/stage196f-run.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'stage196f-run.json').read_text())
          if (run['status'], run['conclusion'], run['head_branch'], run['path'].split('@')[0]) != (
              'completed', 'success', 'main', '.github/workflows/stage196f-combined-candidate.yml'
          ):
              raise SystemExit('Expected a completed successful Stage196F validation run on main')
          PY
          gh run download "$VALIDATED_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "stage196f-combined-candidate-$VALIDATED_RUN_ID" \
            --dir "$RUNNER_TEMP/stage196f-candidate"
      - name: Refresh declarations for the field comparison
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RACING_API_USERNAME" && test -n "$RACING_API_PASSWORD"
          python scripts/stage26_feed_capture.py racecards
          cp data/racecards.json "$RUNNER_TEMP/stage196f-fresh-cards.json"
      - name: Publish verified upcoming races and preserve the existing archive
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stage196f-publish.py" <<'PY'
          import datetime as dt
          import json
          import os
          import re
          from collections import defaultdict
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from rhp_runner_eligibility import active_runner

          temp = Path(os.environ['RUNNER_TEMP'])
          root = temp / 'stage196f-candidate'
          feed_path = Path('data/strategy-roi-combined.json')

          def read(path):
              return json.loads(path.read_text())

          def stamp(value):
              time = dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
              if time.tzinfo is None:
                  raise ValueError('Expected a time zone in publication evidence')
              return time.astimezone(dt.timezone.utc)

          def key(value):
              return ''.join(c for c in str(value or '').casefold() if c.isalnum())

          def race_key(row):
              course = key(re.sub(r'\s*\((?:AW|GB|IRE|UK)\)\s*$', '', row['course'], flags=re.I))
              course = {
                  'bangor': 'bangorondee', 'chelmsfordcity': 'chelmsford',
                  'kemptonpark': 'kempton', 'dundalkaw': 'dundalk',
              }.get(course, course)
              return row['date'], course, stamp(row['race_time']).strftime('%H:%M')

          now = dt.datetime.now(dt.timezone.utc)
          local_day = now.astimezone(ZoneInfo('Europe/Dublin')).date()
          candidate = read(root / 'combined-candidate.json')
          audit = read(root / 'audit.json')
          run = read(temp / 'stage196f-run.json')
          day = candidate['day']
          requested = os.environ.get('REQUESTED_DATE')
          if requested and requested != day:
              raise SystemExit(f'Validation is for {day}, but {requested} was requested')
          if day not in {local_day.isoformat(), (local_day + dt.timedelta(days=1)).isoformat()}:
              raise SystemExit(f'The validation date {day} is no longer eligible for publication')
          rows = candidate['races']
          if (candidate.get('model') != 'Stage196F combined candidate'
              or day != audit.get('day') or audit.get('issues')
              or len(rows) < 1 or audit.get('remaining_fields') != len(rows)
              or audit.get('coverage') != {'PAPER_SELECTION': len(rows)}
              or len({race_key(r) for r in rows}) != len(rows)):
              raise SystemExit('The validation artifact does not show complete successful race coverage')
          completed = stamp(run['updated_at'])
          card_path = Path('data/racecards.json')
          cards = max((read(card_path), read(temp / 'stage196f-fresh-cards.json')),
                      key=lambda snapshot: stamp(snapshot['collected_at']))
          if not dt.timedelta(0) <= now - stamp(cards['collected_at']) <= dt.timedelta(minutes=20):
              raise SystemExit('The latest racecard snapshot is too old for publication')
          declared = defaultdict(list)
          for card in cards['runners']:
              if card.get('date') == day and card.get('race_time') and active_runner(card):
                  declared[race_key(card)].append(card)

          feed = read(feed_path)
          publications = feed.setdefault('stage196f_publications', {})
          prior = publications.get(day)
          if prior and str(prior['run_id']) == os.environ['VALIDATED_RUN_ID']:
              print('This validation run has already been published')
              raise SystemExit(0)
          existing = feed['races']
          published = []
          skipped = []
          closed = {'abandoned', 'cancelled', 'canceled', 'void', 'resulted', 'finished', 'completed', 'final'}
          for row in rows:
              race_id = race_key(row)
              runners = row['runners']
              off = stamp(row['race_time'])
              ranks = [r['rank'] for r in runners]
              field_names = {key(r['horse']) for r in runners}
              if (row['date'] != day or len(runners) < 2 or len(field_names) != len(runners)
                  or row['field_size'] != len(runners)
                  or ranks != list(range(1, len(runners) + 1)) or not row['source_model']):
                  raise SystemExit(f'Invalid model field for {row["course"]} {row["time"]}')
              if now + dt.timedelta(minutes=2) >= off or completed >= off:
                  skipped.append((row, 'off or too close to the off'))
                  continue
              latest = declared.get(race_id, [])
              if (len(latest) != len(runners) or {key(r['horse']) for r in latest} != field_names
                  or any(key(r.get('race_status')) in closed for r in latest)):
                  skipped.append((row, 'latest declarations differ'))
                  continue
              selection = row.get('selection')
              if selection:
                  scored = stamp(selection['published_at'])
                  if (selection['kind'] != 'VALIDATION_ONLY' or selection['pre_off_valid'] is not True
                      or scored > completed or scored >= off or selection['horse'] != runners[0]['horse']):
                      raise SystemExit(f'Invalid selection evidence for {row["course"]} {row["time"]}')
                  row['evidence_asof'] = scored.isoformat()
                  row['selection'] = {**selection, 'kind': 'RECORDED_PRE_OFF', 'published_at': now.isoformat()}
              row.update(published_at=now.isoformat(), model='Stage196F Combined',
                         publication_run_id=int(os.environ['VALIDATED_RUN_ID']))
              published.append(row)

          if not published:
              raise SystemExit('No upcoming Stage196F field still matches the latest declarations')
          publications[day] = {
              'run_id': int(os.environ['VALIDATED_RUN_ID']),
              'published_at': now.isoformat(), 'races': len(published),
          }
          replaced = {race_key(row) for row in published}
          retained = [row for row in existing if row['date'] != day or race_key(row) not in replaced]
          feed.update(day=day, generated_at=now.isoformat(),
                      races=sorted(retained + published, key=lambda row: (row['date'], row['race_time'])))
          feed_path.write_text(json.dumps(feed, ensure_ascii=False, indent=2) + '\n')
          card_path.write_text(json.dumps(cards, ensure_ascii=False, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Stage196F on {day}\n\n')
              summary.write(f'{len(published)} rechecked race rankings prepared from validation run {run["id"]}.\n\n')
              for row, reason in skipped:
                  summary.write(f'- {row["time"]} {row["course"]}: retained existing record ({reason}).\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            PYTHONPATH=scripts python "$RUNNER_TEMP/stage196f-publish.py"
            if git diff --quiet -- data/strategy-roi-combined.json; then exit 0; fi
            python scripts/stage153_roi_combined.py settle \
              --output data/strategy-roi-combined.json \
              --results data/race-results.json \
              --settled data/strategy-roi-combined-results.json
            git add data/racecards.json data/strategy-roi-combined.json data/strategy-roi-combined-results.json
            git commit -m "Publish Stage196F selections from validation $VALIDATED_RUN_ID"
            if timeout 25s git push origin HEAD:main; then
              echo 'Stage196F rankings published to the live feed.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep "$((attempt*4))"
          done
          exit 1
