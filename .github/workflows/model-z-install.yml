name: Model Z - Install and Update Specialist Strategy Portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * *'

permissions:
  contents: write

concurrency:
  group: model-z-install-and-refresh
  cancel-in-progress: false

