      - name: Verify the frozen course profiles and candidate-only safeguards
        run: |
          set -euo pipefail
          test -s reports/stage34/stage34-frozen-track-profiles.json
          python -m py_compile scripts/model_z_portfolio.py
          python scripts/model_z_portfolio.py --self-test

      - name: Publish research portfolio status and Model Z navigation link
        run: |
          set -euo pipefail
          python scripts/model_z_portfolio.py --install-nav
          python - <<'PY_VALIDATE'
          import json
          from pathlib import Path
          r=json.loads(Path('data/model-z-status.json').read_text())
          assert r['mode']=='RESEARCH_AND_PAPER_ONLY'
          assert r['active_strategies']==0
          assert r['total_live_picks']==0
          assert r['candidate_strategies']>=2
          assert not r['live_models_changed']
          assert len(r['automated_model_z_picks'])==0
          assert 'model-z.html' in Path('index.html').read_text()
          print('Model Z candidate-only portfolio verified. No live Model A-D changes.')
          PY_VALIDATE

      - name: Commit only Model Z and its additive navigation link
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-z.html scripts/model_z_portfolio.py data/model-z-strategies.json data/model-z-status.json index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'; exit 0
          fi
          git commit -m 'Model Z: install independent candidate-only specialist portfolio'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Model Z published on GitHub Pages'; exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt*3))"
          done
          echo 'Unable to commit Model Z; review workflow logs' >&2
          exit 1
