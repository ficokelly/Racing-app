name: Racing Hot Pots - Five Minute Data Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 7-22 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: rhp-five-minute-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update UK and Irish bookmaker odds
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
        run: python scripts/stage26_feed_capture.py odds

      - name: Archive older odds snapshots (no API call)
        run: python archive-odds-history.py

      - name: Send newly detected Power Fav alerts
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
        run: python send-power-fav-alerts.py

      - name: Update final UK and Irish race results
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
        run: python collect-puntersedge-results.py

      - name: Update and archive complete racecards once an hour
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          set -euo pipefail
          # GitHub's scheduled runners frequently start after hh:05. Compare the
          # published refresh hour, not the wall-clock start minute. This runs
          # at most once per UTC hour, but catches up immediately if stale.
          if python - <<'RHP_RACECARD_FRESHNESS'
          import datetime as dt,json
          from pathlib import Path
          path=Path('data/racecards.json')
          try:
           payload=json.loads(path.read_text())
           last=dt.datetime.fromisoformat(payload['collected_at'].replace('Z','+00:00'))
           fresh=(dt.datetime.now(dt.timezone.utc)-last).total_seconds()<3600 and last.astimezone(dt.timezone.utc).hour==dt.datetime.now(dt.timezone.utc).hour
           if fresh and payload.get('runners'):
            print('Racecards already collected this UTC hour:',last.isoformat())
            raise SystemExit(0)
          except (OSError,ValueError,TypeError,KeyError) as exc:
           print('Racecards need refresh:',exc)
          raise SystemExit(1)
          RHP_RACECARD_FRESHNESS
          then
            echo 'Racecards up to date; no extra free-tier API request.'
          else
            python scripts/stage26_feed_capture.py racecards
          fi

      - name: Detect confirmed non-runners and archive pre-change decisions
        id: nonrunners
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage26_nonrunner_monitor.py --repo . | tee /tmp/stage26-monitor.log
          count=$(sed -n 's/^STAGE26_NR_NEW=//p' /tmp/stage26-monitor.log | tail -1)
          echo "new=${count:-0}" >> "$GITHUB_OUTPUT"

      - name: Refresh AW (2) historical track strike rates (offline)
        run: python calculate-aw2-track-stats.py

      - name: Publish changed API feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/aw2-track-stats.json data/latest-odds.json data/odds-history.json data/odds-archive/ data/power-fav-alert-state.json data/race-results.json data/racecards.json data/racecards-archive.json data/nonrunner-monitor.json data/nonrunner-decision-history.json
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Refresh odds, results, alerts and racecard archive'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Published refreshed data.'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo 'Could not publish; check for concurrent legacy workflow writes.' >&2
          exit 1

      - name: Reassess all three models on confirmed non-runner changes
        if: ${{ steps.nonrunners.outputs.new != '0' && steps.nonrunners.outputs.new != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Stage 13 rebuilds A against the changed field. Stage 17 is triggered
          # by successful Stage 13 completion and rebuilds B's live decisions.
          gh workflow run stage13-strategy-learning.yml --ref main
          # Stage 22 independently rebuilds Model C's full-field rankings.
          gh workflow run stage21-model-c-live.yml --ref main
          echo 'Triggered genuine all-runner reassessment, not simple odds renormalisation.'
