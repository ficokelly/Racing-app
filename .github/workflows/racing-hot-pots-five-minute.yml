name: Racing Hot Pots - Five Minute Data Updates
on:
  workflow_dispatch:
  schedule:
    # UTC; includes UK/Irish morning through evening racing, including BST.
    - cron: '*/5 7-22 * * *'
permissions:
  contents: write
concurrency:
  group: rhp-five-minute-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update UK and Irish bookmaker odds
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
        run: python collect-odds.py
      - name: Update final UK and Irish race results
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
        run: python collect-puntersedge-results.py
      - name: Update and archive complete racecards once an hour
        # Once an hour rather than 5-min to avoid hammering The Racing API.
        if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '*/5 7-22 * * *' && github.run_id != '')
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          # On scheduled executions, only at the top of the UTC hour.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%M)" -ge 5 ]; then
            echo 'Skipping racecards this run; hourly archive refresh only.'
            exit 0
          fi
          python collect-racecards.py
      - name: Publish changed API feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest-odds.json data/odds-history.json data/race-results.json data/racecards.json data/racecards-archive.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Refresh odds, results and racecard archive'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Published refreshed data.'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo 'Could not publish; check for concurrent legacy workflow writes.' >&2
          exit 1
