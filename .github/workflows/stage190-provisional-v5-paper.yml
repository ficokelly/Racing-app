name: Stage190 - Provisional V5 independent paper selections
on:
  workflow_dispatch:
    inputs:
      selection_date:
        description: Today or tomorrow Dublin date (blank uses schedule)
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['.github/workflows/stage190-provisional-v5-paper.yml']
  schedule:
    - cron: '7 18 * * *'
      timezone: Europe/Dublin
    - cron: '17 7,9,11,13,15 * * *'
      timezone: Europe/Dublin
permissions:
  contents: write
  actions: write
concurrency:
  group: stage190-v5-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_DATE: ${{ inputs.selection_date }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze V5 research routing and select today's or tomorrow's target
