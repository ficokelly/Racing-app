name: Stage 39 - Wednesday Six Course Historical ROI Research

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stage39-2026-11-04-six-course-roi
  cancel-in-progress: false

jobs:
  six-course-roi:
    runs-on: ubuntu-latest
    timeout-minutes: 330
