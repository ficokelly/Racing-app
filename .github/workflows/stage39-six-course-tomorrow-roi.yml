      - name: Refresh Wednesday 4 November declared racecards without publishing live data
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${RACING_API_USERNAME:-}" ] && [ -n "${RACING_API_PASSWORD:-}" ]; then
            if python scripts/stage26_feed_capture.py racecards; then
              echo 'Collected today's and tomorrow's racecards in this isolated runner.'
            else
              echo 'WARNING: refresh failed; using previously checked-in racecards, explicitly marked as stale where applicable.'
            fi
          else
            echo 'WARNING: Racing API credentials missing. Running historical audit; unavailable future racecards will be clearly reported.'
          fi
          python - <<'PY_CHECK_CARDS'
          import json
          from pathlib import Path
          x=json.loads(Path('data/racecards.json').read_text())
          wanted={'kempton','dundalk','nottingham','musselburgh','chepstow','wexford'}
          rows=[r for r in x.get('runners',[]) if r.get('date')=='2026-11-04'
                and any(t in str(r.get('course','')).lower() for t in wanted)]
          race_keys={(r.get('course'),r.get('race_time'),r.get('race_id')) for r in rows}
          print('4 November target-course races collected:',len(race_keys),'runners:',len(rows))
          if len(race_keys)<6:print('WARNING: missing future cards. Audit still runs, no fabricated race predictions.')
          PY_CHECK_CARDS

      - name: Restore original Stage 2 UK and Irish historical SQLite database
        env:
          GH_TOKEN: ${{ github.token }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY_STAGE39_DB'
          import json,os,subprocess,sys,sqlite3
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          target=Path('stage39_historical_db');target.mkdir(exist_ok=True)
          winner=None
          for page in range(1,21):
              raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts',
                                           '-f','per_page=100','-f',f'page={page}'],text=True)
              results=json.loads(raw).get('artifacts',[])
              for a in results:
                  if a.get('name')=='stage2-historical-staging-database' and not a.get('expired'):
                      if winner is None or a.get('created_at','')>winner.get('created_at',''):winner=a
              if len(results)<100:break
          dbfiles=[]
          if winner:
              try:
                  rid=str(winner['workflow_run']['id'])
                  subprocess.run(['gh','run','download',rid,'--repo',repo,'--name',winner['name'],'--dir',str(target)],check=True)
                  dbfiles=list(target.rglob('*.sqlite'))
                  print('Downloaded original Stage2 archive from run',rid,flush=True)
              except subprocess.CalledProcessError:
                  print('Stage2 artifact unavailable; rebuilding the identical historical source',flush=True)
          if dbfiles:
              db=max(dbfiles,key=lambda p:p.stat().st_size).resolve();source='Stage2 verified artifact'
          else:
              import kagglehub
              print('Rebuilding historical source from original Kaggle archive',flush=True)
              archive=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025')
              db=(target/'historical_ukie_staging.sqlite').resolve()
              subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import',
                              '--input',str(archive),'--min-date','1988-01-01',
                              '--max-date','2026-10-07','--database',str(db),
                              '--report',str(target/'import-report.json')],check=True)
              subprocess.run([sys.executable,'audit_history_coverage.py','--database',str(db),
                              '--expect-first-year','1988',
                              '--output',str(target/'annual_coverage.csv'),
                              '--summary',str(target/'coverage.json')],check=True)
              source='original Kaggle archive reconstructed'
          if not db.exists() or db.stat().st_size<10000000:
              raise SystemExit('Historical database not found or suspiciously small')
          cx=sqlite3.connect('file:'+str(db)+'?mode=ro',uri=True)
          count=cx.execute('SELECT COUNT(*) FROM historical_runs').fetchone()[0]
          min_year=cx.execute('SELECT MIN(race_date) FROM historical_races').fetchone()[0]
          cx.close()
          if count<3000000 or not min_year or min_year[:4]>'1988':
              raise SystemExit(f'Historical source integrity guard failed: rows={count}, first={min_year}')
          print('Integrity checked historical runs:',count,'earliest race:',min_year,'source:',source,flush=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE39_DB='+str(db),file=f)
          PY_STAGE39_DB

      - name: Run the six-course history and publish frozen pre-off research
        run: |
          set -euo pipefail
          python -u scripts/stage39_six_course_audit.py \
            --db "$STAGE39_DB" --root . --day 2026-11-04 --output stage39_report
          python - <<'PY_CHECK_REPORT'
          import json
          from pathlib import Path
          r=Path('stage39_report')
          v=json.loads((r/'stage39-summary.json').read_text())
          assert len(v['courses'])==6
          assert v['target_day']=='2026-11-04'
          assert v['no_model_a_b_c_d_z_changes'] is True
          assert v['historical_audit']['runner_rows']>3000000
          assert len(v['per_course_report_rows'])>=6*4*2
          for name in ('stage39-course-model-yearly-roi.csv',
                       'stage39-course-condition-splits.csv',
                       'stage39-historical-model-picks.csv',
                       'stage39-tomorrow-full-assessments.json',
                       'stage39-mobile-report.html'):
              if not (r/name).exists() or (r/name).stat().st_size<50:
                  raise SystemExit('Stage39 expected research output missing: '+name)
          print('Research completed. Tomorrow racecards scored:',v['tomorrow_coverage']['races_scored'])
          print('Course model/condition candidates:',len(v['retrospective_candidates']))
          print('No betting recommendations or model promotions were made')
          PY_CHECK_REPORT

      - name: Publish the research report and mobile-readable Pages page
        run: |
          set -euo pipefail
          mkdir -p reports/stage39
          cp -f stage39_report/stage39-* reports/stage39/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stage39_six_course_audit.py reports/stage39/ tomorrow-research.html
          if git diff --cached --quiet; then
            echo 'No modified Stage39 research report'
            exit 0
          fi
          git commit -m 'Stage39: six-course long-history audit for 4 November racecards'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Stage39 published without modifying A/B/C/D/Z models';exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt*4))"
          done
          echo 'GitHub push unsuccessful, use research report in Actions artifact' >&2
          exit 1

      - name: Preserve Stage39 outputs even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage39-six-course-nov4-research
          path: |
            stage39_report/
            tomorrow-research.html
          retention-days: 21
          if-no-files-found: warn
