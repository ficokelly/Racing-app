          with sqlite3.connect(candidate) as c:
           c.execute('delete from historical_runs where race_id in (select id from historical_races where race_date>?)',(M.BASE,));c.execute('delete from historical_races where race_date>?',(M.BASE,));c.commit()
          with candidate_ref.open(encoding='utf-8-sig',newline='') as f:
