name: Stage182e - Resolve remaining historical exceptions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stage182e-targeted-form-recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage182e-targeted-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: '.:scripts'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-db
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - uses: actions/download-artifact@v4
        with:
          name: stage181-unmatched-recovery-audit
          run-id: 45515273975
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/audit
      - uses: actions/download-artifact@v4
        with:
          name: stage182b-metadata-repair-audit
          run-id: 45518317420
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved182b
      - uses: actions/download-artifact@v4
        with:
          name: stage182d-individual-recovery-evidence
          run-id: 45519353923
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/provider182d
      - name: Install pinned-source downloader
        run: python -m pip install --disable-pip-version-check 'kagglehub>=0.3,<1'
      - name: Recover candidate historical fields privately and verify baseline gap
        run: |
          python - <<'PY'
          import collections as C, csv, datetime as D, hashlib, json, os, pathlib as P, re, sqlite3, shutil
          import kagglehub
