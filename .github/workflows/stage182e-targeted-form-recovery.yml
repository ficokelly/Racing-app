           assert {str(a.get('horse_id')) for a in rich[0]['tomorrow']}=={str(a.get('horse_id')) for a in poor[0]['tomorrow']}
           comparisons=provider_index[k[:3]];agree=[a for a in comparisons if not a['differences'] and a['archive_time']==k[3] and a['target_archive']==list(k[4:])]
           assert len({a['provider_id'] for a in agree})==1 and {a['archive_id'] for a in agree}=={rich[0]['race_id'],None}
           unique.append(rich[0]);duplicates.append(poor[0])
