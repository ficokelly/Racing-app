name: Stage89 - Model E HPR Full-Field and Beaten-Distance Gap Audit

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'As-of Irish date YYYY-MM-DD (blank = today)'
        type: string
        required: false
        default: ''
      days:
        description: 'Completed racing dates to inspect'
        type: choice
        required: true
        default: '30'
        options: ['7', '14', '30', '60', '90']

permissions:
  contents: read
  actions: read

concurrency:
  group: stage89-model-e-research-audit
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify read-only Stage86/87/89 research modules
        run: |
          python scripts/stage86_hpr_engine.py --mode self-test
          python scripts/stage87_hpr_audit.py --self-test
          python scripts/stage89_hpr_gap_triage.py --self-test
      - uses: actions/cache@v4
        with:
          path: |
            reports/stage86/base/original.sqlite
            ~/.cache/kagglehub
          key: stage86-base-v129-${{ hashFiles('import_historical_ukie.py') }}
          restore-keys: |
            stage84-base-ukie-v129-
      - name: Install historical source helper
        run: python -m pip install --disable-pip-version-check kagglehub
      - name: Verify original UK/IE historical research archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import kagglehub,subprocess,sys,sqlite3
          from pathlib import Path
          p=Path('reports/stage86/base/original.sqlite');p.parent.mkdir(parents=True,exist_ok=True)
          if not p.exists() or p.stat().st_size<1000000:
              src=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
              subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import',
                  '--input',str(src),'--min-date','1988-01-01','--max-date','2026-10-07',
                  '--database',str(p),'--report','reports/stage86/base/import.json'],check=True)
          with sqlite3.connect('file:'+str(p.resolve())+'?mode=ro',uri=True) as c:
              assert c.execute('PRAGMA quick_check').fetchone()[0]=='ok'
              assert c.execute('SELECT COUNT(*) FROM historical_races').fetchone()[0]>100000
          PY
      - name: Reproduce archived E v0 full-field pre-off HPRs (not live)
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode backtest --db reports/stage86/base/original.sqlite --root . \
            --output reports/stage89/e-base --git-preoff --days "${DAYS:-30}")
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage86_hpr_engine.py "${args[@]}"
      - name: Recreate Stage87 verified gap queue for identical dates
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--root . --db reports/stage86/base/original.sqlite --output reports/stage89/source-stage87 \
            --e-selections reports/stage89/e-base/hpr-race-by-race.csv --days "${DAYS:-30}")
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage87_hpr_audit.py "${args[@]}"
      - name: Triage all missing full-field ratings and missing margin references
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--root . --db reports/stage86/base/original.sqlite \
            --ratings reports/stage89/e-base/hpr-backtest-research.sqlite \
            --stage87-queue reports/stage89/source-stage87/stage87-beaten-distance-queue.csv \
            --output reports/stage89/output --days "${DAYS:-30}")
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage89_hpr_gap_triage.py "${args[@]}"
      - name: Verify Stage89 count reconciliation with frozen Stage86 audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('reports/stage89/e-base/hpr-audit.json').read_text())
          b=json.loads(Path('reports/stage89/output/stage89-gap-report.json').read_text())
          x=a['backtest_rejections']; y=b['full_field_hpr']['status']
          for k in ('INSUFFICIENT_FULL_FIELD_HPR','NO_PREOFF_CARD','FIELD_UNVERIFIED_OR_CHANGED'):
              assert x.get(k,0)==y.get(k,0),(k,x.get(k,0),y.get(k,0))
          assert sum(x.values())+y.get('ELIGIBLE_FULL_FIELD_HPR',0)==len(a['outcomes']['result_eligibility']) or y.get('ELIGIBLE_FULL_FIELD_HPR',0)==a['backtest_metrics'][0]['selections']
          print('PASS: full-field exclusion counts match frozen Stage86 backtest')
          PY
      - name: Publish read-only audit CSV and summary; never publish a research DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage89-hpr-coverage-${{ github.run_id }}
          path: |
            reports/stage89/output/stage89-gap-report.json
            reports/stage89/output/stage89-race-coverage.csv
            reports/stage89/output/stage89-priority-races.csv
            reports/stage89/output/stage89-margin-source-queue.csv
            reports/stage89/e-base/hpr-audit.json
          retention-days: 90
          if-no-files-found: warn
