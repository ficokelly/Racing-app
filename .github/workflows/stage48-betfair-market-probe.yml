name: Stage 48 - Verify Betfair historical market CSV access

on:
  workflow_dispatch:
    inputs:
      historical_date:
        description: Historical racing date to check (YYYY-MM-DD)
        required: true
        default: '2025-06-14'
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: Check public Betfair UK and Ireland market files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out original models without changing them
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify CSV parser locally
        run: python scripts/stage48_betfair_market_probe.py --self-test
      - name: Test a single historical day's UK and Irish public CSVs
        shell: bash
        env:
          HISTORICAL_DATE: ${{ inputs.historical_date }}
        run: |
          set -euo pipefail
          python scripts/stage48_betfair_market_probe.py \
            --date "$HISTORICAL_DATE" \
            --out "$RUNNER_TEMP/stage48-market-source-probe.json"
      - name: Upload aggregate access audit only (no raw licensed price data)
        uses: actions/upload-artifact@v4
        with:
          name: stage48-betfair-public-source-audit
          path: ${{ runner.temp }}/stage48-market-source-probe.json
          if-no-files-found: error
          retention-days: 30
