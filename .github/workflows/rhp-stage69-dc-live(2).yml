name: Hot Pots D(c) - Scheduled Race-Type-Aware Selections

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'Optional Irish racing date YYYY-MM-DD (blank = auto)'
        required: false
        type: string
  # ONE-TIME integration trigger: uploading this updated workflow runs the
  # Stage81-based 10-Nov reassessment once (if races are still in the future).
  # The committed D(c) schedule key blocks repeated one-off publication.
  push:
    paths:
      - '.github/workflows/rhp-stage69-dc-live.yml'
  workflow_run:
    workflows:
      - 'Racing Hot Pots - Five Minute Data Updates'
      - 'Collect Racing Racecards'
    types: [completed]
  schedule:
    - cron: '3 5-23 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: rhp-dc-live
  cancel-in-progress: false

jobs:
  score:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Fetch latest racing data and verified history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Stage81 integration safeguards
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/rhp_stage83_dc_integrated.py --self-test

      - name: Settle D(c) results as soon as a final race result is published
        run: python scripts/rhp_stage68_settle.py

      - name: Publish newly settled D(c) results without changing selections
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/strategy-dc-results.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strategy-dc-results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Settle Hot Pots D(c) from verified finishing results'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1

      - name: Decide scheduled slot or one-time 10 November integration slot
        id: guard
        shell: bash
        env:
          MANUAL_DAY: ${{ github.event.inputs.day || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'push' ]; then
            # This one-off guard refuses races already run; the deployed code
            # never re-predicts past races using known outcomes.
            PYTHONDONTWRITEBYTECODE=1 python scripts/rhp_stage83_dc_integrated.py --once-guard
          else
            python scripts/rhp_stage68_schedule.py --day "$MANUAL_DAY" --event "$EVENT_NAME"
          fi

      - name: Install pinned modelling dependencies
        if: steps.guard.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 kagglehub joblib

      - name: Restore exact historic SQLite and stage81-specific C cache
        if: steps.guard.outputs.run == 'true'
        id: sqlite_cache
        uses: actions/cache@v4
        with:
          path: |
            reports/stage68/base/original.sqlite
            reports/stage68/base/c_classifier_2024_stage81_v1.joblib
            ~/.cache/kagglehub
          key: rhp-dc-stage81-v1-${{ hashFiles('import_historical_ukie.py', 'scripts/stage65p_race_type_c_only.py', 'scripts/rhp_stage83_dc_integrated.py') }}
          restore-keys: |
            rhp-dc-sqlite-v2-

      - name: Verify permanent pinned Stage81 evidence file
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s data/rhp-stage81-ukie-2021plus-hashes.csv.gz
          python - <<'PY'
          import hashlib,gzip,csv
          p='data/rhp-stage81-ukie-2021plus-hashes.csv.gz'
          with open(p,'rb') as f: sha=hashlib.file_digest(f,'sha256').hexdigest()
          assert sha=='b028ec32d2bae1d34331cda150d545b7441c9e45aa4ddb27b5ce450562288cbe', 'Stage81 evidence has changed'
          with gzip.open(p,'rt',encoding='utf-8') as f:
              n=sum(1 for _ in csv.DictReader(f))
          assert n==75944, f'Stage81 record count mismatch: {n}'
          print('PASS: 75,944 compact Stage81 research records, pinned source SHA256; no expiring artifact required')
          PY

      - name: Restore source historical SQLite cache or import on cache miss
        if: steps.guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          import kagglehub,subprocess,sys
          from pathlib import Path
          home=Path('reports/stage68/base');home.mkdir(parents=True,exist_ok=True)
          source=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
          (home/'source_path.txt').write_text(str(source))
          db=home/'original.sqlite'
          if not db.exists() or db.stat().st_size<1000000:
              subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import','--input',str(source),
                '--min-date','1988-01-01','--max-date','2026-10-07','--database',str(db),
                '--report',str(home/'import.json')],check=True)
          print('Stage83 historical research baseline:',db,db.stat().st_size,'bytes',flush=True)
          PY

      - name: Reconcile newer verified results, preserving original SQLite
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export MAX_DATE=$(TZ=Europe/Dublin date +%Y-%m-%d)
          python -u scripts/stage65m_backfill.py \
            --baseline reports/stage68/base/original.sqlite \
            --out reports/stage68/current \
            --max-date "$MAX_DATE" --keep-candidate --skip-replay
          python -u scripts/stage65p_enrich_race_details.py \
            --db reports/stage68/current/backfilled_research_only.sqlite \
            --source "$(cat reports/stage68/base/source_path.txt)" \
            --out reports/stage68/current/enrichment

      - name: Apply Stage81 UK IE categories and publish D(c) pre-off reassessment
        if: steps.guard.outputs.run == 'true'
        env:
          TARGET_DAY: ${{ steps.guard.outputs.day }}
          SLOT_NAME: ${{ steps.guard.outputs.slot }}
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/rhp_stage83_dc_integrated.py \
            --db reports/stage68/current/backfilled_research_only.sqlite \
            --stage81 data/rhp-stage81-ukie-2021plus-hashes.csv.gz \
            --day "$TARGET_DAY" --slot "$SLOT_NAME" \
            --out reports/stage83
          python scripts/rhp_stage68_settle.py

      - name: Upload immutable original vs Stage81 integration rankings
        if: steps.guard.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: stage83-dc-original-vs-stage81-rankings
          path: |
            reports/stage83/integration_audit.json
            reports/stage83/*_original_vs_integrated.csv
            reports/stage83/*_comparison_summary.json
          retention-days: 90
          if-no-files-found: warn

      - name: Commit pre-off rankings and settled results (D(c) only)
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strategy-dc-probabilities.json data/strategy-dc-schedule.json
          test ! -f data/strategy-dc-results.json || git add data/strategy-dc-results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate verified Stage81 race types in research D(c) and archive updated ranks'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          echo 'Failed to publish D(c) revisions: no push sent' >&2
          exit 1

      - name: Notify only for new or changed Hot Pots selections
        if: steps.guard.outputs.run == 'true'
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
        run: python scripts/rhp_stage68_push.py

      - name: Persist successful push deduplication state
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f data/hot-pots-dc-push-state.json || exit 0
          git add data/hot-pots-dc-push-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Archive Hot Pots D(c) notification delivery state'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
