            for phrase,(label,kind) in VERIFIED_RESEARCH_ANCHORS.items():
             if kind==discipline and re.search(r'\b'+re.escape(phrase)+r'\b',current):
              chosen=(phrase,label,'EXACT_NAMED_ANCHOR_RESEARCHED');break
            if not chosen:
             tokens=current.split()
             # Discover contiguous unusual phrases: require >=2 meaningful tokens,
             # >=5 distinct older editions at this venue in matching discipline.
             candidates=[]
             for length in range(4,1,-1):
              for i in range(len(tokens)-length+1):
               phrase_tokens=tokens[i:i+length]
               meaningful=[t for t in phrase_tokens if t not in COMMON and len(t)>3]
               if len(meaningful)<2 or meaningful[0] in ('thank','happy','welcome','join','book','visit'):continue
               phrase=' '.join(phrase_tokens)
               if any(t in COMMON for t in phrase_tokens):continue
               pattern=r'\b'+r'\s+'.join(map(re.escape,phrase_tokens))+r'\b'
               matches=[m for m in bycourse[key[0]] if exact.kind(m.get('race_type'))==discipline and re.search(pattern,exact.norm(m.get('race_name')))]
               years={m['date'][:4] for m in matches}
               if len(years)>=5:
                candidates.append((len(phrase_tokens),len(years),phrase))
             if candidates:
              candidates.sort(reverse=True)
              strongest=candidates[0]
              if len(candidates)>1 and candidates[1][:2]==strongest[:2] and candidates[1][2]!=strongest[2]:continue
              chosen=(strongest[2],strongest[2].title(),'AUTOMATED_DISTINCTIVE_PHRASE_PROVISIONAL')
            if not chosen:continue
            phrase,label,method=chosen
            # Use a boundary-anchored phrase: historical mapping must contain the phrase unbroken.
            pattern=r'\b'+r'\s+'.join(map(re.escape,phrase.split()))+r'\b'
            anchors[key]=(label,pattern,discipline);methods[key]=method
           return anchors,methods

          def produce_history(args,races,history_dir):
           keys=sorted(races)
           cards=[]
           for key in keys:
            rr=races[key];r=rr[0]
            cards.append({'meeting':r['course'],'time':key[1],'race':r.get('race_name',''),
                          'distance_f':r.get('distance_f') or '','type':r.get('type') or ''})
           cards_path=Path(args.work)/'stage13_current_cards.csv';cards_path.parent.mkdir(parents=True,exist_ok=True)
           with cards_path.open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=['meeting','time','race','distance_f','type']);w.writeheader();w.writerows(cards)
           anchors,methods=make_exact_anchors(args.mapping,races,args.day)
           exact.TODAY=args.day
           exact.NAMED_EVENT_ANCHORS=anchors
           # Stage 10 original template had the 2025 year-end cutoff; the immutable
           # mapping currently ends 2025. Prevent matching any day >= target by patching
           # the pre-2026 source's 2026 upper bound only in this daily wrapper.
           exact.process(argparse.Namespace(db=args.db,mapping=args.mapping,cards=str(cards_path),out=str(history_dir)))
           audit=read_json(history_dir/'audit.json',{})
           audit['anchor_methods']={k[0]+' '+k[1]:v for k,v in methods.items()}
           write_json(history_dir/'audit.json',audit)
           return audit

          def safe_float(x):
           try:
            f=float(x);return f if math.isfinite(f) else None
           except (ValueError,TypeError):return None

          def evidence_short(text):
           if not text:return []
           return [t.strip()[:240] for t in re.split(r' \| ',text) if t.strip()][:7]

          def make_features(row,field,all_current):
           rating=safe_float(row.get('official_rating'))
           top=max((safe_float(x.get('official_rating')) for x in all_current if safe_float(x.get('official_rating')) is not None),default=None)
           gap=top-rating if top is not None and rating is not None else None
           return {'fit':safe_float(row.get('fit_score')) or 0,
             'trend':safe_float(row.get('trend_fit_component')) or 0,
             'form':safe_float(row.get('form_component')) or 0,
             'connections':safe_float(row.get('connections_component')) or 0,
             'field_size':field,'rating_gap':gap,'rating_gap_per_rival':(gap/max(1,field-1) if gap is not None else None),
             'age':safe_float(row.get('age')),'historical_positive':safe_float(row.get('positive_trend_impact_points')) or 0,
             'historical_negative':safe_float(row.get('negative_trend_impact_points')) or 0}

          FEATURES=['fit','trend','form','connections','field_size','rating_gap','rating_gap_per_rival','age','historical_positive','historical_negative']

          def feature_vector(f):return [float(f.get(k) or 0) for k in FEATURES]

          def predict_prob(model,rows):
           from math import exp
           means=model['means'];stds=model['stds'];coeff=model['coefficients'];intercept=model['intercept']
           logits=[]
           for r in rows:
            x=feature_vector(r['features'])
            z=intercept+sum(w*((v-m)/s) for v,m,s,w in zip(x,means,stds,coeff))
            logits.append(max(-30,min(30,z)))
           odds=[1/(1+exp(-z)) for z in logits]
           total=sum(odds)
           return [p/total if total>0 else 1/len(rows) for p in odds]

          def race_key(r):return '|'.join((str(r.get('date','')),form.norm(r.get('course')),str(r.get('time',''))))

          def settle(results_log,candidate_log,repo):
           """Settles immutable predictions using only official archived race-result rows.
           Pending when no confident result match; NEVER infer lost merely by absence.
           """
           dates={s.get('date') for s in results_log if s.get('status')=='Pending'}|{s.get('date') for s in candidate_log if s.get('status')=='Pending'}
           resolved={}
           for d in dates:
            if not d:continue
            p=Path(repo)/'data/racing-results'/f'{d}.json'
            obj=read_json(p,{})
            if not obj:
             obj=read_json(Path(repo)/'data/race-results.json',{})
             res=[x for x in obj.get('races',[]) if x.get('date')==d and x.get('status') in ('final','finished','complete')]
            else:res=obj.get('results',[])
            for race in res:
             rid=race.get('race_id');course=form.norm(race.get('course'))
             if not course or not race.get('runners'):continue
             when=parse_when(race.get('off_dt') or race.get('race_time'))
             if when:tm=when.astimezone(ZoneInfo('Europe/Dublin')).strftime('%H:%M')
             else:tm=''
             for runner in race.get('runners',[]):
              horse=form.name_norm(runner.get('horse'))
              if not horse:continue
              position=form.position(runner.get('position'))
              outcome=str(runner.get('status') or runner.get('outcome') or '').lower()
              st='Non-runner' if outcome in ('nr','non-runner','nonrunner','withdrawn') or str(runner.get('position')).upper()=='NR' else ('Won' if position==1 else 'Lost')
              row={'status':st,'position':position,'sp':runner.get('sp'),'race_id':rid,'horse_id':runner.get('horse_id')}
              if rid:resolved[(d,str(rid),horse)]=row
              if tm:resolved[(d,course,tm,horse)]=row
           for arr in (results_log,candidate_log):
            for s in arr:
             if s.get('status')!='Pending':continue
             h=form.name_norm(s.get('horse'));d=s.get('date')
             match=(resolved.get((d,str(s.get('race_id')),h)) if s.get('race_id') else None) or resolved.get((d,form.norm(s.get('course')),s.get('time'),h))
             if match:
              if s.get('horse_id') and match.get('horse_id') and s['horse_id']!=match['horse_id']:continue
              s['status']=match['status'];s['position']=match['position'];s['official_sp']=match.get('sp')
              s['settled_from']='official_repo_result';s['settled_at']=dt.datetime.now(UTC).isoformat()
           return results_log,candidate_log

          def train_if_ready(candidates,existing,now):
           """Chronological, locked validation and conservative model promotion; never fit on target day."""
           settled=[c for c in candidates if c.get('status') in ('Won','Lost') and c.get('date','')<today_iso(now) and c.get('features') and c.get('race_key')]
           dates=sorted({c['date'] for c in settled});races={c['race_key'] for c in settled}
           report={'candidate_rows':len(settled),'race_count':len(races),'dates':len(dates),'status':'INSUFFICIENT_TRAINING_DATA'}
           if len(settled)<300 or len(races)<50 or len(dates)<20:return existing,report
           cutoff=dates[max(1,int(len(dates)*.7))-1]
           train=[c for c in settled if c['date']<=cutoff];valid=[c for c in settled if c['date']>cutoff]
           if len(valid)<80 or len({c['race_key'] for c in valid})<15:return existing,report
           try:
            import numpy as np
            from sklearn.linear_model import LogisticRegression
           except ImportError:
            return existing,{**report,'status':'SCIKIT_LEARN_NOT_INSTALLED'}
           x=np.array([feature_vector(c['features']) for c in train],float)
           y=np.array([c['status']=='Won' for c in train],int)
           if len(set(y))<2:return existing,report
           means=x.mean(axis=0);stds=np.maximum(x.std(axis=0),1e-3)
           clf=LogisticRegression(C=.25,max_iter=400,random_state=13,class_weight=None)
           clf.fit((x-means)/stds,y)
           candidate={'version':'stage13-logistic-v1','trained_through':cutoff,'created_at':now.isoformat(),
            'features':FEATURES,'means':means.tolist(),'stds':stds.tolist(),
            'coefficients':clf.coef_[0].tolist(),'intercept':float(clf.intercept_[0]),'state':'VALIDATED_CANDIDATE'}
           def loss(model,eval_rows):
            groups=collections.defaultdict(list)
            for c in eval_rows:groups[c['race_key']].append(c)
            penalties=[]
            for rs in groups.values():
             # Only complete fields to avoid optimistic conditional training targets.
             if len(rs)<2 or sum(c['status']=='Won' for c in rs)!=1:continue
             pp=predict_prob(model,rs) if model else [1/len(rs)]*len(rs)
             p=next((v for c,v in zip(rs,pp) if c['status']=='Won'),1e-6)
             penalties.append(-math.log(max(1e-6,min(1,p))))
            return statistics.mean(penalties) if penalties else float('inf'),len(penalties)
           new_loss,n=loss(candidate,valid);base_loss,_=loss(None,valid)
           old_loss,_=loss(existing,valid) if existing and existing.get('features')==FEATURES else (float('inf'),0)
           report={**report,'status':'REJECTED_INSUFFICIENT_IMPROVEMENT','validated_races':n,
               'candidate_logloss':round(new_loss,5),'equal_field_logloss':round(base_loss,5),'previous_logloss':round(old_loss,5) if math.isfinite(old_loss) else None}
           if n>=15 and new_loss < base_loss*.99 and new_loss < old_loss*.995:
            candidate['validation']={k:report[k] for k in ('validated_races','candidate_logloss','equal_field_logloss','previous_logloss')}
            candidate['state']='VALIDATED';report['status']='PROMOTED';return candidate,report
           return existing,report

          def run(args):
           now=parse_when(args.now) if args.now else dt.datetime.now(UTC)
           if not now:raise SystemExit('Bad --now')
           root=Path(args.repo);target=args.day or today_iso(now);args.day=target
           data=root/'data';out=Path(args.work);out.mkdir(parents=True,exist_ok=True)
           results_path=data/'strategy-results.json';candidates_path=data/'strategy-learning-history.json';model_path=data/'strategy-model.json'
           old_results=read_json(results_path,{'version':1,'selections':[]}).get('selections',[])
           old_candidates=read_json(candidates_path,{'version':1,'candidates':[]}).get('candidates',[])
           model=read_json(model_path,None)
           old_results,old_candidates=settle(old_results,old_candidates,root)
           model,learning=train_if_ready(old_candidates,model,now)
           cards=read_json(args.cards,{})
           if not any(x.get('date')==target for x in cards.get('runners',[])):
            # Safe empty current view; preserve historic result records.
            report={'version':1,'day':target,'generated_at':now.isoformat(),'model_status':model.get('state') if model else 'RESEARCH_ONLY_UNVALIDATED',
              'races':[],'status':'NO_CURRENT_RACECARDS','message':'No up-to-date racecards for target day; not publishing guesses.'}
            write_json(data/'strategy-selections.json',report)
            write_json(results_path,{'version':1,'selections':old_results})
            write_json(candidates_path,{'version':1,'candidates':old_candidates})
            write_json(model_path,model or {'state':'NOT_TRAINED','version':'none'})
            write_json(data/'strategy-learning-status.json',learning)
            return report
           groups=grouped_cards(cards,target)
           hist_dir=out/'exact_history'
           cached=Path(args.cached_history) if getattr(args,'cached_history',None) else None
           cache_audit=read_json(cached/'audit.json',{}) if cached and cached.is_dir() else {}
           if cache_audit.get('target_day')==target and cache_audit.get('status')=='COMPLETE' and (cached/'actual_historical_runners.csv').is_file():
            shutil.copytree(cached,hist_dir,dirs_exist_ok=True)
            audit=cache_audit
            print('Reusing Stage 10 full historical exact-event research for target day',target,flush=True)
           else:audit=produce_history(args,groups,hist_dir)
           if not audit.get('matching_races'):
            report={'version':1,'day':target,'generated_at':now.isoformat(),'model_status':model.get('state') if model else 'RESEARCH_ONLY_UNVALIDATED',
              'status':'NO_VERIFIED_NAMED_EVENT_MATCHES','races':[], 'message':'No qualifying exact named race: no fallback to other races.'}
           else:
            stage12_dir=out/'form_analysis'
            a=argparse.Namespace(db=args.db,stage10=str(hist_dir),cards=args.cards,odds=args.odds,repo=str(root),day=target,out=str(stage12_dir))
            form.run(a)
            rows=form.loadcsv(stage12_dir/'runner_research_rankings.csv')
            historical_sizes=collections.defaultdict(list)
            historical_by_race=collections.defaultdict(set)
            for h in form.loadcsv(hist_dir/'actual_historical_runners.csv'):
             if h.get('included_in_trends') not in ('True','true','1'):continue
             key=(form.norm(h.get('meeting')),h.get('time'))
             historical_by_race[(key,h.get('race_id'))].add(form.name_norm(h.get('horse')))
            for (key,rid),names in historical_by_race.items():
             historical_sizes[key].append(len(names))
            evidence=form.loadcsv(stage12_dir/'horse_by_horse_positive_negative_evidence.csv')
            eidx=collections.defaultdict(list)
            for e in evidence:eidx[(form.norm(e['meeting']),e['time'],form.name_norm(e['horse']))].append(e)
            races=[]
            all_by_race=collections.defaultdict(list)
            for row in rows:
             if row.get('horse'):
              all_by_race[(form.norm(row['meeting']),row['time'])].append(row)
            existing={s['id'] for s in old_results if s.get('id')}
            candidate_ids={s['id'] for s in old_candidates if s.get('id')}
            for key,rs in sorted(all_by_race.items()):
             current=groups.get(key)
             if not current:continue
             off=parse_when(current[0]['race_time'])
             field=len(current)
             entry=[]
             for row in rs:
              card=next((r for r in current if form.name_norm(r['horse'])==form.name_norm(row['horse'])),None)
              if not card:continue
              features=make_features(row,field,rs)
              ev=eidx.get((key[0],key[1],form.name_norm(row['horse'])),[])
              # A 3-runner bottom third must NOT inherit penalties inferred mainly from
              # 12/18-runner fields. Require enough historical same-event editions with
              # field size comparable to today (exact count in small fields) before scoring relative rating/weight thirds.
              comparable_field_editions=sum((n==field if field<=4 else abs(n-field)<=max(2,round(field*.15))) for n in historical_sizes.get(key,[]))
              insufficient_field_context=comparable_field_editions<5
              context_suppressed=sum((safe_float(e.get('impact_points')) or 0) for e in ev
                                     if insufficient_field_context and (e.get('trait','').startswith('OFFICIAL_RATING_') or e.get('trait','').startswith('WEIGHT_')))
              if context_suppressed:
               features['fit']=round(max(0,min(100,features['fit']-context_suppressed)),2)
              for e in ev:
               if insufficient_field_context and (e.get('trait','').startswith('OFFICIAL_RATING_') or e.get('trait','').startswith('WEIGHT_')):
                e['context_status']='FIELD_SIZE_NOT_COMPARABLE_UNSCORED'
                e['context_adjusted_impact']=0
              pos=[x for x in ev if x.get('direction')=='POSITIVE']
              neg=[x for x in ev if x.get('direction')=='NEGATIVE']
              rr={
                'horse':row['horse'],'horse_id':row.get('horse_id'),'race_id':card.get('race_id'),'course':row['meeting'],
                'date':target,'time':row['time'],'race_time':card.get('race_time'),
                'trainer':row.get('trainer'),'jockey':row.get('jockey'),
                'score':features['fit'],'rank':int(float(row.get('rank_in_race') or 0)),
                'qualifies':row.get('provisional_trend_qualifies')=='True' and row.get('form_status')=='MATCHED',
                'research_status':row.get('status'),'identity_status':row.get('form_status'),
                'price_decimal':safe_float(row.get('william_hill_decimal')),
                'bookmaker':'William Hill','positive_count':len(pos),'negative_count':len(neg),
                'positive_trends':[{'trait':x.get('trait'),'runners':x.get('qualifying_runners'),'wins':x.get('winning_runner_credit'),
                 'editions':x.get('editions'),'impact':safe_float(x.get('context_adjusted_impact',x.get('impact_points'))),'validation':x.get('validation'),
                 'context_status':x.get('context_status')} for x in pos][:8],
                'negative_trends':[{'trait':x.get('trait'),'runners':x.get('qualifying_runners'),'wins':x.get('winning_runner_credit'),
                 'editions':x.get('editions'),'impact':safe_float(x.get('context_adjusted_impact',x.get('impact_points'))),'validation':x.get('validation'),
                 'context_status':x.get('context_status')} for x in neg][:8],
                'form_runs':int(float(row.get('horse_historical_runs') or 0)),
                'form_wins':int(float(row.get('horse_historical_wins') or 0)),
                'form_cautions':evidence_short(row.get('form_counter_evidence')),'features':features,
                'field_size':field,'rating_gap_to_top_lbs':features.get('rating_gap'),
                'market_rank':row.get('current_market_rank') or None,
                'historical_similar_field_editions':comparable_field_editions,
                'field_context_limitation':insufficient_field_context,
                'rating_weight_effect_suppressed':round(context_suppressed,2)
              }
              entry.append(rr)
             if not entry:continue
             # Prospective ranking is conditional on SAME-event positive matching and individual form.
             entry.sort(key=lambda x:-(x['score'] or 0))
             probabilities=predict_prob(model,entry) if model and model.get('state')=='VALIDATED' else [None]*len(entry)
             for r,pr in zip(entry,probabilities):r['predicted_win_probability']=round(pr,5) if pr is not None else None
             qualifying=[r for r in entry if r['qualifies']]
             if qualifying:
              top=max(qualifying,key=lambda r:r['predicted_win_probability'] if r['predicted_win_probability'] is not None else r['score'] or 0)
             else:top=None
             value=None
             if model and model.get('state')=='VALIDATED':
              choices=[r for r in qualifying if r['price_decimal'] is not None and r['predicted_win_probability'] is not None]
              choices=[r for r in choices if r['predicted_win_probability']*r['price_decimal']>1.05]
              value=max(choices,key=lambda r:r['predicted_win_probability']*r['price_decimal']) if choices else None
             match_row=next((m for m in form.loadcsv(hist_dir/'race_match_audit.csv') if form.norm(m['meeting'])==key[0] and m['time']==key[1]),{})
             live=bool(off and off>now+dt.timedelta(minutes=3))
             race_display={'course':current[0]['course'],'time':key[1],'date':target,'race_time':current[0]['race_time'],
              'race_name':current[0].get('race_name'),'event_name':match_row.get('anchor',''),
              'historical_editions':int(match_row.get('comparable_editions') or 0), 'field_size':field,
              'status':'UPCOMING' if live else 'OFF_OR_FINISHED',
              'most_likely_winner':top['horse'] if top and live else None,
              'best_value':value['horse'] if value and live else None,
              'qualifiers':[{k:v for k,v in r.items() if k!='features'} for r in entry if r['qualifies']],
              'nonqualifier_count':field-len(qualifying),
              'model_status':model.get('state') if model else 'RESEARCH_ONLY_UNVALIDATED',
              'message':'Exploratory research fit; not a validated betting edge' if not model or model.get('state')!='VALIDATED' else 'Validated candidate model; estimated probabilities remain uncertain'}
             races.append(race_display)
             # Log EVERY horse at initial pre-off evaluation for later ML labels, not only selected winners.
             if live:
              for r in entry:
               cid=f'{target}|{card.get("race_id") if (card:=next((x for x in current if form.name_norm(x["horse"])==form.name_norm(r["horse"])),{})) else ""}|{r["horse_id"] or form.name_norm(r["horse"])}'
               if cid not in candidate_ids:
                old_candidates.append({'id':cid,'race_key':race_key(r),'date':target,'race_id':r.get('race_id'),
                 'course':r['course'],'time':r['time'],'horse':r['horse'],'horse_id':r.get('horse_id'),
                 'status':'Pending','published_at':now.isoformat(),'features':r['features'],
                 'qualifies':r['qualifies'],'model_version':model.get('version') if model else 'research-v1'})
                candidate_ids.add(cid)
              if top:
               for role,sel in [('MLW',top),('VALUE',value)]:
                if not sel or (role=='VALUE' and top and sel['horse_id']==top['horse_id']):continue
                sid=f'{target}|{form.norm(sel["course"])}|{sel["time"]}|{role}|{form.name_norm(sel["horse"])}'
                if sid in existing:continue
                # Price only if sampled before the off; if no price P&L will exclude.
                old_results.append({'id':sid,'role':role,'date':target,'race_id':sel['race_id'],
                 'course':sel['course'],'time':sel['time'],'race_time':sel['race_time'],
                 'horse_id':sel['horse_id'],'horse':sel['horse'],'odds':sel['price_decimal'],
                 'bookmaker':sel['bookmaker'],'status':'Pending','model_version':model.get('version') if model else 'research-v1',
                 'model_status':model.get('state') if model else 'RESEARCH_ONLY_UNVALIDATED',
                 'fit_score':sel['score'],'winning_probability':sel.get('predicted_win_probability'),
                 'historical_positive_count':sel['positive_count'],'historical_negative_count':sel['negative_count'],
                 'published_at':now.isoformat(),'provisional':True})
                existing.add(sid)
            report={'version':1,'day':target,'generated_at':now.isoformat(),
             'status':'READY' if races else 'NO_ELIGIBLE_RACES','model_status':model.get('state') if model else 'RESEARCH_ONLY_UNVALIDATED',
             'model_version':model.get('version') if model else 'research-v1',
             'races':races,'matched_races':len(races),'excluded_races':len(groups)-len(races),
             'message':'Previous editions of the same named event only. Trends first, qualified runners second, form comparison third. Predictions logged pre-off; no odds guarantee.'}
           write_json(data/'strategy-selections.json',report)
           write_json(results_path,{'version':1,'updated_at':now.isoformat(),'selections':old_results})
           write_json(candidates_path,{'version':1,'updated_at':now.isoformat(),'candidates':old_candidates})
           write_json(model_path,model or {'state':'NOT_TRAINED','version':'none'})
           write_json(data/'strategy-learning-status.json',learning)
           print('Stage13:',report['status'],'races',len(report.get('races',[])), 'tracked selections',len(old_results), 'learning',learning['status'])
           return report

          if __name__=='__main__':
           p=argparse.ArgumentParser()
           for key in ('repo','db','mapping','cards','odds','work'):p.add_argument('--'+key,required=True)
           p.add_argument('--day',default=None);p.add_argument('--now',default=None);p.add_argument('--cached-history',default=None)
           run(p.parse_args())
