          def read_db_history(db,cardhorses,target):
              """Single bounded historical pass: retain only target horses, plus aggregate eligible trainers and jockeys.
              SQLite records end 2026-10-07; no hand-wavy historical IDs.
              """
              entries=[];stats=[];keys={name_norm(x['horse']) for x in cardhorses}
              trainers={person(x.get('trainer')) for x in cardhorses if x.get('trainer')}
              jockeys={person(x.get('jockey')) for x in cardhorses if x.get('jockey')}
              con=sqlite3.connect('file:'+str(Path(db).resolve())+'?mode=ro',uri=True)
              maxdate=con.execute('SELECT max(race_date) FROM historical_races').fetchone()[0]
              meta={row[0]:row[1:] for row in con.execute('SELECT id,race_date,course,race_type,distance_f,going FROM historical_races WHERE race_date < ?',(target.isoformat(),))}
              # Sequential scan avoids 194k random index probes / expensive SQLite join.
              sql='SELECT race_id,horse_name,horse_name_norm,age,sire,dam,trainer,jockey,finish_pos,rpr,topspeed,official_rating FROM historical_runs'
              from functools import lru_cache
              @lru_cache(maxsize=16000)
              def pnorm(v):return person(v)
              for rid,horse,hn,age,sire,dam,trainer,jockey,finish,rpr,speed,ori in con.execute(sql):
                  m=meta.get(rid)
