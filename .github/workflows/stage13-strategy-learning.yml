          def clean_lineage(v):return name_norm(v)

          def matched_horse(h,source,strict_name=True):
              """Require age continuity, and known pedigree agreement; exclude contradictions."""
              if name_norm(h.get('horse_name',h.get('horse')))!=name_norm(source['horse']):return False
              if h.get('date'):
