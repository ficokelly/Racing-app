                  ish=name_norm(hn or horse) in keys
                  ist=pnorm(trainer) in trainers
                  isj=pnorm(jockey) in jockeys
                  if not ish and not ist and not isj:continue
                  date,course,typ,dist,going=m
                  record={'date':date,'course':course,'type':typ,'distance_f':dist,'going':going,
                          'horse':horse,'horse_name':horse,'age':age,'sire':sire,'dam':dam,'trainer':trainer,'jockey':jockey,
                          'finish':finish,'rpr':rpr,'topspeed':speed,'or':ori,'race_id':rid,'source':'stage2'}
                  if ish:entries.append(record)
