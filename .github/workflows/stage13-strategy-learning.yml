      - name: Retrieve existing historical artifact inputs (no new paid data)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'STAGE13_DOWNLOAD'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          sources={
            'stage2-historical-staging-database':('stage13_sources/stage2','STAGE13_DB',None),
            'stage4-reference-named-events-and-winners':('stage13_sources/stage4','STAGE13_MAP','all_races_with_reference_event_ids.csv'),
            'stage10-exact-named-race-history':('stage13_sources/stage10',None,'audit.json')}
          found={}
          for page in range(1,12):
            raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts',
                      '-f','per_page=100','-f',f'page={page}'],text=True)
            batch=json.loads(raw).get('artifacts',[])
            for a in batch:
              if a.get('expired') or a.get('name') not in sources:continue
              prev=found.get(a['name'])
              if prev is None or a['created_at']>prev['created_at']:found[a['name']]=a
            if len(found)==len(sources) or len(batch)<100:break
          for name,(folder,env,target) in sources.items():
            artifact=found.get(name)
            if not artifact:
              if env:raise SystemExit('Required historical artifact not found: '+name+'. Re-run its historical import workflow first.')
              print('Optional current-day exact-event cache unavailable; using safe live identity matching instead')
              continue
            Path(folder).mkdir(parents=True,exist_ok=True)
            print('Downloading existing',name,'run',artifact['workflow_run']['id'],flush=True)
            subprocess.run(['gh','run','download',str(artifact['workflow_run']['id']),
                     '--repo',repo,'--name',name,'--dir',folder],check=True)
            if env:
              if target:
                candidates=list(Path(folder).rglob(target))
              else:candidates=list(Path(folder).rglob('*.sqlite'))
              if not candidates:raise SystemExit('Missing required file in '+name)
              path=max(candidates,key=lambda p:p.stat().st_size).resolve()
              with open(os.environ['GITHUB_ENV'],'a') as f:print(f'{env}={path}',file=f)
              print('Historical source',name,'size',path.stat().st_size,flush=True)
          STAGE13_DOWNLOAD
      - name: Build trend-first selections; settle and check training thresholds
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(TZ=Europe/Dublin date +%F)
          python stage13_driver.py \
            --repo . --db "$STAGE13_DB" --mapping "$STAGE13_MAP" \
            --cards data/racecards.json --odds data/latest-odds.json \
            --work stage13_run --day "$DAY" --cached-history stage13_sources/stage10
          python - <<'STAGE13_VERIFY'
          import json
          from pathlib import Path
          p=Path('data')
          for name in ['strategy-selections.json','strategy-results.json',
                       'strategy-learning-history.json','strategy-model.json','strategy-learning-status.json']:
            obj=json.loads((p/name).read_text())
            assert isinstance(obj,dict),name
          j=json.loads((p/'strategy-selections.json').read_text())
          for race in j.get('races',[]):
            assert race['historical_editions']>=2
            assert race['status'] in ('UPCOMING','OFF_OR_FINISHED')
            assert all(r['qualifies'] for r in race['qualifiers'])
          print('Verified matched races',len(j.get('races',[])),'research day',j.get('day'))
          STAGE13_VERIFY
      - name: Publish fresh selections and immutable historical predictions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strategy-selections.json data/strategy-results.json data/strategy-learning-history.json \
                  data/strategy-model.json data/strategy-learning-status.json
          if git diff --cached --quiet; then
            echo 'No strategy data changes.'
            exit 0
          fi
          git commit -m 'Update exact-race strategy selections, results and model validation'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo 'Strategy report and results published.'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          echo 'Could not publish strategy feed: other actions may be writing concurrently.' >&2
          exit 1
