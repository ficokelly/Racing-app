          BANDS=[('odds-on',0,2),('evens–under 2/1',2,3),('2/1–under 4/1',3,5),('4/1–under 8/1',5,9),('8/1–under 14/1',9,15),('14/1–under 25/1',15,26),('25/1+',26,float('inf'))]
          CUTOFF_DATA=dt.date(2026,11,1)

          def norm(s):
              return re.sub(r'[^a-z0-9]+','',unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().lower().replace('’',"'"))
          def name_norm(s):
