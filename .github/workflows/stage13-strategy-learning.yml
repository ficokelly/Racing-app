              con.close()
              return entries,stats,maxdate

          def history_match(h,r,strict_id=False):
              # When both racing API identifiers exist, require equality.
              if h.get('horse_id') and r.get('horse_id') and h['horse_id']!=r['horse_id']:return False
              return matched_horse(h,r)

          def aggregated_form(rows,runner,target):
              valid=[]; rejected=0
              for h in rows:
                  if name_norm(h.get('horse'))!=name_norm(runner.get('horse')):continue
                  if not history_match(h,runner):rejected+=1;continue
                  valid.append(h)
              valid.sort(key=lambda x:(x['date'],str(x.get('race_id'))),reverse=True)
              # If a record is demonstrably associated with another stable API identity, avoid blending.
              known_ids={h.get('horse_id') for h in valid if h.get('horse_id')}
              if runner.get('horse_id') and known_ids and runner['horse_id'] not in known_ids:return {'status':'CONFLICTING_API_ID','runs':0,'rejected':rejected}
              # Historical entries with multiple incompatible pedigrees must be excluded.
              pedigrees={(clean_lineage(h.get('sire')),clean_lineage(h.get('dam'))) for h in valid if h.get('sire') and h.get('dam')}
              if len(pedigrees)>1:return {'status':'AMBIGUOUS_PEDIGREE','runs':0,'rejected':rejected}
              # Distinct race IDs by source, no same-day duplicate across archived systems.
              seen=set();dedup=[]
