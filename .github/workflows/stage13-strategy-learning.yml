name: Stage 13 - Racing Hot Pots new strategy and learning

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7,10,13,17,23 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: stage13-strategy-feed
  cancel-in-progress: false

jobs:
  strategy-research-and-track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest Racing Hot Pots
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install self-learning dependency
        run: python -m pip install --disable-pip-version-check scikit-learn==1.6.1
      - name: Write standalone strategy engine and test modules
        shell: bash
        run: |
          set -euo pipefail
          cat > stage10_exact_history.py <<'EXACT_EVENT_MODULE'
          #!/usr/bin/env python3
          """Stage 10 — Previous editions of the SAME named race only.

          Limited, title-anchored research for the 36 races on 2026-11-01.
          The Stage 4 race identity registry is candidate evidence, not official proof;
          no substituting comparable races. All outputs distinguish descriptive from validated.
          """
          import argparse
          import collections
          import csv
          import datetime as dt
          import html
          import json
          import math
          import re
          import sqlite3
          import statistics
          import unicodedata
          from pathlib import Path

          TODAY = '2026-11-01'
          # Race-specific, distinctive named-event anchors identified in the CURRENT
          # card BEFORE inspecting winner outcomes. Sponsors are deliberately excluded.
          # Generic events like 'maiden hurdle', 'novices hurdle' etc. cannot be safely
          # equated from a title alone and MUST remain excluded.
          NAMED_EVENT_ANCHORS = {
              ('carlisle','12:38'): ('Gordon Richards', r'\bgordon\s+richards\b', 'chase'),
              ('carlisle','13:48'): ('Houghton Mares Chase', r'\bhoughton\s+mares\s+chase\b', 'chase'),
              ('carlisle','14:23'): ('Castletown Handicap Hurdle', r'\bcastletown\s+handicap\s+hurdle\b', 'hurdle'),
              ('carlisle','14:58'): ('Colin Parker Memorial', r'\bcolin\s+parker\s+memorial\b', 'chase'),
              ('carlisle','15:33'): ('Cumberland Handicap Chase', r'\bcumberland\s+handicap\s+chase\b', 'chase'),
              ('cork','15:25'): ('Cork Grand National', r'\bcork\s+grand\s+national\b.*\bhandicap\s+chase\b', 'chase'),
              ('curragh','14:37'): ('Loughbrown Stakes', r'\bloughbrown\b', 'flat'),
              ('curragh','16:20'): ('Finale Stakes', r'\bfinale\s+stakes\b', 'flat'),
              ('huntingdon','14:42'): ('Macer Gifford', r'\bmacer\s+gifford\b', 'chase'),
          }
          NONRUN = {'NR','NON-RUNNER','NON RUNNER','NONRUNNER','WITHDRAWN','SCRATCHED','VOID'}

          def norm(value):
              s=unicodedata.normalize('NFKD', str(value or '')).encode('ascii','ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+',' ',s).strip()

          def num(v):
              try:
                  n=float(v)
                  return n if math.isfinite(n) else None
              except (ValueError, TypeError):return None

          def kind(v):
              s=norm(v)
              if 'chase' in s or 'steeple' in s:return 'chase'
              if 'hurdle' in s:return 'hurdle'
              if 'national hunt flat' in s or 'nh flat' in s or 'bumper' in s:return 'bumper'
              if s in ('aw','all weather') or 'flat' in s:return 'flat'
              return s

          def read_cards(path):
              with open(path,encoding='utf-8-sig',newline='') as f: cards=list(csv.DictReader(f))
              for card in cards:
                  card['meeting']=card['meeting'].strip()
                  card['time']=card['time'].strip()[:5]
                  card['key']=(norm(card['meeting']),card['time'])
              if not cards:raise ValueError('No current races in card')
              if len(set(c['key'] for c in cards))!=len(cards):raise ValueError('Duplicate current course+time')
              return cards

          def parse_legacy_distance(s):
              s=str(s or '').lower().replace('½','.5').replace('¼','.25').replace('¾','.75')
              s=re.sub(r'\s+','',s)
              m=re.search(r'(\d+)m',s); f=re.search(r'(\d+(?:\.\d+)?)f',s)
              if not m and not f:return None
              return (int(m.group(1))*8 if m else 0)+(float(f.group(1)) if f else 0)

          def matched_mapping(mapping,cards):
              """Only explicit distinctive event names, same course and discipline.

              No wildcards over race conditions, no fallback to other races, and no
              blind trust that event IDs align across title/sponsor changes.
              """
              wanted={c['key']:c for c in cards if c['key'] in NAMED_EVENT_ANCHORS}
              candidates=collections.defaultdict(lambda:collections.defaultdict(list))
              with open(mapping,encoding='utf-8-sig',newline='') as f:
                  for row in csv.DictReader(f):
                      course=norm(row.get('course'))
                      if course not in {k[0] for k in wanted}:continue
                      rid=row.get('stage2_race_id')
                      day=row.get('date','')[:10]
                      if not rid or not day or not ('1988-01-01'<=day<TODAY):continue
                      title=norm(row.get('race_name'))
                      historical_kind=kind(row.get('race_type'))
                      for key,card in wanted.items():
                          if key[0]!=course:continue
                          label,pattern,expected_kind=NAMED_EVENT_ANCHORS[key]
                          if historical_kind!=expected_kind or not re.search(pattern,title):continue
                          # Prevent a race being mistaken for an advert for an event,
                          # or e.g. 'Cork Grand National Day' in a different race.
                          if expected_kind=='chase' and ('chase' not in title and 'steeple' not in title):continue
                          candidates[key][day[:4]].append(row)
              verified=collections.defaultdict(list)
              rejected=collections.defaultdict(list)
              for key,yeargroups in candidates.items():
                  for year,rows in yeargroups.items():
                      distinct={r['stage2_race_id']:r for r in rows}
                      if len(distinct)!=1:
                          rejected[key].append({'year':year,'reason':'AMBIGUOUS_MULTIPLE_NAMED_RACES_IN_YEAR','candidate_count':len(distinct)})
                          continue
                      row=next(iter(distinct.values()))
                      verified[key].append(row)
              for key in verified:verified[key].sort(key=lambda z:(z['date'],z['stage2_race_id']))
              return verified,rejected

          def history_rows(cx,identities):
              cols={row[1] for row in cx.execute('PRAGMA table_info(historical_runs)')}
              needed={'race_id','horse_name','finish_pos','age','trainer','jockey','official_rating','sp_decimal'}
              if needed-cols:raise ValueError('Missing historical run columns: '+','.join(sorted(needed-cols)))
              pick=list(sorted(needed))+[c if c in cols else 'NULL AS '+c for c in ('weight_lbs','draw','sex','outcome')]
              sql='SELECT '+','.join(pick)+' FROM historical_runs WHERE race_id=?'
              meta_cols={row[1] for row in cx.execute('PRAGMA table_info(historical_races)')}
              for c in ('id','race_date','course','race_type','distance_f'):
                  if c not in meta_cols:raise ValueError('Missing historical race column '+c)
              meta_sql='SELECT * FROM historical_races WHERE id=?'
              for row in identities:
                  rid=row['stage2_race_id']
                  meta= cx.execute(meta_sql,(rid,)).fetchone()
                  if meta is None:yield row,None,[];continue
                  runners=[dict(x) for x in cx.execute(sql,(rid,))]
                  runners=[r for r in runners if str(r.get('outcome') or '').strip().upper() not in NONRUN]
                  yield row,dict(meta),runners

          def tertile(vals,index):
              v=vals[index]
              if v is None:return None
              actual=[n for n in vals if n is not None]
              if len(actual)<3:return None
              pct=(sum(x<v for x in actual)+.5*sum(x==v for x in actual))/len(actual)
              return 'BOTTOM' if pct<=1/3 else 'TOP' if pct>=2/3 else 'MIDDLE'

          def flags(r,i,field,discipline):
              age=num(r.get('age'));rating=num(r.get('official_rating'))
              age=int(age) if age is not None and age>=0 and age.is_integer() else None
              result=set()
              if age is not None:
                  result.update((f'AGE_{age}', 'AGE_8_PLUS' if age>=8 else 'AGE_UNDER_8'))
              wt=tertile([num(x.get('weight_lbs')) for x in field],i)
              orank=tertile([num(x.get('official_rating')) for x in field],i)
              if wt:result.add('WEIGHT_'+wt+'_THIRD')
              if orank:result.add('OFFICIAL_RATING_'+orank+'_THIRD')
              if discipline=='flat':
                  draw=tertile([num(x.get('draw')) for x in field],i)
                  if draw:result.add('DRAW_'+draw+'_THIRD')
              sex=norm(r.get('sex'))
              if sex in ('m','f','mare','filly'):result.add('FEMALE')
              if sex in ('g','gelding'):result.add('GELDING')
              if sex in ('c','colt','h','horse','stallion'):result.add('ENTIRE_MALE')
              return sorted(result)

          def evaluate_one(key,edition_rows,card,cx):
              label,pat,dis=NAMED_EVENT_ANCHORS[key]
              target_dist=num(card.get('distance_f'))
              editions=[]; all_entries=[]; traits=collections.defaultdict(list)
              for mapping,meta,field in history_rows(cx,edition_rows):
                  if meta is None:continue
                  if norm(meta['course'])!=key[0] or kind(meta['race_type'])!=dis:continue
                  year=int(mapping['date'][:4]); historical_dist=num(meta.get('distance_f'))
                  if historical_dist is None:historical_dist=parse_legacy_distance(mapping.get('distance'))
                  comparable=(target_dist is None or historical_dist is None or abs(target_dist-historical_dist)<=3)
                  winners=[r for r in field if num(r['finish_pos'])==1]
                  if not field or not winners:continue
                  spok=all(num(r.get('sp_decimal')) is not None and num(r['sp_decimal'])>=1.01 for r in field)
                  market_total=sum(1/num(r['sp_decimal']) for r in field) if spok else None
                  edition={'meeting':card['meeting'],'time':card['time'],'named_event':label,
                       'date':mapping['date'],'year':year,'race_name':mapping['race_name'],
                       'race_id':mapping['stage2_race_id'],'stage4_event_id':mapping['event_id'],
                       'stage4_match_status':mapping['match_status'], 'distance_f':historical_dist,
                       'distance_difference_f':round(historical_dist-target_dist,2) if target_dist is not None and historical_dist is not None else '',
                       'included_in_trends':comparable,'field_size':len(field),'winners':len(winners),
                       'winner_names':' / '.join(r['horse_name'] for r in winners)}
                  editions.append(edition)
                  for i,r in enumerate(field):
                      wins=1/len(winners) if num(r['finish_pos'])==1 else 0.
                      sp=num(r.get('sp_decimal'))
                      expected=(1/sp/market_total if spok else None)
                      feats=flags(r,i,field,dis)
                      # Historic final SP is retrospective. These are descriptive market
                      # distributions, not pre-race features for 2026 selection.
                      if sp is not None and sp>=1.01:
                          valid_sp=[num(x.get('sp_decimal')) for x in field]
                          if all(x is not None and x>=1.01 for x in valid_sp):
                              if sp==min(valid_sp):feats.append('HISTORICAL_FINAL_SP_FAVOURITE')
                              if sum(x<sp for x in valid_sp)<=2:feats.append('HISTORICAL_FINAL_SP_TOP_THREE')
                              if sp<2:feats.append('HISTORICAL_FINAL_SP_ODDS_ON')
                      entry={'meeting':card['meeting'],'time':card['time'],'named_event':label,
                             'date':mapping['date'],'race_id':mapping['stage2_race_id'],
                             'included_in_trends':comparable,
                             'horse':r['horse_name'],'trainer':r.get('trainer'),'jockey':r.get('jockey'),
                             'age':r.get('age'),'sex':r.get('sex'),'official_rating':r.get('official_rating'),
                             'weight_lbs':r.get('weight_lbs'),'draw':r.get('draw'),
                             'finish_pos':r.get('finish_pos'),'winner_credit':round(wins,3),
                             'sp_decimal':sp,'market_expected_share':round(expected,5) if expected is not None else '',
                             'historical_traits':'|'.join(feats)}
                      all_entries.append(entry)
                      if comparable:
                          for flag in feats:traits[flag].append((edition,entry))
              editions.sort(key=lambda x:x['date'])
              included=[x for x in editions if x['included_in_trends']]
              baseline={e['race_id']:e['field_size'] for e in included}
              traitrows=[]
              for trait,obs in traits.items():
                  qualifying=len(obs);win=sum(q['winner_credit'] for e,q in obs)
                  equal_expected=sum(1/baseline[e['race_id']] for e,q in obs)
                  market_obs=[(e,q) for e,q in obs if q['market_expected_share']!='']
                  market_exp=sum(q['market_expected_share'] for e,q in market_obs)
                  market_wins=sum(q['winner_credit'] for e,q in market_obs)
                  sp_return=sum(q['winner_credit']*q['sp_decimal'] for e,q in market_obs)
                  ryears=sorted({e['year'] for e,q in obs})
                  # Repeated annual editions and tiny runner samples are exploratory.
                  traitrows.append({'meeting':card['meeting'],'time':card['time'],'named_event':label,
                      'trait':trait,'historical_editions_in_scope':len(included),
                      'qualifying_runners':qualifying,'editions_with_qualifiers':len({e['race_id'] for e,q in obs}),
                      'winning_runner_credit':round(win,3),
                      'win_pct_of_qualifiers':round(100*win/qualifying,2) if qualifying else '',
                      'equal_field_expected_wins':round(equal_expected,3),
                      'excess_vs_equal_field':round(win-equal_expected,3),
                      'market_evaluable_qualifiers':len(market_obs),
                      'market_expected_wins':round(market_exp,3) if market_obs else '',
                      'excess_vs_market':round(market_wins-market_exp,3) if market_obs else '',
                      'retrospective_sp_roi_pct':round(100*(sp_return/len(market_obs)-1),2) if market_obs else '',
                      'first_year':min(ryears) if ryears else '',
                      'last_year':max(ryears) if ryears else '',
                      'status':'DESCRIPTIVE_ONLY_SMALL_SAMPLE' if len(included)<15 or qualifying<20 else 'EXPLORATORY_UNVALIDATED',
                      'interpretation':'positive' if win>equal_expected else 'negative' if win<equal_expected else 'neutral'})
              traitrows.sort(key=lambda x:(-x['editions_with_qualifiers'],-x['qualifying_runners'],x['trait']))
              return editions,all_entries,traitrows

          def write_csv(path,items,cols):
              with open(path,'w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore');w.writeheader();w.writerows(items)

          def write_report(path, cards, audits, edition_rows, trends):
              grouped=collections.defaultdict(list)
              for t in trends:grouped[(norm(t['meeting']),t['time'])].append(t)
              pered=collections.defaultdict(list)
              for e in edition_rows:pered[(norm(e['meeting']),e['time'])].append(e)
              parts=['<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">',
                 '<title>Stage 10 — exact named races only</title><style>body{font:15px system-ui,Arial;max-width:1100px;margin:auto;padding:18px;color:#243044;background:#f7f8fa}h1,h2{color:#18243b}.card{background:#fff;border:1px solid #dce3e9;padding:14px;margin:16px 0;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:600px}th,td{padding:8px;border-bottom:1px solid #e5e9ed;text-align:left}th{background:#eef2f7}.scroll{overflow:auto}small{color:#606b78}.no{color:#8a3434}.yes{color:#275e37}</style></head><body>',
                 '<h1>Stage 10 — Previous Editions of the Same Named Race</h1>',
                 '<p><strong>Target day: '+TODAY+'.</strong> Named-event matching only; no same-course or comparable-race fallback. Historical editions before target day.</p>',
                 '<p><strong>Important:</strong> Title-and-course identity is provisional, NOT independent official verification. Trends are descriptive, not proven profitable. Retrospective SP is for evaluation only. Distance changes of more than 3 furlongs are listed but excluded from trend calculations.</p>']
              matched=sum(a['status']=='MATCHED' for a in audits)
              parts.append(f'<p><strong>{matched} / {len(cards)}</strong> races with 2+ separately dated matched historical editions; {len(cards)-matched} excluded.</p>')
              for a in audits:
                  key=(norm(a['meeting']),a['time']);c=html.escape(a['meeting']+' '+a['time']+' '+a['race'])
                  parts.append('<section class="card"><h2>'+c+'</h2>')
                  if a['status']!='MATCHED':
                      parts.append('<p class="no"><strong>EXCLUDED.</strong> '+html.escape(a['reason'])+'</p></section>');continue
                  parts.append('<p class="yes"><strong>Included.</strong> '+str(a['historical_editions'])+' named historical editions ('+str(a['first_year'])+'–'+str(a['last_year'])+'), '+str(a['comparable_editions'])+' with broadly comparable distance. '+str(a['runner_records_used'])+' runner starts used in trend research.</p>')
                  parts.append('<details><summary>Historical editions and winners</summary><div class="scroll"><table><tr><th>Year</th><th>Named race</th><th>Winner(s)</th><th>Field</th><th>Distance usable?</th></tr>')
                  for e in pered[key]:parts.append('<tr><td>'+str(e['year'])+'</td><td>'+html.escape(e['race_name'])+'</td><td>'+html.escape(e['winner_names'])+'</td><td>'+str(e['field_size'])+'</td><td>'+('Yes' if e['included_in_trends'] else 'No')+'</td></tr>')
                  parts.append('</table></div></details>')
                  parts.append('<h3>Runner traits: winners versus all starters</h3><div class="scroll"><table><tr><th>Characteristic</th><th>Starts</th><th>Wins</th><th>Wins expected / equal-field</th><th>Market expected</th><th>Historical SP ROI</th><th>Status</th></tr>')
                  for t in grouped[key][:35]:
                      parts.append('<tr><td>'+html.escape(t['trait'])+'</td><td>'+str(t['qualifying_runners'])+'</td><td>'+str(t['winning_runner_credit'])+'</td><td>'+str(t['equal_field_expected_wins'])+'</td><td>'+str(t['market_expected_wins'])+'</td><td>'+str(t['retrospective_sp_roi_pct'])+'</td><td>'+t['status']+'</td></tr>')
                  parts.append('</table></div><small>Full runner-by-runner evidence and all calculated traits are in the CSV files. Same-field comparisons are descriptive: small and overlapping samples cannot establish a reliable betting advantage.</small></section>')
              parts.append('</body></html>')
              path.write_text('\n'.join(parts),encoding='utf-8')

          def process(args):
              out=Path(args.out);out.mkdir(parents=True,exist_ok=True)
              cards=read_cards(args.cards)
              mapping,rejected=matched_mapping(args.mapping,cards)
              cx=sqlite3.connect('file:'+str(Path(args.db).resolve())+'?mode=ro',uri=True)
              cx.row_factory=sqlite3.Row
              audits=[];all_editions=[];all_runners=[];all_trends=[]
              for card in cards:
                  key=card['key'];label=NAMED_EVENT_ANCHORS.get(key,('','',''))[0]
                  candidates=mapping.get(key,[])
                  reason='NO_DISTINCTIVE_SAME_NAMED_EVENT_MATCH' if key not in NAMED_EVENT_ANCHORS else 'FEWER_THAN_TWO_UNAMBIGUOUS_HISTORIC_EDITIONS'
                  if len(candidates)<2:
                      audits.append({'meeting':card['meeting'],'time':card['time'],'race':card['race'],
                                     'status':'EXCLUDED','reason':reason,'anchor':label,'historical_editions':len(candidates),
                                     'ambiguous_years':len(rejected.get(key,[]))})
                      continue
                  ed,runs,trends=evaluate_one(key,candidates,card,cx)
                  if len(ed)<2:
                      audits.append({'meeting':card['meeting'],'time':card['time'],'race':card['race'],
                                     'status':'EXCLUDED','reason':'FEWER_THAN_TWO_EDITIONS_WITH_WINNER_AND_STARTERS',
                                     'anchor':label,'historical_editions':len(ed),'ambiguous_years':len(rejected.get(key,[]))})
                      continue
                  used=[e for e in ed if e['included_in_trends']]
                  if len(used)<2:
                      audits.append({'meeting':card['meeting'],'time':card['time'],'race':card['race'],
                                     'status':'EXCLUDED','reason':'FEWER_THAN_TWO_EDITIONS_WITH_COMPARABLE_DISTANCE',
                                     'anchor':label,'historical_editions':len(ed),'ambiguous_years':len(rejected.get(key,[]))})
                      continue
                  all_editions+=ed;all_runners+=runs;all_trends+=trends
                  audits.append({'meeting':card['meeting'],'time':card['time'],'race':card['race'],
                     'status':'MATCHED','reason':'SAME_DISTINCTIVE_NAMED_EVENT_AND_COURSE_AND_DISCIPLINE;TITLE_ONLY_PROVISIONAL',
                     'anchor':label,'historical_editions':len(ed),'comparable_editions':len(used),
                     'runner_records_used':sum(e['field_size'] for e in used),
                     'first_year':min(e['year'] for e in ed),'last_year':max(e['year'] for e in ed),
                     'ambiguous_years':len(rejected.get(key,[]))})
                  print(card['meeting'],card['time'],label,len(ed),'editions',sum(e['field_size'] for e in used),'runner starts',flush=True)
              cx.close()
              # Named-race historical trainer/jockey records. Retrospective identities
              # are name-based and cannot be assumed to represent the same person.
              trainer_jockey=[]
              by_entity=collections.defaultdict(list)
              for x in all_runners:
                  if not x['included_in_trends']:continue
                  for role in ('trainer','jockey'):
                      name=str(x.get(role) or '').strip()
                      if name:by_entity[(x['meeting'],x['time'],x['named_event'],role,name)].append(x)
              for (meeting,time,event,role,name),entries in by_entity.items():
                  wins=sum(float(x['winner_credit']) for x in entries)
                  sp_entries=[x for x in entries if x['sp_decimal'] is not None]
                  roi=(sum(float(x['winner_credit'])*float(x['sp_decimal']) for x in sp_entries)/len(sp_entries)-1)*100 if sp_entries else None
                  trainer_jockey.append({'meeting':meeting,'time':time,'named_event':event,'role':role,
                       'name':name,'runner_starts':len(entries),'winning_credit':round(wins,3),
                       'wins_per_100_starts':round(100*wins/len(entries),2),
                       'historical_sp_roi_pct':round(roi,2) if roi is not None else '',
                       'year_span':str(min(x['date'][:4] for x in entries))+'-'+str(max(x['date'][:4] for x in entries)),
                       'status':'DESCRIPTIVE_ONLY_UNVALIDATED'})
              trainer_jockey.sort(key=lambda x:(x['meeting'],x['time'],x['role'],-x['runner_starts'],x['name']))
              write_csv(out/'historical_event_trainer_jockey.csv',trainer_jockey,
                 ['meeting','time','named_event','role','name','runner_starts','winning_credit',
                  'wins_per_100_starts','historical_sp_roi_pct','year_span','status'])
              write_csv(out/'race_match_audit.csv' ,audits,['meeting','time','race','status','reason','anchor','historical_editions','comparable_editions','runner_records_used','first_year','last_year','ambiguous_years'])
              write_csv(out/'exact_historical_editions.csv',all_editions,['meeting','time','named_event','date','year','race_name','race_id','stage4_event_id','stage4_match_status','distance_f','distance_difference_f','included_in_trends','field_size','winners','winner_names'])
              write_csv(out/'actual_historical_runners.csv',all_runners,['meeting','time','named_event','date','race_id','included_in_trends','horse','trainer','jockey','age','sex','official_rating','weight_lbs','draw','finish_pos','winner_credit','sp_decimal','market_expected_share','historical_traits'])
              write_csv(out/'previous_edition_trends.csv',all_trends,['meeting','time','named_event','trait','historical_editions_in_scope','qualifying_runners','editions_with_qualifiers','winning_runner_credit','win_pct_of_qualifiers','equal_field_expected_wins','excess_vs_equal_field','market_evaluable_qualifiers','market_expected_wins','excess_vs_market','retrospective_sp_roi_pct','first_year','last_year','status','interpretation'])
