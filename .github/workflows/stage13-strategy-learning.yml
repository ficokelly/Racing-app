                  if k in seen:continue
                  seen.add(k);dedup.append(h)
              valid=dedup
              if not valid:return {'status':'NO_MATCHED_RECORDS','runs':0,'rejected':rejected}
              won=lambda h: h.get('finish')==1
              place=lambda h: h.get('finish') is not None and h['finish']<=3
              track=norm(runner.get('course'))
              rf=num(runner.get('distance_f'))
              kind='flat' if norm(runner.get('type'))=='flat' else 'chase' if 'chase' in norm(runner.get('type')) else 'hurdle' if 'hurdle' in norm(runner.get('type')) else ''
              atcourse=[h for h in valid if norm(h.get('course'))==track]
              atdistance=[h for h in valid if rf is not None and num(h.get('distance_f')) is not None and abs(num(h['distance_f'])-rf)<=1]
              atk=[h for h in valid if kind and kind in norm(h.get('type'))]
              p5=valid[:5];p3=valid[:3]
              ratings=[num(h.get('rpr')) for h in p5];ratings=[v for v in ratings if v is not None]
              days=(target-day(valid[0]['date'])).days
              return {'status':'MATCHED','runs':len(valid),'wins':sum(map(won,valid)),'last3':sum(map(place,p3)),
                  'last5':sum(map(place,p5)),'last5wins':sum(map(won,p5)),
                  'course_runs':len(atcourse),'course_wins':sum(map(won,atcourse)),
                  'distance_runs':len(atdistance),'distance_wins':sum(map(won,atdistance)),
                  'type_runs':len(atk),'type_wins':sum(map(won,atk)),
                  'last_run_days':days,'last_rpr_avg':round(statistics.mean(ratings),1) if ratings else None,
                  'latest_record':valid[0]['date'],'rejected':rejected,'history_sources':','.join(sorted({h['source'] for h in valid}))}

          def person_stats(rows,runner,target,role,days,course=False):
              key=person(runner.get(role));loc=norm(runner.get('course'))
              if not key:return {'starts':0,'wins':0}
              since=target-dt.timedelta(days=days)
              sel=[r for r in rows if person(r.get(role))==key and since<=day(r['date'])<target and (not course or norm(r.get('course'))==loc)]
              # Deduplicate across sets; date+course+horse may mix double headers but acceptable for trainer field.
              unique={(x['date'],norm(x.get('course')),name_norm(x.get('horse'))):x for x in sel}
              n=len(unique);w=sum(x.get('finish')==1 for x in unique.values())
              return {'starts':n,'wins':w,'pct':round(100*w/n,1) if n else None}

          def band_for(price):
              return next((name for name,a,b in BANDS if price is not None and a<=price<b),None)

          def market_data(stage10_runners,matched):
              stats=collections.defaultdict(lambda:collections.defaultdict(list))
              for r in stage10_runners:
                  key=(norm(r['meeting']),r['time'])
                  if key not in matched or str(r.get('included_in_trends')).lower()!='true':continue
                  sp=num(r.get('sp_decimal'))
                  if sp is None or sp<=1:continue
                  b=band_for(sp)
                  if b:stats[key][b].append((num(r.get('winner_credit')) or 0,sp,r['date']))
              output={}
              for key,groups in stats.items():
                  output[key]={}
                  for b,vals in groups.items():
                      wins=sum(x[0] for x in vals);n=len(vals)
                      output[key][b]={'starts':n,'wins':round(wins,2), 'strike_pct':round(wins/n*100,1),
                          'roi_pct':round((sum(w*odds for w,odds,_ in vals)-n)/n*100,1),
                          'editions':len({date[:4] for _,_,date in vals})}
              return output

          def historical_market_positions(stage10_runners,matched):
              """Rank every historical starter within its edition by final SP (descriptive ONLY)."""
              byrace=collections.defaultdict(list)
              for r in stage10_runners:
                  key=(norm(r['meeting']),r['time'])
                  if key not in matched or str(r.get('included_in_trends')).lower()!='true':continue
                  price=num(r.get('sp_decimal'))
                  if price and price>1:
                      byrace[(key,r['race_id'])].append((price,num(r.get('winner_credit')) or 0,r['date'][:4]))
              groups=collections.defaultdict(lambda:collections.defaultdict(list))
              for (key,race_id),data in byrace.items():
                  prices=sorted({p for p,w,y in data})
                  for p,w,y in data:
                      rank=prices.index(p)+1
                      label='Favourite' if rank==1 else 'Second favourite' if rank==2 else 'Third–fourth' if rank<=4 else 'Fifth or bigger'
                      groups[key][label].append((w,p,y))
              out={}
              for key,g in groups.items():
                  out[key]={}
                  for label,vals in g.items():
                      n=len(vals);wins=sum(x[0] for x in vals)
                      out[key][label]={'starts':n,'wins':round(wins,2),'roi_pct':round((sum(w*p for w,p,_ in vals)-n)/n*100,1),
                                       'editions':len({y for _,_,y in vals})}
              return out

          def observed_prices(p,target):
              if not Path(p).exists():return {}
              data=jsonread(p);rows=data.get('prices',[])
              by=collections.defaultdict(list)
              for x in rows:
                  if x.get('bookmaker')!='williamhill':continue
                  if str(x.get('race_time',''))[:10]!=target:continue
                  k=(norm(x.get('course')),local_clock(x.get('race_time')),name_norm(x.get('horse')))
                  price=num(x.get('decimal_odds'))
                  if price and price>1:by[k].append(x)
              out={}
              for k,v in by.items():
                  v.sort(key=lambda x:str(x.get('collected_at') or x.get('bookmaker_updated_at')))
                  x=v[-1]
                  observed=str(x.get('collected_at') or data.get('collected_at') or '')
                  # No betting price when snapshot came after scheduled off
                  snap=dt.datetime.fromisoformat(observed.replace('Z','+00:00')) if observed else None
                  off=dt.datetime.fromisoformat(str(x['race_time']).replace('Z','+00:00'))
                  out[k]={'decimal':num(x.get('decimal_odds')) if snap and snap<off and not x.get('stale') else None,
                      'opening_decimal':num(x.get('opening_odds')) if snap and snap<off and not x.get('stale') else None,
                      'observed_at':observed,'preoff':bool(snap and snap<off and not x.get('stale')),
                      'raw_decimal':num(x.get('decimal_odds'))}
              return out

          def current_trait(r,allr):
              traits=set()
              age=num(r.get('age'))
              if age is not None:
                  traits.add('AGE_'+str(int(age)))
                  if age<8:traits.add('AGE_UNDER_8')
              sex=norm(r.get('sex'))
              if sex in ('gelding','g'):traits.add('GELDING')
              if sex in ('mare','m','filly','f'):traits.add('FEMALE')
              if sex in ('colt','c','horse','h','stallion'):traits.add('MALE_ENTIRE')
              for field,trait_prefix in [('ofr','OFFICIAL_RATING'),('lbs','WEIGHT')]:
                  v=num(r.get(field));all_values=[num(x.get(field)) for x in allr];all_values=[x for x in all_values if x is not None]
                  if v is not None and len(all_values)>=3:
                      lower=sum(x<v for x in all_values);tie=sum(x==v for x in all_values)
                      p=(lower+tie*.5)/len(all_values)
                      label='BOTTOM_THIRD' if p<=1/3 else 'TOP_THIRD' if p>=2/3 else 'MIDDLE_THIRD'
                      traits.add(trait_prefix+'_'+label)
              return traits

          def historical_signal(traits,trend_rows,key,editions):
              # Statistical evidence is exploratory and post-selection; never assert validated edge.
              evaluated=[]
              for row in trend_rows:
                  if (norm(row['meeting']),row['time'])!=key:continue
                  t=row['trait']
                  if t not in traits:continue
                  n=num(row.get('qualifying_runners')) or 0
                  e=num(row.get('editions_with_qualifiers')) or 0
                  wins=num(row.get('winning_runner_credit')) or 0
                  expected=num(row.get('market_expected_wins'))
                  if n<10 or e<5 or expected is None or expected<=0:continue
                  excess=wins-expected
                  # Stabilize with pseudocounts and prevent extreme zeros; cap per-factor contribution.
                  z=excess/math.sqrt(expected+1)
                  strength=max(-1,min(1,z/2.8))*min(1,e/12)*min(1,n/30)
                  evaluated.append((t,round(strength,3),round(wins,2),int(n),int(e)))
              return sorted(evaluated,key=lambda x:-abs(x[1]))

          def signal_family(trait):
              """Overlapping age and handicap measures count at most once toward a score."""
              if trait.startswith('AGE_'):return 'AGE'
              if trait.startswith('OFFICIAL_RATING_') or trait.startswith('WEIGHT_'):return 'HANDICAP_POSITION'
              if trait in ('MALE_ENTIRE','GELDING','FEMALE'):return 'SEX'
              return trait

          def historical_evidence(traits,trend_rows,key):
              """All applicable hypotheses, including low-support observations and negatives.

              Evidence direction is observed winners relative to market-expected winners,
              never based simply on the share of previous winners. Insufficient market
              coverage is unscored and explicitly disclosed.
              """
              out=[]
              for row in trend_rows:
                  if (norm(row['meeting']),row['time'])!=key or row['trait'] not in traits:continue
                  n=int(num(row.get('qualifying_runners')) or 0)
                  editions=int(num(row.get('editions_with_qualifiers')) or 0)
                  wins=num(row.get('winning_runner_credit')) or 0
                  expected=num(row.get('market_expected_wins'))
                  market_n=int(num(row.get('market_evaluable_qualifiers')) or 0)
                  market_coverage=market_n/n if n else 0
                  excess=wins-expected if expected is not None else None
                  direction='POSITIVE' if excess is not None and excess>0 else 'NEGATIVE' if excess is not None and excess<0 else 'NEUTRAL' if excess is not None else 'UNKNOWN'
                  # Do not score a post-hoc trend without sufficient historical depth or
                  # market coverage. These are exploratory minimums, NOT validation.
                  scored=(n>=10 and editions>=5 and expected is not None and expected>0 and market_coverage>=.8)
                  raw=(excess/math.sqrt(expected+1)) if scored else 0.0
                  strength=(max(-1,min(1,raw/2.8))*min(1,editions/12)*min(1,n/30)) if scored else 0.0
                  result=dict(trait=row['trait'],family=signal_family(row['trait']),direction=direction,
                      qualifying_runners=n,winning_runner_credit=round(wins,2),editions=editions,
                      market_evaluable_runners=market_n,market_coverage_pct=round(market_coverage*100,1),
                      market_expected_wins=round(expected,2) if expected is not None else None,
                      excess_vs_market=round(excess,2) if excess is not None else None,
                      historical_sp_roi_pct=num(row.get('retrospective_sp_roi_pct')),
                      first_year=row.get('first_year',''),last_year=row.get('last_year',''),
                      validation='EXPLORATORY_UNVALIDATED' if scored else 'LIMITED_SAMPLE_OR_MARKET_COVERAGE',
                      strength=round(strength,5),impact_points=0.0,overlap_not_counted=False,
                      source_status=row.get('status',''))
                  out.append(result)
              # Avoid giving extra ranking points to overlapping traits such as AGE_7
              # and AGE_UNDER_8, or correlated rating/weight third buckets.
              by_family={}
              for result in out:
                  if result['validation']!='EXPLORATORY_UNVALIDATED':continue
                  fam=result['family']
                  if fam not in by_family or abs(result['strength'])>abs(by_family[fam]['strength']):
                      by_family[fam]=result
              for result in out:
                  if result['validation']=='EXPLORATORY_UNVALIDATED':
                      if by_family.get(result['family']) is not result:
                          result['overlap_not_counted']=True
                      else:
                          result['impact_points']=round(max(-.25,min(.25,result['strength']))*16,3)
              pos=sum(max(0,r['impact_points']) for r in out)
              neg=sum(min(0,r['impact_points']) for r in out)
              # The historical component is a *heuristic*, capped symmetrically and
              # openly; it must not be presented as a fitted winning probability.
              pos=round(min(8.0,pos),3)
              neg=round(max(-8.0,neg),3)
              return out, pos, neg

          def evidence_description(e):
              x=('+' if e['excess_vs_market'] is not None and e['excess_vs_market']>0 else '')+str(e['excess_vs_market'] if e['excess_vs_market'] is not None else 'unknown')
              return (f"{e['trait']}: {e['winning_runner_credit']} wins / {e['qualifying_runners']} starters "
                      f"({e['editions']} editions; {e['first_year']}–{e['last_year']}); "
                      f"market expected {e['market_expected_wins']}; excess {x}; "
                      f"{'overlap, 0 additional points' if e['overlap_not_counted'] else 'limited/unscored' if e['validation']!='EXPLORATORY_UNVALIDATED' else 'score '+format(e['impact_points'],'+.2f')}")

          def form_counter_evidence(f):
              cautions=[]
              if f.get('status')!='MATCHED':return ['Horse history not verified; missing form is NOT a negative result']
              if f.get('last_run_days') is not None and f['last_run_days']>210:
                  cautions.append(f"Long break: {f['last_run_days']} days since most recent verified run (not automatically a negative)")
              if f.get('runs',0)>=3 and f.get('last5wins',0)==0:
                  cautions.append('No wins in last five recorded starts; quality of opposition still requires review')
              if f.get('course_runs',0)==0:cautions.append('No verified course form: unknown, not a course-form failure')
              if f.get('distance_runs',0)==0:cautions.append('No verified similar-distance form: unknown, not evidence against stamina')
              return cautions

          def ranking(r,feature,trainer30,trainercourse,jockey90,signals,price,historical_market):
              # Transparent research FIT score (not win probability), sparse-history penalty.
              f=feature
              # Historical evidence passed in as (positive_points, negative_points)
              # after overlap grouping. Positives cannot erase negatives in the audit.
              positive_points,negative_points=signals
              hist=(positive_points+negative_points)/16
              fscore=0
              if f.get('status')=='MATCHED':
                  n=f['runs'];fscore+=min(f['last5'],3)*0.11+min(f['last5wins'],2)*0.17
                  if f['type_runs']>=3:fscore+=min(f['type_wins'],3)*0.09
                  if f['course_runs']>=2:fscore+=min(f['course_wins'],2)*0.1
                  if f['distance_runs']>=2:fscore+=min(f['distance_wins'],2)*0.1
                  if f.get('last_run_days') is not None and f['last_run_days']>210:fscore-=0.08
              else:fscore-=0.1
              # Trainer/jockey indicators are sample-shrunk relative to neutral baselines, not post-race.
              t=0
              if trainer30.get('starts',0)>=10:t+=max(-.12,min(.16,(trainer30['wins']/(trainer30['starts']+30)-0.1)*0.7))
              if trainercourse.get('starts',0)>=25:t+=max(-.09,min(.12,(trainercourse['wins']/(trainercourse['starts']+30)-0.1)*0.5))
              if jockey90.get('starts',0)>=20:t+=max(-.08,min(.1,(jockey90['wins']/(jockey90['starts']+30)-0.1)*0.5))
              score=round(50+hist*16+fscore*18+t*16,1)
              # Market data and historical SP bands are deliberately NOT used to optimize scores,
              # avoiding the post-race SP pattern as a predictive shortcut without validation.
              return max(0,min(100,score)),round(hist,3),round(fscore,3),round(t,3)

