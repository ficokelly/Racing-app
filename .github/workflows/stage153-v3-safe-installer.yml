name: 'Stage153 V3 — Secure two-step installer (source + workflow handoff)'

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: stage153-one-file-installer
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout main with write permission
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unpack audited self-contained source and scheduling payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'STAGE153_PAYLOAD'
          from pathlib import Path
          import base64,gzip
          payloads = {
              'scripts/stage153_roi_combined.py': '',
              'scripts/stage153_install_stage153.py': '',
              '.github/workflows/stage153-roi-combined.yml': '',
              '.github/workflows/stage153-odds-fallback.yml': '',
          }
          for name,pack in payloads.items():
              dest=Path(name); dest.parent.mkdir(parents=True,exist_ok=True)
              if dest.exists():
                  raise RuntimeError('Refusing to replace existing file during installer extraction: '+name)
              raw=gzip.decompress(base64.b64decode(pack))
              dest.write_bytes(raw)
              print('INSTALLED_PAYLOAD',name,len(raw),'bytes')

          STAGE153_PAYLOAD
      - name: Apply exact frozen-source compatibility edits and run syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage153_install_stage153.py
          python scripts/stage153_roi_combined.py self-test
          python -m py_compile scripts/stage153_roi_combined.py
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python - <<'STAGE153_YAML'
          import pathlib,yaml
          paths=[pathlib.Path('.github/workflows')/s for s in (
            'stage153-roi-combined.yml','stage153-odds-fallback.yml',
            'stage152-best-roi-specialists-today.yml','stage147-daily-143-146.yml',
            'racing-hot-pots-five-minute.yml')]
          for p in paths:
            j=yaml.safe_load(p.read_text());assert j['jobs'],p
            print('STAGE153_YAML_VALID',p)
          STAGE153_YAML
          node - <<'STAGE153_JS'
          const fs=require('fs');const vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const blocks=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(x=>x[1]).filter(s=>s.trim());
          if(!blocks.length)throw Error('No embedded index.html scripts');
          for(const s of blocks)new vm.Script(s);
          console.log('STAGE153_JS_VALID',blocks.length,'inline scripts');
          STAGE153_JS
      - name: Package workflow permissions workaround for user upload
        uses: actions/upload-artifact@v4
        with:
          name: stage153-eight-workflows-to-upload
          path: |
            .github/workflows/stage153-roi-combined.yml
            .github/workflows/stage153-odds-fallback.yml
            .github/workflows/stage141-today-or-weight-paper.yml
            .github/workflows/stage151-d142-core-form-or-weight-today.yml
            .github/workflows/stage152-best-roi-specialists-today.yml
            .github/workflows/stage147-daily-143-146.yml
            .github/workflows/racing-hot-pots-five-minute.yml
            .github/workflows/rhp-stage69-dc-live.yml
          retention-days: 30
          if-no-files-found: error
      - name: Commit source code only (GitHub workflow permissions workaround)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html \
            scripts/stage153_roi_combined.py scripts/stage153_install_stage153.py \
            scripts/stage141_today_or_weight_paper.py \
            scripts/stage151_d142_core_form_or_weight_today.py \
            scripts/stage152_best_roi_specialists_today.py \
            scripts/stage147_daily_143_146.py
          # Archive uploaded above; do not include GitHub workflow files in the commit.
          # Restore changes to tracked workflows so git pull --rebase is permitted.
          git restore --worktree -- .github/workflows
          rm -f .github/workflows/stage153-roi-combined.yml .github/workflows/stage153-odds-fallback.yml
          if git diff --cached --quiet; then echo 'No source updates';exit 0; fi
          git commit -m 'Stage153: install ROI specialist app and scorer sources; workflows require user upload'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'STAGE153_INSTALL_COMMITTED'
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt * 4))"
          done
          echo 'Unable to push Stage153; main app unchanged' >&2
          exit 1
      - name: Display required manual workflow-upload instructions
        run: |
          echo '# Stage153 source installed — workflow upload required' >> "$GITHUB_STEP_SUMMARY"
          echo '1. Download the artifact: stage153-eight-workflows-to-upload' >> "$GITHUB_STEP_SUMMARY"
          echo '2. Extract the ZIP and upload all eight .yml files to .github/workflows/ on main using GitHub web UI.' >> "$GITHUB_STEP_SUMMARY"
          echo '3. Run .github/workflows/stage153-roi-combined.yml manually for tomorrow after they are uploaded.' >> "$GITHUB_STEP_SUMMARY"
          echo '4. Confirm the combined feed and all five source runs complete before relying on automated operation.' >> "$GITHUB_STEP_SUMMARY"
