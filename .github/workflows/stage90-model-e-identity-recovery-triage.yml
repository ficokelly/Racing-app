name: Stage90 - Model E Exact Horse Identity Recovery Triage

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'As-of Irish date YYYY-MM-DD (blank = today)'
        required: false
        type: string
        default: ''
      days:
        description: 'Backtest window: prior completed racing days'
        type: choice
        required: true
        default: '30'
        options: ['7', '14', '30', '60', '90']

permissions:
  contents: read
  actions: read

concurrency:
  group: stage90-model-e-identity-research
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout full dated Git history without write permission
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen HPR engine and exact-ID safety checks
        run: |
          python scripts/stage86_hpr_engine.py --mode self-test
          python scripts/stage89_hpr_gap_triage.py --self-test
          python scripts/stage90_hpr_identity_triage.py --self-test
      - name: Restore historical source cache
        uses: actions/cache@v4
        with:
          path: |
            reports/stage86/base/original.sqlite
            ~/.cache/kagglehub
          key: stage86-base-v129-${{ hashFiles('import_historical_ukie.py') }}
          restore-keys: |
            stage84-base-ukie-v129-
      - name: Install historical data source helper
        run: python -m pip install --disable-pip-version-check kagglehub
      - name: Verify strictly historical original research DB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import kagglehub,sqlite3,subprocess,sys
          from pathlib import Path
          p=Path('reports/stage86/base/original.sqlite');p.parent.mkdir(parents=True,exist_ok=True)
          if not p.exists() or p.stat().st_size<1000000:
              src=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
              subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import',
                 '--input',str(src),'--min-date','1988-01-01','--max-date','2026-10-07',
                 '--database',str(p),'--report','reports/stage86/base/import.json'],check=True)
          with sqlite3.connect('file:'+str(p.resolve())+'?mode=ro',uri=True) as c:
              assert c.execute('PRAGMA quick_check').fetchone()[0]=='ok'
              assert c.execute('SELECT COUNT(*) FROM historical_races').fetchone()[0]>100000
          PY
      - name: Rebuild untouched HPR v0 baseline with strictly prior-day source data
        shell: bash
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          args=(--mode backtest --db reports/stage86/base/original.sqlite --root . \
            --output reports/stage90/base --days "${DAYS:-30}" --git-preoff)
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage86_hpr_engine.py "${args[@]}"
      - name: Diagnose exact historical identity vs missing HPR in excluded races
        shell: bash
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          args=(--root . --db reports/stage86/base/original.sqlite \
            --ratings reports/stage90/base/hpr-backtest-research.sqlite \
            --output reports/stage90/output --days "${DAYS:-30}")
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage90_hpr_identity_triage.py "${args[@]}"
      - name: Reconcile unchanged full-field race counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('reports/stage90/base/hpr-audit.json').read_text())
          b=json.loads(Path('reports/stage90/output/stage90-summary.json').read_text())
          for category in ('INSUFFICIENT_FULL_FIELD_HPR','NO_PREOFF_CARD','FIELD_UNVERIFIED_OR_CHANGED'):
              assert a['backtest_rejections'].get(category,0)==b['baseline_full_field'].get(category,0),category
          assert b['automatically_recovered_hpr']==0
          print('PASS: unchanged historical race eligibility and no production or persistent rating writes')
          PY
      - name: Upload small independent evidence report (never the big DB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage90-hpr-identity-investigation-${{ github.run_id }}
          path: |
            reports/stage90/output/stage90-summary.json
            reports/stage90/output/stage90-missing-horse-source-diagnostics.csv
            reports/stage90/output/stage90-verified-recovery-investigation-queue.csv
            reports/stage90/base/hpr-audit.json
          retention-days: 90
          if-no-files-found: warn
