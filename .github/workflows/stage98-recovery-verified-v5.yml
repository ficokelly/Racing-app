name: Stage98 - Recovered NH D(c) and E Weight Simulation V5

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage98-recovered-verified-v5
  cancel-in-progress: false

jobs:
  evaluate-sealed-features:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout research code read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen scorer dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 joblib beautifulsoup4

      - name: Recover sealed, outcome-blind features from the latest failed Stage98 run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stage98/output reports/stage98/reference
          gh run download 42939523905 --repo "${GITHUB_REPOSITORY}" \
            --name stage98-nh-full-weight-simulation-42939523905 \
            --dir reports/stage98/output
          gh run download 42926669840 --repo "${GITHUB_REPOSITORY}" \
            --name stage97-nh-blind-oct-nov-42926669840 \
            --dir reports/stage98/reference
          test -s reports/stage98/output/stage98-blind-all-runner-features.jsonl.gz
          test -s reports/stage98/output/stage98-blind-manifest.json
          test -s reports/stage98/reference/stage97-blind-rank1-rank2.csv.gz
          test -s reports/stage98/reference/stage97-blind-manifest.json
          python - <<'PY'
          import hashlib, json, pathlib
          folder=pathlib.Path('reports/stage98/output')
          manifest=json.loads((folder/'stage98-blind-manifest.json').read_text())
          data=folder/'stage98-blind-all-runner-features.jsonl.gz'
          assert manifest['nh_races']==218, 'Unexpected source race count'
          assert manifest['cutoff_exclusive']=='2026-10-01'
          assert manifest['no_outcomes_visible_at_prediction'] is True
          assert hashlib.sha256(data.read_bytes()).hexdigest()==manifest['features_sha256']
          print('Verified sealed Stage98 pre-result features',manifest['nh_races'],manifest['features_sha256'])
          PY

      - name: Build corrected V5 scorer and regenerate sealed baseline predictions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source=Path('scripts/stage98_nh_weight_grid_replay.py')
          text=source.read_text(encoding='utf-8')
          old="if disc in ('HURDLE','CHASE'):w['ground']*=1.4 if profile_name!='FROZEN_D' else 1."
          new="if profile_name!='FROZEN_D':w['ground']*=1.4"
          if old in text:
              assert text.count(old)==1, 'Unexpected duplicate NH ground rule'
              text=text.replace(old,new)
          elif new not in text:
              raise RuntimeError('Unexpected Stage98 ground rule; refusing unverified edit')
          assert text.count(new)==1
          # NH Flat is jumps racing, even though the Jumping pillar is disabled.
          # Original Stage97 E applied ground boost to ALL jumps before removing Jumping.
          anchor="    assert 1<=len(verified_recovered_prices())<=300"
          regression=(
              "    expected=E.weights('people_heavy','Jumps')\n"
              "    expected['jumping']=0.\n"
              "    scale=sum(expected.values())\n"
              "    expected=np.asarray([expected[k]/scale for k in PILLARS])\n"
              "    assert np.allclose(nh_weights('people_heavy','NH_FLAT',base),expected,atol=1e-12), 'Stage97 NH Flat baseline not reproduced'\n"
          )
          if 'Stage97 NH Flat baseline not reproduced' not in text:
              assert text.count(anchor)==1
              text=text.replace(anchor,regression+anchor)
          for original in ("VERSION='stage98-nh-reweight-chronological-v1'",
                           "VERSION='stage98-nh-reweight-chronological-v2-nhflat-ground-repro'"):
              if original in text:
                  text=text.replace(original,"VERSION='stage98-v5-verified-fast-settlement-2026-11-11'")
          # V3 failed because it loaded the OLD baseline CSV generated by V1.
          # Rebuild *all 872* baseline predictions from the sealed runner factors.
          # No outcomes or SP values are accessed in this reconstruction.
          func=r'''
          def regenerate_sealed_baseline(out):
              out=pathlib.Path(out)
              manifest=json.loads((out/'stage98-blind-manifest.json').read_text())
              path=out/'stage98-blind-all-runner-features.jsonl.gz'
              if hashlib.sha256(path.read_bytes()).hexdigest()!=manifest['features_sha256']:
                  raise RuntimeError('Stage98 sealed features changed before baseline regeneration')
              fields=read_features(path)
              if len(fields)!=manifest['nh_races'] or len(fields)!=218:
                  raise RuntimeError('Stage98 baseline source race coverage changed')
              matrix=profiles(manifest['original_D_weights'])
              ids=baseline_ids()
              options={o['id']:o for o in candidates() if o['id'] in ids.values()}
              if len(options)!=2:raise RuntimeError('Frozen baseline profiles missing')
              restored=[]
              for race in fields:
                  for model,profile_id in ids.items():
                      ordered=ranks(race,options[profile_id],matrix)
                      for rank,i in enumerate(ordered[:2],1):
                          restored.append(dict(**{k:race[k] for k in BASIC_FIELDS},
                              model=model,rank=rank,horse=race['horses'][i]))
              if len(restored)!=872:raise RuntimeError('Expected exactly 872 baseline ranks')
              write_csv(out/'stage98-baseline-unsettled.csv',restored)
              return len(restored)

          '''
          anchor="def verify_baseline(out, reference):"
          assert text.count(anchor)==1, 'Cannot patch Stage98 verifier safely'
          text=text.replace(anchor,func+"def verify_baseline(out, reference):\n"
                            "    n=regenerate_sealed_baseline(out)\n"
                            "    print('Regenerated original rankings from 218 sealed races:',n,flush=True)")
          # The rebuild is done inside the verifier, so a stale input CSV
          # can never cause another false failure.
          destination=Path('scripts/stage98_nh_weight_grid_replay_v5_runner.py')
          destination.write_text(text,encoding='utf-8')
          print('Created temporary V5 scorer:',destination, 'bytes',destination.stat().st_size)
          PY
          python -m py_compile scripts/stage98_nh_weight_grid_replay_v5_runner.py
          python -u scripts/stage98_nh_weight_grid_replay_v5_runner.py --mode self-test

      - name: Reproduce all 872 original selections and evaluate all 595 parameter combinations
        shell: bash
        run: |
          set -euo pipefail
          # Validate the REBUILT (not stale) 872 predictions before settlement.
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from stage98_nh_weight_grid_replay_v5_runner import verify_baseline
          r=verify_baseline(Path('reports/stage98/output'),Path('reports/stage98/reference'))
          assert r['same_rank1_rank2'] and r['stage98_rank12_records']==872
          print('PASS Stage98 V5: 872/872 rebuilt benchmark ranks match Stage97')
          PY
          # Settlement includes the EXACT 595 original candidates. Cache only
          # deterministic rank order; never cache race outcomes or SP changes.
          python - <<'PY'
          from pathlib import Path
          from argparse import Namespace
          import sys
          sys.path.insert(0,'scripts')
          import stage98_nh_weight_grid_replay_v5_runner as sim
          assert len(sim.candidates())==595
          ranks_uncached=sim.ranks
          rank_cache={}
          def ranks_cached(race,variant,weights):
              key=(race['date'],sim.venue(race['course']),race['time_utc'],variant['id'])
              if key not in rank_cache:
                  rank_cache[key]=ranks_uncached(race,variant,weights)
              return rank_cache[key]
          sim.ranks=ranks_cached
          args=Namespace(out=Path('reports/stage98/output'),
                         reference=Path('reports/stage98/reference'),
                         root=Path('.'))
          sim.settle(args)
          print('V5 computed unique profile-race rankings:',len(rank_cache))
          PY
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('reports/stage98/output/stage98-summary.json')
          report=json.loads(p.read_text())
          assert report['stage']==98 and report['candidate_count']==595
          assert report['Stage97_baseline_reproduced'] is True
          assert report['total_preoff_races']==218
          assert report['training_verified_races']>=60
          assert report['heldout_verified_races']>=35
          print('COMPLETE: 595 alternative profiles, all 872 Stage97 baseline ranks reproduced')
          print(json.dumps(report['main_summary'],indent=2))
          PY

      - name: Publish complete comparison and any failure diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage98-verified-recovery-v5-${{ github.run_id }}
          path: |
            reports/stage98/output/stage98-blind-manifest.json
            reports/stage98/output/stage98-reproducibility.json
            reports/stage98/output/stage98-summary.json
            reports/stage98/output/stage98-baseline-scorecard.csv
            reports/stage98/output/stage98-optimal-profiles-by-race-type.csv
            reports/stage98/output/stage98-combination-scorecard.csv
            reports/stage98/output/stage98-profile-leaderboards.csv
            reports/stage98/output/stage98-combined-rank1-selections.csv
            reports/stage98/output/stage98-daily-combinations.csv
            reports/stage98/output/stage98-candidates.csv
            reports/stage98/output/stage98-missing-runner-sps.csv
          if-no-files-found: warn
          retention-days: 90
