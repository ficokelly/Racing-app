name: Stage 27 - Historical A B C Weighting Research (Safe / No Live Changes)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stage27-historical-abc-audit
  cancel-in-progress: false

jobs:
  corrected-history-research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out Racing-app (research only)
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical training dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Restore self-contained challenger optimizer
        run: |
          python - <<'STAGE27_RESTORE'
          import base64,gzip,pathlib
          pathlib.Path('scripts').mkdir(exist_ok=True)
          payload=''
          pathlib.Path('scripts/stage27_retrain_optimize.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          print('Restored independently tested 84-combination challenger optimizer')
          STAGE27_RESTORE
      - name: Unit-test the independent retrospective engine
        run: |
          python -m py_compile scripts/stage27_retrain_optimize.py
          python scripts/stage27_retrain_optimize.py --self-test
          python scripts/stage24_history_integrity.py self-test
      - name: Download latest nonexpired Stage 2 historical SQLite artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'STAGE27_DOWNLOAD'
          import json,os,subprocess
          from pathlib import Path
          name='stage2-historical-staging-database'
          repo=os.environ['GITHUB_REPOSITORY']
          best=None
          for page in range(1,21):
           raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts','-f','per_page=100','-f',f'page={page}'],text=True)
           objs=json.loads(raw).get('artifacts',[])
           for a in objs:
            if a.get('name')==name and not a.get('expired') and (best is None or a.get('created_at','')>best.get('created_at','')):best=a
           if len(objs)<100:break
          if not best:raise SystemExit('Missing unexpired Stage 2 historical SQLite artifact. Run Stage 2 import first.')
          folder=Path('stage27_sources');folder.mkdir(exist_ok=True)
          runid=str(best['workflow_run']['id'])
          print('Downloading corrected-history base artifact',name,'run',runid,flush=True)
          subprocess.run(['gh','run','download',runid,'--repo',repo,'--name',name,'--dir',str(folder)],check=True)
          matches=list(folder.rglob('*.sqlite'))
          if not matches:raise SystemExit('No SQLite file in Stage 2 artifact')
          p=max(matches,key=lambda q:q.stat().st_size).resolve()
          print('Historical base SQLite bytes',p.stat().st_size,flush=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE27_DB='+str(p),file=f)
          STAGE27_DOWNLOAD
      - name: Download named-event historical race mapping (same annual race ID)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'STAGE27_MAPPING'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];name='stage4-reference-named-events-and-winners'
          best=None
          for page in range(1,21):
           raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts','-f','per_page=100','-f',f'page={page}'],text=True)
           batch=json.loads(raw).get('artifacts',[])
           for a in batch:
            if a.get('name')==name and not a.get('expired') and (best is None or a.get('created_at','')>best.get('created_at','')):best=a
           if len(batch)<100:break
          if not best:raise SystemExit('Stage 4 exact named-event mapping artifact has expired. Re-run Stage 4 first.')
          folder=Path('stage27_mapping');folder.mkdir(exist_ok=True)
          subprocess.run(['gh','run','download',str(best['workflow_run']['id']),'--repo',repo,'--name',name,'--dir',str(folder)],check=True)
          matches=list(folder.rglob('all_races_with_reference_event_ids.csv'))
          if not matches:raise SystemExit('Missing all_races_with_reference_event_ids.csv in named-event artifact')
          path=max(matches,key=lambda q:q.stat().st_size).resolve()
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE27_MAP='+str(path),file=f)
          print('Named event mapping bytes:',path.stat().st_size,flush=True)
          STAGE27_MAPPING
      - name: Apply Stage 25 integrity repairs and check declared data quality
        run: |
          set -euo pipefail
          python scripts/stage24_history_integrity.py prepare --db "$STAGE27_DB" --repo . --strict --assert-form
          python - <<'STAGE27_INTEGRITY'
          import json
          from pathlib import Path
          f=Path('data/history-integrity-audit.json')
          if not f.exists():raise SystemExit('No Stage 25 audit')
          d=json.loads(f.read_text())
          assert d.get('coverage_verified_through','')>='2026-11-01', d.get('coverage_verified_through')
          print('Stage 25 coverage verified through',d.get('coverage_verified_through'))
          print('Data quality',d.get('quality'))
          print('Unresolved pedigree rows',d.get('missing_pedigree_runs'),'— missing identity is never guessed')
          STAGE27_INTEGRITY
      - name: Retrain independent A B C challenger variants and test unseen recent races
        run: |
          set -euo pipefail
          python -u scripts/stage27_retrain_optimize.py \
            --db "$STAGE27_DB" --mapping "$STAGE27_MAP" \
            --recent-start 2026-10-08 --recent-end 2026-11-01 \
            --output stage27_report
          python - <<'STAGE27_CHECK'
          import json
          from pathlib import Path
          d=json.loads(Path('stage27_report/stage27-model-comparison.json').read_text())
          assert d['recent_race_count']>=100,'Too few 2026 historical races available for meaningful comparison'
          for model in 'ABC':
           item=d['models'][model]
           assert item['candidates_tested']>=20
           assert item['untouched_2025']['races']>=100
           assert item['untouched_recent_2026']['races']>=100
           print(model,item['chosen_variant'],item['recent_retrained_on_all_history_through_2025'])
          print('No live model file has been changed; research-only results verified')
          STAGE27_CHECK
      - name: Publish research-only reports as individually accessible files
        run: |
          set -euo pipefail
          mkdir -p reports/stage27
          cp stage27_report/stage27-model-comparison.json reports/stage27/
          cp stage27_report/stage27-recent-races.csv reports/stage27/
          cp stage27_report/stage27-recent-races.json reports/stage27/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stage27/
          if git diff --cached --quiet; then
            echo 'Reports already up to date.'
            exit 0
          fi
          git commit -m 'Publish Stage 27 research-only A B C historical audit'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Published three research-only reports.'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo 'Report push failed; Actions artifact is still available.' >&2
          exit 1
      - name: Upload individual reports (no live model updates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage27-corrected-history-a-b-c-comparison
          path: stage27_report/
          retention-days: 30
          if-no-files-found: warn
