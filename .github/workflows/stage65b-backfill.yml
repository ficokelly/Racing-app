name: Stage65B - UK IE Historical Form Backfill
on:
  workflow_dispatch:
  schedule:
    - cron: '25 0 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: stage65b-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HORSE_RACING_API_KEY: ${{ secrets.HORSE_RACING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate importer
        run: python -m py_compile scripts/stage65b_backfill.py
      - name: Recover prior SQLite artifact if available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/stage65b
          python - <<'PY'
          import json,os,subprocess,zipfile,io,pathlib
          repo=os.environ['GITHUB_REPOSITORY'];out=pathlib.Path('reports/stage65b/form_results.sqlite')
          try:
            p=subprocess.run(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts','-f','per_page=100'],capture_output=True,text=True,check=True)
            arts=json.loads(p.stdout).get('artifacts',[])
            for a in arts:
              if a['name']!='stage65b-historical-form' or a.get('expired'):continue
              r=subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{a["id"]}/zip'],capture_output=True,check=True)
              with zipfile.ZipFile(io.BytesIO(r.stdout)) as z:
                for n in z.namelist():
                  if n.endswith('form_results.sqlite'):
                    out.write_bytes(z.read(n));print('Recovered prior form DB');raise SystemExit(0)
          except Exception as e:print('No recoverable prior artifact:',str(e))
          PY
      - name: Backfill and verify dates (fails if incomplete)
        run: python -u scripts/stage65b_backfill.py --db reports/stage65b/form_results.sqlite --out reports/stage65b
      - name: Preserve database and audit even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage65b-historical-form
          path: reports/stage65b/
          retention-days: 90
