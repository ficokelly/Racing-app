name: Stage 13 & 16 - Trend-first Strategy, Model Probabilities and Learning

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7,10,13,17,23 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: stage13-strategy-feed
  cancel-in-progress: false

jobs:
  strategy-research-and-track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest Racing Hot Pots
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install self-learning dependency
        run: python -m pip install --disable-pip-version-check scikit-learn==1.6.1
      - name: Write standalone strategy engine and test modules
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > stage10_exact_history.py
          printf '%s' '' | base64 --decode | gzip --decompress > stage12_form_analysis.py
          printf '%s' '' | base64 --decode | gzip --decompress > stage13_driver.py
          printf '%s' '' | base64 --decode | gzip --decompress > test_stage10.py
          printf '%s' '' | base64 --decode | gzip --decompress > test_stage12.py
          printf '%s' '' | base64 --decode | gzip --decompress > test_stage13.py
          printf '%s' '' | base64 --decode | gzip --decompress > test_selective.py
          printf '%s' '' | base64 --decode | gzip --decompress > test_selective.py
          printf '%s' '' | base64 --decode | gzip --decompress > test_selective.py
          python -m py_compile stage10_exact_history.py stage12_form_analysis.py stage13_driver.py test_selective.py test_selective.py test_selective.py
          python -m unittest -q test_stage10.py test_stage12.py test_stage13.py test_selective.py
      - name: Load Stage 16 validated learner, daily evidence and settlement modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/stage16_history_model.py
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/stage16_score.py
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/stage16_integrate.py
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/stage16_results.py
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/stage16_commentary_learning.py
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/stage16_online_learning.py
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/stage16_external_research.py
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/test_stage16.py
          python -m py_compile scripts/stage16_*.py
          cd scripts && python -m unittest -q test_stage16.py
      - name: Retrieve existing historical artifact inputs (no new paid data)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'STAGE13_DOWNLOAD'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          sources={
            'stage2-historical-staging-database':('stage13_sources/stage2','STAGE13_DB',None),
            'stage4-reference-named-events-and-winners':('stage13_sources/stage4','STAGE13_MAP','all_races_with_reference_event_ids.csv'),
            'stage10-exact-named-race-history':('stage13_sources/stage10',None,'audit.json')}
          found={}
          for page in range(1,12):
            raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts',
                      '-f','per_page=100','-f',f'page={page}'],text=True)
            batch=json.loads(raw).get('artifacts',[])
            for a in batch:
              if a.get('expired') or a.get('name') not in sources:continue
              prev=found.get(a['name'])
              if prev is None or a['created_at']>prev['created_at']:found[a['name']]=a
            if len(found)==len(sources) or len(batch)<100:break
          for name,(folder,env,target) in sources.items():
            artifact=found.get(name)
            if not artifact:
              if env:raise SystemExit('Required historical artifact not found: '+name+'. Re-run its historical import workflow first.')
              print('Optional current-day exact-event cache unavailable; using safe live identity matching instead')
              continue
            Path(folder).mkdir(parents=True,exist_ok=True)
            print('Downloading existing',name,'run',artifact['workflow_run']['id'],flush=True)
            subprocess.run(['gh','run','download',str(artifact['workflow_run']['id']),
                     '--repo',repo,'--name',name,'--dir',folder],check=True)
            if env:
              if target:
                candidates=list(Path(folder).rglob(target))
              else:candidates=list(Path(folder).rglob('*.sqlite'))
              if not candidates:raise SystemExit('Missing required file in '+name)
              path=max(candidates,key=lambda p:p.stat().st_size).resolve()
              with open(os.environ['GITHUB_ENV'],'a') as f:print(f'{env}={path}',file=f)
              print('Historical source',name,'size',path.stat().st_size,flush=True)
          STAGE13_DOWNLOAD
      - name: Score all declared runners with separately validated historical model
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(TZ=Europe/Dublin date +%F)
          python scripts/stage16_score.py --cards data/racecards.json \
            --model data/strategy-historical-model.json --online data/strategy-online-calibration.json \
            --db "$STAGE13_DB" --day "$DAY" --out data/strategy-probabilities.json
          python - <<'STAGE16_PROBS_CHECK'
          import json
          d=json.load(open('data/strategy-probabilities.json'))
          for r in d['races']:
           if d['state']=='VALIDATED':
            assert r['complete_field'] and abs(sum(x['probability'] for x in r['runners'])-1)<0.001
           else:assert all(x.get('probability') is None for x in r['runners'])
          print('Stage16 all-runner estimates',d['state'],len(d['races']))
          STAGE16_PROBS_CHECK
      - name: Build trend-first selections; settle and check training thresholds
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(TZ=Europe/Dublin date +%F)
          python stage13_driver.py \
            --repo . --db "$STAGE13_DB" --mapping "$STAGE13_MAP" \
            --cards data/racecards.json --odds data/latest-odds.json \
            --work stage13_run --day "$DAY" --cached-history stage13_sources/stage10
          python - <<'STAGE13_VERIFY'
          import json
          from pathlib import Path
          p=Path('data')
          for name in ['strategy-selections.json','strategy-results.json',
                       'strategy-learning-history.json','strategy-model.json','strategy-learning-status.json']:
            obj=json.loads((p/name).read_text())
            assert isinstance(obj,dict),name
          j=json.loads((p/'strategy-selections.json').read_text())
          for race in j.get('races',[]):
            assert race['historical_editions']>=2
            assert race['status'] in ('UPCOMING','OFF_OR_FINISHED')
            assert all(r['qualifies'] for r in race['qualifiers'])
            assert race['selection_status'] in ('SELECTED','OFF','NO_SELECTION')
            assert not race.get('selection') or race['selection_status']=='SELECTED'
            assert len([r for r in race.get('ranked_runners',[]) if r.get('predicted_win_probability') is not None]) in (0,len(race.get('ranked_runners',[])))
            assert race['selection_status'] in ('SELECTED','OFF','NO_SELECTION')
            assert not race.get('selection') or race['selection_status']=='SELECTED'
            assert len([r for r in race.get('ranked_runners',[]) if r.get('predicted_win_probability') is not None]) in (0,len(race.get('ranked_runners',[])))
            assert race['selection_status'] in ('SELECTED','OFF','NO_SELECTION')
            assert not race.get('selection') or race['selection_status']=='SELECTED'
            assert len([r for r in race.get('ranked_runners',[]) if r.get('predicted_win_probability') is not None]) in (0,len(race.get('ranked_runners',[])))
          print('Verified matched races',len(j.get('races',[])),'research day',j.get('day'))
          STAGE13_VERIFY
      - name: Preserve completed results and enforce one verified probability leader
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage16_results.py --repo . --archive --settle
          python scripts/stage16_integrate.py --repo .
      - name: Publish evidence-based race and horse commentary for every race
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > stage14_commentary.py
          printf '%s' '' | base64 --decode | gzip --decompress > test_stage14_commentary.py
          python -m py_compile stage14_commentary.py
          python -m unittest -q test_stage14_commentary.py
          DAY=$(TZ=Europe/Dublin date +%F)
          python stage14_commentary.py --cards data/racecards.json \
            --strategy data/strategy-selections.json --db "$STAGE13_DB" \
            --mapping "$STAGE13_MAP" --day "$DAY" --out data/strategy-commentary.json
          python - <<'RHP_COMMENTARY_VERIFY'
          import json
          from pathlib import Path
          commentary=json.loads(Path('data/strategy-commentary.json').read_text())
          cards=json.loads(Path('data/racecards.json').read_text())
          target=commentary['day']
          expected={(x['course'],x['race_time']) for x in cards.get('runners',[]) if x.get('date')==target and x.get('course') and x.get('race_time')}
          actual={(x['course'],x['race_time']) for x in commentary['races']}
          assert actual==expected, f'Commentary must cover all declared races: {len(actual)} != {len(expected)}'
          for race in commentary['races']:
           assert race['summary']
           assert all(x.get('summary') for x in race['horses'])
           assert len(race['horses'])==len([x for x in cards['runners'] if x.get('date')==target and x.get('course')==race['course'] and x.get('race_time')==race['race_time']])
          print('Verified evidence-grounded commentary',commentary['stats'])
          RHP_COMMENTARY_VERIFY
      - name: Freeze pre-off analysis and learn from independently verified outcomes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage16_commentary_learning.py --repo . --decorate --review
          python scripts/stage16_online_learning.py --repo .
          python - <<'STAGE16_RESEARCH_AUDIT'
          import json
          from pathlib import Path
          root=Path('data')
          for name in ['strategy-probabilities.json','strategy-commentary-learning.json',
                       'strategy-online-calibration.json','strategy-commentary.json']:
           assert isinstance(json.loads((root/name).read_text()),dict),name
          selections=json.loads((root/'strategy-selections.json').read_text())
          for race in selections.get('races',[]):
           assert not race.get('selection') or race.get('selection_status')=='SELECTED'
           if race.get('selection_status')=='SELECTED':
            assert race.get('selection') and race.get('decision',{}).get('metric') in ('VALIDATED_PROBABILITY',None),race
          print('Stage16 validated feed integration and commentary snapshot safeguards')
          STAGE16_RESEARCH_AUDIT
      - name: Publish fresh selections and immutable historical predictions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if git diff --cached --quiet; then
            echo 'No strategy data changes.'
            exit 0
          fi
          git commit -m 'Update selective exact-first/course-type strategy, results and validation'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo 'Strategy report and results published.'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          echo 'Could not publish strategy feed: other actions may be writing concurrently.' >&2
          exit 1
      - name: Upload detailed research and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage13-strategy-audit
          path: |
            stage13_run/exact_history/
            stage13_run/form_analysis/
            data/strategy-learning-status.json
            data/strategy-commentary.json
            data/strategy-probabilities.json
            data/strategy-commentary-learning.json
            data/strategy-online-calibration.json
          retention-days: 14
          if-no-files-found: warn
