name: Stage86 - Model E HPR 30-Day UK IE Research Backtest

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'As-of Irish date YYYY-MM-DD (blank = current date; includes preceding 30 completed days)'
        required: false
        type: string
        default: ''
      days:
        description: 'Retrospective number of completed calendar days'
        required: true
        type: choice
        default: '30'
        options: ['7', '14', '30', '60', '90']

# All outputs are research artifacts, never production selections.
permissions:
  contents: read
  actions: read

concurrency:
  group: stage86-hpr-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out all previous pre-off racecard snapshots read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify HPR research safety and idempotence
        run: python scripts/stage86_hpr_engine.py --mode self-test
      - name: Restore Stage84 base SQLite and historical Kaggle source cache
        uses: actions/cache@v4
        with:
          path: |
            reports/stage86/base/original.sqlite
            ~/.cache/kagglehub
          key: stage86-base-v129-${{ hashFiles('import_historical_ukie.py') }}
          restore-keys: |
            stage84-base-ukie-v129-
      - name: Install historical source downloader
        run: python -m pip install --disable-pip-version-check kagglehub
      - name: Obtain read-only original historical UK IE baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import kagglehub,subprocess,sys,sqlite3
          from pathlib import Path
          p=Path('reports/stage86/base/original.sqlite');p.parent.mkdir(parents=True,exist_ok=True)
          if not p.exists() or p.stat().st_size < 1000000:
            source=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
            subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import',
              '--input',str(source),'--min-date','1988-01-01','--max-date','2026-10-07',
              '--database',str(p),'--report','reports/stage86/base/import.json'],check=True)
          with sqlite3.connect('file:'+str(p.resolve())+'?mode=ro',uri=True) as c:
            assert c.execute('PRAGMA quick_check').fetchone()[0]=='ok'
            assert c.execute('SELECT COUNT(*) FROM historical_races').fetchone()[0]>100000
          print('Verified historical research source')
          PY
      - name: Calculate historical HPR and retrospective pre-off rankings
        shell: bash
        env:
          AS_OF: ${{ inputs.as_of }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          args=(--mode backtest --db reports/stage86/base/original.sqlite --root . \
            --output reports/stage86/test --days "${DAYS:-30}" --git-preoff)
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -u scripts/stage86_hpr_engine.py "${args[@]}"
      - name: Retain audit, full HPR research DB and unbiased eligible-race metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage86-model-e-hpr-backtest-${{ github.run_id }}
          path: |
            reports/stage86/test/hpr-audit.json
            reports/stage86/test/hpr-race-by-race.csv
            reports/stage86/test/hpr-metrics.csv
            reports/stage86/test/hpr-backtest-research.sqlite
          retention-days: 90
          if-no-files-found: warn
