          PY_SUMMARY

      - name: Run tomorrow verified history recovery and all model scorers
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_TIME'
          import datetime as dt,os
          from zoneinfo import ZoneInfo
          target=dt.date.fromisoformat(os.environ['STAGE129_TARGET'])
          today=dt.datetime.now(ZoneInfo('Europe/Dublin')).date()
          if target<today:
            raise SystemExit('Historical date: refuse backdated model predictions or repaired selection publication')
          print('Safe future/pre-off scoring target:',target)
          PY_TIME
          TARGET="$STAGE129_TARGET"
          echo 'Requesting Stage116 verified form install before updated score runs.'
          AFTER=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run stage116-live-form-recovery-and-deploy.yml --ref main \
            -f mode=install_live -f target_date="$TARGET"
          echo 'Next workflows are only started when Stage116 has finished successfully.'
          RUN_ID=''
          for attempt in $(seq 1 24); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow stage116-live-form-recovery-and-deploy.yml \
              --event workflow_dispatch --limit 10 \
              --json databaseId,createdAt \
              --jq ".[] | select(.createdAt >= \"$AFTER\") | .databaseId" | head -1)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo 'Stage116 queued but run ID not yet available. Subsequent audits can be run manually.'
            exit 1
          fi
          echo "Monitoring Stage116 run $RUN_ID for verified historical-form recovery"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          echo 'Verified historical-form recovery completed. Dispatching model scoring and independent audit.'
          failed=0
          dispatch() {
            echo "Starting $1"
            if ! gh workflow run "$1" --ref main "${@:2}"; then
              echo "FAILED to dispatch $1" >&2
              failed=1
            fi
          }
          dispatch rhp-stage69-dc-live.yml -f day="$TARGET"
          dispatch stage38-model-d-repair.yml -f day="$TARGET"
          dispatch stage109-g3-paper.yml -f selection_date="$TARGET"
          dispatch stage111b-g4-paper-fix.yml -f selection_date="$TARGET"
          dispatch stage128-g5-paper.yml -f selection_date="$TARGET"
          dispatch stage113b-lossless-form-and-tomorrow-audit.yml -f audit_dates="$TARGET"
          echo 'Each run publishes its own result and historical-form evidence; not declaring coverage clean in advance.'
          exit "$failed"
