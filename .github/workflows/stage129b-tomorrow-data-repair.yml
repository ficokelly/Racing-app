          python scripts/stage111_model_g4.py self-test
          python scripts/stage128_g5_today_paper.py self-test
          python scripts/stage116_verified_form_live.py --mode self-test

      - name: Commit safe code and visible 15-Nov coverage report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collect-racecards.py \
            scripts/rhp_runner_eligibility.py \
            scripts/stage26_feed_capture.py \
            scripts/stage26_nonrunner_monitor.py \
            scripts/stage38_model_dz_live.py \
            scripts/stage108_model_g2.py \
            scripts/stage107_model_g.py \
            scripts/stage112_form_coverage_reconcile.py \
            scripts/stage128_g5_today_paper.py \
            scripts/stage116_verified_form_live.py \
            data/racecards.json data/racecards-archive.json \
            data/rhp-stage129-preoff-coverage.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'All changes already applied; no new commit necessary.'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'Stage129: exclude non-runners and unactivated reserves in all D and G scoring paths'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Stage129 guard fixes published to main.'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo 'Could not publish fixed racecards; stop before running models.' >&2
          exit 1

