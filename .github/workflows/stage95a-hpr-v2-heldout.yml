name: Stage95a - HPR v2 Rank1 Rank2 Heldout Probability and ROI Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage95a-readonly-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out frozen model code without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify HPR v2 research safety tests
        run: python -u scripts/stage95a_hpr_v2_out_of_sample.py --self-test
      - name: Download immutable Stage92 Stage94 and existing D E baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stage95a/source/92 reports/stage95a/source/94 reports/stage95a/source/95
          # These exact reference runs are intentionally pinned for reproducibility.
          gh run download 42890039641 --repo "${GITHUB_REPOSITORY}" \
            --name stage92-performance-research-42890039641 \
            --dir reports/stage95a/source/92
          gh run download 42895103772 --repo "${GITHUB_REPOSITORY}" \
            --name stage94-hpr-v2-research-42895103772 \
            --dir reports/stage95a/source/94
          gh run download 42870009858 --repo "${GITHUB_REPOSITORY}" \
            --name stage95-five-model-matched-comparison-42870009858 \
            --dir reports/stage95a/source/95
          python - <<'PY'
          import json,pathlib,zipfile
          base=pathlib.Path('reports/stage95a/source')
          refs=[('92','stage92-summary.json',92,'stage92-performance-quality-research-v1'),
                ('94','stage94-summary.json',94,'hpr-v2-research-2026-11-10'),
                ('95','output/stage95-summary.json',95,'stage95-v1-2026-11-10')]
          for folder,report,stage,version in refs:
              p=base/folder
              doc=json.loads((p/report).read_text())
              assert doc.get('stage')==stage and doc.get('version')==version, f'Unexpected {folder} version'
              dest=base/f'stage{folder}.zip'
              with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                  for file in sorted(p.rglob('*')):
                      if file.is_file():z.write(file,file.relative_to(p))
              print('Verified immutable reference:',stage,version,'ZIP bytes',dest.stat().st_size)
          PY
      - name: Obtain pinned Kaggle version 129 strictly for historical SP settlement
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'kagglehub>=0.3,<1'
          python - <<'PY'
          import kagglehub,pathlib
          p=pathlib.Path(kagglehub.dataset_download(
              'deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129'))
          assert p.is_dir() and list(p.rglob('*.csv')), 'No Kaggle CSVs'
          home=pathlib.Path('reports/stage95a/source')
          (home/'kaggle-dir.txt').write_text(str(p))
          print('Pinned Kaggle v129 source directory confirmed')
          PY
      - name: Calibrate HPR on older dates and settle heldout rank1 rank2 against unchanged D E baseline
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/stage95a_hpr_v2_out_of_sample.py \
            --stage92-zip reports/stage95a/source/stage92.zip \
            --stage94-zip reports/stage95a/source/stage94.zip \
            --stage95-zip reports/stage95a/source/stage95.zip \
            --pedigree-source "$(cat reports/stage95a/source/kaggle-dir.txt)" \
            --out reports/stage95a/output
      - name: Verify comparison integrity and show SP coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('reports/stage95a/output/stage95a-summary.json')
          r=json.loads(p.read_text())
          assert r['research_only'] and r['stage']=='95a'
          assert r['training_window']['end'] < r['heldout_window']['start']
          assert r['heldout_window']['matched_existing_stage95_races']>=50
          rank1=next(x for x in r['scorecard'] if x['scope']=='HPR_ALL_HOLDOUT' and x['rank']==1)
          assert rank1['selections']>=100
          print('HPR holdout rank1:',rank1)
          print('SP settlement coverage:',r['sp_source'])
          print('Safety:',r['safety'])
          PY
      - name: Publish research artifacts only, no live app or historical archive changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage95a-hpr-v2-heldout-${{ github.run_id }}
          path: |
            reports/stage95a/output/stage95a-summary.json
            reports/stage95a/output/stage95a-hpr-rank1-rank2.csv
            reports/stage95a/output/stage95a-matched-models.csv
            reports/stage95a/output/stage95a-scorecard.csv
            reports/stage95a/output/stage95a-probability-thresholds.csv
          if-no-files-found: warn
          retention-days: 90
