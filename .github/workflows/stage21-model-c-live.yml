      - name: Download existing historical database and named-event mapping
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'HIST_DOWNLOAD'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          requests={
            'stage2-historical-staging-database':('stage21_sources/stage2','STAGE21_DB','*.sqlite'),
            'stage4-reference-named-events-and-winners':('stage21_sources/stage4','STAGE21_MAP','all_races_with_reference_event_ids.csv')}
          found={}
          for page in range(1,13):
           raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts','-f','per_page=100','-f',f'page={page}'],text=True)
           aa=json.loads(raw).get('artifacts',[])
           for a in aa:
            if a.get('expired') or a.get('name') not in requests:continue
            prev=found.get(a['name'])
            if prev is None or a['created_at']>prev['created_at']:found[a['name']]=a
           if len(found)==len(requests) or len(aa)<100:break
          for name,(directory,env,pattern) in requests.items():
           art=found.get(name)
           if not art:raise SystemExit('Missing historical artifact '+name+'; re-run original import.')
           Path(directory).mkdir(parents=True,exist_ok=True)
           subprocess.run(['gh','run','download',str(art['workflow_run']['id']),'--repo',repo,'--name',name,'--dir',directory],check=True)
           matches=list(Path(directory).rglob(pattern))
           if not matches:raise SystemExit('Historical artifact missing expected '+pattern)
           path=max(matches,key=lambda p:p.stat().st_size).resolve()
           if path.stat().st_size<1000000:raise SystemExit('Incomplete historical input '+str(path))
           with open(os.environ['GITHUB_ENV'],'a') as f:print(f'{env}={path}',file=f)
           print('Historical data ready',name,'bytes',path.stat().st_size,flush=True)
          HIST_DOWNLOAD
      - name: Repair recent results, audit horse identities and retain pre-repair C baseline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage24_history_integrity.py self-test
          python scripts/stage24_history_integrity.py prepare --db "$STAGE21_DB" --repo . --strict --assert-form
          python - <<'ARCHIVE_PRE_REPAIR'
          from pathlib import Path
          import json,shutil
          data=Path('data')
          old=json.loads((data/'strategy-model-c-historical.json').read_text()) if (data/'strategy-model-c-historical.json').exists() else {}
          if old.get('version') in ('model-c-v2-all-history-2026-11','model-c-v2-stage24-identity-corrected-2026-11'):
           for name in ('strategy-model-c-historical.json','strategy-model-c-2025-report.json',
                        'strategy-c-probabilities.json','strategy-c-history.json',
                        'strategy-c-results.json','strategy-c-learning.json'):
            path=data/name
            if path.exists():shutil.copyfile(path,data/(path.stem+'-pre-stage25.json'))
           # A new feature/identity schema starts a new learning era, never merge
           # its live decisions with the old C v2 immutable observation records.
           (data/'strategy-c-history.json').write_text(json.dumps({'version':2,'races':[]},indent=2)+'\n')
           (data/'strategy-c-results.json').write_text(json.dumps({'version':2,'model':'C','selections':[]},indent=2)+'\n')
          ARCHIVE_PRE_REPAIR
      - name: Train new unsampled all-history Model C (or retain fresh frozen champion)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage22_model_c.py train --repo . --db "$STAGE21_DB" --mapping "$STAGE21_MAP"
          python - <<'VALIDATE_C'
          import json
          from pathlib import Path
          j=json.loads(Path('data/strategy-model-c-historical.json').read_text())
          assert j.get('version')=='model-c-v2-stage25-verified-starters-2026-11'
          assert j.get('split_counts',{}).get('test_2025',0)>=100
          print('Historical v2 model ready; 2025 untouched testing:',j['honest_test'])
          VALIDATE_C
      - name: Publish live Model C v2 selections and settle verified outcomes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage22_model_c.py live --repo . --db "$STAGE21_DB" --mapping "$STAGE21_MAP"
          python scripts/stage21_publish_c.py --repo .
          cp data/strategy-c-probabilities.json /tmp/stage21-c-probabilities.json
          cp data/strategy-c-external-evidence.json /tmp/stage21-c-external.json
          python - <<'VALIDATE_LIVE'
          import json
          from pathlib import Path
          j=json.loads(Path('data/strategy-c-probabilities.json').read_text())
          assert j.get('version')==2 and j.get('model_version')=='model-c-v2-stage25-verified-starters-2026-11'
          assert j['state'] in ('READY','NO_RACECARDS_FOR_DAY','NO_UPCOMING_COMPLETE_FIELDS')
          print('V2 live:',j['state'],len(j['races']),'future races,',j['selections'],'selections')
          VALIDATE_LIVE
      - name: Publish pre-race C research and immutable outcome logs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/racecards.json data/racecards-archive.json
          git add data/strategy-model-c-historical.json data/strategy-model-c-2025-report.json data/history-integrity-audit.json
          for f in data/strategy-model-c-historical-pre-stage25.json data/strategy-model-c-2025-report-pre-stage25.json data/strategy-c-*-pre-stage25.json; do
            if test -f "$f"; then git add "$f"; fi
          done
          git add data/strategy-c-probabilities.json data/strategy-c-external-evidence.json data/strategy-c-history.json data/strategy-c-results.json data/strategy-c-learning.json
          for extra in data/strategy-c-v1-archived.json data/strategy-model-c-v2-challenger.json; do
            if test -f "$extra"; then git add "$extra"; fi
          done
          if git diff --cached --quiet; then echo 'No changed C data';exit 0;fi
          git commit -m 'Publish independently trained Model C pre-race evidence and settlement'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo 'Published Model C live evidence';exit 0
            fi
            git rebase --abort || true
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp /tmp/stage21-c-probabilities.json data/strategy-c-probabilities.json
            cp /tmp/stage21-c-external.json data/strategy-c-external-evidence.json
            python scripts/stage21_publish_c.py --repo .
            git add data/strategy-model-c-historical.json data/strategy-model-c-2025-report.json data/strategy-c-*.json
            if test -f data/strategy-model-c-v2-challenger.json; then git add data/strategy-model-c-v2-challenger.json; fi
            if git diff --cached --quiet; then echo 'Already published';exit 0;fi
            git commit -m 'Reconcile Model C with latest frozen pre-off records'
            sleep $((attempt * 4))
          done
          echo 'Model C publication conflicted after retries' >&2
          exit 1
      - name: Upload C historical and live selection audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage22-model-c-v2-decision-audit
          path: |
            data/strategy-model-c-historical.json
            data/strategy-model-c-2025-report.json
            data/strategy-c-probabilities.json
            data/strategy-c-external-evidence.json
            data/strategy-c-history.json
            data/strategy-c-results.json
            data/strategy-c-learning.json
            data/history-integrity-audit.json
            data/strategy-model-c-historical-pre-stage25.json
            data/strategy-model-c-2025-report-pre-stage25.json
            data/strategy-c-*-pre-stage25.json
            data/strategy-c-v1-archived.json
            data/strategy-model-c-v2-challenger.json
          retention-days: 30
          if-no-files-found: warn
