name: Stage 22 - Model C Full History and Independent Live Scoring

on:
  workflow_dispatch:
  schedule:
    - cron: "12 7,10,13,16 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: racing-model-c-v2
  cancel-in-progress: false

jobs:
  collect-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical scoring dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn
      - name: Refresh today's full racecards when missing or stale
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if python - <<'CARD_CHECK'
          import datetime as d,json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          today=d.datetime.now(ZoneInfo('Europe/Dublin')).date().isoformat()
          p=Path('data/racecards.json')
          try:
           j=json.loads(p.read_text());t=d.datetime.fromisoformat(j['collected_at'].replace('Z','+00:00'))
           age=(d.datetime.now(d.timezone.utc)-t).total_seconds()
           fields={x.get('race_id') for x in j.get('runners',[]) if x.get('date')==today and x.get('horse')}
           if age<3600 and len(fields)>0:
            print('Racecards available',len(fields),'races; last refreshed',round(age/60),'minutes ago')
            raise SystemExit(0)
          except (OSError,ValueError,TypeError,KeyError) as err:print('Missing/stale racecards:',type(err).__name__)
          raise SystemExit(1)
          CARD_CHECK
          then echo 'Reusing fresh published racecards.'
          else
            echo 'Collecting today/tomorrow racecards from the existing free API plan.'
            python scripts/stage26_feed_capture.py racecards
            python scripts/stage26_nonrunner_monitor.py --repo .
          fi
