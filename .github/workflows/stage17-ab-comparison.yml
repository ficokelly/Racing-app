name: Stage 17 - A and B Independent Strategy Comparison

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Stage 13 & 16 - Trend-first Strategy, Model Probabilities and Learning
    types: [completed]
  schedule:
    - cron: '50 7,10,13,17,23 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: racing-stage17-ab-results
  cancel-in-progress: false

