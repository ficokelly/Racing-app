      - name: Verify both historical models use Stage 25 corrected identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'CHECK_AB_IDENTITY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/strategy-historical-model.json').read_text())
          b=json.loads(Path('data/strategy-model-b-historical.json').read_text())
          assert a.get('history_integrity_version')=='stage25-2026-11-starter-identity-v2', 'Stage 13 must finish with corrected A first.'
          assert a.get('version')=='stage16-own-data-temporal-v3-stage25-starters', 'Stage 13 probability version is stale.'
          assert b.get('version')=='stage18-historical-trends-form-conditional-v2-stage25', 'Stage 18 must retrain B before comparing.'
          print('Stage 25 A/B shared-history compatibility verified')
          CHECK_AB_IDENTITY
      - name: Publish separate Model A and Model B selections and results
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage17_ab.py --repo . --build --settle
          python scripts/stage23_ab_repair.py --repo .
          python scripts/stage17_learning.py --repo .
          python - <<'PY_VERIFY_AB'
          import json
          from pathlib import Path
          p=Path('data')
          a=json.loads((p/'strategy-ab-selections.json').read_text())
          r=json.loads((p/'strategy-ab-results.json').read_text())
          learning=json.loads((p/'strategy-ab-learning.json').read_text())
          commentary=json.loads((p/'strategy-ab-commentary-learning.json').read_text())
          assert learning['model_b']['learning_state'] in ('INSUFFICIENT_VERIFIED_PREOFF_RACES','NO_VERIFIED_IMPROVEMENT','APPROVED_ON_LATER_RACES')
          assert 'model_b' in commentary and 'model_a_verdicts_settled' in commentary
          assert set(a['models'])=={'A','B'}
          assert set(r['models'])=={'A','B'}
          for model in ('A','B'):
            picks=[x for x in a['models'][model]['races'] if x['selection']]
            assert len({(x['date'],x['course'],x['time']) for x in picks})==len(picks)
            assert all(x['selection_status']=='SELECTED' and x['status']=='UPCOMING' for x in picks)
          print('A/B published', {m:len(a['models'][m]['races']) for m in ('A','B')})
          PY_VERIFY_AB
      - name: Commit auditable A/B feeds and frozen pre-race results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strategy-ab-selections.json data/strategy-ab-results.json data/strategy-b-probabilities.json
          if test -f data/strategy-b-history.json; then git add data/strategy-b-history.json; fi
          if test -f data/strategy-b-evidence.json; then git add data/strategy-b-evidence.json; fi
          git add data/strategy-b-calibration.json data/strategy-ab-learning.json data/strategy-ab-commentary-learning.json
          if git diff --cached --quiet; then echo 'No A/B changes';exit 0;fi
          git commit -m 'Update independent Model A/B pre-off selections and outcomes'
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo 'A/B strategy feeds published';exit 0
            fi
            # If another job published first, the old files are stale.
            # Refresh from the remote then RECOMPUTE using its frozen ledgers.
            # Never force-push or overwrite already recorded selections.
            git rebase --abort || true
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python scripts/stage17_ab.py --repo . --build --settle
            python scripts/stage23_ab_repair.py --repo .
            python scripts/stage17_learning.py --repo .
            git add data/strategy-ab-selections.json data/strategy-ab-results.json data/strategy-b-probabilities.json
            if test -f data/strategy-b-history.json; then git add data/strategy-b-history.json; fi
            if test -f data/strategy-b-evidence.json; then git add data/strategy-b-evidence.json; fi
            git add data/strategy-b-calibration.json data/strategy-ab-learning.json data/strategy-ab-commentary-learning.json
            if git diff --cached --quiet; then echo 'Identical A/B data already published';exit 0;fi
            git commit -m 'Recompute A/B outcomes on latest frozen records'
            sleep $((attempt * 2))
          done
          echo 'A/B publishing failed after fresh-state retries' >&2
          exit 1
      - name: Upload A/B decision audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage17-ab-decision-audit
          path: |
            data/strategy-ab-selections.json
            data/strategy-b-probabilities.json
            data/strategy-ab-results.json
            data/strategy-b-history.json
            data/strategy-b-evidence.json
            data/strategy-b-calibration.json
            data/strategy-ab-learning.json
            data/strategy-ab-commentary-learning.json
          retention-days: 30
          if-no-files-found: warn
