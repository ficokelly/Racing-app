name: Kaggle form baseline audit and refresh
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kaggle version to compare (blank checks latest; 132 is known)'
        required: false
        default: '132'
      audit_only:
        description: 'Compare without activating approved days'
        type: boolean
        default: false
  schedule:
    - cron: '35 4 * * *'
permissions:
  contents: write
concurrency:
  group: kaggle-form-baseline
  cancel-in-progress: false
jobs:
  compare-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle download client
        run: pip install 'kagglehub>=0.3,<1'
      - name: Install guarded day replacement and test
        run: |
          cat > scripts/form_person_aliases.py <<'ALIASES_PY'
          from pathlib import Path
          import json,re,unicodedata
          from functools import lru_cache
          PATH=Path(__file__).resolve().parent.parent/'data/form-person-aliases.json'
          def raw_key(s):
              s=re.sub(r'\s*\(\d+\)\s*$','',str(s or ''))
              s=unicodedata.normalize('NFKD',s)
              return re.sub(r'[^a-z0-9]+','', ''.join(c for c in s if not unicodedata.combining(c)).lower())
          @lru_cache(maxsize=1)
          def aliases():
              doc=json.loads(PATH.read_text())
              if doc.get('schema')!='form-person-aliases-v1':raise ValueError('Unexpected person registry schema')
              out={}
              for e in doc['entries']:
                  assert e['kind'] in ('trainer','jockey') and e['evidence_url'].startswith('https://')
                  k,v=raw_key(e['alias']),raw_key(e['canonical'])
                  assert k and v and (k not in out or out[k]==v), ('Conflicting alias',k)
                  out[k]=v
              assert all(out.get(v,v)==v for v in out.values()), 'Alias chains require explicit review'
              return out

          def person_key(s):
              k=raw_key(s)
              return aliases().get(k,k)
          ALIASES_PY
          cat > .form_alias_seed.py <<'SEED_PY'
          import json
          from pathlib import Path
          p=Path('data/form-person-aliases.json')
          seed=json.loads('{"schema": "form-person-aliases-v1", "entries": [{"kind": "trainer", "alias": "A W Carroll", "canonical": "Tony Carroll", "evidence_url": "https://www.flatstats.co.uk/turf/trainer/a-w-carroll", "matched_starters_v132": 14, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "trainer", "alias": "B R Summers", "canonical": "Rob Summers", "evidence_url": "https://www.racingtv.com/profiles/horse/ukantango", "matched_starters_v132": 1, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "trainer", "alias": "D McCain Jnr", "canonical": "Donald McCain", "evidence_url": "https://www.flatstats.co.uk/both/trainer/d-mccain-jnr/", "matched_starters_v132": 14, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "trainer", "alias": "A M Thomson", "canonical": "Sandy Thomson", "evidence_url": "https://paddocksense.com/trainers/sandy-thomson-trn-190809/", "matched_starters_v132": 7, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "trainer", "alias": "W Coltherd", "canonical": "Stuart Coltherd", "evidence_url": "https://www.racingtv.com/profiles/horse/medal-of-freedom", "matched_starters_v132": 2, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "trainer", "alias": "J W Mullins", "canonical": "Seamus Mullins", "evidence_url": "https://www.flatstats.co.uk/turf/trainer/j-w-mullins", "matched_starters_v132": 9, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "trainer", "alias": "P D Evans", "canonical": "David Evans", "evidence_url": "https://www.racingtv.com/profiles/horse/tie-em-up-tel", "matched_starters_v132": 6, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "trainer", "alias": "Sir Mark Prescott", "canonical": "Sir Mark Prescott Bt", "evidence_url": "https://www.racingtv.com/profiles/trainer/sir-mark-prescott", "matched_starters_v132": 3, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "trainer", "alias": "D M Loughnane", "canonical": "Mark Loughnane", "evidence_url": "https://www.racing971.ae/form/trainer/D-M-Loughnane/1001949?raceid=1617652", "matched_starters_v132": 6, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "trainer", "alias": "F Brennan", "canonical": "Barry Brennan", "evidence_url": "https://race.watch/horses/he-is-a-cracker-22567370", "matched_starters_v132": 3, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "trainer", "alias": "B R Millman", "canonical": "Rod Millman", "evidence_url": "https://www.flatstats.co.uk/turf/trainer/b-r-millman", "matched_starters_v132": 2, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "jockey", "alias": "Thomas Bellamy", "canonical": "Tom Bellamy", "evidence_url": "https://www.irishracing.com/galway-races/horse/Es-Perfecto-IRE/586459", "matched_starters_v132": 16, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "jockey", "alias": "Billy Lee", "canonical": "W. J. Lee", "evidence_url": "https://www.irishracing.com/jockey/W-J-Lee/5694", "matched_starters_v132": 19, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "jockey", "alias": "Tpr Elizabeth Feakes", "canonical": "Miss Elizabeth Feakes", "evidence_url": "https://insights.betfred.com/horse-racing/results/2026-11-16/plumpton/931537/13-15/", "matched_starters_v132": 1, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "jockey", "alias": "Mid Milica Dusanovic", "canonical": "Miss Milica Jovana Dusanovic", "evidence_url": "https://www.racingpost.com/results/44/plumpton/2026-11-16/931537/", "matched_starters_v132": 1, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "jockey", "alias": "Mr O McGill", "canonical": "Mr Oran McGill", "evidence_url": "https://paddocksense.com/jockeys/mr-oran-mcgill/", "matched_starters_v132": 1, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}, {"kind": "jockey", "alias": "William Featherstone", "canonical": "Will Featherstone", "evidence_url": "https://www.skysports.com/racing/news/12426/10160640/first-double-for-featherstone-at-fakenham", "matched_starters_v132": 1, "verified_on": "2026-11-25", "evidence_method": "dated paired source records plus published racing profile/result"}]}')
          from scripts.form_person_aliases import raw_key
          existing=json.loads(p.read_text()) if p.exists() else {'schema':seed['schema'],'entries':[]}
          assert existing['schema']==seed['schema']
          seen={raw_key(x['alias']):x for x in existing['entries']}
          for x in seed['entries']:
              k=raw_key(x['alias'])
              if k in seen:
                  assert raw_key(seen[k]['canonical'])==raw_key(x['canonical']) and seen[k]['kind']==x['kind'],('Alias conflict',x)
              else:
                  existing['entries'].append(x);seen[k]=x
          p.parent.mkdir(exist_ok=True);p.write_text(json.dumps(existing,indent=2,ensure_ascii=False)+'\n')
          SEED_PY
          python .form_alias_seed.py
          rm .form_alias_seed.py
          cat > scripts/kaggle_form_baseline.py <<'BASELINE_PY'
          """Use approved daily Kaggle aggregates as a replacement, never an additive overlay.
          Raw historical rows remain in the workflow runner; no raw CSVs are published.
          """
          from collections import Counter, defaultdict
          from pathlib import Path
          import datetime as dt, json

          BASELINE=Path('data/kaggle-form-baseline.json')

          def merge(output, rows, dates, as_of, audit, build_form, compact):
              if not BASELINE.exists(): return output
              doc=json.loads(BASELINE.read_text())
              if doc.get('schema')!='kaggle-form-baseline-v1': raise ValueError('Invalid baseline schema')
              lower=(as_of-dt.timedelta(days=13)).isoformat(); end=as_of.isoformat()
              approved={d:v for d,v in doc['approved_days'].items() if lower<=d<=end}
              if not approved: return output
              api_rows=[r for r in rows if r['date'] not in approved]
              result=build_form(api_rows,as_of,set(dates)-approved.keys(),audit)
              for n,period in result['periods'].items():
                  start=(as_of-dt.timedelta(days=int(n)-1)).isoformat()
                  use={d:v for d,v in approved.items() if d>=start}
                  for kind,group,denom in [('trainer','trainers','runs'),('jockey','jockeys','rides')]:
                      names=defaultdict(list)
                      for key,stat in output['periods']['14'][group].items(): names[compact(stat['name'])].append(key)
                      merged={compact(stat['name']):dict(stat) for stat in period[group].values()}
                      ids={compact(stat['name']):key for key,stat in period[group].items()}
                      for day in use.values():
                          for nm,stat in day[group].items():
                              item=merged.setdefault(nm,{'name':stat['name'],denom:0,'wins':0})
                              item[denom]+=stat['runs']; item['wins']+=stat['wins']
                      new={}
                      for nm,stat in sorted(merged.items()):
                          key=ids.get(nm) or (names[nm][0] if len(names[nm])==1 else 'name:'+nm)
                          if key in new: key='name:'+nm
                          if key in new: raise ValueError('Duplicate aggregate identity')
                          assert 0<=stat['wins']<=stat[denom] and stat[denom]>0
                          stat['strike_rate']=round(100*stat['wins']/stat[denom],1)
                          new[key]=stat
                      period[group]=new
                  period['runners']+=sum(v['starters'] for v in use.values())
                  period['dates_available']=sorted(set(period['dates_available'])|use.keys())
                  # Each approved Kaggle day was required to have zero missing identities.
                  period['kaggle_days']=sorted(use)
                  period['api_days']=sorted(set(period['dates_available'])-use.keys())
                  for kind,group,denom in [('trainer','trainers','runs'),('jockey','jockeys','rides')]:
                      assert sum(x[denom] for x in period[group].values())+period['identity_gaps'][kind]==period['runners'], (n,kind)
              result['source']='Validated Kaggle historical day aggregates + daily API results bridge'
              result['kaggle_version']=doc['version']; result['kaggle_cutoff']=doc['cutoff']
              result['methodology']='Whole-day replacement after runner/finish/person and race coverage checks; no duplicate days; API retained separately.'
              return result
          BASELINE_PY
          cat > scripts/audit_kaggle_form.py <<'COMPARE_PY'
          """Compare a newly published Kaggle version to the actual archived GB/IE result rows.
          Approve whole days only where coverage is a verified superset, with no known contradictions.
          """
          import argparse, collections as C, csv, datetime as dt, json, os, re, sys, tempfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo
          import kagglehub
          import import_historical_ukie as I
          import stage4_match_all_recurring_races as R
          from scripts import stage32_form_rebuild as F
          from scripts.kaggle_form_baseline import BASELINE

          DATASET='deltaromeo/horse-racing-results-ukireland-2015-2025'
          REPORT=Path('reports/stage32/kaggle-form-comparison.json')
          NR={'NR','NONRUNNER','NONSTARTER','WD','WITHDRAWN','SCRATCHED','DNS'}
          TERMINAL={'F','FELL','PU','P','PULLEDUP','UR','UNSEATEDRIDER','BD','BROUGHTDOWN','RO','RANOUT','R','REF','REFUSED','DQ','DSQ','DISQUALIFIED','SU','RR','DNF','CO','S','UNPLACED','FINISHEDUNPLACED','U','RET'}
          FOREIGN={'compiegne','toulouse','abudhabi','auteuil','woodbine','chantilly','meydan'}
          PEOPLE={'trainers':['Dan Skelton','Martin Keighley'],'jockeys':['Harry Skelton','James Best']}

          def read(p): return json.loads(p.read_text()) if p.exists() else {}
          def save(p,obj):
              p.parent.mkdir(parents=True,exist_ok=True); tmp=p.with_suffix('.tmp'); tmp.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n'); tmp.replace(p)
          def version_number():
              url='https://www.kaggle.com/api/v1/datasets/view/'+DATASET
              with urlopen(Request(url,headers={'Accept':'application/json','User-Agent':'RacingApp-form-audit/1.0'}),timeout=45) as r: obj=json.load(r)
              for k in ('currentVersionNumber','versionNumber','current_version_number','version_number'):
                  v=obj.get(k)
                  if str(v).isdigit() and int(v)>0:return int(v)
              raise RuntimeError('Kaggle metadata did not expose a version number; do not guess latest')

          def outcome(pos,status=''):
              p=str(pos or '').strip().upper(); s=F.compact(status).upper(); q=F.compact(p).upper()
              if q in NR or s in NR:return 'NR'
              m=re.fullmatch(r'([1-9][0-9]*)(?:\.0+|=|ST|ND|RD|TH)?',p)
              if m:return int(m.group(1))
              if q in TERMINAL or s in TERMINAL:return 'NONFINISH'
              return 'UNKNOWN'

          def person_words(s):
              import unicodedata
              s=unicodedata.normalize('NFKD',str(s or ''))
              s=''.join(x for x in s if not unicodedata.combining(x)).casefold()
              s=re.sub(r'\s*\(\d+\)\s*$','',s)
              return re.findall(r'[a-z]+',s)

          def lexical_alias(a,b):
              x,y=person_words(a),person_words(b)
              if ',' in str(a):
                  left,right=str(a).split(',',1);x=person_words(right)+person_words(left)
              if ',' in str(b):
                  left,right=str(b).split(',',1);y=person_words(right)+person_words(left)
              titles={'mr','mrs','ms','miss','dr'}
              x=[t for t in x if t not in titles]; y=[t for t in y if t not in titles]
              if not x or not y:return False
              if F.person_key(a)==F.person_key(b):return True
              if ''.join(x)==''.join(y):return True
              # Initials plus identical surname; no fuzzy spelling or surname-only matches.
              if len(x)<2 or len(y)<2 or x[-1]!=y[-1] or x[0][0]!=y[0][0]:return False
              if x[0]==y[0] or len(x[0])==1 or len(y[0])==1:
                  return True
              return False

          def crosswalk(kdays,api):
              # A source pair must appear on the same uniquely identified starter, not merely
              # on the same day or with a similar name. Record contradictory aliases for review.
              observed={t:C.defaultdict(C.Counter) for t in ('trainer','jockey')}
              reverse={t:C.defaultdict(set) for t in observed}; labels={t:{} for t in observed}
              raw_labels={t:{} for t in observed}; examples=[]; issues=C.Counter()
              enriched=C.defaultdict(list)
              for row in api:
                  enriched[(row['date'],row['form_course'],row['form_horse'])].append(row)
              for day,k in kdays.items():
                  for (co,horse),r in k.items():
                      matches=enriched.get((day,co,horse),[])
                      if len(matches)!=1:continue
                      a=matches[0]
                      if (r['outcome']==1)!=F.is_win(a):continue
                      for t in observed:
                          kn=F.person_key(r[t]); an=F.person_key(a[t])
                          if not kn or not an:continue
                          observed[t][kn][an]+=1; reverse[t][an].add(kn)
                          labels[t][an]=a[t];raw_labels[t][kn]=r[t]
              mapping={t:{} for t in observed}
              for t in observed:
                  for kn,v in observed[t].items():
                      if len(v)!=1:
                          issues[t+'_ambiguous_source_name']+=1;continue
                      an,count=next(iter(v.items()))
                      raw,canonical=raw_labels[t][kn],labels[t][an]
                      if kn==an or lexical_alias(raw,canonical):
                          mapping[t][kn]=canonical
                      else:
                          issues[t+'_unresolved_alias']+=1
                          if len(examples)<80:examples.append({'kind':t,'kaggle_name':raw,'api_name':canonical,'matched_starters':count})
              return mapping,{'mapped_names':{t:len(v) for t,v in mapping.items()},'unresolved':dict(issues),'unresolved_examples':examples,'source_name_samples':{t:list(raw_labels[t].values())[:12] for t in observed}}

          def person_totals(rows):
              out={'starters':len(rows),'trainers':{},'jockeys':{}}
              for kind,group in [('trainer','trainers'),('jockey','jockeys')]:
                  for x in rows:
                      name=x[kind]; nm=F.person_key(name)
                      if not nm or nm in {'nan','none','null','unknown','na'}:continue
                      a=out[group].setdefault(nm,{'name':name,'runs':0,'wins':0});a['runs']+=1;a['wins']+=int(x['outcome']==1)
              return out

          def fetch_rows(source,start,end):
              days=C.defaultdict(dict); problems=C.defaultdict(C.Counter); races=C.defaultdict(set); maxdate=''; scanned=0
              dash=C.defaultdict(list); known_nr=C.defaultdict(set)
              for filename,opener in I.source_iter(source):
                  with opener() as f:
                      sample=f.read(8192);f.seek(0)
                      try:dialect=csv.Sniffer().sniff(sample,delimiters=',;\t|')
                      except csv.Error:dialect=csv.excel
                      reader=csv.DictReader(f,dialect=dialect); m=I.mapping(reader.fieldnames or [])
                      if not all(m.get(x) for x in ('race_date','course','horse','finish','trainer','jockey')) or not any(m.get(x) for x in ('race_id','race_no','off_time')):continue
                      for row in reader:
                          raw=I.value(row,m,'race_date'); day=raw[:10] if re.fullmatch(r'\d{4}-\d\d-\d\d',raw[:10]) else I.dateparse(raw)
                          if not day or day>end:continue
                          maxdate=max(maxdate,day)
                          if day<start:continue
                          scanned+=1; course=I.value(row,m,'course')
                          region=R.region(course)
                          # Explicitly foreign courses are outside the UK/IE metric, not evidence of a missing UK/IE result.
                          if region=='OTHER' or F.course_key(course) in FOREIGN:
                              problems[day]['excluded_explicit_foreign_course']+=1;continue
                          if region not in ('GB','IRELAND'):
                              problems[day]['unresolved_course:'+course[:80]]+=1;continue
                          co=F.course_key(course);horse=F.horse_key(I.value(row,m,'horse'));rid=I.value(row,m,'race_id') or I.value(row,m,'race_no') or I.value(row,m,'off_time')
                          pos=outcome(I.value(row,m,'finish'))
                          if all((co,horse,rid)) and I.value(row,m,'finish').strip() in ('-','–','—'):
                              dash[day].append((co,horse,rid));continue
                          if not all((co,horse,rid)) or pos=='UNKNOWN':problems[day]['invalid_identity_or_finish:'+course[:40]+':'+str(I.value(row,m,'finish'))[:30]]+=1;continue
                          if pos=='NR':known_nr[day].add((co,horse,rid));continue
                          x={'outcome':pos,'trainer':I.value(row,m,'trainer'),'jockey':I.value(row,m,'jockey'),'race':rid}
                          key=(co,horse); old=days[day].get(key)
                          if old and old!=x:problems[day]['contradictory_duplicate']+=1;continue
                          days[day][key]=x;races[day].add((co,rid))
              # A dash is NOT a finishing position and is never automatically a non-runner.
              # An exact source race/horse with a separate known finish or explicit NR is redundant.
              for day,records in dash.items():
                  for co,horse,rid in records:
                      match=days[day].get((co,horse))
                      if (match and match['race']==rid) or (co,horse,rid) in known_nr[day]:
                          problems[day]['excluded_redundant_dash_row']+=1
                      else:
                          problems[day]['unresolved_dash:'+co]+=1
              if not maxdate or not scanned:raise RuntimeError('No usable recent Kaggle source records')
              return days,problems,races,maxdate

          def api_rows(day):
              rows={}; races=set(); problems=C.Counter()
              doc=read(Path('data/racing-results')/(day+'.json'))
              for race in doc.get('results',[]):
                  if race.get('status')=='superseded' or str(race.get('region') or '').upper() not in ('','GB','IRE','IE'):continue
                  co=F.course_key(race.get('course'));off=F.off_key(race.get('off_dt') or race.get('race_time') or race.get('off'))
                  if not co or not off:problems['invalid_race']+=1;continue
                  races.add((co,off))
                  for h in race.get('runners',[]):
                      if not F.is_starter(h):continue
                      key=(co,F.horse_key(h.get('horse')));pos=outcome(h.get('position'),h.get('status'))
                      if not key[1] or pos in ('NR','UNKNOWN'):problems['invalid_runner']+=1;continue
                      x={'outcome':pos,'trainer':str(h.get('trainer') or ''),'jockey':str(h.get('jockey') or ''),'race':off}
                      if key in rows and rows[key]!=x:problems['contradictory_duplicate']+=1;continue
                      rows[key]=x
              return rows,races,problems

          def compare(day,k,kr,kissues,api,ar,ai,expected,api_count):
              common=k.keys()&api.keys(); missing=api.keys()-k.keys(); different=0; people_diff=0
              for key in common:
                  a,b=api[key],k[key]
                  different+=int(a['outcome']!=b['outcome'])
                  people_diff+=sum(bool(a[t] and b[t] and F.person_key(a[t])!=F.person_key(b[t])) for t in ('trainer','jockey'))
              stats=person_totals(k.values()); ag=person_totals(api.values())
              gaps={g:len(k)-sum(x['runs'] for x in stats[g].values()) for g in ('trainers','jockeys')}
              # A full known field may have NR omissions. Require at least one matching starter
              # per saved race, and a unique candidate by horse overlap, not an inferred off time.
              groups=C.defaultdict(set)
              for (co,horse),x in k.items():groups[(co,x['race'])].add(horse)
              matched=set(); unmatched=0
              for key,decl in sorted(expected.items()):
                  _,co,_=key.split('|'); active={h for h,s in decl.items() if s!='NR'}
                  if not active:continue
                  hits=[g for g,hs in groups.items() if g[0]==co and hs&active]
                  if len(hits)!=1 or hits[0] in matched:unmatched+=1
                  else:matched.add(hits[0])
              reasons=[]
              if not api or not k:reasons.append('no_comparable_source_rows')
              if len(api)!=api_count:reasons.append('archive_vs_published_api_count_mismatch')
              if missing:reasons.append('api_starters_absent_from_kaggle')
              if different:reasons.append('finish_disagreements')
              if people_diff:reasons.append('person_name_disagreements')
              if len(kr)<len(ar):reasons.append('fewer_kaggle_races')
              if unmatched:reasons.append('unmatched_saved_races')
              if any(gaps.values()):reasons.append('missing_kaggle_persons')
