rification":{"source_url":"https://www.racingpost.com/results/513/wolverhampton-aw/2026-11-23/931829/","source_race_id":"931829","starters":10,"verified_on":"2026-11-25"},"runners":[{"horse":"Hitched","position":"1","trainer":"David Simcock","jockey":"Luke Morris","sp":"7/4"},{"horse":"Galileo Island","position":"2","trainer":"Tom Ward","jockey":"Sean Levey","sp":"50/1"},{"horse":"He's A Gentleman","position":"3","trainer":"Hugo Palmer","jockey":"David Egan","sp":"11/1"},{"horse":"Sovereign Bay","position":"4","trainer":"James Owen","jockey":"Jason Watson","sp":"3/1"},{"horse":"Shadowmere","position":"5","trainer":"George Baker","jockey":"Callum Shepherd","sp":"9/1"},{"horse":"Galba","position":"6","trainer":"Kevin & Lauren Frost","jockey":"Matthew Lloyd Slater","sp":"9/2"},{"horse":"Law Supreme","position":"7","trainer":"Ian Williams","jockey":"Edward Greatrex","sp":"28/1"},{"horse":"Pipily","position":"8","trainer":"T J Kent","jockey":"Clifford Lee","sp":"11/1"},{"horse":"Ecclefechan","position":"9","trainer":"Scott Dixon","jockey":"Kieran O'Neill","sp":"16/1"},{"horse":"Clatford","position":"10","trainer":"Scott Dixon","jockey":"Christian Howarth","sp":"125/1"}]},{"date":"2026-11-24","course":"Wolverhampton (AW)","off_dt":"2026-11-24T20:30:00Z","region":"GB","status":"final","source":"Stage V5 independently published result","external_verification":{"source_url":"https://www.racingpost.com/results/513/wolverhampton-aw/2026-11-24/931840/","source_race_id":"931840","starters":9,"verified_on":"2026-11-25"},"runners":[{"horse":"Moe's Legacy","position":"1","trainer":"Ronald Harris","jockey":"Cieren Fallon","sp":"22/1"},{"horse":"Rye","position":"2","trainer":"Tony Carroll","jockey":"Hollie Doyle","sp":"8/1"},{"horse":"Showtime Mahomes","position":"3","trainer":"Grant Tuer","jockey":"Laura Pearson","sp":"6/1"},{"horse":"Beaumadier","position":"4","trainer":"Mark Loughnane","jockey":"Hope Regan","sp":"9/1"},{"horse":"Truly Glamorous","position":"5","trainer":"Christopher Mason","jockey":"Gina Mangan","sp":"10/1"},{"horse":"Maharajas Express","position":"6","trainer":"Ian Williams","jockey":"Billy Loughnane","sp":"5/2"},{"horse":"Grandlad","position":"7","trainer":"James Horton","jockey":"Daniel Muscutt","sp":"5/1"},{"horse":"Campenaerts","position":"8","trainer":"Jonathan Portman","jockey":"Rob Hornby","sp":"9/2"},{"horse":"Burdett Estate","position":"9","trainer":"Brian Toomey","jockey":"Kieran Shoemark","sp":"16/1"},{"horse":"Sunlit Sea","position":"NR","status":"non-runner"}]}]}
          DATED_JSON
      - name: Install and test dated evidence integration
        env:
          AUDIT_ONLY: ${{ inputs.audit_only }}
        run: |
          python - <<'PY_PATCH'
          from pathlib import Path
          import json,py_compile
          p=Path('data/form-dated-evidence.json');seed=json.loads(Path('.form_dated_seed.json').read_text())
          if p.exists():
              existing=json.loads(p.read_text());assert existing['schema']==seed['schema']
              for key,value in seed['meetings'].items():
                  assert key not in existing['meetings'] or existing['meetings'][key]==value
                  existing['meetings'][key]=value
              for key in ('abandoned','final_results'):
                  for row in seed[key]:
                      if row not in existing[key]:existing[key].append(row)
              seed=existing
          p.write_text(json.dumps(seed,ensure_ascii=False,indent=2)+'\n')
          p=Path('scripts/audit_kaggle_form.py');s=p.read_text()
          def patch(old,new):
              global s
              if new in s:return
              assert s.count(old)==1,old[:100]
              s=s.replace(old,new,1)
          patch('    dash=C.defaultdict(list); known_nr=C.defaultdict(set)','    dash=C.defaultdict(list); known_nr=C.defaultdict(set)\n    unresolved_dash=C.defaultdict(list)\n    from scripts.form_dated_evidence import verified_dash')
          patch("                problems[day]['unresolved_dash:'+co]+=1", "                verdict=verified_dash(day,co,horse,rid,days[day])\n                if verdict:problems[day]['excluded_verified_nonrunner']+=1\n                else:\n                    problems[day]['unresolved_dash:'+co]+=1\n                    unresolved_dash[day].append({'course_key':co,'horse_key':horse,'source_race_id':rid})")
          patch('    return days,problems,races,maxdate','    return days,problems,races,maxdate,unresolved_dash')
          patch('kdays,kissues,kraces,cutoff=fetch_rows(source,start,end)','kdays,kissues,kraces,cutoff,unresolved_dash=fetch_rows(source,start,end)')
          patch("('excluded_explicit_foreign_course','excluded_redundant_dash_row')", "('excluded_explicit_foreign_course','excluded_redundant_dash_row','excluded_verified_nonrunner')")
          patch("        r['enriched_pair_conflicts']=len(pair_conflicts)", "        r['unresolved_dash_rows']=unresolved_dash.get(day,[])\n        r['enriched_pair_conflicts']=len(pair_conflicts)")
          p.write_text(s);py_compile.compile(str(p),doraise=True);py_compile.compile('scripts/form_dated_evidence.py',doraise=True)
          from scripts.form_dated_evidence import verified_dash
          # All fields must match independent evidence before treating a dash as a withdrawal.
          from scripts import stage32_form_rebuild as F
          e=seed['meetings']['2026-11-16|plumpton']['races'];known={}
          for i,(winner,n,nr) in enumerate(e):
              known['plumpton',F.horse_key(winner)]={'race':str(i),'outcome':1}
              for j in range(n-1):known['plumpton',f'test{i}x{j}']={'race':str(i),'outcome':j+2}
          assert verified_dash('2026-11-16','plumpton','alanbresil','4',known)=='externally_verified_nonrunner'
          assert verified_dash('2026-11-16','plumpton','unknownhorse','4',known) is None
          known.pop(('plumpton','test0x0'));assert verified_dash('2026-11-16','plumpton','alanbresil','4',known) is None
          print('Dated evidence regression checks passed')
          PY_PATCH
          rm .form_dated_seed.json
          if [ "$AUDIT_ONLY" != true ]; then python -m scripts.form_dated_evidence; fi
      - name: Check version and compare historical days
        env:
          VERSION: ${{ inputs.version }}
          AUDIT_ONLY: ${{ inputs.audit_only }}
        run: |
          args=()
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ "$AUDIT_ONLY" = true ]; then args+=(--audit-only); fi
          python -m scripts.audit_kaggle_form "${args[@]}"
      - name: Rebuild form with approved baseline and API bridge
        if: ${{ inputs.audit_only != true }}
        run: |
          DAY=$(python -c 'from datetime import datetime,timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("Europe/Dublin")).date()-timedelta(days=1)).isoformat())')
          python calculate-strike-rates.py --as-of "$DAY" --no-wrapper
      - name: Retain comparison report even if final rebuild fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-form-comparison-${{ github.run_id }}
          path: reports/stage32/kaggle-form-comparison.json
          if-no-files-found: warn
      - name: Publish comparison and approved derived form (no raw Kaggle data)
        env:
          AUDIT_ONLY: ${{ inputs.audit_only }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stage32/kaggle-form-comparison.json
          if [ "$AUDIT_ONLY" != true ]; then
            git add scripts/form_dated_evidence.py data/form-dated-evidence.json data/rhp-stage72-race-exceptions.json reports/stage32/form-dated-recovery.json data/racing-results/ data/form-person-aliases.json scripts/form_person_aliases.py index.html scripts/kaggle_form_baseline.py scripts/audit_kaggle_form.py scripts/stage32_form_rebuild.py data/strike-rates.json data/form-identity-cache.json reports/stage32/form-rebuild-audit.json
            if [ -f data/kaggle-form-baseline.json ]; then git add data/kaggle-form-baseline.json; fi
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Kaggle form V5: dated nonrunner verification and late result recovery'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
