          from pathlib import Path
          import json,py_compile
          p=Path('data/form-dated-evidence.json');seed=json.loads(Path('.form_dated_seed.json').read_text())
          if p.exists():
              existing=json.loads(p.read_text());assert existing['schema']==seed['schema']
              for key,value in seed['meetings'].items():
                  assert key not in existing['meetings'] or existing['meetings'][key]==value
                  existing['meetings'][key]=value
              for key in ('abandoned','final_results'):
                  for row in seed[key]:
                      if row not in existing[key]:existing[key].append(row)
              seed=existing
          p.write_text(json.dumps(seed,ensure_ascii=False,indent=2)+'\n')
          p=Path('scripts/audit_kaggle_form.py');s=p.read_text()
          def patch(old,new):
              global s
              assert s.count(old)==1,old[:100]
              s=s.replace(old,new,1)
          patch('    dash=C.defaultdict(list); known_nr=C.defaultdict(set)','    dash=C.defaultdict(list); known_nr=C.defaultdict(set)\n    unresolved_dash=C.defaultdict(list)\n    from scripts.form_dated_evidence import verified_dash')
          patch("                problems[day]['unresolved_dash:'+co]+=1", "                verdict=verified_dash(day,co,horse,rid,days[day])\n                if verdict:problems[day]['excluded_verified_nonrunner']+=1\n                else:\n                    problems[day]['unresolved_dash:'+co]+=1\n                    unresolved_dash[day].append({'course_key':co,'horse_key':horse,'source_race_id':rid})")
          patch('    return days,problems,races,maxdate','    return days,problems,races,maxdate,unresolved_dash')
          patch('kdays,kissues,kraces,cutoff=fetch_rows(source,start,end)','kdays,kissues,kraces,cutoff,unresolved_dash=fetch_rows(source,start,end)')
          patch("('excluded_explicit_foreign_course','excluded_redundant_dash_row')", "('excluded_explicit_foreign_course','excluded_redundant_dash_row','excluded_verified_nonrunner')")
          patch("        r['enriched_pair_conflicts']=len(pair_conflicts)", "        r['unresolved_dash_rows']=unresolved_dash.get(day,[])\n        r['enriched_pair_conflicts']=len(pair_conflicts)")
          p.write_text(s);py_compile.compile(str(p),doraise=True);py_compile.compile('scripts/form_dated_evidence.py',doraise=True)
          from scripts.form_dated_evidence import verified_dash
          # All fields must match independent evidence before treating a dash as a withdrawal.
          from scripts import stage32_form_rebuild as F
          e=seed['meetings']['2026-11-16|plumpton']['races'];known={}
          for i,(winner,n,nr) in enumerate(e):
              known['plumpton',F.horse_key(winner)]={'race':str(i),'outcome':1}
              for j in range(n-1):known['plumpton',f'test{i}x{j}']={'race':str(i),'outcome':j+2}
          assert verified_dash('2026-11-16','plumpton','alanbresil','4',known)=='externally_verified_nonrunner'
          assert verified_dash('2026-11-16','plumpton','unknownhorse','4',known) is None
          known.pop(('plumpton','test0x0'));assert verified_dash('2026-11-16','plumpton','alanbresil','4',known) is None
          print('Dated evidence regression checks passed')
