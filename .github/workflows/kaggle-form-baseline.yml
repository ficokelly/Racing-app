name: Kaggle form baseline audit and refresh
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kaggle version (132 for this repair; blank checks latest)'
        required: false
        default: '132'
      audit_only:
        description: 'Compare without publishing form changes'
        type: boolean
        default: false
  schedule:
    - cron: '35 4 * * *'
permissions:
  contents: write
concurrency:
  group: kaggle-form-baseline
  cancel-in-progress: false
jobs:
  compare-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: pip install 'kagglehub>=0.3,<1'
      - name: Install and test exact evidence repair
        run: |
          cat > scripts/form_final_evidence.py <<'HELPER_PY'
          """Dated evidence for duplicate declarations and authoritative final person identities."""
          from collections import defaultdict
          from functools import lru_cache
          from pathlib import Path
          import json

          DECLARATION_SOURCE='https://www.sportinglife.com/racing/racecards/2026-11-19/thurles/live-show/949080/irish-stallion-farms-ebf-beginners-chase'
          RESULT_SOURCE='https://www.racingpost.com/results/198/thurles/2026-11-19/933391/'
          # 12:05 declaration is not a second race; 12:08 final contains eight of the fourteen.
          FINISH={'doctorsteinberg':1,'fortdino':2,'courtcompliance':3,'walksinjune':4,'franciscanrock':5,'farnahoerebel':6,'firecoral':7,'stedebonnet':'NONFINISH'}
          DECLARED=set(FINISH)|{'countyfinal','hecantdance','notimetowait','portauthority','timesareachanging','yeshil'}

          def thurles_duplicate(day, records, known):
              if day!='2026-11-19': return set()
              d=[(c,h,r) for c,h,r in records if c=='thurles' and str(r)=='949080']
              if len(d)!=len(DECLARED) or {h for c,h,r in d}!=DECLARED:return set()
              # Every final starter and placing must be present in exactly one other source race.
              final=[known.get(('thurles',h)) for h in FINISH]
              if any(x is None for x in final):return set()
              ids={str(x['race']) for x in final}
              if len(ids)!=1 or '949080' in ids:return set()
              rid=next(iter(ids))
              actual={h:x['outcome'] for (c,h),x in known.items() if c=='thurles' and str(x['race'])==rid}
              if actual!=FINISH:return set()
              if any(('thurles',h) in known for h in DECLARED-set(FINISH)):return set()
              return set(d)

          @lru_cache(maxsize=1)
          def evidence():
              p=Path('data/form-dated-evidence.json')
              return json.loads(p.read_text()) if p.exists() else {}

          def verified_final_person(race, runner, kind, F):
              # A URL or source label alone is insufficient. Require exact matching archived
              # final race and independently reviewed horse, placing, trainer and rider.
              if kind not in ('trainer','jockey') or race.get('status')!='final':return False
              if race.get('source')!='Stage V5 independently published result':return False
              meta=race.get('external_verification') or {}
              if not meta.get('source_url') or not meta.get('source_race_id'):return False
              key=lambda r:(str(r.get('date') or '')[:10], F.course_key(r.get('course')), F.off_key(r.get('off_dt') or r.get('race_time') or r.get('off')))
              def signature(rows):
                  return sorted((F.horse_key(h.get('horse')),str(h.get('position') or '').upper(),F.person_key(h.get('trainer')),F.person_key(h.get('jockey'))) for h in rows if F.is_starter(h))
              for original in evidence().get('final_results',[]):
                  if key(original)!=key(race) or original.get('external_verification')!=meta:continue
                  a,b=signature(original.get('runners',[])),signature(race.get('runners',[]))
                  if a!=b or len(a)!=meta.get('starters') or len({x[0] for x in a})!=len(a):return False
                  entry=(F.horse_key(runner.get('horse')),str(runner.get('position') or '').upper(),F.person_key(runner.get('trainer')),F.person_key(runner.get('jockey')))
                  return bool(runner.get(kind)) and entry in a
              return False
          HELPER_PY
          cat > .form_v6_install.py <<'INSTALL_PY'

          from pathlib import Path
          import py_compile

          def patch(path,old,new):
              p=Path(path);s=p.read_text()
              if new in s:return
              if s.count(old)!=1:raise RuntimeError(f'Unexpected source version: {path}: {old[:120]}')
              p.write_text(s.replace(old,new,1))

          A='scripts/audit_kaggle_form.py'; F='scripts/stage32_form_rebuild.py'
          patch(A, '    for day,records in dash.items():\n        for co,horse,rid in records:', "    from scripts.form_final_evidence import thurles_duplicate\n    for day,records in dash.items():\n        duplicate=thurles_duplicate(day,records,days[day])\n        for co,horse,rid in records:\n            if (co,horse,rid) in duplicate:\n                problems[day]['excluded_verified_duplicate_declaration']+=1\n                continue")
          patch(A, "('excluded_explicit_foreign_course','excluded_redundant_dash_row','excluded_verified_nonrunner')", "('excluded_explicit_foreign_course','excluded_redundant_dash_row','excluded_verified_nonrunner','excluded_verified_duplicate_declaration')")
          # The registry is already deployed. Verify a final row before overriding a stale
          # declaration, and never attach a different person's pre-race ID.
          for kind in ('trainer','jockey'):
              old=f"                    elif stage75_approved_result_alias(race, runner, ref, '{kind}'):"
              new=f"""                    elif verified_dated_final_person(race, runner, '{kind}'):
                                  if person_key(original_{kind}) != person_key(ref.get('{kind}')):
                                      {kind}_id=str(runner.get('{kind}_id') or '')
                                  audit['verified_dated_final_{kind}_preferred'] += 1
          {old}"""
              patch(F,old,new)
          patch(F, 'def get_best_rows(as_of: dt.date, cache: dict, audit: collections.Counter):', 'def verified_dated_final_person(race, runner, kind):\n    # Import lazily to avoid a circular import during startup.\n    import sys\n    try:\n        from scripts.form_final_evidence import verified_final_person\n    except ModuleNotFoundError:\n        from form_final_evidence import verified_final_person\n    return verified_final_person(race,runner,kind,sys.modules[__name__])\n\ndef get_best_rows(as_of: dt.date, cache: dict, audit: collections.Counter):')
          # Make canonical aliases/claim suffixes equivalent for both regular API and recovered rows.
          for kind in ('trainer','jockey'):
              patch(F,f"compact(original_{kind})!=compact(ref['{kind}'])",f"person_key(original_{kind})!=person_key(ref['{kind}'])")
          # Keep raw archive gaps, but distinguish those already covered by approved Kaggle days.
          G='scripts/form_coverage_guard.py'
          patch(G,"        selected=[v for d,v in byday.items() if d>=lower]","        selected=[v for d,v in byday.items() if d>=lower]\n        approved=set(p.get('kaggle_days',[]))\n        effective=[v for d,v in byday.items() if d>=lower and d not in approved]\n        p['effective_form_coverage']={'api_missing_or_ambiguous_races':sum(len(v['missing_or_ambiguous_races']) for v in effective),'api_unresolved_declarations':sum(len(x['declared_horses_without_result_or_withdrawal']) for v in effective for x in v['unresolved_declarations']),'api_unknown_fixture_days':sum(v['fixture_coverage_unknown'] for v in effective),'approved_kaggle_days':sorted(approved),'note':'Approved Kaggle days replace API aggregates; raw archive gaps remain in coverage_guard. External complete fixture census not established.'}")
          for path in (A,F,G,'scripts/form_final_evidence.py'):py_compile.compile(path,doraise=True)
          INSTALL_PY
          python .form_v6_install.py
          python .form_v6_install.py
          rm .form_v6_install.py
          python - <<'TEST_PY'
          from scripts import form_final_evidence as E, stage32_form_rebuild as F
          from pathlib import Path
          from copy import deepcopy
          import json
          # Exact declaration and actual starter set must agree; no blanket dash exclusion.
          known={('thurles',h):{'race':'final-result','outcome':v} for h,v in E.FINISH.items()}
          rows=[('thurles',h,'949080') for h in E.DECLARED]
          assert len(E.thurles_duplicate('2026-11-19',rows,known))==14
          assert not E.thurles_duplicate('2026-11-19',rows[:-1],known)
          bad=deepcopy(known);bad[('thurles','doctorsteinberg')]['outcome']=2
          assert not E.thurles_duplicate('2026-11-19',rows,bad)
          assert not E.thurles_duplicate('2026-11-20',rows,known)
          registry=json.loads(Path('data/form-dated-evidence.json').read_text())
          checked=0
          for r in registry['final_results']:
              for h in r['runners']:
                  if not F.is_starter(h):continue
                  assert E.verified_final_person(r,h,'trainer',F)
                  assert E.verified_final_person(r,h,'jockey',F)
                  checked+=1
              bad=deepcopy(r);bad['runners'][0]['jockey']='Not the verified rider'
              assert not E.verified_final_person(bad,bad['runners'][0],'jockey',F)
          assert checked==48, checked
          print('Exact declaration and 48 final-result identity checks passed.')
          TEST_PY
      - name: Compare and approve historical dates
        env:
          VERSION: ${{ inputs.version }}
          AUDIT_ONLY: ${{ inputs.audit_only }}
        run: |
          args=()
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ "$AUDIT_ONLY" = true ]; then args+=(--audit-only); fi
          python -m scripts.audit_kaggle_form "${args[@]}"
      - name: Rebuild and verify form counts
        if: ${{ inputs.audit_only != true }}
        run: |
          DAY=$(python -c 'from datetime import datetime,timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("Europe/Dublin")).date()-timedelta(days=1)).isoformat())')
          python calculate-strike-rates.py --as-of "$DAY" --no-wrapper
          python - <<'VERIFY_PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/strike-rates.json').read_text())
          for n,p in x['periods'].items():
              for group,kind,denom in [('trainers','trainer','runs'),('jockeys','jockey','rides')]:
                  assert sum(z[denom] for z in p[group].values())+p['identity_gaps'][kind]==p['runners'],(n,kind)
          p=x['periods']['14']; print(json.dumps({'runners':p['runners'],'identity_gaps':p['identity_gaps'],'kaggle_days':p.get('kaggle_days'),'effective_form_coverage':p.get('effective_form_coverage')},indent=2))
          VERIFY_PY
      - name: Retain comparison diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-form-comparison-${{ github.run_id }}
          path: reports/stage32/kaggle-form-comparison.json
          if-no-files-found: warn
      - name: Publish verified form and persistent repair
        if: ${{ inputs.audit_only != true }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/form_final_evidence.py scripts/audit_kaggle_form.py scripts/stage32_form_rebuild.py scripts/form_coverage_guard.py data/kaggle-form-baseline.json data/strike-rates.json data/form-identity-cache.json reports/stage32/kaggle-form-comparison.json reports/stage32/form-rebuild-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Form V6: reconcile Thurles declaration duplicate and verified final jockey identities'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
