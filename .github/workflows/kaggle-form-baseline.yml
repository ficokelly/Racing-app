      - name: Check version and compare historical days
        env:
          VERSION: ${{ inputs.version }}
          AUDIT_ONLY: ${{ inputs.audit_only }}
        run: |
          args=()
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ "$AUDIT_ONLY" = true ]; then args+=(--audit-only); fi
          python -m scripts.audit_kaggle_form "${args[@]}"
      - name: Rebuild form with approved baseline and API bridge
        if: ${{ inputs.audit_only != true }}
        run: |
          DAY=$(python -c 'from datetime import datetime,timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("Europe/Dublin")).date()-timedelta(days=1)).isoformat())')
          python calculate-strike-rates.py --as-of "$DAY" --no-wrapper
      - name: Retain comparison report even if final rebuild fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-form-comparison-${{ github.run_id }}
          path: reports/stage32/kaggle-form-comparison.json
          if-no-files-found: warn
      - name: Publish comparison and approved derived form (no raw Kaggle data)
        env:
          AUDIT_ONLY: ${{ inputs.audit_only }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stage32/kaggle-form-comparison.json
          if [ "$AUDIT_ONLY" != true ]; then
            git add scripts/form_dated_evidence.py data/form-dated-evidence.json data/rhp-stage72-race-exceptions.json reports/stage32/form-dated-recovery.json data/racing-results/ data/form-person-aliases.json scripts/form_person_aliases.py index.html scripts/kaggle_form_baseline.py scripts/audit_kaggle_form.py scripts/stage32_form_rebuild.py data/strike-rates.json data/form-identity-cache.json reports/stage32/form-rebuild-audit.json
            if [ -f data/kaggle-form-baseline.json ]; then git add data/kaggle-form-baseline.json; fi
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Kaggle form V5: dated nonrunner verification and late result recovery'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
