name: Stage185a - Stage95 E75 and HPR frozen formula replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stage185a-e75-hpr-replay.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage185a-e-research
  cancel-in-progress: false
env:
  PYTHONPATH: .:scripts
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      days: ${{ steps.days.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5987838b0e3f28b53686bac60d52cd164738718
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: days
        run: |
          python - <<'PY'
          import datetime as d,json,os
          days=[(d.date(2026,10,25)+d.timedelta(days=i)).isoformat() for i in range(30)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:print('days='+json.dumps(days,separators=(',',':')),file=f)
          PY
  score:
    needs: prepare
    name: ${{ matrix.day }} / E75 HPR
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        day: ${{ fromJSON(needs.prepare.outputs.days) }}
    env:
      DAY: ${{ matrix.day }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5987838b0e3f28b53686bac60d52cd164738718
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: reports/stage177/shared
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-db
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: reports/stage177/shared
      - uses: actions/download-artifact@v4
        with:
          name: stage177-g5-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: reports/stage177/shared
      - name: Install exact scoring dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 scikit-learn==1.6.1 joblib==1.4.2 freezegun==1.5.5 requests
      - name: Install Stage95 replay adapter
        run: |
          cat > scripts/stage185a_local_replay.py <<'PY'
          import argparse, pathlib as P, json, csv, collections, sqlite3, numpy as np
          import stage101_all_models_compare as M
          import stage86_hpr_engine as H
          from rhp_runner_eligibility import active_runner
          p=argparse.ArgumentParser();p.add_argument('command');p.add_argument('--date');p.add_argument('--db',type=P.Path);p.add_argument('--reference',type=P.Path);p.add_argument('--cards',type=P.Path);p.add_argument('--out',type=P.Path);p.add_argument('--hpr',type=P.Path,required=True);a=p.parse_args()
          # Stage101 uses Stage83's category-aware classifier; reconstruct its named-race table from the exact prior reference.
          with sqlite3.connect(a.db) as c:
           c.execute('CREATE TABLE IF NOT EXISTS stage65p_race_details (race_id TEXT PRIMARY KEY,race_name TEXT,pattern TEXT,rating_band TEXT,age_band TEXT,sex_rest TEXT,source_file TEXT)')
           with a.reference.open() as f:c.executemany('INSERT OR IGNORE INTO stage65p_race_details VALUES (?,?,NULL,NULL,NULL,NULL,?)',((r['stage2_race_id'],r['race_name'],'validated prior reference') for r in csv.DictReader(f) if r.get('stage2_race_id') and r.get('race_name')))
           c.commit();latest=c.execute('select max(race_date) from historical_races').fetchone()[0];assert latest<a.date
          # Restrict archived result and card reads to completed earlier dates. The dummy results satisfy Stage95's winner-index formatting only; never actual target outcomes.
          import datetime as dt
          original_results=H.load_results;original_cards=H.card_dates
          prior=dt.date.fromisoformat(a.date)-dt.timedelta(days=1)
          H.load_results=lambda root,start,end,*args,**kw:original_results(root,start,min(end,prior),*args,**kw)
          H.card_dates=lambda root,start,end,*args,**kw:original_cards(root,start,min(end,prior),*args,**kw)
          g=collections.defaultdict(list)
          for r in json.loads(a.cards.read_text())['runners']:
           if r['date']==a.date and active_runner(r):g[(r['date'],M.norm(r['course']),M.clock(r['race_time']))].append(r)
          entries=[]
          for k,rs in g.items():
           if len(rs)<2:continue
           # Stage95 uses weight_lbs, official_rating and race_type on input cards.
           cards=[dict(r,weight_lbs=r.get('weight_lbs') or r.get('lbs'),official_rating=r.get('official_rating') or r.get('ofr'),race_type=r.get('race_type') or r.get('type')) for r in rs]
           entries.append(dict(date=k[0],course=rs[0]['course'],time=k[2],key=k,cards=cards,result={'runners':[{'horse':r['horse'],'position':None} for r in cards]}))
          assert entries
          issues=[];scores=M.date_rows_de(a.db,a.hpr,entries,issues);rows=[]
          for e in entries:
           for model,x in scores.get(e['key'],{}).items():
            if model not in ('E_75_25_NO_HPR','E_75_25_WITH_HPR'):continue
            v=np.asarray(x['scores'],dtype=float);assert len(v)==len(e['cards']) and np.isfinite(v).all()
            for rank,i in enumerate(np.argsort(-v,kind='stable'),1):
             r=e['cards'][int(i)];rows.append(dict(date=e['date'],time_utc=e['time'],meeting=e['course'],race_type=r.get('race_name') or r.get('type') or '',discipline=r.get('type') or '',model=model,rank=rank,horse=r['horse']))
          assert rows,'No verified Stage95 E ranks'
          a.out.mkdir(parents=True,exist_ok=True)
          with (a.out/'stage185a-all-runners.csv').open('w',newline='') as f:w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          (a.out/'stage185a-audit.json').write_text(json.dumps(dict(historical_source_through=latest,training_year=2024,validation_year=2025,models=sorted({r['model'] for r in rows}),issues=issues),default=str))
          PY
          python -m py_compile scripts/stage185a_local_replay.py
      - name: Replay original Stage95 E75 recipes on frozen pre-off inputs
        run: |
          python - <<'PY'
          import collections as C,csv,datetime as D,hashlib,json,os,pathlib as P,re,sqlite3,subprocess as S,sys,unicodedata,tempfile,shutil
          DAY=os.environ['DAY'];B=P.Path('reports/stage177/shared').resolve();O=P.Path('reports/stage185a/score').resolve();O.mkdir(parents=True,exist_ok=True)
          def read(p):return json.loads(p.read_text())
          def norm(s):return re.sub('[^a-z0-9]','',unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().lower())
          def horse(s):return norm(re.sub(r'\s*\([A-Za-z]{2,3}\)\s*$','',str(s or '')))
          def course(s):
           n=norm(re.sub(r'\s*\((?:AW|GB|IRE)\)\s*$','',str(s or ''),flags=re.I));return {'galwayire':'galway','wexfordire':'wexford','dundalkawire':'dundalk','dundalkire':'dundalk','dundalkaw':'dundalk','fairyhouseire':'fairyhouse','clonmelire':'clonmel','gowranparkire':'gowranpark','kemptonpark':'kempton','chelmsfordcity':'chelmsford','bangor':'bangorondee'}.get(n,n)
          def digest(p):
           with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          cols=['date','course','time','model','horse','race_type','discipline','basis','source_asof','cutoff','batch'];out=[];audit={'date':DAY,'status':'STARTED','batches':[]}
          def save():
           (O/'audit.json').write_text(json.dumps(audit,indent=2));
           with (O/'rank1.csv').open('w',newline='') as f:w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(out)
          try:
           manifest=read(B/'history-manifest.json');db=B/'candidate.sqlite';assert digest(db)==manifest['database_sha256'] and digest(B/'candidate-reference.csv')==manifest['reference_sha256']
           batches=read(B/(DAY+'-batches.json'))
           with sqlite3.connect(db) as c:
            c.execute('delete from historical_runs where race_id in (select id from historical_races where race_date>=?)',(DAY,));c.execute('delete from historical_races where race_date>=?',(DAY,));c.commit();assert c.execute('select max(race_date) from historical_races').fetchone()[0]<DAY
           with tempfile.TemporaryDirectory() as td:
            T=P.Path(td);ref=T/'prior-reference.csv'
            with (B/'candidate-reference.csv').open(encoding='utf-8-sig',newline='') as f,ref.open('w',newline='') as g:
             r=csv.DictReader(f);w=csv.DictWriter(g,fieldnames=r.fieldnames);w.writeheader();w.writerows(x for x in r if x['date']<DAY)
            wrapper=T/'clock.py';wrapper.write_text('import sys,runpy\nfrom freezegun import freeze_time\nclock,script,*args=sys.argv[1:]\nsys.argv=[script,*args]\nwith freeze_time(clock,real_asyncio=True):\n runpy.run_path(script,run_name="__main__")\n')
            for b in batches:
             bid=b['batch'];work=T/bid;work.mkdir();rep={'batch':bid,'status':'FAILED'};meta={tuple(x['key']):x for x in b['races']};seen=set();exclude=C.Counter()
             try:
              args=[sys.executable,str(wrapper),b['cutoff'],str(P.Path('scripts/stage185a_local_replay.py').resolve()),'today','--db',str(db),'--reference',str(ref),'--cards',str(B/(bid+'.json')),'--date',DAY,'--out',str(work),'--hpr',str(B/'hpr.sqlite')]
              with (O/(bid+'.log')).open('w') as f:rc=S.run(args,stdout=f,stderr=S.STDOUT,timeout=6000).returncode
              assert rc==0,'Scorer failed: '+str(rc)
              sa=read(work/'stage185a-audit.json');assert sa['training_year']==2024 and sa['historical_source_through']<DAY
              raw=list(csv.DictReader((work/'stage185a-all-runners.csv').open()));groups=C.defaultdict(list)
              for r in raw:groups[((r['date'],course(r['meeting']),r['time_utc']),r['model'])].append(r)
              for (k,model),rs in groups.items():
               if k not in meta:exclude['unmatched_race']+=1;continue
               m=meta[k];top=[r for r in rs if r['rank']=='1'];declared=set(m['declared_horses'])
               if len(top)!=1 or len(rs)!=len(declared) or {horse(r['horse']) for r in rs}!=declared:exclude['incomplete_field_or_rank']+=1;continue
               r=top[0];assert (k,model) not in seen;seen.add((k,model))
               out.append(dict(date=k[0],course=k[1],time=k[2],model=r['model'],horse=r['horse'],race_type=r['race_type'],discipline=r['discipline'],basis='STAGE95_FROZEN_FORMULA_PREOFF_ADAPTER',source_asof=m['source_asof'],cutoff=b['cutoff'],batch=bid))
              rep.update(status='SCORED' if seen else 'NO_ACCEPTED_RANK1',rank1=len(seen),excluded=dict(exclude),scheduled=len(meta))
             except Exception as e:rep['error']=repr(e)
             finally:audit['batches'].append(rep);save();shutil.rmtree(work,ignore_errors=True)
           audit['status']='COMPLETE' if batches and all(x['status']=='SCORED' for x in audit['batches']) else 'PARTIAL_OR_FAILED';save();print('STAGE185A_SCORE',json.dumps(audit),flush=True)
          except Exception as e:audit.update(status='FAILED',error=repr(e));save();raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage185a-ranks-${{ matrix.day }}
          path: reports/stage185a/score/
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: [prepare,score]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage177-shared-inputs
          run-id: 45491296882
          github-token: ${{ github.token }}
          path: shared
      - uses: actions/download-artifact@v4
        with:
          pattern: stage185a-ranks-*
          path: results
          merge-multiple: false
      - name: Settle rank1 with the same Stage177b prices; report coverage and common cohorts
        run: |
          python - <<'PY'
          import collections as C,csv,json,pathlib as P,re,unicodedata
          out=P.Path('summary');out.mkdir(exist_ok=True)
          def horse(s):return re.sub('[^a-z0-9]','',unicodedata.normalize('NFKD',re.sub(r'\s*\((?:IRE|GB|FR|USA|GER|AUS|NZ|ITY|JPN)\)\s*$','',str(s or ''),flags=re.I)).encode('ascii','ignore').decode().lower())
          def key(r):return (r['date'],r['course'],r['time'])
          def write(name,rs):
           p=out/name
           if not rs:p.write_text('');return
           with p.open('w',newline='') as f:w=csv.DictWriter(f,fieldnames=list(dict.fromkeys(k for r in rs for k in r)));w.writeheader();w.writerows(rs)
          s={key(x):x for x in json.loads(P.Path('shared/settlement-prices.json').read_text())};rows=[];seen=set();audits=[]
          for p in P.Path('results').rglob('audit.json'):audits.append(json.loads(p.read_text()))
          for p in P.Path('results').rglob('rank1.csv'):
           for r in csv.DictReader(p.open()):
            k=key(r);mk=(k,r['model']);assert mk not in seen;seen.add(mk)
            status='NO_RESULT';won=None;pnl=None
            if k in s:
             v=s[k];h=horse(r['horse']);starter={horse(x['horse']) for x in v['starters']};nr={horse(x) for x in v['declared_nonrunners']};wins={horse(x['horse']):x['sp_decimal'] for x in v['winner_prices']}
             if h not in starter:status='VOID_NR' if h in nr else 'UNMATCHED'
             else:
              status='SETTLED';won=int(h in wins)
              if wins and not v['price_conflicts'] and all(x is not None for x in wins.values()):pnl=float(wins[h])/len(wins)-1 if won else -1.
            rows.append(dict(r,status=status,won=won,pnl=pnl))
          def metric(rs):
           settled=[r for r in rs if r['status']=='SETTLED'];priced=[r for r in settled if r['pnl'] is not None];wins=sum(r['won'] for r in settled);profit=sum(r['pnl'] for r in priced)
           return {'selections':len(rs),'settled':len(settled),'wins':wins,'strike_rate_pct':round(100*wins/len(settled),4) if settled else None,'priced':len(priced),'pnl_units':round(profit,4),'roi_pct':round(100*profit/len(priced),4) if priced else None,'excluded_or_void':len(rs)-len(settled)}
          groups=C.defaultdict(list)
          for r in rows:
           for dimension,value in [('overall','all'),('day',r['date']),('discipline',r['discipline']),('race_type',r['race_type'])]:groups[(r['model'],dimension,value)].append(r)
          metrics=[dict(model=m,dimension=d,value=v,**metric(rs)) for (m,d,v),rs in sorted(groups.items())]
          write('rank1-settlement.csv',rows);write('model-performance.csv',metrics)
          report={'status':'RESEARCH_ONLY_NOT_ROUTING_CERTIFIED','period':['2026-10-25','2026-11-23'],'expected_days':30,'reported_days':len({a['date'] for a in audits}),'day_status':dict(C.Counter(a['status'] for a in audits)),'overall':[x for x in metrics if x['dimension']=='overall'],'limitations':['Stage95 E75 formulas on frozen cards, prior-day history and archived HPR; not original E live parity. E V2, E balanced and F not included.','No production change. Missing fields and failed batches excluded.']}
          (out/'report.json').write_text(json.dumps(report,indent=2));(out/'day-audits.json').write_text(json.dumps(audits,indent=2));print('STAGE185A_REPORT',json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage185a-e75-hpr-comparison
          path: summary/
          if-no-files-found: error
          retention-days: 30
