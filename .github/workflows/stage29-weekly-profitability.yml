name: Stage 29 - ROI Optimisation with 10 Weekly Selections Target (Research Only)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stage29-weekly-profitability.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: stage29-weekly-target-sp-repair
  cancel-in-progress: false

jobs:
  weekly-roi-research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out Racing-app (research only)
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical training and audited SP-recovery dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 beautifulsoup4==4.13.4 requests==2.32.4
      - name: Restore self-contained challenger optimizer
        run: |
          python - <<'STAGE27_RESTORE'
          import base64,gzip,pathlib
          pathlib.Path('scripts').mkdir(exist_ok=True)
          payload=''
          pathlib.Path('scripts/stage27_retrain_optimize.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          print('Restored Stage27 historical feature engine with Stage28 conditional profitability hook')
          STAGE27_RESTORE
      - name: Restore race-specific conditional ROI discovery engine
        run: |
          python - <<'STAGE28_RESTORE'
          import base64,gzip,pathlib
          payload=''
          pathlib.Path('scripts/stage28_selection_discovery.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          print('Restored selective race-specific ROI mining engine')
          STAGE28_RESTORE
      - name: Restore tested source-audited SP backfill engine
        run: |
          python - <<'STAGE29_RESTORE_SP'
          import base64,gzip,pathlib
          source=''
          pathlib.Path('scripts/stage29_sp_repair.py').write_bytes(gzip.decompress(base64.b64decode(source)))
          STAGE29_RESTORE_SP
      - name: Unit-test the independent retrospective engine
        run: |
          python -m py_compile scripts/stage27_retrain_optimize.py
          python scripts/stage27_retrain_optimize.py --self-test
          python -m py_compile scripts/stage28_selection_discovery.py
          python scripts/stage28_selection_discovery.py
          python -m py_compile scripts/stage29_sp_repair.py
          python scripts/stage29_sp_repair.py --test
          python scripts/stage24_history_integrity.py self-test
      - name: Download latest nonexpired Stage 2 historical SQLite artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'STAGE27_DOWNLOAD'
          import json,os,subprocess
          from pathlib import Path
          name='stage2-historical-staging-database'
          repo=os.environ['GITHUB_REPOSITORY']
          best=None
          for page in range(1,21):
           raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts','-f','per_page=100','-f',f'page={page}'],text=True)
           objs=json.loads(raw).get('artifacts',[])
           for a in objs:
            if a.get('name')==name and not a.get('expired') and (best is None or a.get('created_at','')>best.get('created_at','')):best=a
           if len(objs)<100:break
          if not best:raise SystemExit('Missing unexpired Stage 2 historical SQLite artifact. Run Stage 2 import first.')
          folder=Path('stage27_sources');folder.mkdir(exist_ok=True)
          runid=str(best['workflow_run']['id'])
          print('Downloading corrected-history base artifact',name,'run',runid,flush=True)
          subprocess.run(['gh','run','download',runid,'--repo',repo,'--name',name,'--dir',str(folder)],check=True)
          matches=list(folder.rglob('*.sqlite'))
          if not matches:raise SystemExit('No SQLite file in Stage 2 artifact')
          p=max(matches,key=lambda q:q.stat().st_size).resolve()
          print('Historical base SQLite bytes',p.stat().st_size,flush=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE27_DB='+str(p),file=f)
          STAGE27_DOWNLOAD
      - name: Download named-event historical race mapping (same annual race ID)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'STAGE27_MAPPING'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];name='stage4-reference-named-events-and-winners'
          best=None
          for page in range(1,21):
           raw=subprocess.check_output(['gh','api','-X','GET',f'repos/{repo}/actions/artifacts','-f','per_page=100','-f',f'page={page}'],text=True)
           batch=json.loads(raw).get('artifacts',[])
           for a in batch:
            if a.get('name')==name and not a.get('expired') and (best is None or a.get('created_at','')>best.get('created_at','')):best=a
           if len(batch)<100:break
          if not best:raise SystemExit('Stage 4 exact named-event mapping artifact has expired. Re-run Stage 4 first.')
          folder=Path('stage27_mapping');folder.mkdir(exist_ok=True)
          subprocess.run(['gh','run','download',str(best['workflow_run']['id']),'--repo',repo,'--name',name,'--dir',str(folder)],check=True)
          matches=list(folder.rglob('all_races_with_reference_event_ids.csv'))
          if not matches:raise SystemExit('Missing all_races_with_reference_event_ids.csv in named-event artifact')
          path=max(matches,key=lambda q:q.stat().st_size).resolve()
          with open(os.environ['GITHUB_ENV'],'a') as f:print('STAGE27_MAP='+str(path),file=f)
          print('Named event mapping bytes:',path.stat().st_size,flush=True)
          STAGE27_MAPPING
      - name: Restore Stage 25 historical engine dependencies from existing repository workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'STAGE27_BOOTSTRAP'
          import base64,gzip,json,os,pathlib,re,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          def workflow(name):
           path=f'.github/workflows/{name}'
           req=urllib.request.Request('https://api.github.com/repos/'+repo+'/contents/'+path,
             headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
           with urllib.request.urlopen(req,timeout=45) as response:data=json.load(response)
           return base64.b64decode(data['content']).decode('utf-8')
          # Stage 24 patches these *runtime-generated* Python modules. Unlike the
          # original Stage 27 workflow, restore them before running its prepare.
          src=workflow('stage18-historical-ab.yml')
          matches=re.findall(r"pathlib\.Path\('([^']+\.py)'\)\.write_bytes\(gzip\.decompress\(base64\.b64decode\('''(.*?)'''\)\)\)",src,re.S)
          restored=set()
          for name,b64 in matches:
           p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True)
           p.write_bytes(gzip.decompress(base64.b64decode(b64)))
           restored.add(name)
          essential={'scripts/stage16_history_model.py','scripts/stage18_historical_ab.py'}
          if not essential.issubset(restored):raise SystemExit('Missing required Stage 18 feature engine: '+str(essential-restored))
          # The other 2026 integrity patch sometimes references this unbundled
          # source module; recover it from Stage 13 without changing any model.
          src13=workflow('stage13-strategy-learning.yml')
          pairs=re.findall(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 --decode \| gzip --decompress > ([\w./-]+\.py)",src13)
          targets={'stage12_form_analysis.py','scripts/stage16_score.py',
                   'scripts/stage16_integrate.py'}
          for b64,name in pairs:
           if name not in targets:continue
           p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True)
           p.write_bytes(gzip.decompress(base64.b64decode(b64)))
           restored.add(name)
          print('Restored Stage 25 runtime engines:',', '.join(sorted(restored)),flush=True)
          import py_compile
          for name in restored:py_compile.compile(name,doraise=True)
          STAGE27_BOOTSTRAP
      - name: Apply Stage 25 integrity repairs and check declared data quality
        run: |
          set -euo pipefail
          python scripts/stage24_history_integrity.py prepare --db "$STAGE27_DB" --repo . --strict --assert-form
          python - <<'STAGE27_INTEGRITY'
          import json
          from pathlib import Path
          f=Path('data/history-integrity-audit.json')
          if not f.exists():raise SystemExit('No Stage 25 audit')
          d=json.loads(f.read_text())
          assert d.get('coverage_verified_through','')>='2026-11-01', d.get('coverage_verified_through')
          print('Stage 25 coverage verified through',d.get('coverage_verified_through'))
          print('Data quality',d.get('quality'))
          print('Unresolved pedigree rows',d.get('missing_pedigree_runs'),'— missing identity is never guessed')
          STAGE27_INTEGRITY
      - name: Backfill missing 2026 October SP from verified public race results
        run: |
          set -euo pipefail
          mkdir -p stage29_report
          python -u scripts/stage29_sp_repair.py \
            --db "$STAGE27_DB" --start 2026-10-08 --end 2026-11-01 \
            --output stage29_report/sp-backfill-audit.json
          test -s stage29_report/sp-backfill-audit.json
      - name: Discover ROI-positive race subgroups with at least 10 bets per week as target
        run: |
          set -euo pipefail
          python -u scripts/stage27_retrain_optimize.py \
            --db "$STAGE27_DB" --mapping "$STAGE27_MAP" \
            --recent-start 2026-10-08 --recent-end 2026-11-01 \
            --output stage29_report
          python - <<'STAGE27_CHECK'
          import json
          from pathlib import Path
          d=json.loads(Path('stage29_report/stage27-model-comparison.json').read_text())
          assert d['recent_race_count']>=100,'Too few 2026 historical races available for meaningful comparison'
          for model in 'ABC':
           item=d['models'][model]
           assert item['candidates_tested']>=20
           assert item['untouched_2025']['races']>=100
           assert item['untouched_recent_2026']['races']>=100
           print(model,item['chosen_variant'],item['recent_retrained_on_all_history_through_2025'])
          data=json.loads(Path('stage29_report/stage28-candidate-rules.json').read_text())
          assert all(k in data['models'] for k in 'ABC')
          assert data.get('minimum_bets_each_year')==520
          assert data.get('weekly_research_target_per_model')==10
          assert data['promotion_ready'] is False
          assert Path('stage29_report/stage28-comparison.csv').exists()
          print('Stage29 weekly-target ROI report and SP backfill verified; no live models changed')
          STAGE27_CHECK
      - name: Publish Stage 29 SP coverage and both all-race/selected-race ROI reports
        run: |
          set -euo pipefail
          mkdir -p reports/stage29
          for input in stage29_report/stage28-*.csv stage29_report/stage28-*.json; do
            test -f "$input" || continue
            b="${input##*/}"
            cp "$input" "reports/stage29/${b/stage28/stage29}"
          done
          cp stage29_report/sp-backfill-audit.json reports/stage29/stage29-sp-backfill-audit.json
          cp stage29_report/stage27-model-comparison.json reports/stage29/stage29-global-model-diagnostics.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stage29/
          if git diff --cached --quiet; then echo 'Reports already published'; exit 0; fi
          git commit -m 'Publish Stage 29 repaired SP and weekly target ROI research'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Stage 29 reports committed without changing live models';exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            git add reports/stage29/
            if git diff --cached --quiet; then echo 'Stage29 reports already published';exit 0;fi
            git commit -m 'Publish Stage 29 repaired SP and weekly target ROI research'
            sleep $((attempt * 3))
          done
          echo 'Stage29 report push failed' >&2
          exit 1
      - name: Upload individual reports (no live model updates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage29-weekly-roi-and-sp-repair-a-b-c
          path: stage29_report/
          retention-days: 30
          if-no-files-found: warn
