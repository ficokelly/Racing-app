name: Stage66 - November 8 Three Model D Replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nov8-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 kagglehub
      - name: Rebuild frozen historical baseline and retain source
        run: |
          python - <<'PY'
          import kagglehub,subprocess,sys
          from pathlib import Path
          root=Path('reports/stage66/nov8');root.mkdir(parents=True,exist_ok=True)
          source=kagglehub.dataset_download('deltaromeo/horse-racing-results-ukireland-2015-2025/versions/129')
          (root/'source_path.txt').write_text(str(source))
          subprocess.run([sys.executable,'import_historical_ukie.py','--mode','import','--input',str(source),'--min-date','1988-01-01','--max-date','2026-10-07','--database',str(root/'original.sqlite'),'--report',str(root/'import.json')],check=True)
          PY
      - name: Recover history available before November 8
        run: |
          python -u scripts/stage65m_backfill.py --baseline reports/stage66/nov8/original.sqlite --out reports/stage66/nov8/backfill --max-date 2026-11-07 --keep-candidate --skip-replay
      - name: Enrich historical race categories for Model C
        run: |
          python - <<'PY'
          import pathlib,subprocess,sys
          root=pathlib.Path('reports/stage66/nov8')
          source=(root/'source_path.txt').read_text().strip()
          subprocess.run([sys.executable,'-u','scripts/stage65p_enrich_race_details.py','--db',str(root/'backfill/backfilled_research_only.sqlite'),'--source',source,'--out',str(root/'enrichment')],check=True)
          PY
      - name: Replay November 8 with historical pre-off cards and settle at SP
        run: |
          python -u scripts/stage66_replay_nov8.py --baseline reports/stage66/nov8/original.sqlite --updated reports/stage66/nov8/backfill/backfilled_research_only.sqlite --out reports/stage66/nov8/results
      - name: Upload comparison and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage66-nov8-three-model-d-results
          path: |
            reports/stage66/nov8/results/*.csv
            reports/stage66/nov8/results/*.json
            reports/stage66/nov8/enrichment/*.json
          retention-days: 90
          if-no-files-found: warn
