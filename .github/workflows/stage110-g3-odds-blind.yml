name: 'Stage110 - G3 Winner First, No Odds, Every Eligible Race'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'historical = same original 2023-2025 predictions; paper = fresh future pre-race top 1, no odds'
        type: choice
        required: true
        default: historical
        options:
          - historical
          - paper
      selection_date:
        description: 'Only for paper mode: future race date YYYY-MM-DD. Blank = today.'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: stage110-g3-odds-blind-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  exact-odds-blind:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OUT: reports/stage110/output
      PARENT: reports/stage110/parent
    steps:
      - name: Checkout existing app read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Freeze the paper decision timestamp before data/model restore
        if: ${{ inputs.mode == 'paper' }}
        shell: bash
        run: echo "STAGE110_CUTOFF=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproducible dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 \
            scikit-learn==1.6.1 joblib==1.4.2
      - name: Code, model and odds-free selection self-test
        run: |
          set -euo pipefail
          python -m py_compile scripts/stage110_odds_blind.py scripts/stage109_model_g3.py scripts/stage108_model_g2.py
          python scripts/stage110_odds_blind.py self-test
          python scripts/stage109_model_g3.py self-test
      - name: Restore the exact immutable Stage109 walk-forward model and predictions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PARENT"
          gh run download 43407036838 --repo "$GITHUB_REPOSITORY" \
            --name stage109-g3-learning-43407036838 --dir "$PARENT"
          test -s "$PARENT/stage109-all-horses-historical.csv.gz"
          test -s "$PARENT/stage109-future-form-model.joblib"
          test -s "$PARENT/stage109-prior-form-state.joblib"
          python - <<'PY'
          import json, pathlib, os
          p=pathlib.Path(os.environ['PARENT'])
          report=json.loads((p/'stage109-walkforward-audit.json').read_text())
          assert report['initial_seed_training']=='2023-01-01 to 2023-12-31', 'Not original 2023-trained seed'
          assert report['price_policy'].startswith('NO bookmaker odds or SP'), 'Original model not odds-blind'
          print('Restored and verified immutable G3 walk-forward experiment from run 43407036838')
          PY
      - name: Historical replay - select the top predicted horse in every eligible race
        if: ${{ inputs.mode == 'historical' }}
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/stage110_odds_blind.py historical \
            --predictions "$PARENT/stage109-all-horses-historical.csv.gz" \
            --out "$OUT"
      - name: Restore only completed historical runs for future paper scoring
        if: ${{ inputs.mode == 'paper' }}
        shell: bash
        run: |
          set -euo pipefail
          if test -s data/hpr/shards/manifest.json; then
            python scripts/stage87_hpr_storage.py restore \
              --dir data/hpr/shards --db reports/stage110/recent.sqlite
          else
            echo 'No stored recent form shards available; paper model will report missing coverage.'
          fi
      - name: Paper mode - highest-probability horse per eligible future race, NO odds input
        if: ${{ inputs.mode == 'paper' }}
        env:
          TARGET: ${{ inputs.selection_date }}
        shell: bash
        run: |
          set -euo pipefail
          DATE="${TARGET:-$(date -u +%Y-%m-%d)}"
          args=(paper
            --model "$PARENT/stage109-future-form-model.joblib"
            --state "$PARENT/stage109-prior-form-state.joblib"
            --cards data/racecards.json
            --date "$DATE"
            --cutoff "$STAGE110_CUTOFF"
            --out "$OUT")
          if test -s reports/stage110/recent.sqlite; then args+=(--hpr reports/stage110/recent.sqlite); fi
          # Crucially, no data/latest-odds.json, no bookmaker and no price filter.
          python -u scripts/stage110_odds_blind.py "${args[@]}"
      - name: Show audit summary
        if: always()
        shell: bash
        run: |
          if [ -s "$OUT/README.md" ]; then
            cat "$OUT/README.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ -s "$OUT/stage110-paper-audit.json" ]; then
            cat "$OUT/stage110-paper-audit.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report generated; inspect failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download results and one-horse-per-race selections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage110-odds-blind-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            reports/stage110/output/*.csv
            reports/stage110/output/*.json
            reports/stage110/output/*.md
            reports/stage110/output/*.html
          compression-level: 6
          retention-days: 90
          if-no-files-found: warn
